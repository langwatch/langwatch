[project]
name = "agent-optimization-example"
version = "0.1.0"
description = "Optimize a DSPy ReAct agent with scenario simulations as the metric"
requires-python = ">=3.10,<3.14"
dependencies = [
  "langwatch[dspy]>=1.3.1,<2",
  "langwatch-scenario>=1.3.0,<2",
  "python-dotenv>=1.0.1",
  "openai>=1.88.0",
  "dspy[optuna]>=3.3.1",
]

[tool.uv]
package = false
# exclude-newer-package below needs uv 0.9.25+ (dev/docs/best_practices/dependency-age-gates.md).
required-version = ">=0.9.25"
exclude-newer = "7 days"

# Security fix released inside the 7-day window above, admitted up to a fixed
# date so the rest of the tree keeps the cooldown. Drop it once the date is
# more than 7 days old (#8958).
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

# Transitive-dependency security pins, so a re-resolution can't pull a
# vulnerable version back in.
constraint-dependencies = [
  "pyjwt>=2.15.0", # security: PyJWT advisories covering <=2.14.0 (#2492, #2632)
  "urllib3>=2.8.0", # security: urllib3 advisories covering <2.8.0 (#2597, #2598, #2610)
  "aiohttp>=3.14.4", # security: aiohttp advisories covering <=3.14.3, two HIGH (#2848-#2850)
  "mako>=1.4.2", # security: Mako advisory covering <=1.4.1 (#2748)
  "certifi>=2026.10.19", # security: certifi advisory covering <2026.10.19 (#2918)
  "multidict>=6.9.1", # security: multidict advisory covering 6.7.0-6.9.0 (#2747)
  # filelock 4.2.1 needs Python 3.11; on 3.10, 3.20.3 sits below the advisories covering 3.20.4-4.2.0.
  "filelock>=4.2.1; python_full_version >= '3.11'",
  "filelock>=3.20.3,<3.20.4; python_full_version < '3.11'",
]

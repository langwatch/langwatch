[project]
name = "langwatch"
version = "1.4.0" # remember to also update it in src/langwatch/__version__.py
description = "LangWatch Python SDK, for monitoring your LLMs"
authors = [{ name = "Langwatch Engineers", email = "engineering@langwatch.ai" }]
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
readme = "README.md"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",

  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "nanoid>=2.0.0,<3.0.0",
  "coolname>=5.0.0",
  "httpx>=0.27.0",
  "openinference-instrumentation-haystack>=0.1.20",
  "openinference-instrumentation-langchain>=0.1.24",
  "openinference-instrumentation-openai>=0.1.25",
  "openinference-semantic-conventions>=0.1.17",
  "opentelemetry-api>=1.32.1",
  "opentelemetry-exporter-otlp-proto-http>=1.32.1",
  "opentelemetry-sdk>=1.32.1",
  "opentelemetry-instrumentation-crewai>=0.45.0",
  "retry>=0.9.2",
  "tenacity>=8.0.0",
  "termcolor>=3.0.1",
  "deprecated>=1.2.18",
  "python-liquid>=2.2.0",
  "pydantic>=2",
  "attrs>=26.1.0",
  # The house identifier library (packages/ksuid-python in this repository,
  # resolved from the workspace in development). Same prefix_payload shape the
  # platform's TypeScript side generates with @langwatch/ksuid.
  "langwatch-ksuid>=1.0.1",
  "pyyaml>=6.0.2",
  # Progress bars for experiment loop()/aloop(); pure-python and tiny, so a
  # declared dependency rather than an optional (it always runs there).
  "tqdm>=4.62.0",
  # The outbound relay of connected agents (langwatch.agent), pure Python.
  "websockets>=12",
]

[project.optional-dependencies]
langchain = ["langchain-core>=1.5.4,<2.0.0"]
dspy = ["dspy-ai>=3.3.0,<4"]
litellm = ["litellm>=1.96.0"]
dev = ["ruff>=0.16.2"]
# tomli is stdlib from 3.11 on; the supported-versions test reads
# pyproject.toml and runs on 3.10 too.
tests = [
  "pytest>=9.1.1,<10.0.0",
  "pytest-asyncio>=1.4.0,<1.5.0",
  "factory-boy>=3.3.0,<4.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
  "e2e: End-to-end tests that require external services",
  "integration: Integration tests",
  "unit: Unit tests (default)",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "langwatch-scenario>=1.3.0",
]
examples = [
  "anthropic>=0.36.0,<0.122.0",
  "chainlit>=2.11.1,<3",
  "cloudpickle>=3.1.2",
  "dspy-ai>=3.3.0,<4",
  "faiss-cpu>=1.15.0,<2.0.0",
  "fastapi>=0.141.1",
  "haystack-ai>=3.0.0,<4.0.0",
  "jupyter>=1.1.1,<2.0.0",
  "langchain>=1.0.0,<2.0.0",
  "langchain-community>=0.4.2,<1.0.0",
  "langchain-openai>=1.4.3,<2.0.0",
  "langchain-text-splitters>=1.1.2,<2.0.0",
  "langchain-google-vertexai>=2.0.0,<4.0.0",
  "litellm>=1.96.0",
  "openinference-instrumentation-dspy>=0.1.39,<0.2.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "langgraph>=1.0.0,<2.0.0",
  "openai>=1.68.2,<2.55.0", # cap re-verified against openai 2.43.0 (2.8+ historically called model_dump(by_alias=None) which pydantic-core rejected)
  "pydantic>=2.11.0", # chainlit <2.11.1 was broken with pydantic >=2.10.2; fixed in chainlit 2.11.1
  "pytest>=9.1.1,<10.0.0",
  "python-dotenv==1.2.2",
  "streamlit>=1.61.1,<2.0.0",
  "uvicorn>=0.38.0,<0.53.0",
  "json-repair>=0.63.0",
  "openinference-instrumentation-openai>=0.1.30",
  "opentelemetry-instrumentation-langchain>=0.62.3",
  "openinference-instrumentation-litellm>=0.1.36",
  "pandas>=2.2.3",
  "fonttools>=4.63.0", # security: CVE-2025-66034 (#328)
  "jupyterlab>=4.6.3", # security: CVE-2025-59842 (#319)
  "langsmith>=0.10.18", # security: CVE-2026-45134 (#1175)
  "pypdf>=6.15.0", # security: CVE-2026-31826 (#543)
  "strands-agents[otel]>=1.51.0,<2.0.0",
  "nltk>=3.10.2",
  "unstructured[pdf]>=0.18.18",
]
tests = ["factory-boy>=3.3.3", "pytest-asyncio>=1.4.0", "python-dotenv==1.2.2"]

# Resolution settings ([tool.uv] exclude-newer, constraint-dependencies) live
# at the workspace root pyproject.toml — uv ignores them on members.

[tool.uv.sources]
langwatch-ksuid = { workspace = true }

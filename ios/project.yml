# XcodeGen project definition.
#
# The .xcodeproj is generated, not checked in: a pbxproj is a merge-conflict
# machine and nothing in it is worth reviewing. Regenerate with:
#
#   cd ios && xcodegen generate && open LangWatchOps.xcodeproj
#
# See ios/README.md.
name: LangWatchOps

options:
  bundleIdPrefix: ai.langwatch
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # `targeted` rather than `complete`: the app is Swift 5.9 and the
    # concurrency it actually has (one actor for the session, @MainActor
    # view models) is already checked at that level.
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGN_STYLE: Automatic

targets:
  LangWatchOps:
    type: application
    platform: iOS
    sources:
      - path: LangWatchOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.langwatch.ops
        PRODUCT_NAME: LangWatch Ops
        INFOPLIST_FILE: LangWatchOps/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"

  LangWatchOpsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LangWatchOpsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.langwatch.ops.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LangWatchOps

schemes:
  LangWatchOps:
    build:
      targets:
        LangWatchOps: all
    test:
      targets:
        - LangWatchOpsTests

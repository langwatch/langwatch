version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  # Pin analysis target to the highest Go version golangci-lint v2.11.4 was
  # built with (1.25). Without this, lint refuses to analyze code whose
  # go.mod targets a newer Go than the linter's own build toolchain.
  # Track upstream: golangci-lint follows "latest-1" — bump when v2.x ships
  # built with go1.26.
  go: "1.25"

linters:
  # ── Defaults (always on) ───────────────────────────────────────────────
  #   errcheck, govet, ineffassign, staticcheck, unused
  #
  # ── Additional linters, grouped by intent ──────────────────────────────
  enable:
    # Bug prevention — these catch real production issues.
    - bodyclose        # unclosed HTTP response bodies leak file descriptors
    - durationcheck    # duration × duration is always wrong
    - exhaustive       # missing enum cases in switches
    - fatcontext       # context.WithValue in a loop leaks memory
    - nilerr           # returning nil when err != nil
    - nilnesserr       # checking err but returning a different nil
    - noctx            # HTTP requests without context.Context
    - spancheck        # OTel spans not ended or status not set
    - sqlclosecheck    # unclosed sql.Rows / Stmt

    # Code quality — reduces accidental complexity.
    - gocritic         # broad opinionated diagnostics
    - unconvert        # useless type conversions
    - unparam          # unused function parameters (dead API surface)
    - wastedassign     # writes never read
    - recvcheck        # mixed pointer/value receivers on same type
    - errorlint        # correct use of errors.Is/As

    # Security — static analysis for vulnerabilities.
    - gosec            # inspects source code for security problems

    # House rules — the SRP limits /.coderabbit.yaml states as prose in its
    # AC7 block. These carry a pre-existing baseline, so go-ci gates them via
    # `--new-from-merge-base` (new and changed lines only), not the full tree.
    # Delete the matching FAIL clauses from .coderabbit.yaml as each lands, or
    # every violation gets reported twice — once here, once by the reviewer.
    - funlen           # 60-line / 40-statement function cap
    - gocognit         # cognitive complexity > 10
    - revive           # argument-limit + doc comments on exported symbols

    # Hygiene — keeps the codebase tidy.
    - dupword          # repeated words in comments
    - misspell         # typos in identifiers and comments
    - nolintlint       # nolint directives must be specific + explained
    - predeclared      # shadowing builtins (nil, len, cap, etc.)
    - tagalign         # aligned, consistently ordered struct tags
    - usestdlibvars    # http.MethodGet instead of "GET", etc.
    - whitespace       # stray blank lines at start/end of blocks

    # Testing — better assertions and helpers.
    - testifylint      # idiomatic testify usage
    - thelper          # test helpers missing t.Helper()
    - usetesting       # prefer testing pkg equivalents

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain       # style preference, not a defect
        - hugeParam         # too noisy with domain structs

    exhaustive:
      default-signifies-exhaustive: true

    # Mirrors the TypeScript side: biome.new-code.jsonc caps functions at 60
    # lines. Statements are capped too because a 60-line function of dense
    # one-liners is the same SRP problem.
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true

    gocognit:
      min-complexity: 10

    revive:
      rules:
        # 3 positional params, matching biome's useMaxParams. Past that, a
        # struct or options type reads better at the call site.
        - name: argument-limit
          arguments: [3]
        # .coderabbit.yaml already demands doc comments on new exported Go
        # symbols; this is that rule, deterministically.
        - name: exported
          arguments: ["sayRepetitiveInsteadOfStutters"]

    errorlint:
      asserts: false  # type assertions on error are fine internally

    misspell:
      locale: US

    spancheck:
      checks:
        - end
        - set-status

    testifylint:
      enable:
        - error-is-as
        - require-error
        - contains
        - empty

    gosec:
      excludes:
        - G101  # false positives on OTel attribute names and test tokens
        - G104  # already covered by errcheck
        - G115  # integer narrowing — reviewed case-by-case
        - G304  # file path from variable is fine in a server
        - G602  # slice bounds — guarded by upstream length checks
        - G705  # XSS — gateway proxies JSON/SSE, not HTML

    tagalign:
      align: true
      sort: true
      order:
        - json
        - yaml
        - env
        - validate

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling

    rules:
      # Tests: relax rules that trade readability for strictness.
      #
      # funlen/gocognit are excluded because a table-driven test is one long
      # function by design and splitting it to satisfy a line count makes it
      # harder to read, not easier. revive's `exported` is excluded because
      # test helpers are not API surface.
      - path: _test\.go
        linters:
          - errcheck
          - noctx
          - unparam
          - bodyclose
          - funlen
          - gocognit
          - revive

      # paramTypeCombine is style, not a bug.
      - linters:
          - gocritic
        text: "paramTypeCombine"

      # Prometheus counters are exact small integers that happen to be carried
      # in a float64, so assert.Equal is the correct comparison and there is no
      # representation error for float-compare to protect against.
      #
      # Scoped to this package rather than disabled globally, because
      # float-compare is worth keeping wherever real float arithmetic happens.
      #
      # The linter's primary suggestion is also inapplicable here.
      # assert.InEpsilon computes the error relative to the expected value, so
      # it divides by zero and returns false for a zero expectation, verified:
      # InEpsilon(0.0, 0.0, 0.0001) is false. Seven of these assertions check
      # that a counter did NOT move, which is the point of the negative half of
      # a metrics test, and rewriting those to InEpsilon would turn them into
      # assertions that always fail.
      - path: services/aigateway/adapters/gatewaymetrics/.*_test\.go
        linters:
          - testifylint
        text: "float-compare"

      # langyagent: per-worker home directories are chmodded 0700 on purpose.
      # A directory needs the x bit to be traversable, so 0700 is the tightest
      # possible private-dir mode and gosec's <=0600 rule (G302) cannot apply.
      # The sessions root is 0755 (G301) so per-conversation worker UIDs can
      # reach their own 0700 subdir under a root-owned parent.
      - path: services/langyagent/
        linters:
          - gosec
        text: "G30[12]"

      # langyagent tests spin up loopback fixture servers and on-disk fixture
      # trees: InsecureSkipVerify (G402) against a self-signed test listener,
      # no ReadHeaderTimeout (G112) on a short-lived httptest-style server, and
      # 0755 fixture dirs/scripts (G301/G306, a fake worker script needs the
      # exec bit). None of it ships.
      - path: services/langyagent/.*_test\.go
        linters:
          - gosec

      # langyagent carries a pre-linting baseline: the streaming/provisioning
      # state machines (opencode + pi Stream, Provision, the pool spawn path)
      # are event loops whose length and complexity are inherent to the
      # protocol they drive, and the argument-limit hits are
      # interface-mandated signatures (app ports, frames, telemetry) shared by
      # both harness adapters. Scoped here so the rest of the repo keeps these
      # rules at full strength.
      - path: services/langyagent/
        linters:
          - gocognit
          - funlen
      - path: services/langyagent/
        linters:
          - revive
        text: "argument-limit:"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/langwatch/langwatch

  exclusions:
    paths:
      - vendor
      - node_modules

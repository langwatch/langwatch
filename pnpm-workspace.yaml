# The single pnpm workspace for every JavaScript project in the repo.
# See dev/docs/adr/076-single-pnpm-workspace.md.
#
# This used to be six independent install roots with six lockfiles: the repo
# root, platform/app/, sdks/typescript/, mcp/typescript/, skills/ and
# dev/tests/agentic-e2e/. mcp/typescript was BOTH its own root and a member of
# platform/app/'s workspace, so CI installed it twice on every app build; skills/
# and dev/tests/agentic-e2e/ needed `--ignore-workspace` to escape a workspace they
# were never members of; and each root carried its own `overrides` block, so a
# security pin applied in one could be silently absent from another.
#
# One install from the repo root now covers all of it.
packages:
  - "apps/*"
  - "packages/*"
  - "modules/*/*"
  - "enterprise"
  - "enterprise/packages/composition/*"
  - "enterprise/packages/plan-gate"
  - "enterprise/modules/*/*"
  - "mcp/typescript"
  - "plugins/*"
  - "sdks/typescript"
  - "services/langyworker"
  # The capture half of visualdiff (tools/visualdiff): Playwright is Node, so
  # the Go CLI orchestrates and this package drives the browsers.
  - "tools/*/runner"
  # The contributor-only backend launcher: the API and worker applications in
  # one local process (ADR-004, amendment 2026-09-07). Private, never shipped,
  # and the one package architecture-lint lets combine both runtimes.
  - "tools/dev-runtime"
  - "skills"
  - "dev/tests/agentic-e2e"
  - "dev/tests/e2e-stack"

# pnpm 10 already defaults this to false. It is stated explicitly because the
# six-root merge is what made it load-bearing: sdks/typescript/ is the package
# `langwatch`, and a member depending on `langwatch@<range>` means the PUBLISHED
# SDK. With both in one workspace, flipping this to true would silently switch
# every such member — and everything built from them, including the production
# image — onto the SDK working copy. Linking the working copy is a deliberate
# change (`"langwatch": "workspace:*"`, which is what the packages that need the
# working copy declare today), not something to acquire by accident.
linkWorkspacePackages: false


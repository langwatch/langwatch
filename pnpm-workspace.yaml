  '@aws-sdk/client-ses': ^3.1080.0
  '@aws-sdk/s3-request-presigner': ^3.826.0
  # Exact, not a caret: 1.7.x mints the session in the same transaction as
  # the credential row on `/passkey/verify-registration`, which is what makes
  # passkey sign-up atomic, and 1.7.1 is the release the app is tested against.
  '@better-auth/passkey': 1.7.1
  '@chakra-ui/react': ^3.36.0

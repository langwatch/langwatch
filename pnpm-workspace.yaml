# The single pnpm workspace for every JavaScript project in the repo: one
# install root, one lockfile, and one place each shared version, security floor
# and build-script permission is stated. One `pnpm install` here covers every
# member listed below. Why it is one workspace rather than the six independent
# roots it replaced: dev/docs/adr/076-single-pnpm-workspace.md.
packages:
  - "apps/*"
  - "packages/*"
  - "modules/*/*"
  # The generated statement of what this build installs: the server and web
  # module lists and the members each module declared. It is a package rather
  # than three loose files so the lists resolve the module packages they name
  # and a renamed export fails to compile.
  - "modules"
  - "enterprise"
  - "enterprise/packages/composition/*"
  - "enterprise/packages/plan-gate"
  - "enterprise/modules/*/*"
  - "mcp/typescript"
  - "plugins/*"
  - "sdks/typescript"
  - "services/langyworker"
  # The capture half of visualdiff (tools/visualdiff): Playwright is Node, so
  # the Go CLI orchestrates and this package drives the browsers.
  - "tools/*/runner"
  # The contributor-only backend launcher: the API and worker applications in
  # one local process (ADR-004, amendment 2026-09-07). Private, never shipped,
  # and the one package architecture-lint lets combine both runtimes.
  - "tools/dev-runtime"
  - "skills"
  - "dev/tests/agentic-e2e"
  - "dev/tests/e2e-stack"

# pnpm 10 already defaults this to false. It is stated explicitly because it is
# load-bearing: sdks/typescript IS the package `langwatch`, so a member
# depending on `langwatch@<range>` means the PUBLISHED SDK, and both live in
# this one workspace. Flipping this to true would silently switch every such
# member — and everything built from them, including the production image —
# onto the SDK working copy. Linking the working copy is a deliberate
# declaration (`"langwatch": "workspace:*"`, which is what the packages that
# need it say today), not something to acquire by accident.
linkWorkspacePackages: false

# The one place each shared dependency's version lives. `catalog:` (default)
# covers every dependency whose declared range agrees everywhere it is used,
# or whose differing spellings already resolved to one version before this
# existed (dev/docs/best_practices/typescript.md, "pnpm catalogs"). A manifest
# opts in with `"dep": "catalog:"`; `pnpm sync:references` is the sibling for
# tsconfig project references, not dependency versions.
catalog:

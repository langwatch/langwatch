# Overlay applied on top of values-e2e.yaml by the test_lwql_replicas suite
# (charts/langwatch/tests/e2e.sh). Boots chart-managed ClickHouse as a
# three-node ReplicatedMergeTree cluster so the e2e can assert that every pod
# carries the whole LangWatchQL access set delivered by the mounted Secret
# (issue #8258, epic tasks#889 AC3), then scale to a fourth pod.
#
# Resources are kept small so three ClickHouse pods plus three Keeper pods fit a
# single kind node alongside the rest of the stack.
clickhouse:
  replicas: 3
  memory: 1Gi
  cpu: "1"
  storage:
    size: 1Gi

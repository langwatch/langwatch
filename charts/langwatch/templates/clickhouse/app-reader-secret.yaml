{{- /*
  The app reader's credentials (ADR-202 slice 4): its password and the URL the app,
  the workers and the access-render Job read. A pre-install,pre-upgrade,pre-rollback
  hook below the render Job's weight, as lwql-passwords-secret.yaml is, so the Job
  finds the reader on the upgrade that turns it on. lookup-or-rand keeps it stable.
  An operator Secret (secrets.existingSecret, or autogen off) carries the URLs itself.
*/}}
{{- if and .Values.clickhouse.chartManaged .Values.clickhouse.appReader.enabled (include "langwatch.lwql.passwordsChartOwned" .) }}
{{- $secretName := include "langwatch.clickhouse.appReaderSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if and $existing $existing.data }}
{{-   $existingData = $existing.data }}
{{- end }}
{{- $host := include "langwatch.clickhouse.serviceName" . }}
{{- $readerB64 := index $existingData "CLICKHOUSE_READER_PASSWORD" | default (include "langwatch.autogenSecretValue" .) }}
{{- $enforcingB64 := index $existingData "CLICKHOUSE_ENFORCING_READER_PASSWORD" | default (include "langwatch.autogenSecretValue" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "langwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  CLICKHOUSE_READER_PASSWORD: {{ $readerB64 | quote }}
  CLICKHOUSE_READER_URL: {{ printf "http://langwatch_app_reader:%s@%s:8123/langwatch" ($readerB64 | b64dec | urlquery) $host | b64enc | quote }}
  CLICKHOUSE_ENFORCING_READER_PASSWORD: {{ $enforcingB64 | quote }}
  CLICKHOUSE_ENFORCING_READER_URL: {{ printf "http://langwatch_app_reader_enforcing:%s@%s:8123/langwatch" ($enforcingB64 | b64dec | urlquery) $host | b64enc | quote }}
{{- end }}

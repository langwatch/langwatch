{{- /*
  The app writer's credentials (ADR-202 Decided 12): the insert-only user the api sends its
  three inserts as once its system credential is removed. A hook at the reader's weight, below
  the render Job's, so the Job finds the writer on the upgrade that turns it on; lookup-or-rand
  keeps it stable. An operator Secret (secrets.existingSecret, or autogen off) carries the URL.
*/}}
{{- if and .Values.clickhouse.chartManaged .Values.clickhouse.appWriter.enabled (not .Values.clickhouse.appReader.enabled) }}
{{- fail "clickhouse.appWriter.enabled needs clickhouse.appReader.enabled: the writer is provisioned beside the reader (ADR-202 Decided 12)" }}
{{- end }}
{{- if and .Values.clickhouse.chartManaged .Values.clickhouse.appWriter.enabled (include "langwatch.lwql.passwordsChartOwned" .) }}
{{- $secretName := include "langwatch.clickhouse.appWriterSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if and $existing $existing.data }}
{{-   $existingData = $existing.data }}
{{- end }}
{{- $host := include "langwatch.clickhouse.serviceName" . }}
{{- $writerB64 := index $existingData "CLICKHOUSE_WRITER_PASSWORD" | default (include "langwatch.autogenSecretValue" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "langwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  CLICKHOUSE_WRITER_PASSWORD: {{ $writerB64 | quote }}
  CLICKHOUSE_WRITER_URL: {{ printf "http://langwatch_app_writer:%s@%s:8123/langwatch" ($writerB64 | b64dec | urlquery) $host | b64enc | quote }}
{{- end }}

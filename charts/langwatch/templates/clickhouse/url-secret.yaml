{{/*
  Materialise the chart-managed ClickHouse credentials Secret only when
  autogen.enabled=true. Mirrors the gating shape Sarah landed on
  charts/langwatch/templates/app/secrets.yaml + the old
  gateway-auth-secret.yaml: with autogen off, nothing renders; the
  operator pre-creates the Secret out-of-band, points the deployment at
  it via a custom clickhouse.auth.existingSecret name, and the runtime
  CLICKHOUSE_URL is composed from the Secret's `password` key (see the
  "User-provided existingSecret" branch in _helpers.tpl :: app env).

  HISTORY: pre-fix, the gate was only chartManaged + eq $secretName
  $defaultName. The inner block looked up the live Secret and, on lookup
  miss, fell back to randAlphaNum. Under ArgoCD repo-server, lookup
  returns nil at every reconcile because the renderer has no cluster
  access, so the random branch fired on every sync, rotating the
  ClickHouse password and the inter-Keeper clusterSecret underneath the
  running pods (postmortem action item).

  Each key is checked independently against the lookup result so a
  partially-populated Secret (e.g. an operator imported password but
  not clusterSecret across a single->replicated migration) is healed in
  place — only the missing key is generated.

  REINSTALL HAZARD: helm.sh/resource-policy=keep keeps the Secret
  around on `helm uninstall` so a subsequent reinstall in the same
  namespace reuses the credentials. Without this, every reinstall
  rotates the password AND the Keeper clusterSecret, which breaks
  inter-node auth in replicated clusters. The cost is the familiar
  "exists and cannot be imported into the current release" annotation
  hand-off on reinstall.
*/}}
{{- if and .Values.clickhouse.chartManaged .Values.autogen.enabled }}
{{- $secretName := include "langwatch.clickhouse.secretName" . }}
{{- $defaultName := include "langwatch.clickhouse.serviceName" . }}
{{- if eq $secretName $defaultName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if and $existing $existing.data }}
{{-   $existingData = $existing.data }}
{{- else }}
{{- /* UPGRADE RENAME: langwatch.clickhouse.serviceName now truncates the
         release name to 36 chars (matching clickhouse-serverless.fullname), so a
         release name longer than 36 chars renamed this Secret from its old
         untruncated `<release>-clickhouse` — the value the pre-truncation chart
         used for clickhouse.auth.existingSecret. Under helm.sh/resource-policy:
         keep the old Secret survives the upgrade holding the live password the
         running pods still authenticate with. If the NEW (truncated) name has no
         Secret yet but the OLD one does, adopt the old values so the upgrade does
         not regenerate the ClickHouse password AND the Keeper clusterSecret
         underneath the pods — the same rotation hazard the ArgoCD lookup-miss
         above caused, one release-rename removed. See charts/langwatch/README.md
         (Upgrading: ClickHouse credentials Secret rename). */}}
{{-   $oldName := printf "%s-clickhouse" .Release.Name }}
{{-   if ne $oldName $secretName }}
{{-     $oldExisting := lookup "v1" "Secret" .Release.Namespace $oldName }}
{{-     if and $oldExisting $oldExisting.data }}
{{-       $existingData = $oldExisting.data }}
{{-     end }}
{{-   end }}
{{- end }}
{{- $pwB64 := "" }}
{{- if hasKey $existingData "password" }}
{{-   $pwB64 = index $existingData "password" }}
{{- else if .Values.clickhouse.auth.password }}
{{-   $pwB64 = .Values.clickhouse.auth.password | b64enc }}
{{- else }}
{{-   $pwB64 = randAlphaNum 32 | b64enc }}
{{- end }}
{{- $pw := $pwB64 | b64dec }}
{{- $csB64 := "" }}
{{- if hasKey $existingData "clusterSecret" }}
{{-   $csB64 = index $existingData "clusterSecret" }}
{{- else }}
{{-   $csB64 = randAlphaNum 48 | b64enc }}
{{- end }}
{{- $url := printf "http://default:%s@%s:8123/langwatch" ($pw | urlquery) (include "langwatch.clickhouse.serviceName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "langwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $pwB64 | quote }}
  clusterSecret: {{ $csB64 | quote }}
  url: {{ $url | b64enc | quote }}
  {{- /* LangWatchQL (Design C): for chart-managed ClickHouse the pod that OWNS
         the server creates langwatch_lwql from these keys, and the app/workers
         read the SAME keys from THIS Secret (langwatch.clickhouse.lwqlSecretName
         resolves here on the default path). Single source, so the query password
         cannot diverge from the provisioned one. Same per-key lookup-or-rand as
         above: an existing value is preserved (stable across pods/upgrades), a
         missing one is generated. lwql_pg_password is STORED whenever the
         feature is on, but only CONSUMED for chart-managed ClickHouse paired
         with chart-managed PostgreSQL: the subchart projects it into the
         ClickHouse pod only when the bridge host resolves, and the app reads it
         (LWQL_MANAGE_POSTGRES_READER) only when postgresql.chartManaged. An
         external-PostgreSQL install owns lwql_ro out of band, so it leaves this
         stored key unused rather than the app touching a role it does not own. */}}
  {{- if .Values.lwql.enabled }}
  {{- $lwql := .Values.clickhouse.lwqlAccessModel | default dict }}
  {{- $lwqlKey := $lwql.passwordSecretKey | default "lwql_password" }}
  {{- $lwqlPgKey := ($lwql.postgres | default dict).passwordSecretKey | default "lwql_pg_password" }}
  {{ $lwqlKey }}: {{ default (include "langwatch.autogenSecretValue" .) (index $existingData $lwqlKey) | quote }}
  {{ $lwqlPgKey }}: {{ default (include "langwatch.autogenSecretValue" .) (index $existingData $lwqlPgKey) | quote }}
  {{- end }}
{{- end }}
{{- end }}

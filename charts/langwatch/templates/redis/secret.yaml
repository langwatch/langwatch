{{- if .Values.redis.chartManaged }}
{{- if .Values.redis.auth.enabled }}
{{- if not .Values.redis.auth.existingSecret }}
{{- $secretName := printf "%s-redis" .Release.Name }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- /* A generated password is only stable where helm can read the live Secret
       back (lookup). Argo CD and `helm template` render with no cluster access,
       so a generated value changes on every render and rotates the password
       under the running Redis. With autogen off the operator owns every
       credential: require one instead of generating it. */}}
{{- if and (not .Values.autogen.enabled) (not $existingSecret) (not .Values.redis.auth.password) }}
{{- fail "redis.auth.existingSecret is required when autogen.enabled=false (or set redis.auth.password): the chart only generates the Redis password with autogen.enabled=true, and that generated password is only stable under plain helm. Create a Secret holding the password, set redis.auth.existingSecret to its name and redis.auth.secretKeys.passwordKey to its key. See https://docs.langwatch.ai/self-hosting/deployment/kubernetes-helm#production-deployment" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "langwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  annotations:
    # Argo CD: before the LangWatchQL render Job (wave -1), which reads it.
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
data:
  {{- if $existingSecret }}
  redis-password: {{ index $existingSecret.data "redis-password" }}
  {{- else if .Values.redis.auth.password }}
  redis-password: {{ .Values.redis.auth.password | b64enc | quote }}
  {{- else }}
  redis-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

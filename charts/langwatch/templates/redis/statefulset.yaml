{{- if .Values.redis.chartManaged }}
{{- $authEnabled := .Values.redis.auth.enabled }}
{{- $secretName := .Values.redis.auth.existingSecret | default (printf "%s-redis" .Release.Name) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis-master
  labels:
    {{- include "langwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ .Release.Name }}-redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
    spec:
      # Redis does not call the Kubernetes API, so don't mount the SA token.
      automountServiceAccountToken: {{ .Values.global.automountServiceAccountToken }}
      {{- with (coalesce .Values.redis.nodeSelector .Values.global.scheduling.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (coalesce .Values.redis.tolerations .Values.global.scheduling.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (coalesce .Values.redis.affinity .Values.global.scheduling.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # uid 999 is the redis image's own user, so this cannot inherit
      # global.podSecurityContext (uid 1000). A per-component override
      # layers on top rather than replacing, so a partial override cannot
      # strip runAsNonRoot or the seccomp profile.
      securityContext:
        {{- include "langwatch.podSecurityContext" (dict "ctx" . "component" .Values.redis "base" (dict "runAsUser" 999 "runAsGroup" 999 "fsGroup" 999)) | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          securityContext:
            {{- include "langwatch.containerSecurityContext" (dict "ctx" . "component" .Values.redis) | nindent 12 }}
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy | default "IfNotPresent" }}
          {{- if $authEnabled }}
          command: ["sh", "-c", "redis-server --maxmemory-policy noeviction --requirepass \"$REDIS_PASSWORD\""]
          {{- else }}
          command: ["redis-server", "--maxmemory-policy", "noeviction"]
          {{- end }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          {{- if $authEnabled }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ if .Values.redis.auth.existingSecret }}{{ .Values.redis.auth.secretKeys.passwordKey | default "password" }}{{ else }}redis-password{{ end }}
          {{- end }}
          {{- with .Values.redis.master.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              {{- if $authEnabled }}
              command: ["sh", "-c", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
              {{- else }}
              command: ["redis-cli", "ping"]
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              {{- if $authEnabled }}
              command: ["sh", "-c", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
              {{- else }}
              command: ["redis-cli", "ping"]
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
            # Writable /tmp so the container can run read-only root.
            - name: tmp
              mountPath: /tmp
      volumes:
        # Bounded like every other scratch volume: an unbounded emptyDir is
        # backed by node ephemeral storage, so a looping pod evicts neighbours
        # instead of itself.
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.redis.scratchSizeLimit }}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.redis.master.persistence.storageClass }}
        storageClassName: {{ .Values.redis.master.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.master.persistence.size | default "8Gi" }}
{{- end }}

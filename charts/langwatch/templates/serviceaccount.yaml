{{/*
  ServiceAccount for the first-party workloads that touch object storage
  (app, workers, cronjobs).

  Opt-in via global.serviceAccount.create. When false — the default — this
  file renders nothing and the workloads keep using the namespace `default`
  account, so existing installs are byte-identical.

  Its reason to exist is cloud identity: both AWS IRSA and Azure workload
  identity bind a role to a ServiceAccount, so without one under our control
  there is nowhere to put the annotation. Issues #6182 / #6087.
*/}}
{{- if ((.Values.global).serviceAccount).create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "langwatch.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "langwatch.labels" . | nindent 4 }}
  {{- with ((.Values.global).serviceAccount).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

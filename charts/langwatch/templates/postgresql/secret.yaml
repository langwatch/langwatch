{{- if .Values.postgresql.chartManaged }}
{{- if not .Values.postgresql.auth.existingSecret }}
{{- $secretName := printf "%s-postgresql" .Release.Name }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- /* Same rule as the Redis Secret: a generated password is only stable where
       helm can read the live Secret back, so with autogen off one is required. */}}
{{- if and (not .Values.autogen.enabled) (not $existingSecret) (not .Values.postgresql.auth.password) }}
{{- fail "postgresql.auth.existingSecret is required when autogen.enabled=false (or set postgresql.auth.password): the chart only generates the PostgreSQL password with autogen.enabled=true, and that generated password is only stable under plain helm. Create a Secret holding the password, set postgresql.auth.existingSecret to its name and postgresql.auth.secretKeys to its keys. See https://docs.langwatch.ai/self-hosting/deployment/kubernetes-helm#production-deployment" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "langwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    # Argo CD: before the LangWatchQL render Job (wave -1), which reads it.
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
data:
  {{- if $existingSecret }}
  {{- $adminPw := index $existingSecret.data "postgres-password" }}
  {{- $clientPw := index $existingSecret.data "password" }}
  postgres-password: {{ $adminPw }}
  password: {{ $clientPw }}
  {{- else if .Values.postgresql.auth.password }}
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else }}
  {{- $pw := randAlphaNum 24 | b64enc | quote }}
  postgres-password: {{ $pw }}
  password: {{ $pw }}
  {{- end }}
{{- end }}
{{- end }}

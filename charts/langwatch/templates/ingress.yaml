{{- if .Values.ingress.enabled }}
{{- $blockedPaths := include "langwatch.ingress.blockedPaths" . | fromJsonArray }}
{{- /*
  An app path nested under a blocked prefix out-matches the blackhole and
  silently undoes the block, so refuse to render it. Matching is on
  `/`-separated segments like `pathType: Prefix`, so the `/api/internal-status`
  sibling — which the block does not cover — still renders.

  Segment matching only covers LITERAL paths. Two other shapes defeat the block
  while rendering a manifest that looks correct, so both are refused below:
  a regex `ImplementationSpecific` path (ingress-nginx gives regex locations
  priority over prefix locations, so `/api/(.*)` wins outright), and the
  `default-backend` annotation, which ingress-nginx defines as the handler for
  a service with no active endpoints — precisely what the blackhole is.
*/ -}}
{{- if $blockedPaths }}
  {{- /* ingress-nginx: `default-backend` reroutes exactly the no-endpoint case
         the blackhole relies on, turning the block into a working proxy. */ -}}
  {{- range $annotation, $value := (.Values.ingress.annotations | default dict) }}
    {{- if hasSuffix "/default-backend" (toString $annotation) }}
      {{- fail (printf "ingress.annotations contains %q, which routes requests for a backend with no endpoints to another service — that is exactly how the blackhole blocks %v, so the block would render but forward instead. Remove the annotation, or set ingress.blockedPaths: [] to disable the block knowingly." (toString $annotation) $blockedPaths) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range $host := .Values.ingress.hosts }}
  {{- /* `not $host.http` accepted `http: {}` and `http: {paths: []}`, either of
         which renders an Ingress whose only rules are blackholes — a total
         outage that applies without error. Test the list itself. */ -}}
  {{- if not (dig "http" "paths" list $host) }}
    {{- fail (printf "ingress.hosts entry for host %q has no http.paths. An entry with no paths renders an Ingress that routes nothing to the app." (toString $host.host)) }}
  {{- end }}
  {{- range $path := $host.http.paths }}
    {{- if not $path.path }}
      {{- fail (printf "ingress.hosts entry for host %q has a path with no `path` key" (toString $host.host)) }}
    {{- end }}
    {{- if $blockedPaths }}
      {{- /* A regex path is not comparable segment-wise, so the nested-path
             guard below cannot reason about it at all. Refuse rather than
             render a block the controller will rank below it.

             `.` is in the class even though it is legal in a literal path
             (/static/app.js): under ImplementationSpecific a controller MAY
             treat the value as a regex, where `.` matches any character — so
             /api/intern.l would match /api/internal and outrank the block.
             The path is ambiguous by definition, so this fails closed. It only
             bites when blockedPaths is non-empty, and a literal path should be
             pathType: Prefix or Exact anyway. */ -}}
      {{- if and (eq (toString ($path.pathType | default "")) "ImplementationSpecific") (regexMatch "[][().{}*+?^$\\\\|]" $path.path) }}
        {{- fail (printf "ingress.hosts path %q uses pathType: ImplementationSpecific with regex metacharacters while ingress.blockedPaths is set. Controllers that honour regex (ingress-nginx with use-regex) rank it above the blackhole's Prefix rule, re-exposing the private control plane. Use a literal Prefix path, or set ingress.blockedPaths: [] to disable the block knowingly." $path.path) }}
      {{- end }}
    {{- end }}
    {{- range $blocked := $blockedPaths }}
      {{- if or (eq $path.path $blocked) (hasPrefix (printf "%s/" $blocked) $path.path) }}
        {{- fail (printf "ingress.hosts path %q is nested under the blocked prefix %q, so it would out-match the blackhole and re-expose the private control plane. Remove the path, or drop %q from ingress.blockedPaths to disable the block knowingly." $path.path $blocked $blocked) }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  {{- if .Values.ingress.labels }}
  labels:
    {{- .Values.ingress.labels | toYaml | nindent 4 }}
  {{- end }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- .Values.ingress.annotations | toYaml | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - secretName: {{ .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /* Longest-match carries the block; emitting first hedges
            controllers that rank by list position (AWS LBC). */}}
          {{- range $blockedPaths }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-blackhole
                port:
                  number: 80
          {{- end }}
          {{- range .http.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              {{- if .backend }}
              {{- toYaml .backend | nindent 14 }}
              {{- else }}
              service:
                name: {{ $.Release.Name }}-app
                port:
                  number: {{ $.Values.app.service.port | default 5560 }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}

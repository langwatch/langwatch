{{- if .Values.ingress.enabled }}
{{- $blockedPaths := include "langwatch.ingress.blockedPaths" . | fromJsonArray }}
{{- /*
  Guard: an application path nested under a blocked prefix out-matches the
  blackhole and routes the private control plane straight to the app, silently
  undoing the block — the blocked path and the blackhole Service are both still
  rendered, so nothing looks wrong. Refuse to render instead.

  The match is on `/`-separated segments, exactly like `pathType: Prefix`: a
  bare `hasPrefix $blocked $path.path` would also reject `/api/internal-status`,
  which the block genuinely does NOT cover and which is a legitimate app path.

  Known limit: the comparison is on literal paths. A `pathType:
  ImplementationSpecific` path written as a regex that happens to cover the same
  URLs (`/api/internal(/|$)(.*)`) is neither equal to nor nested under the
  prefix, so it passes the guard — and on ingress-nginx with `use-regex`, a
  regex location beats the blackhole's prefix location. Installs that combine
  `use-regex`/`rewrite-target` with blocked prefixes have to verify that
  themselves.

  Emptying `ingress.blockedPaths` disables the guard along with the block, so an
  operator who knowingly opts out is never held up by it. Operators running the
  gateway or the Langy agent OUTSIDE this release (see gateway.controlPlane and
  langyagent.controlPlane) legitimately need part of `/api/internal` published,
  and that is the case this guard will stop — narrow the list rather than
  fighting it.
*/ -}}
{{- range $host := .Values.ingress.hosts }}
  {{- if not $host.http }}
    {{- fail (printf "ingress.hosts entry for host %q has no http.paths" (toString $host.host)) }}
  {{- end }}
  {{- range $path := $host.http.paths }}
    {{- if not $path.path }}
      {{- fail (printf "ingress.hosts entry for host %q has a path with no `path` key" (toString $host.host)) }}
    {{- end }}
    {{- range $blocked := $blockedPaths }}
      {{- if or (eq $path.path $blocked) (hasPrefix (printf "%s/" $blocked) $path.path) }}
        {{- fail (printf "ingress.hosts path %q is nested under the blocked prefix %q, so it would out-match the blackhole and re-expose the private control plane. Remove the path, or drop %q from ingress.blockedPaths to disable the block knowingly." $path.path $blocked $blocked) }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  {{- if .Values.ingress.labels }}
  labels:
    {{- .Values.ingress.labels | toYaml | nindent 4 }}
  {{- end }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- .Values.ingress.annotations | toYaml | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - secretName: {{ .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /*
            Blocked prefixes come first and route to the no-endpoints blackhole
            Service (see templates/blackhole-service.yaml). What carries the
            block is longest-match: `/api/internal` is a longer match than the
            app's catch-all `/`. Emitting first is a hedge for controllers that
            derive rule priority from list position (the AWS load balancer
            controller) rather than from match length.

            See ingress.blockedPaths in values.yaml for the WHY and the
            controller caveats — this is the only copy of that argument.
          */}}
          {{- range $blockedPaths }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-blackhole
                port:
                  number: 80
          {{- end }}
          {{- range .http.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              {{- if .backend }}
              {{- toYaml .backend | nindent 14 }}
              {{- else }}
              service:
                name: {{ $.Release.Name }}-app
                port:
                  number: {{ $.Values.app.service.port | default 5560 }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}

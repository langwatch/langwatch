{{- if .Values.ingress.enabled }}
{{- $blockedPaths := include "langwatch.ingress.blockedPaths" . | fromJsonArray }}
{{- /*
  An app path nested under a blocked prefix out-matches the blackhole and
  silently undoes the block, so refuse to render it. Matching is on
  `/`-separated segments like `pathType: Prefix`, so the `/api/internal-status`
  sibling — which the block does not cover — still renders.

  Literal paths only: a regex `ImplementationSpecific` path covering the same
  URLs passes the guard, and beats the blackhole on nginx with `use-regex`.
*/ -}}
{{- range $host := .Values.ingress.hosts }}
  {{- if not $host.http }}
    {{- fail (printf "ingress.hosts entry for host %q has no http.paths" (toString $host.host)) }}
  {{- end }}
  {{- range $path := $host.http.paths }}
    {{- if not $path.path }}
      {{- fail (printf "ingress.hosts entry for host %q has a path with no `path` key" (toString $host.host)) }}
    {{- end }}
    {{- range $blocked := $blockedPaths }}
      {{- if or (eq $path.path $blocked) (hasPrefix (printf "%s/" $blocked) $path.path) }}
        {{- fail (printf "ingress.hosts path %q is nested under the blocked prefix %q, so it would out-match the blackhole and re-expose the private control plane. Remove the path, or drop %q from ingress.blockedPaths to disable the block knowingly." $path.path $blocked $blocked) }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  {{- if .Values.ingress.labels }}
  labels:
    {{- .Values.ingress.labels | toYaml | nindent 4 }}
  {{- end }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- .Values.ingress.annotations | toYaml | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - secretName: {{ .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /* Longest-match carries the block; emitting first hedges
            controllers that rank by list position (AWS LBC). */}}
          {{- range $blockedPaths }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-blackhole
                port:
                  number: 80
          {{- end }}
          {{- range .http.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              {{- if .backend }}
              {{- toYaml .backend | nindent 14 }}
              {{- else }}
              service:
                name: {{ $.Release.Name }}-app
                port:
                  number: {{ $.Values.app.service.port | default 5560 }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}

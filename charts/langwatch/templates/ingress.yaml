{{- /*
  The AI Gateway is published from this Ingress's settings (ingress.gateway),
  not from a gateway Ingress of its own. The retired gateway.ingress block, or
  a gateway host with no Ingress to carry it, would otherwise render nothing
  without a word, so both are refused. `gateway.ingress.enabled: false` on its
  own asks for nothing and is accepted.
*/ -}}
{{- $gwOld := (.Values.gateway | default dict).ingress }}
{{- if and $gwOld (kindIs "map" $gwOld) (or $gwOld.enabled (omit $gwOld "enabled")) }}
  {{- fail "gateway.ingress.* is no longer supported: the gateway chart renders no Ingress. Publish the gateway on the app Ingress with ingress.gateway.host (and ingress.gateway.tls.secretName); it uses ingress.className and ingress.annotations, and the chart adds the nginx streaming settings when className is nginx. Remove the gateway.ingress block. See https://docs.langwatch.ai/self-hosting/deployment/routing" }}
{{- end }}
{{- $gwRoute := (.Values.ingress | default dict).gateway | default dict }}
{{- if $gwRoute.host }}
  {{- if not .Values.ingress.enabled }}
    {{- fail (printf "ingress.gateway.host is %q but ingress.enabled is not true, so no Ingress would carry it. Set ingress.enabled=true, or clear ingress.gateway.host if you route to the gateway another way." (toString $gwRoute.host)) }}
  {{- end }}
  {{- if not (.Values.gateway | default dict).chartManaged }}
    {{- fail "ingress.gateway.host is set but gateway.chartManaged is false, so there is no gateway Service in this release to route to. Clear ingress.gateway.host, or set gateway.chartManaged=true." }}
  {{- end }}
{{- end }}
{{- $uploadsSwitch := ((.Values.ingress | default dict).uploads | default dict).enabled }}
{{- if not (or (kindIs "invalid" $uploadsSwitch) (kindIs "bool" $uploadsSwitch)) }}
  {{- fail (printf "ingress.uploads.enabled is %q; use true, false, or leave it unset (on for className nginx)." (toString $uploadsSwitch)) }}
{{- end }}
{{- if and (eq $uploadsSwitch true) (not .Values.ingress.enabled) }}
  {{- fail "ingress.uploads.enabled is true but ingress.enabled is not true, so no Ingress would carry the upload route. Set ingress.enabled=true, or unset ingress.uploads.enabled." }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- $blockedPaths := include "langwatch.ingress.blockedPaths" . | fromJsonArray }}
{{- /*
  An app path nested under a blocked prefix out-matches the blackhole and
  silently undoes the block, so refuse to render it. Matching is on
  `/`-separated segments like `pathType: Prefix`, so the `/api/internal-status`
  sibling — which the block does not cover — still renders.

  Segment matching only covers LITERAL paths. Two other shapes defeat the block
  while rendering a manifest that looks correct, so both are refused below:
  a regex `ImplementationSpecific` path (ingress-nginx gives regex locations
  priority over prefix locations, so `/api/(.*)` wins outright), and the
  `default-backend` annotation, which ingress-nginx defines as the handler for
  a service with no active endpoints — precisely what the blackhole is.
*/ -}}
{{- if $blockedPaths }}
  {{- /* ingress-nginx: `default-backend` reroutes exactly the no-endpoint case
         the blackhole relies on, turning the block into a working proxy. */ -}}
  {{- range $annotation, $value := (.Values.ingress.annotations | default dict) }}
    {{- if hasSuffix "/default-backend" (toString $annotation) }}
      {{- fail (printf "ingress.annotations contains %q, which routes requests for a backend with no endpoints to another service — that is exactly how the blackhole blocks %v, so the block would render but forward instead. Remove the annotation, or set ingress.blockedPaths: [] to disable the block knowingly." (toString $annotation) $blockedPaths) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range $host := .Values.ingress.hosts }}
  {{- /* `not $host.http` accepted `http: {}` and `http: {paths: []}`, either of
         which renders an Ingress whose only rules are blackholes — a total
         outage that applies without error. Test the list itself. */ -}}
  {{- if not (dig "http" "paths" list $host) }}
    {{- fail (printf "ingress.hosts entry for host %q has no http.paths. An entry with no paths renders an Ingress that routes nothing to the app." (toString $host.host)) }}
  {{- end }}
  {{- range $path := $host.http.paths }}
    {{- if not $path.path }}
      {{- fail (printf "ingress.hosts entry for host %q has a path with no `path` key" (toString $host.host)) }}
    {{- end }}
    {{- if $blockedPaths }}
      {{- /* A regex path is not comparable segment-wise, so the nested-path
             guard below cannot reason about it at all. Refuse rather than
             render a block the controller will rank below it.

             `.` is in the class even though it is legal in a literal path
             (/static/app.js): under ImplementationSpecific a controller MAY
             treat the value as a regex, where `.` matches any character — so
             /api/intern.l would match /api/internal and outrank the block.
             The path is ambiguous by definition, so this fails closed. It only
             bites when blockedPaths is non-empty, and a literal path should be
             pathType: Prefix or Exact anyway. */ -}}
      {{- if and (eq (toString ($path.pathType | default "")) "ImplementationSpecific") (regexMatch "[][().{}*+?^$\\\\|]" $path.path) }}
        {{- fail (printf "ingress.hosts path %q uses pathType: ImplementationSpecific with regex metacharacters while ingress.blockedPaths is set. Controllers that honour regex (ingress-nginx with use-regex) rank it above the blackhole's Prefix rule, re-exposing the private control plane. Use a literal Prefix path, or set ingress.blockedPaths: [] to disable the block knowingly." $path.path) }}
      {{- end }}
    {{- end }}
    {{- range $blocked := $blockedPaths }}
      {{- if or (eq $path.path $blocked) (hasPrefix (printf "%s/" $blocked) $path.path) }}
        {{- fail (printf "ingress.hosts path %q is nested under the blocked prefix %q, so it would out-match the blackhole and re-expose the private control plane. Remove the path, or drop %q from ingress.blockedPaths to disable the block knowingly." $path.path $blocked $blocked) }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- /*
  ingress-nginx cuts a response at 60 s by default, the same as an analytics
  query's own limit, so with className nginx the app Ingress waits 120 s. Its
  1m body default would refuse a trace export carrying a recording, so the body
  size follows the trace receiver's 64 MiB default. ingress.annotations override these.
*/}}
{{- $appAnnotations := dict }}
{{- if eq (toString .Values.ingress.className) "nginx" }}
{{- $appAnnotations = dict
      "nginx.ingress.kubernetes.io/proxy-read-timeout" "120"
      "nginx.ingress.kubernetes.io/proxy-send-timeout" "120"
      "nginx.ingress.kubernetes.io/proxy-body-size" "64m" }}
{{- end }}
{{- $appAnnotations = mergeOverwrite $appAnnotations (deepCopy (.Values.ingress.annotations | default dict)) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  {{- if .Values.ingress.labels }}
  labels:
    {{- .Values.ingress.labels | toYaml | nindent 4 }}
  {{- end }}
  {{- with $appAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - secretName: {{ .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /* Longest-match carries the block; emitting first hedges
            controllers that rank by list position (AWS LBC). */}}
          {{- range $blockedPaths }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-blackhole
                port:
                  number: 80
          {{- end }}
          {{- range .http.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              {{- if .backend }}
              {{- toYaml .backend | nindent 14 }}
              {{- else }}
              service:
                name: {{ $.Release.Name }}-app
                port:
                  number: {{ $.Values.app.service.port | default 5560 }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- /*
  Uploads (#9666) stream up to 5 GiB and ingress-nginx sizes per Ingress, so the route gets
  its own; on for className nginx unless switched. Annotations: the app's minus rewrites and
  server-snippet (host-scoped), the upload settings, then ingress.uploads.annotations.
*/}}
{{- $uploadsPath := "/api/stored-objects/uploads" }}
{{- $uploadsBlocked := false }}
{{- range $blockedPaths }}
  {{- if hasPrefix (printf "%s/" .) (printf "%s/" $uploadsPath) }}{{ $uploadsBlocked = true }}{{ end }}
{{- end }}
{{- /* A host whose own paths already route the upload path keeps it: a repeat is rejected. */}}
{{- $uploadsHosts := list }}
{{- range $host := .Values.ingress.hosts }}
  {{- $owned := false }}
  {{- range $host.http.paths }}
    {{- $p := trimSuffix "/" (toString .path) }}
    {{- if eq $p $uploadsPath }}{{ $owned = true }}{{ end }}
  {{- end }}
  {{- if not $owned }}{{ $uploadsHosts = append $uploadsHosts $host.host }}{{ end }}
{{- end }}
{{- $uploadsClass := toString (.Values.ingress.className | default "") }}
{{- $uploadsOn := ternary $uploadsSwitch (eq $uploadsClass "nginx") (kindIs "bool" $uploadsSwitch) }}
{{- if and $uploadsOn (not $uploadsBlocked) $uploadsHosts }}
{{- $uploadsRoute := (.Values.ingress.uploads | default dict) }}
{{- $uploadsAnnotations := omit (deepCopy $appAnnotations) "nginx.ingress.kubernetes.io/rewrite-target" "nginx.ingress.kubernetes.io/use-regex" "nginx.ingress.kubernetes.io/app-root" "nginx.ingress.kubernetes.io/server-snippet" }}
{{- /* An ingress-nginx class by name (nginx, nginx-internal) gets the settings; others none. */}}
{{- if contains "nginx" $uploadsClass }}
{{- $uploadsAnnotations = mergeOverwrite $uploadsAnnotations (dict
      "nginx.ingress.kubernetes.io/proxy-request-buffering" "off"
      "nginx.ingress.kubernetes.io/proxy-body-size" "5121m"
      "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600"
      "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600") }}
{{- end }}
{{- $uploadsAnnotations = mergeOverwrite $uploadsAnnotations (deepCopy ($uploadsRoute.annotations | default dict)) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-uploads-ingress
  {{- if .Values.ingress.labels }}
  labels:
    {{- .Values.ingress.labels | toYaml | nindent 4 }}
  {{- end }}
  {{- with $uploadsAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $uploadsClass }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- /* No tls: ingress-nginx serves each host's certificate from the app
         Ingress, and a second tls entry would have cert-manager issue it twice. */}}
  rules:
    {{- range $uploadsHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $uploadsPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-app
                port:
                  number: {{ $.Values.app.service.port | default 5560 }}
    {{- end }}
{{- end }}
{{- end }}

{{- if and .Values.ingress.enabled $gwRoute.host }}
{{- /*
  A separate Ingress for the gateway host: controllers such as ingress-nginx
  apply annotations per Ingress object, and the gateway needs streaming
  settings the app routes do not. Everything else comes from the app Ingress
  settings. Precedence: ingress.annotations, then the nginx streaming
  defaults (className nginx only), then ingress.gateway.annotations. Path
  rewrites written for the app routes are left out: the gateway paths have no
  capture groups, so an inherited rewrite-target would send /v1/... to /.
*/}}
{{- $gwAnnotations := omit (deepCopy (.Values.ingress.annotations | default dict)) "nginx.ingress.kubernetes.io/rewrite-target" "nginx.ingress.kubernetes.io/use-regex" "nginx.ingress.kubernetes.io/app-root" }}
{{- if eq (toString .Values.ingress.className) "nginx" }}
{{- $gwAnnotations = mergeOverwrite $gwAnnotations (dict
      "nginx.ingress.kubernetes.io/proxy-buffering" "off"
      "nginx.ingress.kubernetes.io/proxy-request-buffering" "off"
      "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600"
      "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600"
      "nginx.ingress.kubernetes.io/proxy-body-size" "32m") }}
{{- end }}
{{- $gwAnnotations = mergeOverwrite $gwAnnotations (deepCopy ($gwRoute.annotations | default dict)) }}
{{- $gwPort := ((.Values.gateway.service | default dict).port) | default 80 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-gateway-ingress
  {{- if .Values.ingress.labels }}
  labels:
    {{- .Values.ingress.labels | toYaml | nindent 4 }}
  {{- end }}
  {{- with $gwAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with ($gwRoute.tls | default dict).secretName }}
  tls:
    - secretName: {{ . }}
      hosts:
        - {{ $gwRoute.host | quote }}
  {{- end }}
  rules:
    - host: {{ $gwRoute.host | quote }}
      http:
        paths:
          {{- /* Only the client API, the A2A proxy and the status endpoint.
                 The probes, /metrics, /debug and /internal stay in-cluster. */}}
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port:
                  number: {{ $gwPort }}
          - path: /a2a
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port:
                  number: {{ $gwPort }}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port:
                  number: {{ $gwPort }}
{{- end }}

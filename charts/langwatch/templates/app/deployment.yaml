{{- include "langwatch.validateSecrets" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-app
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "langwatch.labels" . | nindent 4 }}
    {{- if .Values.app.deployment.labels }}
    {{- toYaml .Values.app.deployment.labels | nindent 4 }}
    {{- end }}
  {{- with .Values.app.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  {{- if .Values.app.deployment.strategy }}
  strategy:
    {{- toYaml .Values.app.deployment.strategy | nindent 8 }}
  {{- else if eq (include "langwatch.storedObjects.localFilesystemIsActive" .) "true" }}
  {{/* Default kill-then-start under local-FS: the pod holds the RWO
       stored-objects PVC, and the k8s default RollingUpdate (25% surge) starts
       the new pod BEFORE the old one releases the volume — on a multi-node
       cluster the new pod can land on another node and wedge Pending on a
       multi-attach error (the scheduler does not avoid RWO conflicts for CSI
       volumes). maxSurge=0/maxUnavailable=1 at replicas=1 behaves exactly like
       Recreate (old pod terminates and releases the volume before the new one
       schedules), at the cost of a brief downtime — honest for the
       single-replica local-FS tier.

       Deliberately NOT `type: Recreate`: switching a live Deployment from the
       k8s-defaulted RollingUpdate to Recreate requires DELETING the live
       `rollingUpdate` struct, and Helm's 3-way merge cannot emit that deletion
       when the previous release's manifest never had a `strategy` key (the
       pre-#5083 chart) — the API then rejects the patch with
       "spec.strategy.rollingUpdate: Forbidden: may not be specified when
       strategy `type` is 'Recreate'", failing every upgrade across this
       boundary. Setting maxSurge/maxUnavailable only UPDATES existing fields,
       which the merge applies cleanly. An explicit app.deployment.strategy
       overrides this. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  {{- if hasKey (default (dict) .Values.app.deployment) "revisionHistoryLimit" }}
  revisionHistoryLimit: {{ .Values.app.deployment.revisionHistoryLimit }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-app
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-app
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if .Values.app.pod.labels }}
        {{- toYaml .Values.app.pod.labels | nindent 8 }}
        {{- end }}
        {{- with (include "langwatch.cloudIdentityPodLabels" .) }}
        {{- . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with (coalesce .Values.app.pod.annotations .Values.global.podAnnotations) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.app.telemetry.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.app.service.port }}"
        {{- end }}
    spec:
      {{- with (include "langwatch.serviceAccountName" .) }}
      serviceAccountName: {{ . }}
      {{- end }}
      # The app does not call the Kubernetes API, so don't mount the SA token.
      # Cloud workload identity is unaffected by this flag: the platform
      # webhook injects its own projected token volume, which the chart
      # deliberately does not hand-roll.
      automountServiceAccountToken: {{ .Values.global.automountServiceAccountToken }}
      # Pod security context - https://kubespec.dev/v1/Pod#spec.securityContext
      securityContext:
        {{- include "langwatch.podSecurityContext" (dict "ctx" . "component" .Values.app) | nindent 8 }}

      # Node selection - https://kubespec.dev/v1/Pod#spec.nodeSelector
      {{- with (coalesce .Values.app.nodeSelector .Values.global.scheduling.nodeSelector)}}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # Tolerations - https://kubespec.dev/v1/Pod#spec.tolerations
      {{- with (coalesce .Values.app.tolerations .Values.global.scheduling.tolerations)}}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # Affinity - https://kubespec.dev/v1/Pod#spec.affinity
      {{- with (coalesce .Values.app.affinity .Values.global.scheduling.affinity)}}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # Topology spread constraints - https://kubespec.dev/v1/Pod#spec.topologySpreadConstraints
      {{- with (coalesce .Values.app.topologySpreadConstraints .Values.global.scheduling.topologySpreadConstraints)}}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # PriorityClass - https://kubespec.dev/v1/Pod#spec.priorityClassName
      {{- with (coalesce .Values.app.priorityClassName .Values.global.scheduling.priorityClassName)}}
      priorityClassName: {{ . | quote }}
      {{- end }}

      {{- with .Values.app.extraInitContainers}}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- with .Values.app.extraContainers}}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: {{ .Release.Name }}-app
          securityContext:
            {{- include "langwatch.containerSecurityContext" (dict "ctx" . "component" .Values.app) | nindent 12 }}
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: "{{ .Values.images.app.pullPolicy }}"
          ports:
            - name: http
              containerPort: {{ .Values.app.service.port }}
              protocol: TCP
          env:
            {{- include "langwatch.sharedEnv" . | nindent 12 }}

            # Names this process in telemetry. It becomes the OTel resource
            # `service.name` and the `service` field on every stdout log line,
            # which log shipping promotes to the Loki `service_name` label.
            # Set per role so app / workers / cronjobs stay distinguishable —
            # unset, all three collapse onto the same code default.
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.app.otel.serviceName | default "langwatch-app" | quote }}

            {{/* NEXTAUTH_URL comes from langwatch.sharedEnv: every process
                 needs the same answer for what this installation is called. */}}
            - name: NEXTAUTH_URL_INTERNAL
              value: "http://localhost:{{ .Values.app.service.port | default 5560 }}"

            # Internal platform-API base URL that in-pod scenario/simulation
            # runners call back to. Post-#3541 the app boot-validates it as a
            # required URL. On the app pod the app IS local, so self-reference
            # over localhost (like NEXTAUTH_URL_INTERNAL) — no Service/DNS hop.
            # Workers/nlp are separate pods and use the app's service DNS
            # instead. Override only if in-pod runners must reach the app
            # through a different URL.
            - name: LANGWATCH_ENDPOINT
              value: {{ .Values.app.http.langwatchEndpoint | default (printf "http://localhost:%v" (.Values.app.service.port | default 5560)) | quote }}

            # Content-hashed asset base (ADR-086). Empty by default → assets are
            # served same-origin from the pod. Set to a commit-prefixed CDN base
            # so a rolling deploy never strands a browser on a stale-chunk 404.
            {{- if .Values.app.assetBase }}
            - name: LANGWATCH_ASSET_BASE
              value: {{ .Values.app.assetBase | quote }}
            {{- end }}

            # Cron API key
            {{- if .Values.app.cronApiKey.secretKeyRef.name }}
            - name: CRON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.cronApiKey.secretKeyRef.name }}
                  key: {{ .Values.app.cronApiKey.secretKeyRef.key }}
            {{- else if .Values.secrets.existingSecret }}
            - name: CRON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.secretKeys.cronApiKey | default "cronApiKey" }}
            {{- else if .Values.autogen.enabled }}
            - name: CRON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "langwatch.appSecretName" . }}
                  key: cronApiKey
            {{- end }}

            # AI Gateway virtual-key pepper (control-plane only).
            # The gateway pod must NEVER receive this value — it is used here
            # in src/server/gateway/virtualKey.crypto.ts to hash incoming VK
            # plaintext against the stored digest.
            {{- if .Values.app.virtualKeyPepper.secretKeyRef.name }}
            - name: LW_VIRTUAL_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.virtualKeyPepper.secretKeyRef.name }}
                  key: {{ .Values.app.virtualKeyPepper.secretKeyRef.key }}
            {{- else if .Values.secrets.existingSecret }}
            - name: LW_VIRTUAL_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.secretKeys.virtualKeyPepper | default "virtualKeyPepper" }}
            {{- else if .Values.autogen.enabled }}
            - name: LW_VIRTUAL_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "langwatch.appSecretName" . }}
                  key: virtualKeyPepper
            {{- end }}

            # AI Gateway shared auth — HMAC internal-call signing + per-request
            # JWT issuance. langwatch-app and the gateway pod mount these from
            # the SAME Secret (the app Secret — secrets.existingSecret when
            # operator-provided, autogen.secretNames.app when chart-rendered).
            # Rotating either value requires rolling both Deployments.
            {{- if .Values.gateway.chartManaged }}
            - name: LW_GATEWAY_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "langwatch.appSecretName" . }}
                  key: LW_GATEWAY_INTERNAL_SECRET
            - name: LW_GATEWAY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "langwatch.appSecretName" . }}
                  key: LW_GATEWAY_JWT_SECRET
            {{- end }}

            {{- if (index .Values "langyagent").chartManaged }}
            # Langy agent pod. The app POSTs chats to OPENCODE_AGENT_URL with
            # LANGY_INTERNAL_SECRET as the Bearer token; the agent verifies it
            # against the same Secret. Subchart values key read via index (aliased subchart).
            - name: OPENCODE_AGENT_URL
              value: {{ (index .Values "langyagent").controlPlane.agentUrl | default (printf "http://%s-langyagent:80" .Release.Name) | quote }}
            - name: LANGY_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ (index .Values "langyagent").secrets.existingSecretName | default (include "langwatch.appSecretName" .) }}
                  key: {{ (index .Values "langyagent").secrets.internalSecretKey | default "LANGY_INTERNAL_SECRET" }}
            {{- include "langwatch.langyCallbackUrlEnv" . | nindent 12 }}
            {{- end }}
            {{- /* Langy's rollout flag is SYSTEM-scoped and defaults off, because
                   the hosted product opens it one cohort at a time. A self-hosted
                   install has a single cohort — the people who installed it — so
                   deploying the agent and then finding no assistant anywhere in
                   the product is a dead end whose only lever is an internal ops
                   screen. Deploying the pod IS the decision to enable it; the
                   operator keeps the staged path by setting
                   langyagent.enableForAllUsers=false, which hands authority back
                   to the flag store (/ops/feature-flags). Operator-forced flags
                   are joined with it, never clobbered by it. */}}
            {{- $forcedFlags := list }}
            {{- with .Values.app.featureFlagForceEnable }}
            {{- $forcedFlags = append $forcedFlags . }}
            {{- end }}
            {{- if and (index .Values "langyagent").chartManaged (index .Values "langyagent").enableForAllUsers }}
            {{- $forcedFlags = append $forcedFlags "release_langy_enabled" }}
            {{- end }}
            {{- if $forcedFlags }}
            - name: FEATURE_FLAG_FORCE_ENABLE
              value: {{ join "," $forcedFlags | quote }}
            {{- end }}

            # LW_GATEWAY_PUBLIC_URL — the externally-reachable AI Gateway URL
            # the control plane hands to CLI users (langwatch claude/codex/
            # cursor) at login. Without it the CLI falls back to
            # http://localhost:5563, which a developer laptop can't reach
            # against a remote cluster. Prefer the explicit gateway.publicUrl
            # knob; otherwise derive it from an operator-set gateway ingress
            # host (the SaaS default host is skipped so a self-host install
            # never silently points at gateway.langwatch.ai).
            {{- $gwPublic := .Values.gateway.publicUrl | default "" }}
            {{- if not $gwPublic }}
            {{- $gwIngress := .Values.gateway.ingress | default dict }}
            {{- $gwHost := $gwIngress.host | default "" }}
            {{- if and $gwIngress.enabled $gwHost (ne $gwHost "gateway.langwatch.ai") }}
            {{- $scheme := "http" }}
            {{- if and $gwIngress.tls $gwIngress.tls.enabled }}{{- $scheme = "https" }}{{- end }}
            {{- $gwPublic = printf "%s://%s" $scheme $gwHost }}
            {{- end }}
            {{- end }}
            {{- if $gwPublic }}
            - name: LW_GATEWAY_PUBLIC_URL
              value: {{ $gwPublic | quote }}
            {{- end }}

            {{- /* LW_GATEWAY_BASE_URL — where the CONTROL PLANE itself reaches the
                   gateway, over cluster DNS. Distinct from the public URL above,
                   which is what browsers and laptops use: an install with no
                   gateway ingress (the common self-hosted shape) has no public URL
                   at all, and the control plane still has to reach the gateway.
                   Langy needs it to mint the worker's virtual key, and without it
                   the assistant refuses every turn with a credential-resolution
                   error naming this variable. */}}
            {{- include "langwatch.gatewayBaseUrlEnv" . | nindent 12 }}

            # NextAuth configuration (NEXTAUTH_SECRET lives in sharedEnv —
            # every app-image consumer needs it, see _helpers.tpl)
            - name: NEXTAUTH_PROVIDER
              value: {{ .Values.app.nextAuth.provider | quote }}

            # NextAuth - SSO OAuth providers (auth0, azureAd, cognito, github,
            # gitlab, google, okta, onelogin, oidc).
            # These are this chart's values keys, which map to env prefixes; the
            # provider id the app selects on is app.nextAuth.provider.
            {{- $oauthProviders := list
              (dict "key" "auth0"    "prefix" "AUTH0"    "fields" (list "clientId" "clientSecret" "issuer"))
              (dict "key" "azureAd"  "prefix" "AZURE_AD" "fields" (list "clientId" "clientSecret" "tenantId"))
              (dict "key" "cognito"  "prefix" "COGNITO"  "fields" (list "clientId" "clientSecret" "issuer"))
              (dict "key" "github"   "prefix" "GITHUB"   "fields" (list "clientId" "clientSecret"))
              (dict "key" "gitlab"   "prefix" "GITLAB"   "fields" (list "clientId" "clientSecret"))
              (dict "key" "google"   "prefix" "GOOGLE"   "fields" (list "clientId" "clientSecret"))
              (dict "key" "okta"     "prefix" "OKTA"     "fields" (list "clientId" "clientSecret" "issuer"))
              (dict "key" "onelogin" "prefix" "ONELOGIN" "fields" (list "clientId" "clientSecret" "issuer"))
              (dict "key" "oidc"     "prefix" "OIDC"     "fields" (list "clientId" "clientSecret" "issuer"))
            }}
            {{- range $provider := $oauthProviders }}
            {{- $providerValues := index $.Values.app.nextAuth.providers $provider.key }}
            {{- range $field := $provider.fields }}
            {{- $fieldValues := index $providerValues $field }}
            {{- $envName := printf "%s_%s" $provider.prefix (include "langwatch.envSuffix" $field) }}
            {{- include "langwatch.secretOrValue" (dict "envName" $envName "fieldValues" $fieldValues) | nindent 12 }}
            {{- end }}
            {{- end }}

            {{- with .Values.app.extraEnvs}}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- with .Values.app.extraEnvFrom}}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if .Values.app.extraLifecycle}}
          lifecycle:
            {{- with .Values.app.extraLifecycle}}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            {{- with .Values.app.extraVolumeMounts}}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: tmp-dir
              mountPath: /tmp
            {{- if eq (include "langwatch.storedObjects.localFilesystemIsActive" .) "true" }}
            # Stored-objects local-FS mount — renders ONLY when local-FS is
            # the active backend (dataplane disabled). Single-replica only
            # (the chart refuses to render when replicaCount > 1). PVC-backed
            # so bytes survive pod restarts; without this they'd land on the
            # container's ephemeral writable layer and disappear on every
            # rollout.
            - name: stored-objects-data
              mountPath: {{ .Values.app.storedObjects.localFilesystem.path }}
            {{- end }}

      volumes:
        {{- with .Values.app.extraVolumes}}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: tmp-dir
          emptyDir:
            sizeLimit: {{ .Values.app.scratchSizeLimit }}
        {{- if eq (include "langwatch.storedObjects.localFilesystemIsActive" .) "true" }}
        - name: stored-objects-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-stored-objects
        {{- end }}

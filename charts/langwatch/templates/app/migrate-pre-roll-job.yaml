{{/*
  The pre-roll upgrade (ADR-155; specs/upgrade/entry-points.feature).

  Why. A migration is never breaking: it is applied to the live database while
  the PREVIOUS image is still serving, and the new image must work on the old
  schema until its own migration has run. The api and the workers never
  migrate: at boot they read the upgrade ledger and refuse by name, naming the
  outstanding steps and `pnpm task upgrade`, when a blocking step of their
  image is not done. Something has to run the upgrade before they roll, once,
  and this Job is that something.

  What this does. One Job, on the NEW image, running only the upgrade (the
  api's `start:prepare:db`: `pnpm task upgrade` alone, with no system-migrations
  pass), before helm applies any Deployment. It is fail-closed: an upgrade that
  fails stops the helm upgrade with the new image never rolled and the old one
  still serving the old schema, which is the state an operator can reason
  about. `upgrade` takes its own lease, so a second runner waits, then exits
  naming the holder.

  Scope. pre-upgrade only, deliberately:
    - not pre-install: helm applies hook resources before the rest of the
      manifests, so on a first install the Secrets this Job reads do not exist
      yet. On a first install the api's first boot finds an empty ledger on an
      empty schema and runs the upgrade once itself (Q10); the workers refuse
      and restart until it is done.
    - not pre-rollback: a rollback must never run migrations. Rolling back to
      the previous image on the migrated schema is precisely what the
      expand/contract rules guarantee, and a "down" migration is not how the
      way back works here.

  ArgoCD and Flux map pre-upgrade to PreSync and will run this on every sync,
  including the first. `upgrade` is idempotent, so a redundant run is a no-op
  that exits 0.

  Opt out with `app.migrations.preRoll: false`, for an operator who runs the
  upgrade as a separate pipeline step. Nothing else runs it on an upgrade then:
  until the operator runs `pnpm task upgrade` from the new image, the new pods
  refuse to start, by name.
*/}}
{{- $preRoll := dig "migrations" "preRoll" true .Values.app }}
{{- if $preRoll }}
{{- $name := printf "%s-migrate-pre-roll" .Release.Name }}
{{/* The upgrade can legitimately take a long time on a large installation,
     and a deadline shorter than the work turns a slow migration into a failed
     upgrade half way through the DDL. The app's startupProbe budget is 40
     minutes, which a first install spends on the same upgrade plus a boot, so
     this default sits just under it. */}}
{{- $deadline := dig "migrations" "preRollTimeoutSeconds" 2100 .Values.app }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "langwatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    # Ahead of every other pre-upgrade hook: nothing else in the release should
    # be doing anything while the schema is moving.
    helm.sh/hook-weight: "-20"
    # A FAILED Job is left behind for the operator to read; the next attempt
    # removes it before creating its own, so a failure never blocks the retry.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # One attempt. The runners are idempotent, so a retry is safe — but a
  # migration that failed did so for a reason an operator has to read, and a
  # backoff loop buries it under identical restarts.
  backoffLimit: 0
  activeDeadlineSeconds: {{ $deadline }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "langwatch.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: {{ .Values.global.automountServiceAccountToken }}
      {{- with (include "langwatch.serviceAccountName" .) }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "langwatch.podSecurityContext" (dict "ctx" . "component" .Values.app) | nindent 8 }}
      {{- with (coalesce .Values.app.nodeSelector .Values.global.scheduling.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (coalesce .Values.app.tolerations .Values.global.scheduling.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          securityContext:
            {{- include "langwatch.containerSecurityContext" (dict "ctx" . "component" .Values.app) | nindent 12 }}
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: "{{ .Values.images.app.pullPolicy }}"
          # The upgrade and nothing else: no listener, no queues, no
          # projections. A serving process holding DDL locks is how deploys
          # die (ARCHITECTURE.md §7). The image has no workspace root
          # package.json, so it runs the api's one preparation script.
          workingDir: /app/apps/api
          command: ["pnpm"]
          args: ["-s", "run", "start:prepare:db"]
          env:
            {{- include "langwatch.sharedEnv" . | nindent 12 }}
            # Names this Job in telemetry, so its lines are not filed under the
            # app they run ahead of.
            - name: OTEL_SERVICE_NAME
              value: "langwatch-migrate"
            {{- with .Values.app.extraEnvs }}
            {{- include "langwatch.assertNoReservedTimeoutEnvs" (dict "envs" . "path" "app.extraEnvs") }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.app.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          # /tmp only. The stored-objects PVC the app mounts is ReadWriteOnce
          # and migrations never touch it; mounting it here would pin this Job
          # to the node holding the attachment and re-open issue #7191.
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir:
            sizeLimit: {{ .Values.app.scratchSizeLimit }}
{{- end }}

{{- if .Values.prometheus.chartManaged }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-config
  labels:
    {{- include "langwatch.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.server.global.scrape_interval | default "15s" }}
      evaluation_interval: {{ .Values.prometheus.server.global.evaluation_interval | default "15s" }}

    {{- /* Each job keeps only its own workload's pods, by the
           app.kubernetes.io/name label its Deployment sets. Every annotated pod
           in the namespace matches the scrape annotation, and the two workloads
           have different labels, so the annotation alone would send each job
           to the other's pods. */}}
    scrape_configs:
      - job_name: 'langwatch'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ .Release.Namespace }}
        metrics_path: '/metrics'
        scheme: http
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: {{ .Release.Name }}-app
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: $1:{{ include "langwatch.metricsPort" . }}
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
        {{- if include "langwatch.metricsApiKey" . }}
        bearer_token: {{ include "langwatch.metricsApiKey" . }}
        {{- end }}

      - job_name: 'langwatch-workers'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{ .Release.Namespace }}
        metrics_path: '/metrics'
        scheme: http
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: {{ .Release.Name }}-workers
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: $1:{{ include "langwatch.metricsPort" . }}
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
        {{- if include "langwatch.metricsApiKey" . }}
        bearer_token: {{ include "langwatch.metricsApiKey" . }}
        {{- end }}

      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
{{- end }}

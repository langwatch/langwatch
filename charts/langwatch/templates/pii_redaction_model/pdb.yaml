{{- if and .Values.piiRedactionModel.enabled (include "langwatch.pdbRenders" (dict "name" "piiRedactionModel" "spec" .Values.piiRedactionModel.podDisruptionBudget "replicas" .Values.piiRedactionModel.replicaCount)) }}
{{- with .Values.piiRedactionModel.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-pii-redaction-model-pdb
  labels:
    app.kubernetes.io/name: {{ $.Release.Name }}-pii-redaction-model
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: pii-redaction-model
    {{- /* The common labels without their name and instance, which name this
           component above: a repeated key is invalid YAML. */}}
    {{- toYaml (omit (include "langwatch.labels" $ | fromYaml) "app.kubernetes.io/name" "app.kubernetes.io/instance") | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Release.Name }}-pii-redaction-model
      app.kubernetes.io/instance: {{ $.Release.Name }}
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}

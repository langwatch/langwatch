{{- /*
  LWQL password Secret (issue #8258). Holds the two passwords the app converges
  the LangWatchQL ClickHouse identity and the PostgreSQL lwql_ro reader with
  (LWQL_CLICKHOUSE_PASSWORD, LWQL_POSTGRES_READER_PASSWORD).

  Why its own Secret, not the app Secret: on chart-managed ClickHouse the
  access-render Job reads these two passwords as a PRE-UPGRADE hook, which runs
  before the main phase that would heal the app Secret with the keys on a first
  upgrade from a pre-LWQL release — the render would otherwise abort with
  LwqlRenderConfigMissingInputError. A pre-install,pre-upgrade hook at a lower
  weight than the render Job puts the passwords in place before it on every path;
  `before-hook-creation` (and NOT hook-succeeded) keeps the Secret through the
  main phase for the app Deployment and workers, which read the same two keys via
  langwatch.sharedEnv. lookup-or-rand keeps both values stable across pods and
  upgrades.

  Only the chart-managed-passwords path renders this: an operator-supplied
  `secrets.existingSecret` carries the keys itself, and with autogen off the
  operator hand-creates the app Secret — both pre-exist before any helm phase, so
  sharedEnv reads the passwords from there and neither needs this hook.
*/}}
{{- if and .Values.lwql.enabled .Values.autogen.enabled (not .Values.secrets.existingSecret) }}
{{- $secretName := include "langwatch.lwql.passwordSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if and $existing $existing.data }}
{{-   $existingData = $existing.data }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "langwatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  LWQL_CLICKHOUSE_PASSWORD: {{ default (include "langwatch.autogenSecretValue" .) (index $existingData "LWQL_CLICKHOUSE_PASSWORD") | quote }}
  LWQL_POSTGRES_READER_PASSWORD: {{ default (include "langwatch.autogenSecretValue" .) (index $existingData "LWQL_POSTGRES_READER_PASSWORD") | quote }}
{{- end }}

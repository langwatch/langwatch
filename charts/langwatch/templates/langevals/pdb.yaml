{{- if and .Values.langevals.enabled (include "langwatch.pdbRenders" (dict "name" "langevals" "spec" .Values.langevals.podDisruptionBudget "replicas" .Values.langevals.replicaCount)) }}
{{- with .Values.langevals.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-langevals-pdb
  labels:
    app.kubernetes.io/component: langevals
    {{- include "langwatch.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Release.Name }}-langevals
      app.kubernetes.io/instance: {{ $.Release.Name }}
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}

{{- $np := (.Values.langevals).networkPolicy | default dict }}
{{- if and .Values.langevals.enabled $np.enabled }}
# Ingress to the langevals pods is admitted only from the app and workers pods
# (or networkPolicy.ingressFrom when set). Egress is left open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-langevals
  labels:
    {{- include "langwatch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-langevals
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- with $np.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Release.Name }}-app
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Release.Name }}-workers
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.langevals.service.port }}
{{- end }}

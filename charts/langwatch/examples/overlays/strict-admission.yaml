# strict-admission.yaml - for clusters that enforce Pod Security Admission
# "restricted" or an equivalent OPA Gatekeeper / Kyverno bundle.
#
# LangWatch's own pods (app, workers, nlp, langevals, gateway) and the bundled
# datastores (PostgreSQL, Redis, ClickHouse, Keeper) already ship hardened:
# read-only root, non-root, dropped capabilities, RuntimeDefault seccomp, no
# automounted token, resource requests+limits. This overlay turns off the two
# components that CANNOT comply, because their compliance is not a matter of
# configuration:
#
#   - the bundled Prometheus, an upstream subchart we do not control;
#   - the Langy agent, which must run as root by design (see below).
#
# It also drops the gateway HPA, which needs a custom metrics API rather than
# an admission exemption.
#
# Usage (stack on a size + access overlay):
#   helm install lw . \
#     -f examples/overlays/size-prod.yaml \
#     -f examples/overlays/access-ingress.yaml \
#     -f examples/overlays/strict-admission.yaml
#
# For production, also stack the external-datastore overlays. Managed databases
# give you backups and HA and deploy no datastore pods at all. (In-cluster
# datastores do comply with read-only-root, but external is the better choice.)
#   -f examples/overlays/postgres-external.yaml
#   -f examples/overlays/redis-external.yaml
#   -f examples/overlays/clickhouse-external.yaml

# Bundled Prometheus is an upstream subchart we don't harden; bring your own.
prometheus:
  chartManaged: false

# The ClickHouse subchart's preflight Job shells out to kubectl to check the
# Secret's keys, so it needs both an automounted token and a writable root (for
# kubectl's discovery cache). It only renders when you supply the Secret
# yourself (clickhouse.auth.existingSecret) rather than using autogen, which is
# the recommended production path — so pin it off here rather than leaving it to
# chance. The umbrella already defaults it off; this keeps that true if a base
# values file turns it on.
clickhouse:
  preflight:
    enabled: false

# The Langy assistant's manager runs as UID 0 with CHOWN, DAC_OVERRIDE, FOWNER,
# SETUID and SETGID in its DEFAULT posture. That is deliberate and load-bearing,
# NOT an oversight: the manager hands every worker a distinct UID, which needs
# those exact capabilities from a root-effective-uid process. Without them
# sibling workers share a UID and can read each other's live credentials out of
# /proc/<pid>/environ (ADR-033; specs/langy/langy-deploy-hardening.feature).
#
# This overlay keeps the assistant off, which is the conservative default for a
# restricted cluster and the only setting that needs no security judgement from
# whoever applies it. LangWatch runs fine without it; you lose the in-product
# assistant only.
#
# THERE IS NOW A SECOND OPTION, and it is the reason this comment changed.
# ADR-130 made the per-worker identity wall an operator-selectable posture.
# Turning it off renders the same pod as UID 1000 with drop:[ALL], no adds and
# RuntimeDefault seccomp — a spec this overlay's own hardening assertions pass.
# To run the assistant on a restricted cluster, replace the two lines below with:
#
#   langyagent:
#     workerIsolation: none
#     acceptWorkerIsolationDisabled: true
#
# What that costs, stated plainly because it is not small: workers keep no
# credentials on disk and have no listener, so a sibling can reach neither
# another's control channel nor a credential file at either setting. What a
# shared identity opens is that one conversation's worker can read another's
# live credentials from /proc/<pid>/environ and another conversation's content
# from its session directory. Take it for a single-tenant install whose users
# are colleagues; do not take it if you serve mutually untrusted users. It also
# forecloses the per-worker network namespace (ADR-076), which needs
# CAP_SYS_ADMIN this pod can never hold.
#
# Do NOT instead "fix" the default posture by forcing runAsNonRoot in your own
# values. Helm merges the capability map rather than replacing it, so the pod
# still requests all five, the kernel clears them on the UID transition, and the
# pod is admitted, reports healthy, and dies at the first worker spawn.
#
# Pinned here rather than deferred to examples/overlays/langy-disabled.yaml
# (which sets the same key) so this overlay is self-contained: an operator who
# applies only strict-admission.yaml must not silently keep a pod their cluster
# will reject.
langyagent:
  chartManaged: false

# The gateway's default HPA needs prometheus-adapter for its custom metric.
# Run a fixed replica count instead unless you have a custom metrics API.
gateway:
  autoscaling:
    enabled: false
  replicaCount: 2

app:
  # The stored-objects upgrade hooks scale the workers Deployment through the
  # Kubernetes API while the app rolls, so their pods need an automounted
  # ServiceAccount token and a writable root for kubectl's discovery cache.
  # They render only in local-filesystem stored-objects mode, where the app and
  # the workers share one ReadWriteOnce volume. That mode is the documented
  # hobby tier and is not what a locked-down cluster should run: enable
  # app.dataplane (S3 / MinIO / Azure) instead, and the hooks never render at
  # all. Pinned off here so the overlay is self-contained.
  storedObjects:
    localFilesystem:
      serializeUpgrades: false

  telemetry:
    # Prometheus is off above, so don't expose app metrics either - nothing
    # would scrape them. This is already the default; pinned here so the two
    # stay coupled if a base values file turned metrics on.
    metrics:
      enabled: false
    # Anonymous usage analytics phone home to LangWatch. Not an admission
    # concern, but uncomment for an air-gapped / no-egress install.
    # usage:
    #   enabled: false

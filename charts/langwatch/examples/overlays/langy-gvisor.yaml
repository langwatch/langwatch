# langy-gvisor.yaml: harden the Langy assistant with a sandboxed runtime.
#
# Langy ships enabled and runs on the node's default runtime out of the box.
# This overlay puts the agent pod under gVisor, so a worker that escapes its
# container faces a user-space kernel instead of the node's. It requires a
# `gvisor` RuntimeClass in the cluster (GKE Sandbox provides one; on
# self-managed clusters install the gVisor operator or a RuntimeClass
# manifest first).
#
# The overlay also opens outbound HTTPS egress, which Langy's git/gh/package
# tooling needs; private ranges and the cloud metadata endpoint stay blocked
# either way.
#
# Usage:
#   helm install lw . \
#     -f examples/overlays/langy-gvisor.yaml \
#     --set autogen.enabled=true

langyagent:
  runtimeClassName: "gvisor"
  acceptUnsandboxedRuntime: false

  networkPolicy:
    allowExternalHttps: true

  # Watch Langy work inside your own LangWatch: create an API key in the project
  # you want its turns traced into, put it in a Secret, and name it here. The
  # endpoint resolves to this install.
  #
  #   read -rsp "Mirror project API key: " KEY
  #   kubectl -n <namespace> create secret generic langwatch-langyagent-mirror \
  #     --from-env-file=/dev/stdin <<< "LANGY_MIRROR_TRACE_KEY=$KEY"; unset KEY
  #
  # mirror:
  #   existingSecretName: langwatch-langyagent-mirror

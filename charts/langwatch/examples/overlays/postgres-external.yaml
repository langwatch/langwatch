# postgres-external.yaml — Use an external PostgreSQL (RDS, Cloud SQL, etc.).
#
# Prerequisites:
#   kubectl create secret generic langwatch-db -n <namespace> \
#     --from-literal=connectionString="postgresql://user:pass@host:5432/langwatch"
#
# Usage:
#   helm install lw . \
#     -f examples/overlays/size-prod.yaml \
#     -f examples/overlays/access-ingress.yaml \
#     -f examples/overlays/postgres-external.yaml

postgresql:
  chartManaged: false
  external:
    connectionString:
      secretKeyRef:
        name: "langwatch-db"
        key: "connectionString"

# The LangWatchQL Postgres bridge (lwql_postgres named collection) defaults to
# the chart-managed PostgreSQL Service — wrong for an external PostgreSQL.
# Cancel it back to empty so the bridge renders disabled (a loud NOTES.txt +
# Deployment-annotation warning) instead of pointing at a Service that does
# not exist. Set this to your PostgreSQL host to enable the bridge instead.
clickhouse:
  lwqlAccessModel:
    postgres:
      host: ""

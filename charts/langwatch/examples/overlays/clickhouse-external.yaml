# clickhouse-external.yaml — Use an external ClickHouse instance.
#
# Stack with any size overlay:
#   helm install lw . \
#     -f examples/overlays/size-prod.yaml \
#     -f examples/overlays/access-ingress.yaml \
#     -f examples/overlays/clickhouse-external.yaml \
#     --set 'clickhouse.external.url.value=http://user:pass@my-clickhouse:8123/langwatch'

clickhouse:
  chartManaged: false
  external:
    url:
      value: "http://<username>:<password>@my-clickhouse:8123/langwatch"
    # Set cluster name if your external ClickHouse is replicated:
    # cluster: "my_cluster"

# LangWatchQL (lwql.enabled, default true) self-provisions its access model
# via app SQL DDL, the same as on every other ClickHouse posture. Your
# ClickHouse must already have: custom_settings_prefixes including "custom_",
# and the app's administrative user granted access_management +
# named_collection_control. See "LangWatchQL (LWQL) prerequisites"
# (../../README.md#langwatchql-lwql-prerequisites), and ADR-141
# (../../../../dev/docs/adr/141-the-app-owns-the-lwql-access-model.md).

# langy-unsandboxed.yaml: run Langy on a cluster with no sandboxed runtime.
#
# The default pins the agent pod to a gvisor RuntimeClass; on a cluster without
# one, only that pod stays Pending while the rest of the install runs. GKE
# ships the RuntimeClass managed (GKE Sandbox), AKS offers Kata VM isolation
# (point runtimeClassName at your Kata class instead of using this overlay),
# EKS has no managed option.
#
# This overlay drops the sandbox deliberately. The chart refuses a blank
# runtime without the acceptance, so an unsandboxed deploy is always a value
# you wrote down.
#
# What you give up: the pod-to-host sandbox, so a worker that escapes its
# container faces the node kernel.
# What you keep: per-worker UID isolation, the per-worker opencode password,
# and the NetworkPolicy bounding where workers can reach.
#
# Usage:
#   helm install lw . \
#     -f examples/overlays/langy-unsandboxed.yaml \
#     --set autogen.enabled=true

langyagent:
  runtimeClassName: ""
  acceptUnsandboxedRuntime: true

# size-prod.yaml — Production sizing. Single-node ClickHouse.
#
# 2 app replicas, 2 workers, PDBs, chart-managed ClickHouse, the PII redaction
# model (one 7Gi replica; set piiRedactionModel.enabled=false to skip it).
# Combine with an access overlay and optionally external database overlays.
# Requires app.dataplane (S3 or Azure Blob) for stored objects.
#
# Usage:
#   helm install lw . \
#     -f examples/overlays/size-prod.yaml \
#     -f examples/overlays/access-ingress.yaml

app:
  replicaCount: 2
  # Multi-pod: local-FS is unsafe (pods don't share filesystems). Set
  # app.dataplane (S3 or Azure Blob) so every pod reads the same stored
  # objects. cold-storage-s3.yaml covers ClickHouse only.
  storedObjects:
    localFilesystem:
      enabled: false
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: 2, memory: 4Gi }
  podDisruptionBudget:
    minAvailable: 1

workers:
  enabled: true
  replicaCount: 2
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: 2, memory: 4Gi }

langwatch_nlp:
  replicaCount: 1
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 1, memory: 1Gi }

langevals:
  replicaCount: 1
  resources:
    requests: { cpu: 1, memory: 4Gi }
    limits: { cpu: 2, memory: 8Gi }

piiRedactionModel:
  # Strict PII analysis on the PII redaction model, with Presidio as its
  # fallback. Needs the model image (images.pii_redaction_model) and its pull
  # secret (piiRedactionModel.imagePullSecrets); set enabled: false to stay on
  # Presidio. 7Gi per replica, reserved.
  enabled: true
  replicaCount: 1
  resources:
    requests: { cpu: 2, memory: 7Gi }
    limits: { cpu: 4, memory: 7Gi }

clickhouse:
  chartManaged: true
  replicas: 1
  memory: 8Gi
  cpu: 4
  storage:
    size: 100Gi

postgresql:
  chartManaged: true
  auth:
    database: "langwatch"
  primary:
    persistence:
      size: 20Gi

redis:
  chartManaged: true
  master:
    persistence:
      size: 5Gi
    # Ceiling is half the limit (1.5Gi), so a snapshot fits under it.
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: 1, memory: 3Gi }

prometheus:
  chartManaged: true
  server:
    retention: 30d
    persistentVolume:
      size: 20Gi

cronjobs:
  enabled: true

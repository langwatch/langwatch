{{- $replicas := .Values.replicas | int }}
{{- $fullname := include "clickhouse-serverless.fullname" . }}
{{- $dynamicOnly := include "clickhouse-serverless.dynamicOnly" . }}
{{- $secretsMounted := or (not $dynamicOnly) (gt $replicas 1) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "clickhouse-serverless.selectorLabels" . | nindent 4 }}
    {{- include "clickhouse-serverless.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-headless
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "clickhouse-serverless.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clickhouse-serverless.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "clickhouse-serverless.serviceAccountName" . }}
      # Set on the pod too (not just the SA) for policies that check the pod
      # spec field rather than the ServiceAccount. ClickHouse never calls the
      # Kubernetes API.
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 101  # clickhouse group
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60

      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if gt $replicas 1 }}
      affinity:
        {{- if .Values.scheduling.affinity }}
        {{- toYaml .Values.scheduling.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - {{ $fullname }}
                topologyKey: topology.kubernetes.io/zone
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - {{ $fullname }}
                topologyKey: kubernetes.io/hostname
        {{- end }}
      {{- else if .Values.scheduling.affinity }}
      affinity:
        {{- toYaml .Values.scheduling.affinity | nindent 8 }}
      {{- end }}

      containers:
        - name: clickhouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Read-only root: ch-config only writes into config.d/users.d (both
          # emptyDir mounts) and ClickHouse data lives on the PVC. The few
          # remaining writable paths (server logs and /tmp) are emptyDir-mounted
          # below, so the image layer itself never needs to be writable.
          securityContext:
            # The image already runs as uid 101 via its USER directive; pin it
            # explicitly so it matches Keeper/backup and satisfies runAsUser /
            # MustRunAs policies that read the pod spec.
            runAsUser: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: native
              containerPort: 9000
              protocol: TCP
          # Image runs as uid 101 (clickhouse) via USER directive
          env:
            # Primary inputs — the image derives all ClickHouse parameters from these
            - name: CH_CPU
              value: {{ .Values.cpu | quote }}
            - name: CH_RAM
              value: {{ .Values.memory | quote }}
            - name: CH_REPLICATED
              value: {{ if gt $replicas 1 }}"true"{{ else }}"false"{{ end }}

            {{- if $dynamicOnly }}
            # Dynamic-only (ADR-190): default gets no password; the local
            # admin's per-boot password goes to this in-memory volume.
            - name: CLICKHOUSE_ACCESS_BOOTSTRAP_DIR
              value: /run/clickhouse-access
            {{- else }}
            - name: CLICKHOUSE_PASSWORD_FILE
              value: "/mnt/secrets/password"
            {{- end }}
            {{- if .Values.access.enabled }}
            - name: CLICKHOUSE_ACCESS_FILE
              value: /etc/clickhouse-access/config/access.yaml
            # The sidecar container below runs it; not the entrypoint as well.
            - name: CLICKHOUSE_ACCESS_SIDECAR
              value: external
            {{- end }}

            {{- if gt $replicas 1 }}
            - name: CLICKHOUSE_CLUSTER_SECRET_FILE
              value: "/mnt/secrets/cluster-secret"
            {{- if .Values.auth.clusterSecretEnabled }}
            - name: CLICKHOUSE_CLUSTER_SECRET_ENABLED
              value: "true"
            {{- end }}
            - name: CH_CLUSTER
              value: {{ .Values.clusterName | quote }}
            - name: CH_SHARD
              value: "shard_01"
            - name: CH_REPLICA
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CH_KEEPER_NODES
              value: {{ include "clickhouse-serverless.keeperNodes" . | quote }}
            - name: CH_KEEPER_PORT
              value: "9181"
            - name: CH_DATA_NODES
              value: {{ include "clickhouse-serverless.dataNodes" . | quote }}
            - name: CH_DATA_NODE_PORT
              value: "9000"
            {{- end }}

            {{- if or .Values.cold.enabled .Values.backup.enabled }}
            # Remote storage configuration (shared by cold storage and backups)
            - name: S3_ENDPOINT
              value: {{ if .Values.objectStorage.endpoint }}{{ .Values.objectStorage.endpoint | quote }}{{ else }}{{ printf "https://s3.%s.amazonaws.com/%s/" .Values.objectStorage.region .Values.objectStorage.bucket | quote }}{{ end }}
            - name: S3_BUCKET
              value: {{ .Values.objectStorage.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.objectStorage.region | quote }}
            - name: USE_ENVIRONMENT_CREDENTIALS
              value: {{ .Values.objectStorage.useEnvironmentCredentials | quote }}
            {{- if and .Values.objectStorage.credentials.secretKeyRef.name (not .Values.objectStorage.useEnvironmentCredentials) }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.credentials.secretKeyRef.name }}
                  key: {{ .Values.objectStorage.credentials.secretKeyRef.accessKeyId }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.credentials.secretKeyRef.name }}
                  key: {{ .Values.objectStorage.credentials.secretKeyRef.secretAccessKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.cold.enabled }}
            - name: COLD_STORAGE_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.backup.enabled }}
            - name: BACKUP_ENABLED
              value: "true"
            {{- end }}

            # Advanced overrides (applied last — override any derived value above)
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

          resources:
            requests:
              cpu: {{ .Values.cpu }}
              memory: {{ .Values.memory }}
            limits:
              cpu: {{ .Values.cpu }}
              memory: {{ .Values.memory }}

          {{- if gt $replicas 1 }}
          # Multi-replica: check Keeper connectivity (needs auth)
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - clickhouse-client {{ include "clickhouse-serverless.probeLogin" . }} --query "SELECT 1"
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - clickhouse-client {{ include "clickhouse-serverless.probeLogin" . }} --receive_timeout=3 --query "SELECT 1 FROM system.zookeeper WHERE path='/'"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- else }}
          # Single-replica: simple HTTP ping
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}

          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config-d
              mountPath: /etc/clickhouse-server/config.d
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
            # Writable scratch so the container runs read-only root: server
            # logs and /tmp. (config.d/users.d above are also writable
            # emptyDirs, which is where ch-config renders config; everything
            # else ClickHouse writes — preprocessed_configs, status, uuid,
            # format_schemas, user_files, tmp, access — is under
            # /var/lib/clickhouse on the PVC.)
            - name: ch-logs
              mountPath: /var/log/clickhouse-server
            - name: tmp
              mountPath: /tmp
            {{- if $secretsMounted }}
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
            {{- end }}
            {{- if .Values.lwqlAccess.secretName }}
            # LangWatchQL access model — mounted unconditionally on EVERY pod, on
            # its own value (not extraVolumeMounts, which an operator's list could
            # replace). Nested single-file subPath mounts, so they coexist with
            # the files ch-config renders into users.d / config.d at startup.
            - name: lwql-access
              mountPath: /etc/clickhouse-server/users.d/lwql-access.yaml
              subPath: lwql-access.yaml
              readOnly: true
            - name: lwql-access
              mountPath: /etc/clickhouse-server/config.d/lwql-named-collection.yaml
              subPath: lwql-named-collection.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.access.enabled }}
            {{- include "clickhouse-serverless.accessMounts" . | nindent 12 }}
            {{- end }}
            {{- /* Generic passthrough for operator-supplied mounts (e.g. an
                   umbrella chart delivering extra server config into config.d /
                   users.d). tpl-rendered so values may reference .Release.Name.
                   Nothing here is specific to any one consumer. */}}
            {{- with .Values.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}

        {{- if .Values.access.enabled }}
        # Keeps users.d/access-users.yaml current and verifies token logins on
        # loopback (ADR-190). Same image; it never sees the default password.
        - name: access
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["ch-config", "sidecar", "/etc/clickhouse-server"]
          securityContext:
            runAsUser: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLICKHOUSE_ACCESS_FILE
              value: /etc/clickhouse-access/config/access.yaml
            - name: CLICKHOUSE_ACCESS_LISTEN
              value: {{ .Values.env.CLICKHOUSE_ACCESS_LISTEN | default "127.0.0.1:8124" | quote }}
            {{- if $dynamicOnly }}
            - name: CLICKHOUSE_ACCESS_BOOTSTRAP_DIR
              value: /run/clickhouse-access
            {{- end }}
          # It listens on loopback only, which the kubelet cannot reach.
          livenessProbe:
            exec:
              command: ["curl", "-sf", "http://{{ .Values.env.CLICKHOUSE_ACCESS_LISTEN | default "127.0.0.1:8124" }}/healthz"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if $dynamicOnly }}
          # Every login depends on the sidecar in this mode: the pod leaves the
          # Service until it has an access file and every issuer's keys.
          readinessProbe:
            exec:
              command: ["curl", "-sf", "http://{{ .Values.env.CLICKHOUSE_ACCESS_LISTEN | default "127.0.0.1:8124" }}/readyz"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.access.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
            {{- include "clickhouse-serverless.accessMounts" . | nindent 12 }}
        {{- end }}

      volumes:
        - name: config-d
          # Holds rendered config only (ch-config writes here); bounded like
          # every other scratch volume, so nothing is node-backed without a limit.
          emptyDir:
            sizeLimit: 64Mi
        - name: users-d
          # Holds rendered config only (ch-config writes here); bounded like
          # every other scratch volume, so nothing is node-backed without a limit.
          emptyDir:
            sizeLimit: 64Mi
        - name: ch-logs
          emptyDir:
            sizeLimit: {{ .Values.scratch.logsSizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.scratch.tmpSizeLimit }}
        {{- if $secretsMounted }}
        - name: secrets
          secret:
            secretName: {{ include "clickhouse-serverless.secretName" . }}
            items:
              {{- if not $dynamicOnly }}
              - key: {{ include "clickhouse-serverless.secretKey" . }}
                path: password
              {{- end }}
              {{- if gt $replicas 1 }}
              - key: {{ include "clickhouse-serverless.clusterSecretKey" . }}
                path: cluster-secret
              {{- end }}
        {{- end }}
        {{- if $dynamicOnly }}
        # tmpfs: the local admin's password never touches the node's disk.
        - name: access-bootstrap
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        {{- if .Values.lwqlAccess.secretName }}
        # LWQL access Secret (see volumeMounts above). optional:false: on a first
        # install the render Job has not written it yet, so the pod waits in
        # ContainerCreating rather than booting with no access model — the
        # required-mount retry the install race relies on. tpl-rendered so the
        # umbrella can pass a helper-derived name.
        - name: lwql-access
          secret:
            secretName: {{ tpl .Values.lwqlAccess.secretName $ }}
            optional: false
        {{- end }}
        {{- if .Values.access.enabled }}
        - name: access-config
          configMap:
            name: {{ .Values.access.existingConfigMap | default (printf "%s-access" (include "clickhouse-serverless.fullname" .)) }}
        {{- range $i, $name := .Values.access.passwordSecrets }}
        - name: access-secret-{{ $i }}
          secret:
            secretName: {{ $name }}
            defaultMode: 0440
        {{- end }}
        {{- end }}
        {{- /* Generic passthrough (see extraVolumes above). */}}
        {{- with .Values.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}

  # apiVersion and kind are spelled out: the API server stores them on every
  # claim template, so a GitOps controller diffing with server-side apply
  # reports the StatefulSet as out of sync forever when they are left off.
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClass }}
        storageClassName: {{ .Values.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}

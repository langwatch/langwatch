{{- if and (include "clickhouse-serverless.backupSidecar" .) .Values.backup.sidecar.podMonitor.enabled }}
# Scrapes the backup sidecar's /metrics on every ClickHouse pod (ADR-191).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "clickhouse-serverless.fullname" . }}-backup
  labels:
    {{- include "clickhouse-serverless.selectorLabels" . | nindent 4 }}
    {{- include "clickhouse-serverless.labels" . | nindent 4 }}
    {{- with .Values.backup.sidecar.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "clickhouse-serverless.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clickhouse
  podMetricsEndpoints:
    - port: backup-metrics
      path: /metrics
      interval: {{ .Values.backup.sidecar.podMonitor.interval }}
{{- end }}

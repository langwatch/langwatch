image:
  repository: langwatch/clickhouse-serverless
  tag: "0.4.0" # x-release-please-version
  pullPolicy: IfNotPresent

# Primary inputs — the image auto-tunes all ClickHouse parameters from these
cpu: 2
memory: "4Gi"
replicas: 1 # 1 = standalone MergeTree, 3+ = ReplicatedMergeTree + Keeper (must be odd)
clusterName: langwatch # ClickHouse cluster name used in macros and remote_servers

storage:
  size: 50Gi
  storageClass: ""

# S3-compatible object storage — shared by cold storage and backups
objectStorage:
  bucket: ""
  region: ""
  endpoint: "" # e.g. https://s3.us-east-1.amazonaws.com/bucket/
  useEnvironmentCredentials: true # IRSA / workload identity / pod SA
  credentials:
    secretKeyRef:
      name: "" # K8s secret with S3 access key + secret key
      accessKeyId: "accessKey"
      secretAccessKey: "secretKey"

# Cold storage: tiered hot→cold data movement (requires objectStorage)
cold:
  enabled: false
  defaultTtlDays: 49 # App-side TTL before data moves to cold (must be divisible by 7)

# Backups: native ClickHouse BACKUP/RESTORE to S3 (requires objectStorage)
backup:
  enabled: false
  # Who takes the backups (ADR-191):
  #   cronjob          CronJobs below, as before (the default)
  #   sidecar          the ch-config sidecar in every ClickHouse pod, on one
  #                    elected runner; no backup CronJobs render
  #   cronjob-observe  CronJobs back up; the sidecar only decides and exports
  #                    metrics, so its alerts can be checked before switching
  mode: cronjob
  database: "langwatch"
  user: "default" # ClickHouse user for backup/restore operations
  # Sidecar mode: the Secret key holding backup.user's password, mounted as a
  # file. Empty uses the chart's credentials Secret (the default password).
  passwordSecret:
    name: ""
    key: ""
  # Sidecar mode: how long the backups prefix is kept (the object store's
  # lifecycle rule), which bounds how old a base may be.
  retentionDays: 7
  # Sidecar mode: max_backup_bandwidth in bytes per second (0 = unlimited).
  maxBandwidth: 0
  sidecar:
    # Pod ordinal that runs backups while it answers; else the next one that does.
    runnerOrdinal: 0
    # /metrics, /status and /healthz, on the pod IP.
    metricsPort: 8125
    # Used when access is off; with access on the shared container takes
    # access.sidecar.resources.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    # A prometheus-operator PodMonitor for the sidecar's /metrics.
    podMonitor:
      enabled: false
      interval: 60s
      labels: {}
  # Resource requests + limits for the backup/restore Job containers.
  # Both are required by clusters that enforce a "limits and requests must
  # be set" policy (Gatekeeper/Kyverno) — a Job without them is denied.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  full:
    schedule: "0 */12 * * *" # every 12 hours
  incremental:
    schedule: "0 * * * *" # every hour

  # Alerting on backup freshness, rendered as Prometheus rules.
  #
  # The condition worth paging on is "no recent successful backup", which is not
  # the same as "a job reported an error". A CronJob that is suspended, deleted,
  # or silently rescheduled emits no failure event at all, so a failure-only
  # alert stays quiet while backups stop happening. Every target below therefore
  # gets a freshness alert as the primary signal; the failure alert is an extra,
  # faster one that fires within a scrape of a bad run instead of waiting out the
  # staleness window.
  #
  # Requires kube-state-metrics to be scraped by the Prometheus that loads these
  # rules. Every expression is built from kube_cronjob_* and kube_job_* series;
  # the chart adds no exporter of its own.
  monitoring:
    enabled: false

    # Rendered into every alert as the runbook_url annotation. An alert whose
    # recipient has nowhere to go gets muted, so this is worth setting.
    runbookUrl: ""

    # Merged into every alert's labels. Use it for Alertmanager or Grafana
    # routing keys, e.g. {route: page, team: infra}.
    additionalLabels: {}

    # How long a backup may look broken before the alert fires. Applies to the
    # freshness, suspension, and failure alerts.
    for: "15m"

    # How long the CronJob's metrics may be missing entirely before alerting.
    # Longer than `for` because a kube-state-metrics restart briefly drops them.
    absentFor: "30m"

    # Emit a PrometheusRule instead of a plain ConfigMap. Needs the
    # prometheus-operator CRDs; without them the manifest is rejected at install.
    prometheusRule:
      enabled: false
      # Extra labels on the PrometheusRule object, for the operator's ruleSelector.
      labels: {}

    # Labels on the rules ConfigMap, for a rules sidecar or a Prometheus
    # configmap mount to discover it.
    configMapLabels:
      langwatch.ai/prometheus-rules: "true"

    # One entry per backup that has to stay fresh.
    #
    #   name           label used in alert text and on the `backup` label
    #   cronjob        CronJob name suffix; the release fullname is prepended,
    #                  so `backup-full` matches `<release>-clickhouse-backup-full`
    #   cronjobName    exact CronJob name, for a CronJob this chart does not
    #                  create and whose name does not start with the release
    #                  fullname. Mutually exclusive with `cronjob`.
    #   staleAfterHours  hours without a successful run before the backup counts
    #                  as broken. Keep it above two scheduling intervals so one
    #                  retried run does not page.
    #
    # A backup mechanism that is not a CronJob in this namespace has no
    # kube-state-metrics series and cannot be watched from here; see the runbook.
    targets:
      - name: full
        cronjob: backup-full
        staleAfterHours: 26 # schedule is every 12h
      - name: incremental
        cronjob: backup-incremental
        staleAfterHours: 3 # schedule is hourly

    # Sidecar and cronjob-observe modes: rules on the sidecar's own metrics,
    # one stale alert per mode. Needs the sidecar's /metrics scraped (see
    # backup.sidecar.podMonitor). `targets` above applies while CronJobs render.
    sidecar:
      staleAfterHours:
        full: 26
        incremental: 3
      # PromQL label matchers for the sidecar's series; empty matches this
      # release's pods: namespace="<ns>", pod=~"<fullname>-[0-9]+".
      selector: ""

# Authentication
auth:
  password: "" # Used as autogen seed when autogen.enabled=true and this is unset
  clusterSecret: "" # Used as autogen seed when autogen.enabled=true and this is unset
  # Apply clusterSecret to remote_servers (replicas>1). Recommended; off keeps
  # the earlier no-secret cluster. Turning it on mid-roll mixes pods with and
  # without it, so see the README (Cluster secret) before enabling.
  clusterSecretEnabled: false
  existingSecret: "" # Operator-owned Secret name. Required when autogen.enabled=false.
  secretKeys:
    passwordKey: "password"
    clusterSecretKey: "clusterSecret"

# Chart-managed Secret materialisation. Default false matches the prod-safe
# behaviour of the parent langwatch chart's autogen.enabled.
#
# autogen.enabled=true: the chart renders the credentials Secret on first
# install via the lookup-or-rand pattern (subsequent helm upgrades reuse the
# existing keys verbatim, so ClickHouse pods don't roll). Convenient for
# stock installs and dev quickstart.
#
# autogen.enabled=false: the chart does NOT render a Secret. The operator
# pre-creates a Secret out-of-band and points auth.existingSecret at it.
# This is the only mode that is drift-free under GitOps controllers whose
# render step has no cluster access (ArgoCD's repo-server returns nil from
# helm lookup every sync, so the autogen path would rotate credentials on
# every reconcile). The preflight Job validates the configured keys exist
# before pods roll.
#
# Either way, when both flags are unset the chart-time validator fails with
# a clear message instructing the operator to pick one path.
autogen:
  enabled: false

# Preflight Job that runs pre-install + pre-upgrade and verifies the
# operator-owned Secret has every key the StatefulSet mounts. Only renders
# when autogen.enabled=false and auth.existingSecret is set (when the chart
# materialises the Secret there is nothing to validate ahead of time).
#
# Image needs sh + kubectl + jq. alpine/k8s ships all three. The script
# does a single `kubectl get -o json` per Secret + `jq` lookups so dotted
# operator-configured key names resolve correctly. registry.k8s.io/kubectl
# is distroless and has no /bin/sh; bitnami/kubectl has /bin/sh but no jq.
# A startup guard inside the Job fails fast if jq is missing from the image.
preflight:
  enabled: true
  image: alpine/k8s:1.30.0
  imagePullPolicy: IfNotPresent
  activeDeadlineSeconds: 60

# Advanced: override any computed value (applied last)
env: {}

# Keeper resources (only used when replicas > 1)
keeper:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: "" # defaults to parent storage.storageClass

# Writable scratch (emptyDir) for the paths ClickHouse and Keeper touch outside
# their data PVC, so both can run with a read-only root filesystem.
#
# These are bounded on purpose. An unbounded emptyDir is backed by the node's
# ephemeral storage, so a pod stuck in a merge/replication error loop can fill
# the node and trigger DiskPressure evictions for unrelated workloads. With a
# sizeLimit the kubelet evicts only the offending pod.
#
# logsSizeLimit is deliberately BELOW the image's own retention ceiling. The
# chart renders `console: true` into config.d, but it does not disable the base
# image's file logging, which rotates at 1000M x 10 for each of
# clickhouse-server.log and clickhouse-server.err.log — roughly 20Gi if both
# ever fill. Sizing the volume for that would defeat the point: the cap exists
# so a pathological logger is evicted on its own quota long before it reaches
# it. Normal operation stays far below 2Gi, and the pod's logs are on stdout
# regardless, so cluster log collection is unaffected either way.
#
# Raise it if you deliberately want the full on-disk retention.
scratch:
  logsSizeLimit: 2Gi
  tmpSizeLimit: 1Gi

# ServiceAccount
serviceAccount:
  create: true
  name: "" # defaults to <fullname>
  automountServiceAccountToken: false
  annotations: {} # e.g. eks.amazonaws.com/role-arn: arn:aws:iam::role/my-role (for IRSA)

# Pod-level settings
imagePullSecrets: []
podAnnotations: {}

# Generic extra volumes / mounts for the ClickHouse container. An umbrella chart
# uses these to deliver additional server config (files under config.d / users.d)
# without this subchart knowing what that config is. tpl-rendered, so values may
# reference .Release.Name and other release context. Kept intentionally generic —
# no consumer-specific names live here.
extraVolumes: []
extraVolumeMounts: []

# LangWatchQL access-model delivery. When secretName is non-empty the StatefulSet
# mounts that Secret's two rendered files into users.d / config.d on EVERY pod,
# unconditionally (not through the operator-facing extraVolumes above, which Helm
# would let an operator's own volume replace). The umbrella chart sets it to a
# template string that resolves to <release>-lwql-clickhouse-access; empty here so
# a standalone install of this subchart renders no LWQL mount.
lwqlAccess:
  secretName: ""

# Deprecated, no effect: documented earlier but never rendered. Use `access`.
# Accepted so existing values files keep working; removed in the next major.
users: ""

# Users, tiers and logins from an access file (ADR-190). Off by default: the
# server then has only its default user plus whatever extraVolumes mount.
# On, a sidecar container keeps the users current and verifies OIDC token
# logins on 127.0.0.1 inside the pod. See the README's "Access" section.
access:
  enabled: false
  # The access file itself: issuers and users. Rolling users name a directory
  # under /etc/clickhouse-access/secrets/<Secret name> (see passwordSecrets).
  config: {}
  # More files next to access.yaml, at /etc/clickhouse-access/config/<name>:
  # an issuer's private CA for ca_file, say.
  extraFiles: {}
  # Or an existing ConfigMap with an `access.yaml` key (every key is mounted);
  # `config` and `extraFiles` are then ignored.
  existingConfigMap: ""
  # Secrets mounted as password directories, each at
  # /etc/clickhouse-access/secrets/<name>. Every key is one valid password;
  # `<key>.valid_until` (RFC 3339) ends `<key>`. Add a key, move the client,
  # remove the old key: the sidecar applies each change within ~10 seconds.
  passwordSecrets: []
  # Dynamic-only mode (ADR-190): no static password anywhere in ClickHouse.
  # Every person and workload logs in with a short-lived OIDC token; default
  # is locked; the only password is a local admin generated at every start
  # into an in-memory volume, valid from inside the pod only. Needs
  # access.enabled, token users only (no passwordSecrets), backup.enabled off,
  # and auth.clusterSecretEnabled when replicas > 1. The chart adds
  # `mode: dynamic-only` to access.config; with existingConfigMap, set it there.
  # Clients mount a projected service-account token and re-read it for every
  # connection, for example:
  #   volumes:
  #     - name: clickhouse-token
  #       projected:
  #         sources:
  #           - serviceAccountToken: {audience: clickhouse, expirationSeconds: 600, path: token}
  dynamicOnly:
    enabled: false
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

# Scheduling
scheduling:
  nodeSelector: {}
  affinity: {}
  tolerations: []

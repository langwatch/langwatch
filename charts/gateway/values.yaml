image:
  # Default points at the public Docker Hub image published by the
  # `ai-gateway` matrix entry in .github/workflows/publish-docker-app.yml
  # on every `release.published` event for `langwatch@*` tags.
  # Self-hosters who mirror to an internal registry can override
  # `repository` without changing anything else.
  repository: docker.io/langwatch/ai-gateway
  tag: "" # defaults to .Chart.AppVersion; releases also publish `latest` and `<short-sha>`
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Custom metric: requests/sec per pod. Requires Prometheus-adapter.
  customMetrics:
    - type: Pods
      pods:
        metric:
          name: lw_gateway_rps
        target:
          type: AverageValue
          averageValue: "150"
  # Optional autoscaling/v2 scale-up/down stabilization and rate policies.
  behavior: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 5563
  # Opt-in cloud load-balancer/TLS settings, such as AWS NLB annotations.
  annotations: {}
  # Render a separate ClusterIP when the primary Service is public, so
  # in-cluster callers do not hairpin through the load balancer.
  internal:
    enabled: false
    port: 80

ingress:
  enabled: true
  className: nginx
  host: gateway.langwatch.ai
  path: /v1
  pathType: Prefix
  # Public status-page surface. An Exact match publishes this one path and
  # nothing else, so /healthz, /readyz, /metrics and /internal stay
  # in-cluster. Methods are bounded by the gateway route, which serves GET
  # and HEAD and answers 405 otherwise, not by the ingress.
  # The endpoint is unauthenticated by design: it reports the gateway
  # process plus the control-plane connectivity verdict cached by a
  # background probe, returns no tenant data, makes no upstream call per
  # poll, and can never go red from a model-provider outage. Point the
  # status-page HTTP monitor at https://<ingress.host>/health.
  healthPath:
    enabled: true
    path: /health
  tls:
    enabled: true
    secretName: gateway-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffering: "off" # SSE needs unbuffered
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # long-lived streams
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"

# Control-plane connection (LangWatch app). Left empty, this resolves to the
# app Service of the install the gateway is part of, `<release>-app:5560` —
# the cluster names that Service after the release, so a fixed address would
# only resolve on an install that happens to share ours. Port 5560 is the
# langwatch chart's main-app Service (consistent with the local-dev port:
# app=5560, nlp=5561, langevals=5562, gateway=5563).
#
# Set it when the control plane is somewhere the derivation cannot reach: a
# gateway installed on its own rather than as part of the umbrella chart, an
# app served on another port, or a split topology where the two live apart.
controlPlane:
  baseUrl: ""
  requestTimeout: 2s
  longPollTimeout: 25s

# Secrets are injected from an existing Kubernetes Secret — helm never
# materialises them. Operator creates the Secret via terraform / external
# secrets operator.
#
# JWT secret rotation (zero-downtime):
#   1. Operator flips control plane to new signing secret.
#   2. Operator updates the gateway-runtime-secrets k8s Secret: set
#      jwtSecretKey to the new value AND jwtSecretPreviousKey to the
#      old value. Tokens signed with either key will verify.
#   3. Rolling restart of gateway pods picks up both keys.
#   4. After the longest pre-rotation bundle TTL (~15m by default),
#      remove jwtSecretPreviousKey from the Secret and roll again.
secrets:
  # Key names in the Secret — override if operator uses different names.
  existingSecretName: gateway-runtime-secrets
  internalSecretKey: LW_GATEWAY_INTERNAL_SECRET
  jwtSecretKey: LW_GATEWAY_JWT_SECRET
  # Opt-in previous-key accept for the rotation window. Leave empty to
  # disable (strict single-key mode; production steady state).
  jwtSecretPreviousKey: ""

cache:
  lruSize: 50000
  refreshInterval: 60s
  jwtRefreshThreshold: 5m
  bootstrapAllKeys: false # enterprise opt-in to survive control-plane outage

bifrost:
  poolSize: 200
  streamBufferSize: 100

otel:
  # OTLP/HTTP ingest URL the gateway exports spans to. Umbrella chart
  # defaults this to http://langwatch-app:5560/api/otel so gateway traces
  # land in the control plane and flow into the Origin=Gateway trace view.
  # Point at an external collector for self-host installs that centralise
  # telemetry elsewhere (Honeycomb / Datadog OTLP / Grafana Agent).
  # Empty disables trace export — spans are still created + finalised
  # in-pod but never flushed.
  endpoint: ""
  # X-Auth-Token attached to every OTLP export. Required when endpoint
  # points at /api/otel — the ingest rejects unauthenticated spans with
  # 401 and the span disappears silently. In multi-tenant production,
  # prefer the per-project resolver hook over a shared token; this value
  # is the fallback for single-tenant / dev / air-gapped deploys.
  # Provide via existingSecretName in production; inline authToken is
  # accepted for dev only.
  authExistingSecretName: ""
  authSecretKey: token
  authToken: ""
  batchTimeout: 5s
  maxQueueSize: 8192

logging:
  level: info # debug|info|warn|error

# Admin / operator listener. Exposes /debug/pprof/* on a loopback-bound
# port inside the pod. Operators reach it via `kubectl port-forward`
# — it is NEVER exposed to the Service / Ingress surface, so safe to
# leave on by default. Empty string disables the listener entirely.
#
# Non-k8s deployments that can't port-forward can move admin.addr to
# a routable interface (e.g. "0.0.0.0:6060" behind an internal LB or
# VPN). In that case a bearer token is MANDATORY — the gateway rejects
# startup if admin.addr is non-loopback and no token is provided.
# Provide the token via an existing Kubernetes Secret (helm never
# materialises secrets).
admin:
  addr: 127.0.0.1:6060
  # Opt-in bearer token. Optional on loopback (second defence layer);
  # required when addr is non-loopback. Leave both empty to disable.
  existingAuthSecretName: ""
  authSecretKey: token

# Budget enforcement. VK-level rate limits (rpm/rpd) and the budget
# precheck are both enforced locally against the cached bundle snapshot;
# there is no control-plane call on the hot path. Debits come from the
# spend records below: the control plane folds them into the ClickHouse
# ledger, and the new totals reach this pod on the next /changes refresh.
# Watch `gateway_budget_blocks_total{scope}` to confirm a hard cap is
# firing.
budget:
  # Fraction of the hard limit at which a `warn`-mode scope starts
  # reporting a warn verdict.
  warnThresholdPct: "0.9" # 90%

# Spend emission. Every request writes a spend record to a bounded on-disk
# spool that a background drainer ships to the control plane, which is where
# every gateway budget debit comes from. On by default: a gateway with this
# off serves traffic that costs money and debits nothing, so its budgets go
# stale at zero and stop enforcing.
#
# The spool lives under /tmp, on the writable emptyDir this chart already
# mounts (see scratchSizeLimit), and bounds itself at 64 MiB. Deliberately
# not a PersistentVolume: a pod deleted with records still unshipped loses
# roughly a second of drain lag, and a volume per pod would trade that
# second for a stateful gateway. Watch `gateway_spend_spool_dropped_total`,
# where every drop is spend nobody bills.
#
# Turn it off only while the control plane is older than the gateway and has
# no spend-command ingest route yet. Even then, leaving it on is degraded but
# safe: the drainer retries on backoff and the spool is bounded.
spend:
  enabled: true

guardrails:
  preTimeout: 800ms
  postTimeout: 2s
  streamChunkWindow: 50ms

# Pod-level security.
## @param scratchSizeLimit [string, default: 1Gi] Size cap for the writable /tmp emptyDir the container needs under a read-only root filesystem. Bounded so a looping pod is evicted on its own quota rather than filling the node.
scratchSizeLimit: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  # runAsNonRoot is also set on the pod above; some Gatekeeper constraints
  # inspect the container-level field directly, so set it here too.
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Graceful drain timing. On SIGTERM the pod flips /readyz to 503 so
# the LB / Service endpoint controller stops routing new traffic, waits
# preDrainWaitSeconds for that removal to propagate, then calls
# server.Shutdown, which blocks up to `timeoutSeconds` for in-flight
# handlers to finish (pkg/lifecycle.Group.Run, see configmap.yaml for how
# these two reach the container as SERVER_DRAIN_DELAY_SECONDS /
# SERVER_GRACEFUL_SECONDS).
#
# Plain integer seconds, not duration strings ("5s"/"60s"): the Go side
# (pkg/config.Server.DrainDelaySeconds / GracefulSeconds) is a plain int,
# parsed as a raw number, with no unit suffix to strip.
#
# timeoutSeconds sits above the gateway's 45s non-streaming heartbeat
# interval, which is the boundary between a request that is merely slow and
# one that is stuck. Below it, every request the heartbeat exists to keep
# alive is one a rolling deploy cuts off, and the gateway says so at boot
# with a graceful_shutdown_shorter_than_heartbeat_interval warning.
#
# terminationGracePeriodSeconds (pod spec) MUST exceed preDrainWaitSeconds +
# timeoutSeconds + a few seconds of slack, or the kubelet force-kills the
# pod mid-drain.
shutdown:
  preDrainWaitSeconds: 5
  timeoutSeconds: 60
# terminationGracePeriodSeconds is the kubelet's SIGKILL clock. 75 is a plain
# default that happens to cover the drain settings above (5 + 60 + 10s slack),
# not a value derived from them: raising preDrainWaitSeconds or timeoutSeconds
# means raising this as well. The chart refuses to render when it falls short,
# rather than installing a release the kubelet kills mid-drain. Operators with
# slow load-balancer propagation can raise it further, along with
# preDrainWaitSeconds.
terminationGracePeriodSeconds: 75

# Edge protection. Caps request body size so a misconfigured (or
# hostile) caller can't OOM the pod with a multi-GB body. 10 MiB fits
# ~3 MiB prompts plus base64 images with room to spare, and sits well
# below the 512Mi memory limit. Set to 0 to disable (not recommended).
security:
  maxRequestBodyBytes: 33554432 # 32 MiB

  # Application-layer SSRF admission for tenant-supplied provider endpoints.
  # Keep false for local/self-hosted installs that intentionally reach HTTP,
  # loopback, or private Kubernetes services. SaaS operators should set true
  # and also enable/tighten networkPolicy as the authoritative egress boundary.
  blockLocalHTTPCalls: false
  # Hosted-cloud transport policy. Independent of address-space blocking and
  # disabled by default so self-hosted HTTP endpoints remain compatible.
  requireHTTPSCustomEndpoints: false
  # Exact, case-insensitive hostnames allowed to use private egress while the
  # guard is enabled. Cloud metadata/link-local destinations remain blocked.
  allowedProxyHosts: []

  # HTTP server slowloris protection. ReadHeaderTimeout catches the
  # classic TLS-handshake-then-stall; ReadTimeout bounds the whole body
  # read so a trickling sender can't hold a goroutine indefinitely.
  # WriteTimeout is INTENTIONALLY not configured — it would terminate
  # long SSE streams. Use ingress-level timeouts for response caps.
  #
  # IdleTimeout > typical nginx-ingress keepalive_timeout (75s) so
  # nginx closes keep-alive connections first.
  readHeaderTimeout: 5s
  readTimeout: 60s
  idleTimeout: 120s

# Startup probe gating. The netcheck runs once on pod boot and must
# succeed before /startupz returns 200 — this catches the classic
# NetworkPolicy misconfig where /healthz passes but the first real
# upstream request dies on an egress denial (kube-system DNS missing,
# or provider :443 blocked). Empty list = no probe; greenfield deploys
# and self-hosted air-gapped setups that route providers via a forward
# proxy should leave it empty.
#
# Format: comma-joined "host:port" entries. DNS resolution AND TCP
# dial must complete within netcheckTimeout for each host.
startup:
  netcheckHosts: []
  # Example for SaaS production:
  # netcheckHosts:
  #   - api.openai.com:443
  #   - api.anthropic.com:443
  #   - generativelanguage.googleapis.com:443
  netcheckTimeout: 2s

# Probe timing. Tuned so a cold pod takes traffic only after /startupz
# clears, and stops taking traffic the instant /readyz flips.
probes:
  startup:
    initialDelaySeconds: 5
    periodSeconds: 2
    failureThreshold: 60 # allows ~2min bootstrap for bootstrapAllKeys tenants
  readiness:
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 2
    successThreshold: 1
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}

# NetworkPolicy — deny-by-default ingress + egress. Enable in
# production; dev environments may prefer to leave it off until the
# selectors are tuned for the local cluster's namespace layout.
networkPolicy:
  enabled: false

  # Who can talk TO the gateway (matched as a Kubernetes NetworkPolicy
  # `from` list). Default = ingress-nginx controller + Prometheus.
  # Override if you run a different ingress class or scraper.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus

  # Control plane target (egress). Default points at the same-
  # namespace LangWatch deployment on port 5560 (matches the
  # langwatch Helm chart's langwatch-app Service).
  controlPlanePort: 5560
  egressToControlPlane:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: langwatch-app

  # OTLP collector — leave empty to disable the NetworkPolicy rule
  # when spans export out-of-cluster or per-project endpoints vary.
  egressToOTLP: []

  # Provider upstreams. Default = allow any IP on 443. Tighten with
  # cidr blocks for audit-sensitive deployments.
  egressToProviders:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
          - 0.0.0.0/8
          - 10.0.0.0/8
          - 100.64.0.0/10
          - 127.0.0.0/8
          - 168.63.129.16/32
          - 169.254.0.0/16
          - 172.16.0.0/12
          - 192.0.0.0/24
          - 192.0.2.0/24
          - 192.88.99.0/24
          - 192.168.0.0/16
          - 198.18.0.0/15
          - 198.51.100.0/24
          - 203.0.113.0/24
          - 224.0.0.0/4
          - 240.0.0.0/4
  providerPorts:
    - protocol: TCP
      port: 443

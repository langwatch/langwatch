name: Prepare generated files
description: >-
  Runs the repository root's `start:prepare:files` and `ensure:built`, replayed
  from the Nx cache when none of their inputs changed.

# `start:prepare:files` runs the generators (the Prisma client, the langevals
# evaluator types, the langy skill catalogue, the feature map and the
# setup-skill bodies). `ensure:built` then builds the workspace packages that
# resolve a built `dist` rather than their own source: the TypeScript SDK (which
# also writes its gitignored src/internal/generated files), the MCP server,
# ksuid and mail.
#
# Both are Nx targets with declared inputs and outputs (nx.json), so Nx is the
# only cache: the restored Nx cache replays each unchanged task's outputs, and a
# changed input reruns only that task. There is no second cache keyed by a hand
# list of files here, because a hand list drifts and then serves stale output.

runs:
  using: composite
  steps:
    # Every job that prepares files also runs nx (ensure:built, lint:types).
    - uses: ./.github/actions/nx-cache

    - name: Generate files
      shell: bash
      # `ensure:built` is the same script the dev lanes run before they start,
      # so the bundles are produced by one mechanism, not a build spelled out here.
      run: pnpm start:prepare:files && pnpm ensure:built

    # A replay is only useful if it actually produced the files. A target whose
    # outputs stop covering a file would otherwise hand every job a missing
    # module minutes later, in a stack trace pointing anywhere but here.
    - name: Verify the generated files are present
      shell: bash
      run: bash .github/scripts/verify-generated-files.sh

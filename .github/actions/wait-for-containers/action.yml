name: Wait for containers
description: >-
  Waits until each named container started with a --health-cmd reports
  healthy, and prints its log and the start log when one does not.
inputs:
  names:
    description: Space-separated container names.
    required: true
  start-log:
    description: The log the background start wrote, printed when a container is not healthy.
    required: true
  seconds:
    description: How long to wait for all of them together.
    default: "150"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NAMES: ${{ inputs.names }}
        START_LOG: ${{ inputs.start-log }}
        WAIT_SECONDS: ${{ inputs.seconds }}
      run: |
        deadline=$((SECONDS + WAIT_SECONDS))
        for name in $NAMES; do
          until [ "$(docker inspect -f '{{.State.Health.Status}}' "$name" 2>/dev/null)" = healthy ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$name is not healthy after ${WAIT_SECONDS}s"
              cat "$START_LOG" || true
              docker ps -a || true
              docker logs --tail 100 "$name" || true
              exit 1
            fi
            sleep 1
          done
          echo "$name is healthy (waited ${SECONDS}s)"
        done

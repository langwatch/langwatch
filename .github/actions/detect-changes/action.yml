# Path-change gate for the "always-run + aggregator" pattern. See #3223.
#
# On `pull_request` we diff the PR's base commit against the checked-out
# merge commit with git, through dorny/paths-filter. On every other event
# (push, schedule, workflow_dispatch, merge_group) we force every declared
# filter to `true` so the real jobs always run — required aggregator checks
# need a concrete result. Exception: with `push-strategy: diff` a push is
# diffed against its before-commit instead of force-run, for workflows
# whose real jobs spend money on live LLM calls.
#
# Never the files API: it stops at 3,000 files and, past that, gave each
# workflow a different subset (#7536). On `pull_request_target` the base and
# head commits are fetched by SHA as objects only, never checked out, and
# diffed with git pathspecs (.github/scripts/detect-changes-by-sha.sh); any
# failure there forces every filter. .github/scripts/detect-changes-source.sh
# makes the choice; specs/ci/path-filters.feature pins it.
#
# The caller MUST check out the repo first so this composite action is
# accessible. A sparse `.github` checkout with `persist-credentials: false`
# is enough: both paths list changed paths from trees, never file content.
# A `pull_request_target` caller's filters may not use braces or `!`.
#
# IMPORTANT: every filter key the caller wants to consume must be
# declared as an `outputs.<key>` entry below AND echoed into the force
# step. dorny/paths-filter sets per-key outputs internally, but a
# composite action only exposes outputs it explicitly declares — silently
# missing entries land as empty strings. See #3461 for the regression
# that added `feature-parity` here after callers had been reading an
# undeclared output.
#
# Usage:
#   jobs:
#     changes:
#       runs-on: ubuntu-latest
#       outputs:
#         relevant: ${{ steps.detect.outputs.relevant }}
#         feature-parity: ${{ steps.detect.outputs.feature-parity }}
#       steps:
#         - uses: actions/checkout@...
#         - uses: ./.github/actions/detect-changes
#           id: detect
#           with:
#             filters: |
#               relevant:
#                 - 'foo/**'
#               feature-parity:
#                 - 'specs/**'
name: detect-changes
description: Decide whether a path-filtered workflow should run real work.
inputs:
  filters:
    description: YAML filter block for dorny/paths-filter (must define `relevant` + `feature-parity` filters). On pull_request_target, no braces and no `!` negation.
    required: true
  push-strategy:
    description: >-
      How push events are treated. 'force' (default) marks every filter
      true so the real jobs always run post-merge. 'diff' diffs the push
      against its before-commit with dorny/paths-filter instead, so
      workflows whose real jobs spend money (live LLM calls) only run
      them when the push actually touched relevant paths.
    required: false
    default: force
outputs:
  relevant:
    description: "'true' if relevant paths changed, or if the event is neither a PR nor a diff-mode push."
    value: ${{ steps.filter.outputs.relevant || steps.sha.outputs.relevant || steps.force.outputs.relevant }}
  feature-parity:
    description: "'true' if feature-parity-relevant paths changed, or if the event is neither a PR nor a diff-mode push."
    value: ${{ steps.filter.outputs.feature-parity || steps.sha.outputs.feature-parity || steps.force.outputs.feature-parity }}
  lambda-image:
    description: "'true' if Lambda-image-relevant paths changed, or if the event is neither a PR nor a diff-mode push. Used by langwatch-nlp-ci's LWA-readiness job — covers Go-binary source + Dockerfile + entrypoint, which aren't matched by the Python-only `relevant` filter."
    value: ${{ steps.filter.outputs.lambda-image || steps.sha.outputs.lambda-image || steps.force.outputs.lambda-image }}
  ingest:
    description: "'true' if the app's HTTP ingest spine changed, or if the event is neither a PR nor a diff-mode push. Used by sdk-javascript-ci's e2e job, which drives real SDK telemetry at a running server and is therefore the only check that sees those routes answer over a socket. Separate from `relevant` because the sibling `ci` job shares that filter and spends LLM budget."
    value: ${{ steps.filter.outputs.ingest || steps.sha.outputs.ingest || steps.force.outputs.ingest }}
  codeql-javascript:
    description: "'true' if code CodeQL analyses as javascript-typescript changed. Used by codeql.yml to build its language matrix: the single `relevant` filter fires on any of six trees and then runs every analyser, so a TypeScript-only change was paying for the Python one."
    value: ${{ steps.filter.outputs.codeql-javascript || steps.sha.outputs.codeql-javascript || steps.force.outputs.codeql-javascript }}
  codeql-python:
    description: "'true' if code CodeQL analyses as python changed. See codeql-javascript."
    value: ${{ steps.filter.outputs.codeql-python || steps.sha.outputs.codeql-python || steps.force.outputs.codeql-python }}
  heavy:
    description: >-
      "'true' unless this is a draft pull request. Gate expensive jobs on
      `relevant == 'true' && heavy == 'true'` so a draft keeps the cheap
      signal and releases the runner slots. Never gate a REQUIRED check on
      this alone — a skipped required check blocks the merge; pair it with an
      aggregator that lists the job under allowed-skips, which is what the
      always-run + aggregator pattern already does."
    value: ${{ steps.draft.outputs.heavy }}

runs:
  using: composite
  steps:
    # One PR push fans out to 27 workflow runs and 98 jobs, against a Team-plan
    # concurrency allowance of the same order — which is why integration shards
    # were measured waiting 286-590s for a runner while their only dependency
    # had finished in 8 seconds. Drafts are where that budget is cheapest to
    # reclaim: the work is in progress, and the full suite is guaranteed to run
    # again on ready_for_review and in the merge queue.
    #
    # Computed here rather than in each workflow because it is the same
    # expression 25 times over, and the one place every gate job already calls.
    # A workflow that wants a job on drafts simply does not read this output.
    #
    # `ready_for_review` must be in the workflow's `pull_request.types` for the
    # heavy jobs to get their first run when the PR leaves draft — taking a PR
    # out of draft fires no other event.
    - name: Decide whether heavy jobs should run
      id: draft
      shell: bash
      # Both PR event names, not just `pull_request`. `pull_request_target`
      # carries the identical payload — `draft` included — and several callers
      # here trigger on it, so checking only the one name let a draft
      # pull_request_target run everything heavy.
      run: |
        case "${{ github.event_name }}" in
          pull_request | pull_request_target)
            if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
              echo "heavy=false" >> "$GITHUB_OUTPUT"
            else
              echo "heavy=true" >> "$GITHUB_OUTPUT"
            fi
            ;;
          *)
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            ;;
        esac

    - name: Choose where the changed paths come from
      id: source
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PUSH_STRATEGY: ${{ inputs.push-strategy }}
      run: bash "$GITHUB_ACTION_PATH/../../scripts/detect-changes-source.sh" >> "$GITHUB_OUTPUT"

    - name: Detect relevant changes
      if: steps.source.outputs.source == 'git'
      id: filter
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
      with:
        filters: ${{ inputs.filters }}
        # An empty token is what makes dorny diff with git instead of the API.
        token: ""

    # dorny refuses an empty token on pull_request_target, so git matches here.
    # Untrusted values arrive through env only; the head is fetched as objects
    # and diffed, never checked out or run. Outputs are written only on success.
    - name: Diff the pull request's head commit by SHA
      if: steps.source.outputs.source == 'git-sha'
      id: sha
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FILTERS: ${{ inputs.filters }}
      run: |
        result="$RUNNER_TEMP/detect-changes-by-sha"
        if bash "$GITHUB_ACTION_PATH/../../scripts/detect-changes-by-sha.sh" > "$result"; then
          cat "$result" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Could not diff the head commit by SHA; forcing every filter true."
          echo "sha-diff-failed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Force every filter true
      if: steps.source.outputs.source == 'force' || steps.sha.outputs.sha-diff-failed == 'true'
      id: force
      shell: bash
      run: |
        echo "relevant=true" >> "$GITHUB_OUTPUT"
        echo "feature-parity=true" >> "$GITHUB_OUTPUT"
        echo "lambda-image=true" >> "$GITHUB_OUTPUT"
        echo "ingest=true" >> "$GITHUB_OUTPUT"
        echo "codeql-javascript=true" >> "$GITHUB_OUTPUT"
        echo "codeql-python=true" >> "$GITHUB_OUTPUT"

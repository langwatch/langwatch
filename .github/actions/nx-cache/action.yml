# The Nx task cache, carried between runs. Entries are keyed by task hash, so
# restoring any older cache is safe. Only main saves, under a key that rotates
# with the commit; pull requests and merge queues restore main's newest entry
# and never save, because each save is a fresh copy against the 10 GB quota.
# The index (a SQLite file) travels with the cache. Locally Nx shares ~/.nx (ADR-150).
name: nx-cache
description: Restore the Nx task cache; save it only on main, under a key that rotates with the commit.

inputs:
  suffix:
    description: Separates jobs whose cached tasks differ, so each saves its own entries.
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Point Nx at cacheable directories
      shell: bash
      run: |
        echo "NX_CACHE_DIRECTORY=$GITHUB_WORKSPACE/.nx/cache" >> "$GITHUB_ENV"
        echo "NX_WORKSPACE_DATA_DIRECTORY=$GITHUB_WORKSPACE/.nx/workspace-data" >> "$GITHUB_ENV"

    - name: Restore the Nx cache
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .nx/cache
          .nx/workspace-data/*.db*
        key: ${{ runner.os }}-nx-${{ inputs.suffix }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ inputs.suffix }}-
          ${{ runner.os }}-nx-

    - name: Restore and save the Nx cache
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .nx/cache
          .nx/workspace-data/*.db*
        key: ${{ runner.os }}-nx-${{ inputs.suffix }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ inputs.suffix }}-
          ${{ runner.os }}-nx-

    - name: Adopt the restored cache index
      shell: bash
      run: bash .github/scripts/adopt-nx-cache-index.sh .nx/workspace-data

# The Nx task cache, carried between runs; entries are keyed by task hash, so
# any older cache is safe to restore. Main saves under a key rotating with the
# commit; a same-repository pull request saves its own after pruning its older
# copy (one kept). Merge queues and forks only restore. The SQLite index
# travels with it. Locally Nx shares ~/.nx (ADR-150).
name: nx-cache
description: Restore the Nx task cache; main and same-repository pull requests save it, a pull request keeping one copy.

inputs:
  suffix:
    description: Separates jobs whose cached tasks differ, so each saves its own entries.
    required: false
    default: default
  pr-save:
    description: >-
      "false" makes a pull request restore only. Set it in workflows whose job
      can also run a fork's code (pull_request_target), which never get the
      permission to prune.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Point Nx at cacheable directories
      shell: bash
      run: |
        echo "NX_CACHE_DIRECTORY=$GITHUB_WORKSPACE/.nx/cache" >> "$GITHUB_ENV"
        echo "NX_WORKSPACE_DATA_DIRECTORY=$GITHUB_WORKSPACE/.nx/workspace-data" >> "$GITHUB_ENV"

    - name: Restore the Nx cache
      if: ${{ !((github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && inputs.pr-save == 'true')) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .nx/cache
          .nx/workspace-data/*.db*
        key: ${{ runner.os }}-nx-${{ inputs.suffix }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ inputs.suffix }}-
          ${{ runner.os }}-nx-

    - name: Restore the Nx cache, saving it at the end of the job
      if: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && inputs.pr-save == 'true') }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .nx/cache
          .nx/workspace-data/*.db*
        key: ${{ runner.os }}-nx-${{ inputs.suffix }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ inputs.suffix }}-
          ${{ runner.os }}-nx-

    - uses: ./.github/actions/prune-pr-caches
      if: inputs.pr-save == 'true'
      with:
        prefix: ${{ runner.os }}-nx-${{ inputs.suffix }}-

    - name: Adopt the restored cache index
      shell: bash
      run: bash .github/scripts/adopt-nx-cache-index.sh .nx/workspace-data

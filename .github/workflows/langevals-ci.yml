# Always-run workflow with internal path gating + aggregator. See #3223.
# Branch protection requires `langevals-complete` (includes docker-build).
# `pull_request_target` runs real tests only after an `approved-ci` label
# is applied (per-job `if:` guards); that event forces `relevant=true`.
name: langevals-ci

on:
  # Pull requests and the merge queue reach this through pr.yml.
  workflow_call:
  push:
    branches:
      - main
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

concurrency:
  # A pull_request_target label other than `approved-ci` gets its own group.
  group: langevals-ci-${{ github.event_name }}-${{ (github.event_name == 'pull_request_target' && github.event.label.name != 'approved-ci') && format('label-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  # A newer commit supersedes an older run, on main too: the newest verdict
  # covers the commits before it. Image and release builds keep their own rule.
  cancel-in-progress: true

jobs:
  changes:
    # Skips the whole run for a pull_request_target label other than `approved-ci`.
    # That event exists only to let `approved-ci` run a fork's PR.
    if: (github.event_name != 'pull_request_target' || github.event.label.name == 'approved-ci')
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      # Draft PRs keep the cheap signal and release the runner slots;
      # everything heavy returns on ready_for_review and in the merge queue.
      # A PR labelled `ci:full` runs it all, draft or not.
      heavy: ${{ steps.detect.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The gate reads no working-tree content: the changed paths come
          # from git trees (.github/actions/detect-changes),
          # and every file this job needs on disk lives under .github/.
          # Checking out the rest of the tree is pure runner time.
          sparse-checkout: .github
          # No token left on disk: every fetch in this job is anonymous.
          persist-credentials: false
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          # push-strategy diff: the test job spends real LLM money, so it
          # must not run on pushes that touched nothing under services/langevals/.
          push-strategy: diff
          filters: |
            relevant:
              - 'services/langevals/**'
              - 'modules/model-provider/contract/src/catalog/model-catalog*.json'
              - 'infra/docker/Dockerfile.langevals'
              - '.github/workflows/langevals-ci.yml'

  lint:
    needs: changes
    if: >
      needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
      && (github.event_name != 'pull_request_target'
          || github.event.label.name == 'approved-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup UV
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-dependency-glob: "services/langevals/uv.lock"

      - name: Install dependencies
        working-directory: services/langevals
        run: uv sync --all-extras --all-groups

      - name: Run type checking
        working-directory: services/langevals
        run: uv run python -m py_compile langevals/server.py

  test:
    needs: changes
    if: >
      needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
      && (github.event_name != 'pull_request_target'
          || github.event.label.name == 'approved-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup UV
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-dependency-glob: "services/langevals/uv.lock"

      - name: Install dependencies
        working-directory: services/langevals
        run: uv sync --all-extras --all-groups

      - name: Run tests
        # Fork and Dependabot PRs don't receive repository secrets, so a
        # secret-backed run can only fail on a missing key. Skip it there;
        # same-repo PRs, pushes, and label-approved pull_request_target run.
        if: >
          (github.event_name != 'pull_request'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && (github.actor != 'dependabot[bot]'
           || github.event_name == 'pull_request_target')
        working-directory: services/langevals
        env:
          OPENAI_API_KEY: ${{ secrets.LANGEVALS_OPENAI_API_KEY }}
          AZURE_API_KEY: ${{ secrets.PYTHON_SDK_AZURE_OPENAI_API_KEY }}
          AZURE_API_BASE: ${{ secrets.PYTHON_SDK_AZURE_OPENAI_ENDPOINT }}
          AZURE_CONTENT_SAFETY_ENDPOINT: ${{ secrets.LANGEVALS_AZURE_CONTENT_SAFETY_ENDPOINT }}
          AZURE_CONTENT_SAFETY_KEY: ${{ secrets.LANGEVALS_AZURE_CONTENT_SAFETY_KEY }}
        # LLM-judged evaluator tests are non-deterministic and fail
        # intermittently. Ignored pending langwatch/langwatch#3240.
        run: |
          uv run pytest -x -v \
            --ignore=evaluators/ragas/ \
            --ignore=evaluators/langevals/tests/ \
            --ignore=evaluators/openai/tests/ \
            --ignore=evaluators/azure/tests/ \
            --ignore=evaluators/topic_clustering/tests/ \
            --ignore=tests/

      - name: Run evaluator regression tests that need no provider
        # `evaluators/langevals/tests/` is ignored by the step above because
        # its LLM-judged tests are non-deterministic. This file is not one of
        # them: it stubs the call to the provider, so it needs no key, makes no
        # provider request and always gives the same answer. The step above also
        # ignores `tests/`, which holds the same kind of test. Naming both paths
        # here is what makes them run, and they run on forks too. They guard the
        # dspy thread-affinity crash that broke every evaluation after the first
        # one on a long-lived server, the event-loop block that made the health
        # probe time out under load, the worker-count detection that has to
        # survive a bad value without stopping the boot, and the litellm patch
        # that decides what actually leaves for the provider — `langevals_core/
        # tests/` runs on the secret-bearing step by default, which forks skip,
        # so a contributor could otherwise break the request shape and see CI
        # stay green.
        #
        # The two ragas files are named individually for the same reason. The
        # step above ignores `evaluators/ragas/` wholesale because the evaluator
        # tests there are LLM-judged, and that is how two import-time breaks
        # reached main without CI noticing: the litellm client losing the shape
        # langchain-openai calls it with, and a notebooks dependency that could
        # not be imported on this Python taking the whole suite's collection
        # down. Neither needs a provider. These two files stub every call, so
        # they pin the client shape and the token accounting that prices each
        # evaluation, and they fail loudly at import if that surface moves again.
        working-directory: services/langevals
        run: |
          uv run pytest -x -v \
            evaluators/langevals/tests/test_llm_answer_match_threading.py \
            evaluators/ragas/tests/test_model_to_langchain.py \
            evaluators/ragas/tests/test_token_usage.py \
            tests/deterministic/ \
            langevals_core/tests/

  docker-build:
    needs: changes
    if: >
      needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
      && (github.event_name != 'pull_request_target'
          || github.event.label.name == 'approved-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.langevals
          push: false
          tags: langwatch/langevals:test
          # Scoped, like every other buildx cache in this repo. Unscoped, this
          # and langwatch-nlp-ci both wrote to buildkit's default scope and
          # evicted each other's layers on every run — and with mode=max
          # against a 10 GB per-repo budget, images this size evict a lot.
          cache-from: type=gha,scope=langevals
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=langevals' || '' }}

  langevals-complete:
    needs: [changes, lint, test, docker-build]
    if: always() && (github.event_name != 'pull_request_target' || github.event.label.name == 'approved-ci')
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, test, docker-build

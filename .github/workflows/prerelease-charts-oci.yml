# Publishes every chart under charts/ to the artifacts ECR as an OCI artifact
# on each merge to main, so LangWatch Cloud can deploy main without waiting
# for a tagged release. Prerelease charts are private, like the `main` images:
# they go only to that registry, never to a public one. Self-hosters install
# the tagged releases from the GitHub Pages Helm repo.
#
# Deliberately NOT folded into release-langwatch-chart.yml. That workflow feeds
# the GitHub Pages Helm repo (chart-releaser writes a shared index.yaml) which
# is the artifact self-hosters install from. Publishing a build per merge there
# would grow that index without bound and force every `helm search`/`helm
# upgrade` onto --devel to avoid picking up an untagged main build. OCI has no
# shared index — each push is an independent tag — so prereleases and stable
# releases cannot interfere with each other.
#
# Versions are `<chartVersion>-main.<run_number>.<run_attempt>.<shortSha>`,
# e.g. 3.7.0-main.412.1.a1b2c3d, where chartVersion is the version in
# Chart.yaml, normally the last release. run_attempt is part of the identity
# because a re-run reuses both run_number and sha, and the repositories are
# immutable, so a re-run must not reuse a version string. It is a valid semver
# PRERELEASE of chartVersion, so it sorts BELOW the release it follows
# (3.7.0-main.* < 3.7.0) and `helm upgrade` never selects it over that
# release. It is also a valid OCI tag (semver build metadata, `+sha`, is not —
# `+` is not a legal tag character, which is why the sha goes in the
# prerelease segment).
name: prerelease-charts-oci

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/prerelease-charts-oci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialise per branch: two merges in quick succession would otherwise race
  # on `helm dependency build`, and the later push should win.
  group: prerelease-charts-oci-${{ github.ref }}
  # NOT cancel-in-progress. Cancelling between two chart pushes leaves some
  # charts of a commit published and others not, while the run reports
  # "cancelled" rather than failed, so nothing retries and nothing reconciles
  # it. A publish run drains.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # workflow_dispatch can be triggered from ANY ref, and this job holds
    # id-token:write. Without this gate a manual run from a feature branch
    # would try to push a chart versioned `-main.<run>.<sha>` into the
    # registry Cloud deploys from, built from unreviewed code. The version
    # string must not be forgeable by anyone who can click Run workflow.
    if: github.ref == 'refs/heads/main'
    env:
      AWS_REGION: eu-central-1
    permissions:
      contents: read
      # Assumes the artifacts ECR push role through GitHub OIDC.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job performs no git operations, so the token has no reason to
          # stay in .git/config where every later step (and anything they
          # shell out to) can read it.
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.19.0

      - name: Add upstream Helm repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Package each chart
        env:
          RUN_NUMBER: ${{ github.run_number }}
          # Re-running a workflow reuses run_number AND sha, but `helm package`
          # is not byte-reproducible (tgz mtimes come from checkout), so without
          # run_attempt a re-run would push the SAME version string with
          # different bytes, which the immutable repositories refuse.
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=7 HEAD)"
          mkdir -p .oci-packages

          # Leaf charts before the umbrella: `helm dependency build` on
          # charts/langwatch resolves file://../<chart> paths from the working
          # tree, so ordering only matters for the local build, not the push.
          for chart_dir in charts/*/; do
            [ -f "${chart_dir}Chart.yaml" ] || continue

            # Read straight from Chart.yaml rather than `helm show chart`: the
            # packaged filename is <name>-<version>.tgz using the chart NAME,
            # which is not the directory name (charts/gateway is
            # "langwatch-gateway"), and `helm show` needs dependencies resolved
            # first, which is the step below.
            # Strip surrounding quotes: Chart.yaml scalars are legitimately
            # quotable (clickhouse-serverless quotes appVersion), and a quoted
            # version yielded `"0.2.0"` verbatim — a malformed --version and a
            # .tgz filename that does not exist.
            read_chart_field() {
              awk -v k="$2:" '$1==k{sub(/^[^:]*:[[:space:]]*/,""); gsub(/^["\x27]|["\x27]$/,""); print; exit}' "$1"
            }
            chart_name="$(read_chart_field "${chart_dir}Chart.yaml" name)"
            base_version="$(read_chart_field "${chart_dir}Chart.yaml" version)"
            if [ -z "$chart_name" ] || [ -z "$base_version" ]; then
              echo "::error::could not read name/version from ${chart_dir}Chart.yaml"
              exit 1
            fi
            version="${base_version}-main.${RUN_NUMBER}.${RUN_ATTEMPT}.${short_sha}"

            echo "::group::${chart_name} -> ${version}"
            helm dependency build "$chart_dir"

            # Never publish something that cannot install. Without this, a
            # template error merged to main still reaches the registry Cloud
            # deploys from.
            #
            # autogen.enabled=true matches every entry of the chart CI matrix
            # in langwatch-chart.yml: clickhouse-serverless and the langwatch
            # umbrella refuse to render at all without credentials config, and
            # autogen is how a throwaway render satisfies that gate. Charts
            # without an autogen gate ignore the value.
            helm lint "$chart_dir" >/dev/null
            helm template smoke "$chart_dir" --set autogen.enabled=true >/dev/null
            # --app-version deliberately NOT set: clickhouse-serverless declares
            # appVersion "25.10.2.65" (the actual ClickHouse release), and
            # overwriting it with a git sha both destroys that and claims a
            # correspondence the chart does not have — its image tags come from
            # values.yaml, not appVersion. The sha is already in the version.
            helm package "$chart_dir" --version "$version" -d .oci-packages

            echo "::endgroup::"
          done

      # Cloud pulls these charts from the private ECR registry its images come
      # from. Not signed: a keyless signature puts the reference in the public
      # transparency log, and this registry's host is kept out of the public
      # record (see publish-docker-ecr.yml). The deploy pins the digest instead.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.ARTIFACTS_ECR_OIDC_ROLE_ARN }}
          role-session-name: prerelease-charts-oci-${{ github.run_id }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"

      - name: Push every chart to ECR
        env:
          ROLE_ARN: ${{ secrets.ARTIFACTS_ECR_OIDC_ROLE_ARN }}
          # Every chart under charts/ with a Chart.yaml, by name (a test
          # enforces it). Each needs an ECR repository langwatch-charts/<name>
          # the OIDC role may push to. langyagent first: the push stops at the
          # first failure, and its repository already exists.
          ECR_CHARTS: langwatch-langyagent clickhouse-serverless langwatch-gateway langwatch
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "${ROLE_ARN}" | cut -d: -f5)"
          echo "::add-mask::${ACCOUNT_ID}"
          registry="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | helm registry login "$registry" --username AWS --password-stdin

          # shellcheck disable=SC2086 # ECR_CHARTS is a space-separated list
          go run ./cmd/chartpush -registry "$registry" $ECR_CHARTS

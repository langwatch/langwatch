# The one workflow a pull request, the merge queue or the nightly suite starts
# for the checks: `changes` decides once which of them a change reaches, the
# cheap `checks` run at once, the rest wait in `settle` until the branch has
# been quiet for the settle environment's timer (a newer push cancels the wait;
# the `ci:now` label skips it), and `ci-complete` reports one verdict. A call
# that is skipped takes no runner. Plan: dev/docs/plans/ci-redesign.md
# Specs: specs/ci/one-pull-request-workflow.feature, specs/ci/quiet-branch.feature
name: pr

on:
  pull_request:
    # ready_for_review is not a default activity type: without it, taking a
    # pull request out of draft starts nothing and heavy jobs never run.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # The nightly suite runs every check on main once a day.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app || steps.force.outputs.all }}
      e2e: ${{ steps.filter.outputs.e2e || steps.force.outputs.all }}
      nlp: ${{ steps.filter.outputs.nlp || steps.force.outputs.all }}
      langevals: ${{ steps.filter.outputs.langevals || steps.force.outputs.all }}
      mcp: ${{ steps.filter.outputs.mcp || steps.force.outputs.all }}
      sdk-go: ${{ steps.filter.outputs.sdk-go || steps.force.outputs.all }}
      sdk-javascript: ${{ steps.filter.outputs.sdk-javascript || steps.force.outputs.all }}
      docs: ${{ steps.filter.outputs.docs || steps.force.outputs.all }}
      codeql: ${{ steps.filter.outputs.codeql || steps.force.outputs.all }}
      clickhouse-serverless: ${{ steps.filter.outputs.clickhouse-serverless || steps.force.outputs.all }}
      go: ${{ steps.filter.outputs.go || steps.force.outputs.all }}
      sdk-python: ${{ steps.filter.outputs.sdk-python || steps.force.outputs.all }}
      code-scanners: ${{ steps.filter.outputs.code-scanners || steps.force.outputs.all }}
      review: ${{ steps.filter.outputs.review || steps.force.outputs.all }}
      wait: ${{ steps.quiet.outputs.wait }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The filter and the diff script live there; nothing else is needed on disk.
          sparse-checkout: .github
      # Diff from the main the merge commit is built on, so main's newer
      # commits don't count as this pull request's changes.
      - name: Diff from the main the merge commit is built on
        if: github.event_name == 'pull_request'
        id: diff-base
        run: bash "$GITHUB_WORKSPACE/.github/scripts/pull-request-diff-base.sh" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # Empty: diff with git, never the files API, which stops at 3,000
          # files (specs/ci/path-filters.feature).
          token: ""
          base: ${{ steps.diff-base.outputs.sha }}
          # Generated from the called workflows' own detect-changes paths by
          # `go run ./cmd/prfilters`; ciguard fails when it is stale.
          filters: .github/pr-filters.yml
      - name: Run everything in the merge queue and the nightly suite
        if: github.event_name != 'pull_request'
        id: force
        run: echo "all=true" >> "$GITHUB_OUTPUT"
      # Read live, not from the event: adding ci:now and re-running skips the wait.
      - name: Wait for a quiet branch unless labelled ci:now
        if: github.event_name == 'pull_request'
        id: quiet
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' | grep -qx 'ci:now'; then
            echo "wait=false" >> "$GITHUB_OUTPUT"
          else
            echo "wait=true" >> "$GITHUB_OUTPUT"
          fi

  # Holds no runner while the settle environment's wait timer runs; a newer
  # push cancels this run, so only a branch's last push in the window goes on.
  settle:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.wait == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: settle
    steps:
      - run: echo "The branch has been quiet; starting the checks."

  # The cheap checks, as steps of one job, at once: they used to be a workflow each.
  checks:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /.github/
            /.gitattributes
            /README.md
          sparse-checkout-cone-mode: false
      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: No committed screenshots
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./.github/scripts/check-added-images.sh "origin/${BASE_REF}"
      - name: Did README.md change
        id: readme
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if git diff --quiet "origin/${BASE_REF}...HEAD" -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The link checker builds from source, so it takes the whole tree.
      - name: Check out the whole tree for the link checker
        if: steps.readme.outputs.changed == 'true'
        run: git sparse-checkout disable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.readme.outputs.changed == 'true'
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - name: README links
        if: steps.readme.outputs.changed == 'true'
        run: go run ./cmd/linkcheck README.md
      - name: PR impact map
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-impact-map.cjs`)({ github, context, core })
      - name: Test the token usage comment builder
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: node --test --experimental-strip-types .github/scripts/pr-token-usage.test.ts
      - name: Token usage comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_PR_USAGE_API_KEY }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types .github/scripts/pr-token-usage.ts

  app:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.app == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/langwatch-app-ci.yml
    secrets: inherit
    permissions:
      contents: read
      actions: write

  e2e:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.e2e == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/e2e-ci.yml
    secrets: inherit
    permissions:
      contents: read
      actions: write

  nlp:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.nlp == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/langwatch-nlp-ci.yml
    secrets: inherit

  langevals:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.langevals == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/langevals-ci.yml
    secrets: inherit

  mcp:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.mcp == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/mcp-javascript-ci.yml
    secrets: inherit

  sdk-go:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.sdk-go == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/sdk-go-ci.yml
    secrets: inherit

  sdk-javascript:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.sdk-javascript == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/sdk-javascript-ci.yml
    secrets: inherit

  docs:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.docs == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/docs-ci.yml
    secrets: inherit

  # CodeQL scans pull requests into main only.
  codeql:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.codeql == 'true' && needs.settle.result != 'failure' && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
    uses: ./.github/workflows/codeql.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write

  clickhouse-serverless:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.clickhouse-serverless == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/clickhouse-serverless.yml
    secrets: inherit

  go:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.go == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/go-ci.yaml
    secrets: inherit

  sdk-python:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.sdk-python == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/sdk-python-ci.yml
    secrets: inherit

  code-scanners:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.code-scanners == 'true' && needs.settle.result != 'failure' }}
    uses: ./.github/workflows/code-scanners.yml
    secrets: inherit

  # The review bot reads a quiet branch's last push, never every push.
  review:
    needs: [changes, settle]
    if: ${{ !cancelled() && needs.changes.outputs.review == 'true' && needs.settle.result != 'failure' && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/pr-review-bot.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write

  # The one verdict. Until the ruleset requires `ci-complete`, it also posts
  # the names main still requires, each from the call that used to report it.
  ci-complete:
    needs:
      - changes
      - settle
      - checks
      - app
      - e2e
      - nlp
      - langevals
      - mcp
      - sdk-go
      - sdk-javascript
      - docs
      - codeql
      - clickhouse-serverless
      - go
      - sdk-python
      - code-scanners
      - review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the checks main still requires
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # Every call needs changes: when it failed, their skips mean nothing ran.
          CHANGES: ${{ needs.changes.result }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULTS: >-
            langwatch-app-complete=${{ needs.app.result }}
            typecheck=${{ needs.app.result }}
            build=${{ needs.app.result }}
            e2e-complete=${{ needs.e2e.result }}
            langwatch-nlp-complete=${{ needs.nlp.result }}
            langevals-complete=${{ needs.langevals.result }}
            mcp-javascript-complete=${{ needs.mcp.result }}
            sdk-go-complete=${{ needs['sdk-go'].result }}
            sdk-javascript-complete=${{ needs['sdk-javascript'].result }}
            docs-complete=${{ needs.docs.result }}
            codeql-complete=${{ needs.codeql.result }}
            clickhouse-serverless-complete=${{ needs['clickhouse-serverless'].result }}
        run: |
          for pair in $RESULTS; do
            context="${pair%%=*}" result="${pair#*=}"
            case "$result" in success | skipped) state=success ;; *) state=failure ;; esac
            [ "$CHANGES" = success ] || state=failure
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$context" \
              -f description="pr.yml: $result" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null \
              || echo "::warning::could not post $context (a fork's token cannot write statuses)"
          done
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: settle, checks, app, e2e, nlp, langevals, mcp, sdk-go, sdk-javascript, docs, codeql, clickhouse-serverless, go, sdk-python, code-scanners, review

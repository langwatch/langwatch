# The one workflow a pull request or the merge queue starts for the product
# checks: `changes` decides once which of them a change reaches, only those
# are called, and `ci-complete` reports one verdict. A call that is skipped
# takes no runner. Plan: dev/docs/plans/ci-redesign.md
# Spec: specs/ci/one-pull-request-workflow.feature
name: pr

on:
  pull_request:
    # ready_for_review is not a default activity type: without it, taking a
    # pull request out of draft starts nothing and heavy jobs never run.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app || steps.force.outputs.all }}
      e2e: ${{ steps.filter.outputs.e2e || steps.force.outputs.all }}
      nlp: ${{ steps.filter.outputs.nlp || steps.force.outputs.all }}
      langevals: ${{ steps.filter.outputs.langevals || steps.force.outputs.all }}
      mcp: ${{ steps.filter.outputs.mcp || steps.force.outputs.all }}
      sdk-go: ${{ steps.filter.outputs.sdk-go || steps.force.outputs.all }}
      sdk-javascript: ${{ steps.filter.outputs.sdk-javascript || steps.force.outputs.all }}
      docs: ${{ steps.filter.outputs.docs || steps.force.outputs.all }}
      codeql: ${{ steps.filter.outputs.codeql || steps.force.outputs.all }}
      clickhouse-serverless: ${{ steps.filter.outputs.clickhouse-serverless || steps.force.outputs.all }}
      # The merge commit's tree, and whether a run of this pull request already
      # passed on that exact tree (a re-run, a reopen, a push that restores an
      # earlier tree). Then every call is skipped and ci-complete passes.
      tree: ${{ steps.tree.outputs.tree }}
      passed: ${{ steps.pass.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The filter and the diff script live there; nothing else is needed on disk.
          sparse-checkout: .github
      # Diff from the main the merge commit is built on, so main's newer
      # commits don't count as this pull request's changes.
      - name: Diff from the main the merge commit is built on
        if: github.event_name == 'pull_request'
        id: diff-base
        run: bash "$GITHUB_WORKSPACE/.github/scripts/pull-request-diff-base.sh" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # Empty: diff with git, never the files API, which stops at 3,000
          # files (specs/ci/path-filters.feature).
          token: ""
          base: ${{ steps.diff-base.outputs.sha }}
          # Generated from the called workflows' own detect-changes paths by
          # `go run ./cmd/prfilters`; ciguard fails when it is stale.
          filters: .github/pr-filters.yml
      - name: Run everything in the merge queue
        if: github.event_name != 'pull_request'
        id: force
        run: echo "all=true" >> "$GITHUB_OUTPUT"
      - name: Read the merge commit's tree
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # Only this repository's own pull requests: a pass marker lives in the
      # pull request's cache scope, and ci-complete writes it only after a run
      # that passed with nothing skipped for being a draft.
      - name: Look for a pass on this tree
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          !contains(github.event.pull_request.labels.*.name, 'ci:full')
        id: pass
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ci-pass-${{ steps.tree.outputs.tree }}
          lookup-only: true

  # The small checks that read a pull request, in one job instead of one
  # workflow each: no committed screenshots, and the coding agent usage
  # comment. It runs at once beside `changes`, so their findings show within
  # a minute. In the merge queue it has nothing to read and passes.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          # Both checks read the diff and scripts under .github/, never file contents.
          sparse-checkout: .github
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      # Spec: specs/ci/no-committed-screenshots.feature
      - name: Check for committed screenshots
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./.github/scripts/check-added-images.sh "origin/${BASE_REF}"
      # Spec: specs/ci/pr-token-usage.feature. Describes what the work cost and
      # never judges it: a LangWatch outage warns and the step stays green.
      # A fork's token is read-only and gets no secrets, so it is skipped.
      - name: Test the usage comment builder
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: node --test --experimental-strip-types .github/scripts/pr-token-usage.test.ts
      - name: Build and upsert the usage comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_PR_USAGE_API_KEY }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types .github/scripts/pr-token-usage.ts

  # A Dependabot bump of Go modules or Docker images changes no TypeScript:
  # go-ci, go-services and the image builds cover it, so the app suites and
  # e2e are skipped for it. A github-actions bump still runs app, the main
  # user of the bumped actions.
  app:
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true' && needs.changes.outputs.passed != 'true' &&
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
        (startsWith(github.head_ref, 'dependabot/go_modules/') || startsWith(github.head_ref, 'dependabot/docker/')))
    uses: ./.github/workflows/langwatch-app-ci.yml
    secrets: inherit
    permissions:
      contents: read
      actions: write
      id-token: write # the Nx cache role (nx-remote-cache action)

  e2e:
    needs: changes
    if: >-
      needs.changes.outputs.e2e == 'true' && needs.changes.outputs.passed != 'true' &&
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
        (startsWith(github.head_ref, 'dependabot/go_modules/') || startsWith(github.head_ref, 'dependabot/docker/') ||
         startsWith(github.head_ref, 'dependabot/github_actions/')))
    uses: ./.github/workflows/e2e-ci.yml
    secrets: inherit
    permissions:
      contents: read
      actions: write

  nlp:
    needs: changes
    if: needs.changes.outputs.nlp == 'true' && needs.changes.outputs.passed != 'true'
    uses: ./.github/workflows/langwatch-nlp-ci.yml
    secrets: inherit

  langevals:
    needs: changes
    if: needs.changes.outputs.langevals == 'true' && needs.changes.outputs.passed != 'true'
    uses: ./.github/workflows/langevals-ci.yml
    secrets: inherit

  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true' && needs.changes.outputs.passed != 'true'
    uses: ./.github/workflows/mcp-javascript-ci.yml
    secrets: inherit

  sdk-go:
    needs: changes
    if: needs.changes.outputs.sdk-go == 'true' && needs.changes.outputs.passed != 'true'
    uses: ./.github/workflows/sdk-go-ci.yml
    secrets: inherit

  sdk-javascript:
    needs: changes
    if: needs.changes.outputs.sdk-javascript == 'true' && needs.changes.outputs.passed != 'true'
    uses: ./.github/workflows/sdk-javascript-ci.yml
    secrets: inherit

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.passed != 'true'
    uses: ./.github/workflows/docs-ci.yml
    secrets: inherit

  # CodeQL scans pull requests into main only.
  codeql:
    needs: changes
    if: needs.changes.outputs.codeql == 'true' && needs.changes.outputs.passed != 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    uses: ./.github/workflows/codeql.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write

  clickhouse-serverless:
    needs: changes
    if: needs.changes.outputs.clickhouse-serverless == 'true' && needs.changes.outputs.passed != 'true'
    uses: ./.github/workflows/clickhouse-serverless.yml
    secrets: inherit

  # The one verdict. Until the ruleset requires `ci-complete`, it also posts
  # the names main still requires, each from the call that used to report it.
  ci-complete:
    needs:
      [
        changes,
        checks,
        app,
        e2e,
        nlp,
        langevals,
        mcp,
        sdk-go,
        sdk-javascript,
        docs,
        codeql,
        clickhouse-serverless,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the checks main still requires
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # Every call needs changes: when it failed, their skips mean nothing ran.
          CHANGES: ${{ needs.changes.result }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULTS: >-
            langwatch-app-complete=${{ needs.app.result }}
            typecheck=${{ needs.app.result }}
            build=${{ needs.app.result }}
            e2e-complete=${{ needs.e2e.result }}
            langwatch-nlp-complete=${{ needs.nlp.result }}
            langevals-complete=${{ needs.langevals.result }}
            mcp-javascript-complete=${{ needs.mcp.result }}
            sdk-go-complete=${{ needs['sdk-go'].result }}
            sdk-javascript-complete=${{ needs['sdk-javascript'].result }}
            docs-complete=${{ needs.docs.result }}
            codeql-complete=${{ needs.codeql.result }}
            clickhouse-serverless-complete=${{ needs['clickhouse-serverless'].result }}
        run: |
          for pair in $RESULTS; do
            context="${pair%%=*}" result="${pair#*=}"
            case "$result" in success | skipped) state=success ;; *) state=failure ;; esac
            [ "$CHANGES" = success ] || state=failure
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$context" \
              -f description="pr.yml: $result" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null \
              || echo "::warning::could not post $context (a fork's token cannot write statuses)"
          done
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: app, e2e, nlp, langevals, mcp, sdk-go, sdk-javascript, docs, codeql, clickhouse-serverless
      # Remembers that this tree passed, for the next run of this pull request
      # on the same tree. Not on a draft or a release-please PR, whose heavy
      # jobs skip, and not from a fork, whose run reads only its own scope.
      - name: Write the pass marker
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.draft == false &&
          !startsWith(github.head_ref, 'release-please--') &&
          needs.changes.outputs.passed != 'true'
        run: echo "${{ needs.changes.outputs.tree }}" > .ci-pass
      - if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.draft == false &&
          !startsWith(github.head_ref, 'release-please--') &&
          needs.changes.outputs.passed != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ci-pass-${{ needs.changes.outputs.tree }}

  # The LLM review, last so it spends tokens only on a change CI passed. The
  # ruleset requires a check named `review`.
  #
  # ci-complete covers only the calls of this workflow. The job holds no
  # runner while it is queued behind ci-complete; then a step waits only for
  # the checks the base branch requires (pr conventions, ...), which have
  # reported by then, and fails this job if any failed. Optional workflows
  # never hold it. A new push cancels this run (concurrency above), and with it
  # the wait. A wait that times out fails the job too: the ruleset requires
  # this check, and a silent pass would let an unreviewed change merge.
  review:
    needs: ci-complete
    # !cancelled() replaces the implicit success(). On a job, success() checks
    # every job upstream, transitively, not just `needs`: a call that path
    # filters skipped anywhere above ci-complete would skip this job even
    # though ci-complete passed, and a skipped required check passes, so the
    # change would merge unreviewed. ci-complete's own result is checked below.
    # Dependabot PRs read a separate secret store, so the token check would fail.
    if: |
      !cancelled() &&
      needs.ci-complete.result == 'success' &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The wait step's 50 + the bot's two claude calls at 20 each + 10 spare.
    # ciguard requires at least wait + 2 × review_timeout_minutes + 5.
    timeout-minutes: 100
    permissions:
      actions: read # to map each check run's suite to its workflow, so a superseded run is not counted
      checks: read # to list the head commit's check runs while waiting for them
      contents: write # so the default token can call resolveReviewThread; read would only lose thread auto-resolution
      pull-requests: write
    steps:
      # The bot diffs base...head, so it needs the full commit graph, but only the
      # blobs of the head tree and the changed files: git fetches those on demand.
      # Fetching every blob in history instead takes about 52s of this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "*/go.sum"
      # A failed or timed-out wait fails this job, so the review step below
      # never runs on a red or unfinished change (tools/waitforchecks).
      - name: Wait for the required checks on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # Its rules name the required checks; optional ones are not waited for.
          REQUIRED_FROM_BRANCH: ${{ github.base_ref }}
          # This job's own check run would wait on itself.
          EXCLUDE_CHECK: review
        run: go run ./cmd/waitforchecks
        # Above cmd/waitforchecks' own 45-minute deadline, so a slow CI ends
        # with the wait's message naming the pending checks.
        timeout-minutes: 50
      - uses: langwatch/langwatch-pr-review-bot@fbe577791f28fcb071ca68bbe904afc39e06164a # main 2026-11-26
        with:
          slack_notify: "false"
          # Bounds each of the bot's two claude calls (review and brief); the
          # bot's default of 60 would outlast the job timeout above.
          review_timeout_minutes: 20
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          langwatch_ingest_key: ${{ secrets.LANGWATCH_INGEST_KEY }}

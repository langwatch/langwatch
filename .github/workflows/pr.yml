# The one workflow a pull request or the merge queue starts for the product
# checks: `changes` decides once which of them a change reaches, only those
# are called, and `ci-complete` reports one verdict. A call that is skipped
# takes no runner. Plan: dev/docs/plans/ci-redesign.md
# Spec: specs/ci/one-pull-request-workflow.feature
name: pr

on:
  pull_request:
    # ready_for_review is not a default activity type: without it, taking a
    # pull request out of draft starts nothing and heavy jobs never run.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app || steps.force.outputs.all }}
      e2e: ${{ steps.filter.outputs.e2e || steps.force.outputs.all }}
      nlp: ${{ steps.filter.outputs.nlp || steps.force.outputs.all }}
      langevals: ${{ steps.filter.outputs.langevals || steps.force.outputs.all }}
      mcp: ${{ steps.filter.outputs.mcp || steps.force.outputs.all }}
      sdk-go: ${{ steps.filter.outputs.sdk-go || steps.force.outputs.all }}
      sdk-javascript: ${{ steps.filter.outputs.sdk-javascript || steps.force.outputs.all }}
      docs: ${{ steps.filter.outputs.docs || steps.force.outputs.all }}
      codeql: ${{ steps.filter.outputs.codeql || steps.force.outputs.all }}
      clickhouse-serverless: ${{ steps.filter.outputs.clickhouse-serverless || steps.force.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The filter and the diff script live there; nothing else is needed on disk.
          sparse-checkout: .github
      # Diff from the main the merge commit is built on, so main's newer
      # commits don't count as this pull request's changes.
      - name: Diff from the main the merge commit is built on
        if: github.event_name == 'pull_request'
        id: diff-base
        run: bash "$GITHUB_WORKSPACE/.github/scripts/pull-request-diff-base.sh" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # Empty: diff with git, never the files API, which stops at 3,000
          # files (specs/ci/path-filters.feature).
          token: ""
          base: ${{ steps.diff-base.outputs.sha }}
          # Generated from the called workflows' own detect-changes paths by
          # `go run ./cmd/prfilters`; ciguard fails when it is stale.
          filters: .github/pr-filters.yml
      - name: Run everything in the merge queue
        if: github.event_name != 'pull_request'
        id: force
        run: echo "all=true" >> "$GITHUB_OUTPUT"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/langwatch-app-ci.yml
    secrets: inherit
    permissions:
      contents: read
      actions: write

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e-ci.yml
    secrets: inherit
    permissions:
      contents: read
      actions: write

  nlp:
    needs: changes
    if: needs.changes.outputs.nlp == 'true'
    uses: ./.github/workflows/langwatch-nlp-ci.yml
    secrets: inherit

  langevals:
    needs: changes
    if: needs.changes.outputs.langevals == 'true'
    uses: ./.github/workflows/langevals-ci.yml
    secrets: inherit

  mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/mcp-javascript-ci.yml
    secrets: inherit

  sdk-go:
    needs: changes
    if: needs.changes.outputs.sdk-go == 'true'
    uses: ./.github/workflows/sdk-go-ci.yml
    secrets: inherit

  sdk-javascript:
    needs: changes
    if: needs.changes.outputs.sdk-javascript == 'true'
    uses: ./.github/workflows/sdk-javascript-ci.yml
    secrets: inherit

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs-ci.yml
    secrets: inherit

  # CodeQL scans pull requests into main only.
  codeql:
    needs: changes
    if: needs.changes.outputs.codeql == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    uses: ./.github/workflows/codeql.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write

  clickhouse-serverless:
    needs: changes
    if: needs.changes.outputs.clickhouse-serverless == 'true'
    uses: ./.github/workflows/clickhouse-serverless.yml
    secrets: inherit

  # The one verdict. Until the ruleset requires `ci-complete`, it also posts
  # the names main still requires, each from the call that used to report it.
  ci-complete:
    needs:
      [
        changes,
        app,
        e2e,
        nlp,
        langevals,
        mcp,
        sdk-go,
        sdk-javascript,
        docs,
        codeql,
        clickhouse-serverless,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the checks main still requires
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # Every call needs changes: when it failed, their skips mean nothing ran.
          CHANGES: ${{ needs.changes.result }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULTS: >-
            langwatch-app-complete=${{ needs.app.result }}
            typecheck=${{ needs.app.result }}
            build=${{ needs.app.result }}
            e2e-complete=${{ needs.e2e.result }}
            langwatch-nlp-complete=${{ needs.nlp.result }}
            langevals-complete=${{ needs.langevals.result }}
            mcp-javascript-complete=${{ needs.mcp.result }}
            sdk-go-complete=${{ needs['sdk-go'].result }}
            sdk-javascript-complete=${{ needs['sdk-javascript'].result }}
            docs-complete=${{ needs.docs.result }}
            codeql-complete=${{ needs.codeql.result }}
            clickhouse-serverless-complete=${{ needs['clickhouse-serverless'].result }}
        run: |
          for pair in $RESULTS; do
            context="${pair%%=*}" result="${pair#*=}"
            case "$result" in success | skipped) state=success ;; *) state=failure ;; esac
            [ "$CHANGES" = success ] || state=failure
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$context" \
              -f description="pr.yml: $result" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null \
              || echo "::warning::could not post $context (a fork's token cannot write statuses)"
          done
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: app, e2e, nlp, langevals, mcp, sdk-go, sdk-javascript, docs, codeql, clickhouse-serverless

  # The LLM review, last so it spends tokens only on a change CI passed. The
  # ruleset requires a check named `review`.
  #
  # ci-complete covers only the calls of this workflow. The separate workflows
  # that also run on a pull_request (pr-conventions, go-ci, sdk-python-ci,
  # code-scanners, ...) can still be running, so a step before the review
  # waits until every other check run on the head commit has finished, and
  # fails this job if any failed. A new push cancels this run (concurrency
  # above), and with it the wait. A wait that times out fails the job too: the
  # ruleset requires this check, and a silent pass would let an unreviewed
  # change merge.
  review:
    needs: ci-complete
    # !cancelled() replaces the implicit success(). On a job, success() checks
    # every job upstream, transitively, not just `needs`: a call that path
    # filters skipped anywhere above ci-complete would skip this job even
    # though ci-complete passed, and a skipped required check passes, so the
    # change would merge unreviewed. ci-complete's own result is checked below.
    # Dependabot PRs read a separate secret store, so the token check would fail.
    if: |
      !cancelled() &&
      needs.ci-complete.result == 'success' &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: read # to list the head commit's check runs while waiting for them
      contents: write # so the default token can call resolveReviewThread; read would only lose thread auto-resolution
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
      # A failed or timed-out wait fails this job, so the review step below
      # never runs on a red or unfinished change (tools/waitforchecks).
      - name: Wait for every other check on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # This job's own check run would wait on itself.
          EXCLUDE_CHECK: review
        run: go run ./cmd/waitforchecks
      - uses: langwatch/langwatch-pr-review-bot@05d6c298cb28b0f67e2e7fda075b916a0294af5b # main 2026-10-24
        with:
          slack_notify: "false"
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          langwatch_ingest_key: ${{ secrets.LANGWATCH_INGEST_KEY }}

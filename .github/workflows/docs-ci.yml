# Always-run workflow with internal path gating + aggregator. See #3223.
# Branch protection can require `docs-complete` as a single check.
name: docs-ci

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede an outdated run on a PR branch, never on main: every commit
  # that lands on main has to keep its own validation, and cancelling here
  # would let a merge silently void the run for the commit before it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The gate reads no working-tree content: on pull_request events
          # dorny/paths-filter takes the changed-file list from the API, and
          # every file this job needs on disk lives under .github/. Checking
          # out the rest of the tree is pure runner time.
          sparse-checkout: .github
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          filters: |
            relevant:
              - 'docs/**'
              - 'skills/**'
              - '.github/workflows/docs-ci.yml'
              # The docs site ships a copy of the canonical OpenAPI document and
              # generates its api-reference pages from it, so a spec change has
              # to re-run this job or the copy silently falls behind.
              - 'platform/app/src/app/api/openapiLangWatch.json'

  check_links:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for broken links
        run: |
          # Pipe `continue\n` to dismiss any first-run interactive prompt
          # (Mintlify CLI in a fresh CI runner can prompt about config / version
          # before producing output, exiting nonzero from inside $() under
          # `set -eo pipefail` and killing the step before the broken-links
          # report ever runs). `|| true` keeps us from short-circuiting on
          # CLI nonzero; we drive pass/fail purely from the captured output
          # so a real broken-link report still fails the step.
          output=$(printf 'continue\n' | npx mintlify broken-links 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -qi "found.*broken links in"; then
            echo "Broken links detected!"
            exit 1
          fi
          if echo "$output" | grep -qi "no broken links found"; then
            echo "No broken links found"
            exit 0
          fi
          echo "Mintlify CLI did not report success or broken-links — treating as failure."
          exit 1

  check_generated_files:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Shared pnpm + Node setup with pnpm-store caching, so this job stops
      # re-downloading the full langwatch + skills dependency trees on every run.
      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          cache-dependency-path: pnpm-lock.yaml

      # skills/ pulls node-pty, whose postinstall falls back to `node-gyp
      # rebuild` on linux. The composite action above installs node-gyp only
      # when it does the install itself, and here it does not, so it has to be
      # installed explicitly before the install below reaches that lifecycle
      # script — otherwise it ELIFECYCLEs with "node-gyp: not found".
      - name: Install node-gyp (for node-pty postinstall)
        run: npm install -g node-gyp@12.3.0

      # One install for the app and the skills compiler. skills/ used to need
      # `--ignore-workspace` to escape the root workspace it sat inside without
      # being a member of; it is a member now. See ADR-076.
      - name: Install dependencies
        run: >
          pnpm install --frozen-lockfile
          --filter "@langwatch/web..."
          --filter "@langwatch/skills..."

      - name: Regenerate docs/skills pages
        run: bash docs/scripts/sync-prompts.sh

      - name: Regenerate llms.txt
        run: cd docs && node llms.txt.cjs

      # The api-reference pages and their nav are generated from the docs site's
      # copy of the canonical OpenAPI document. Both the copy and the pages used
      # to drift silently, because nothing regenerated them and nothing checked.
      - name: Re-sync the API spec copy and regenerate api-reference pages
        run: cd docs && make sync-api-spec && make generate-api-reference

      - name: Check for stale generated files
        run: |
          STALE=0
          if ! git diff --exit-code \
            docs/skills/directory.mdx docs/skills/pms-and-domain-experts.mdx \
            docs/llms.txt docs/llms-full.txt \
            docs/api-reference/openapiLangWatch.json docs/docs.json; then
            STALE=1
          fi
          # A newly documented endpoint shows up as an untracked page, which a
          # diff of tracked files cannot see.
          UNTRACKED=$(git ls-files --others --exclude-standard docs/api-reference)
          if [ -n "$UNTRACKED" ]; then
            echo ""
            echo "ERROR: these api-reference pages are generated but not committed:"
            echo "$UNTRACKED"
            STALE=1
          fi
          if [ "$STALE" = "1" ]; then
            echo ""
            echo "ERROR: Generated files are stale. Please run:"
            echo "  bash docs/scripts/sync-prompts.sh"
            echo "  cd docs && node llms.txt.cjs"
            echo "  cd docs && make sync-api-spec && make generate-api-reference"
            echo "Then commit the updated files."
            exit 1
          fi

  docs-complete:
    needs: [changes, check_links, check_generated_files]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: check_links, check_generated_files

# Always-run workflow with internal path gating + aggregator. See #3223.
# Branch protection can require `docs-complete` as a single check.
name: docs-ci

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review is NOT a default pull_request activity type. Without
    # it, taking a PR out of draft fires no event at all, so the jobs gated
    # on `heavy` below would never get their first non-draft run.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

# No job here writes anything. Declared explicitly rather than inherited,
# because this workflow installs an npm dependency tree and runs it: if the
# repository default is ever flipped to write, that would silently hand those
# jobs a write token. go-ci.yaml and langwatch-app-ci.yml do the same.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede an outdated run on a PR branch, never on main: every commit
  # that lands on main has to keep its own validation, and cancelling here
  # would let a merge silently void the run for the commit before it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      # Draft PRs keep the cheap signal and release the runner slots;
      # everything heavy returns on ready_for_review and in the merge queue.
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The gate reads no working-tree content: on pull_request events
          # dorny/paths-filter takes the changed-file list from the API, and
          # every file this job needs on disk lives under .github/. Checking
          # out the rest of the tree is pure runner time.
          sparse-checkout: .github
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          filters: |
            relevant:
              - 'docs/**'
              - 'skills/**'
              - '.github/workflows/docs-ci.yml'
              # The docs site ships a copy of the canonical OpenAPI document and
              # generates its api-reference pages from it, so a spec change has
              # to re-run this job or the copy silently falls behind.
              - 'platform/app/src/app/api/openapiLangWatch.json'
              # The structure checker and the rules it applies.
              - 'pkg/docsscan/**'
              - 'tools/docscheck/**'
              - 'cmd/docscheck/**'
              - 'go.mod'
              - 'go.sum'
              # docscheck holds the release the docs name against the chart's
              # appVersion, so bumping the chart without touching the docs is
              # exactly the drift this job has to catch.
              - 'charts/langwatch/Chart.yaml'
              # check_generated_files installs with --frozen-lockfile, and both
              # composites below shape how these jobs run — detect-changes is
              # the gate itself, so a change to it must re-run the gate.
              - 'pnpm-lock.yaml'
              - '.github/actions/setup-pnpm-node/**'
              - '.github/actions/detect-changes/**'

  check_links:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The CLI refuses to run on Node >= 25 and on < 20.17, and this job would
      # otherwise use whatever the runner image ships — so the next image bump
      # would red every docs PR with nothing in the repo having changed. 24 is
      # what .github/actions/setup-pnpm-node pins for the sibling job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      # `mint` is the CLI. `mintlify` is the same package at the same version,
      # and Mintlify's install docs say to remove it if both are present, so
      # this pins the name that is going to keep existing.
      #
      # --ignore-scripts because the dependency tree reaches puppeteer, whose
      # postinstall downloads a Chrome build that none of validate, broken-links
      # or a11y needs.
      #
      # The pin covers the CLI, not everything it runs: `mint validate` fetches
      # the current Mintlify build client at run time (releases.mintlify.com,
      # unpinned, no checksum), so an upstream client release can still change
      # this step's behaviour, and an outage there fails it. Pinning the client
      # is possible only through an undocumented hidden flag, so this accepts
      # the exposure rather than depending on unsupported surface.
      - name: Install the Mintlify CLI
        run: npm install -g --ignore-scripts mint@4.2.788

      # Strict mode: exits non-zero on warnings as well as errors, and
      # validates the OpenAPI documents docs.json references. Replaces a shell
      # wrapper that swallowed the exit code and decided pass/fail by grepping
      # the CLI's console prose for "no broken links found" — so a change to
      # that wording, or any new failure mode, read as green.
      - name: Validate the build
        run: mint validate

      # The three --check flags are all off by default, which is why a redirect
      # that pointed at another redirect's source survived in docs.json. Anchor
      # checking stays off deliberately: it currently reports 47 pre-existing
      # broken heading anchors, and turning it on here would gate every PR on
      # that backlog. Run `mint broken-links --check-anchors` to see it.
      - name: Check for broken links
        run: mint broken-links --check-redirects --check-snippets

      # We ship 52 <Frame> images and a lot of generated tables; a11y regressions
      # are invisible in review. Non-blocking for now — it reports a baseline
      # nobody has triaged, and a gate nobody can pass gets deleted.
      #
      # Exit 1 means "issues found", which is the baseline we are choosing not
      # to gate on. Anything else means the check did not run — CLI missing
      # (127), OOM-killed (137), a crash — and that must not read as the same
      # warning, or the day it stops checking looks identical to today.
      - name: Check accessibility
        run: |
          set +e
          mint a11y
          code=$?
          set -e
          case "$code" in
            0) ;;
            1) echo "::warning::mint a11y reported issues (not gating)" ;;
            *) echo "::error::mint a11y did not run (exit $code)"; exit 1 ;;
          esac

  # Structural rules the Mintlify CLI does not have: a page that exists but is
  # in no navigation group is still served at its URL, so nothing upstream
  # reports it, and `--check-redirects` validates a destination without
  # noticing it is another redirect's source.
  check_structure:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check docs structure
        run: go run ./cmd/docscheck

  check_prose:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The check reads docs written in the pull request and prints them in a
      # ::error annotation, which GitHub reads as a workflow command. This
      # proves the values are encoded before they reach one.
      - name: Check the prose script encodes its annotations
        run: bash docs/scripts/check-docs-prose.test.sh

      - name: Check docs prose for banned words
        run: bash docs/scripts/check-docs-prose.sh
        env:
          DOCS_PROSE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}

  check_generated_files:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Shared pnpm + Node setup with pnpm-store caching, so this job stops
      # re-downloading the full langwatch + skills dependency trees on every run.
      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          cache-dependency-path: pnpm-lock.yaml

      # skills/ pulls node-pty, whose postinstall falls back to `node-gyp
      # rebuild` on linux. The composite action above installs node-gyp only
      # when it does the install itself, and here it does not, so it has to be
      # installed explicitly before the install below reaches that lifecycle
      # script — otherwise it ELIFECYCLEs with "node-gyp: not found".
      - name: Install node-gyp (for node-pty postinstall)
        run: npm install -g node-gyp@12.3.0

      # One install for the app and the skills compiler. skills/ used to need
      # `--ignore-workspace` to escape the root workspace it sat inside without
      # being a member of; it is a member now. See ADR-076.
      - name: Install dependencies
        run: >
          pnpm install --frozen-lockfile
          --filter "@langwatch/web..."
          --filter "@langwatch/skills..."

      - name: Regenerate docs/skills pages
        run: bash docs/scripts/sync-prompts.sh

      - name: Regenerate llms.txt
        run: cd docs && node llms.txt.cjs

      # The api-reference pages and their nav are generated from the docs site's
      # copy of the canonical OpenAPI document. Both the copy and the pages used
      # to drift silently, because nothing regenerated them and nothing checked.
      - name: Re-sync the API spec copy and regenerate api-reference pages
        run: cd docs && make sync-api-spec && make generate-api-reference

      - name: Check for stale generated files
        run: |
          STALE=0
          if ! git diff --exit-code \
            docs/skills/directory.mdx docs/skills/pms-and-domain-experts.mdx \
            docs/llms.txt docs/llms-full.txt \
            docs/api-reference/openapiLangWatch.json docs/docs.json; then
            STALE=1
          fi
          # A newly documented endpoint shows up as an untracked page, which a
          # diff of tracked files cannot see.
          UNTRACKED=$(git ls-files --others --exclude-standard docs/api-reference)
          if [ -n "$UNTRACKED" ]; then
            echo ""
            echo "ERROR: these api-reference pages are generated but not committed:"
            echo "$UNTRACKED"
            STALE=1
          fi
          if [ "$STALE" = "1" ]; then
            echo ""
            echo "ERROR: Generated files are stale. Please run:"
            echo "  bash docs/scripts/sync-prompts.sh"
            echo "  cd docs && node llms.txt.cjs"
            echo "  cd docs && make sync-api-spec && make generate-api-reference"
            echo "Then commit the updated files."
            exit 1
          fi

  docs-complete:
    needs: [changes, check_links, check_structure, check_prose, check_generated_files]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: check_links, check_structure, check_prose, check_generated_files

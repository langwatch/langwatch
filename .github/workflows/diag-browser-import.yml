name: diag-browser-import (throwaway)

on:
  pull_request:
    paths:
      - ".github/workflows/diag-browser-import.yml"
      - ".github/diag/**"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        leg: [alone, loaded, shard8]
    env:
      CI: "true"
      BUILD_TIME: "true"
      DIAG_BROWSER_HTTP: "1"
      VITEST_PW_DEBUG: "1"
      DEBUG: "vite:deps,vitest:browser:*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "all"
      - uses: ./.github/actions/prepare-generated-files
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(grep -m1 -oE '^  playwright@[0-9][^:]*' pnpm-lock.yaml | cut -d@ -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Patch the Playwright provider with request logging
        run: node .github/diag/patch-playwright.cjs
      - name: Alone
        if: matrix.leg == 'alone'
        run: |
          set +e
          fails=0
          for i in 1 2 3 4; do
            for pkg in @langwatch/user-browser @langwatch/project-browser @langwatch/navigation-browser; do
              echo "::group::$pkg run $i"
              pnpm --filter "$pkg" run test:browser 2>&1 | grep -v "vite:deps.*->" ; rc=${PIPESTATUS[0]}
              echo "::endgroup::"
              echo "RESULT $pkg run $i rc=$rc"
              [ "$rc" = 0 ] || fails=$((fails+1))
            done
          done
          echo "FAILS=$fails"
      - name: Loaded
        if: matrix.leg == 'loaded'
        run: |
          set +e
          ( while true; do pnpm --filter @langwatch/langy-browser exec vitest run >/dev/null 2>&1; done ) &
          ( while true; do pnpm --filter @langwatch/trace-browser exec vitest run >/dev/null 2>&1; done ) &
          sleep 20
          fails=0
          for i in 1 2 3 4; do
            for pkg in @langwatch/user-browser @langwatch/project-browser @langwatch/navigation-browser; do
              echo "::group::$pkg run $i"
              pnpm --filter "$pkg" run test:browser 2>&1 | grep -v "vite:deps.*->" ; rc=${PIPESTATUS[0]}
              echo "::endgroup::"
              echo "RESULT $pkg run $i rc=$rc"
              [ "$rc" = 0 ] || fails=$((fails+1))
            done
          done
          echo "FAILS=$fails"
          kill %1 %2 || true
      - name: Shard 8 of the failing run
        if: matrix.leg == 'shard8'
        env:
          PACKAGE_SUITES_SHARD: "8/8"
          PACKAGE_SUITES_CONCURRENCY: "2"
          DEBUG: ""
        run: |
          export PACKAGE_SUITES_ONLY="$(cat .github/diag/only.json)"
          node --experimental-strip-types .github/scripts/run-package-suites.ts || true

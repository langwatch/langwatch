name: publish-docker-app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (default: "next")'
        required: false
        default: "next"

# A publish run drains — the reasoning is spelled out in prerelease-charts-oci.
# Re-running a release (or dispatching the same tag twice) otherwise has two
# runs pushing one image tag and signing whichever digest won, and a cancel
# between `docker push` and `cosign sign` leaves an unsigned image in the
# registry that reports "cancelled" rather than failed, so nothing retries it.
concurrency:
  group: publish-docker-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-version:
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.event.release.tag_name, 'langwatch@')
      || github.event_name == 'workflow_dispatch'
    outputs:
      short_hash: ${{ steps.extract_version.outputs.short_hash }}
      version: ${{ steps.extract_version.outputs.version }}
      is_release: ${{ steps.extract_version.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Extract version and short hash
        id: extract_version
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "short_hash=${SHORT_HASH}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION=${GITHUB_REF#refs/tags/langwatch@v}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT

            # Draft releases must use a semver prerelease suffix (e.g., 1.0.0-rc.1) or "next"
            if [ "${{ github.event.release.draft }}" = "true" ]; then
              if [ "${VERSION}" != "next" ] && ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-.+'; then
                echo "::error::Draft releases require a semver prerelease suffix (e.g., 1.0.0-rc.1) or 'next'"
                exit 1
              fi
            fi
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      # A release image must name itself its release (specs/upgrade/release-manifests.feature);
      # without its manifest it reports a development build and records no release.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.extract_version.outputs.is_release == 'true'
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: steps.extract_version.outputs.is_release == 'true'
        with:
          node-version: "24.22.1"
      - name: Check the release manifest
        if: steps.extract_version.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "${VERSION} is a prerelease: no manifest names it"; exit 0
          fi
          CI=true pnpm install --frozen-lockfile --filter "@langwatch/upgrade..."
          node --disable-warning=ExperimentalWarning --experimental-transform-types \
            packages/upgrade/scripts/check-release-manifest.ts --release "${VERSION}"

  build-and-push:
    needs: extract-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: langwatch
            dockerfile: infra/docker/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - image: langwatch
            dockerfile: infra/docker/Dockerfile
            platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
            arch: arm64
          - image: langwatch_nlp
            dockerfile: infra/docker/Dockerfile.go-services
            target: nlp
            cache: go
            platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - image: langwatch_nlp
            dockerfile: infra/docker/Dockerfile.go-services
            target: nlp
            cache: go
            platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
            arch: arm64
          - image: langevals
            dockerfile: infra/docker/Dockerfile.langevals
            platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - image: langevals
            dockerfile: infra/docker/Dockerfile.langevals
            platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
            arch: arm64
          - image: ai-gateway
            dockerfile: infra/docker/Dockerfile.go-services
            target: gateway
            cache: go
            platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - image: ai-gateway
            dockerfile: infra/docker/Dockerfile.go-services
            target: gateway
            cache: go
            platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
            arch: arm64
          - image: langyagent
            dockerfile: infra/docker/Dockerfile.langyagent
            platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - image: langyagent
            dockerfile: infra/docker/Dockerfile.langyagent
            platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} (${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: ${{ matrix.platform }}
          # ai-gateway and langwatch_nlp share one scope: both are targets of
          # Dockerfile.go-services over the same go-build and sandbox stages.
          cache-from: type=gha,scope=${{ matrix.cache || matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ matrix.cache || matrix.image }}-${{ matrix.arch }}
          # The Go images stamp this into main.Version, which every log line and
          # the OTel resource report. Dockerfile.go-services reads VERSION,
          # langyagent reads SERVICE_VERSION; the other images ignore both.
          build-args: |
            VERSION=${{ needs.extract-version.outputs.version || format('git-{0}', needs.extract-version.outputs.short_hash) }}
            SERVICE_VERSION=${{ needs.extract-version.outputs.version || format('git-{0}', needs.extract-version.outputs.short_hash) }}
            LANGWATCH_BUILD_COMMIT=${{ github.sha }}
          tags: |
            langwatch/${{ matrix.image }}:${{ needs.extract-version.outputs.short_hash }}-${{ matrix.arch }}

  create-manifest:
    runs-on: ubuntu-latest
    needs: [extract-version, build-and-push]

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifests (short hash)
        run: |
          HASH="${{ needs.extract-version.outputs.short_hash }}"
          for IMAGE in langwatch langwatch_nlp langevals ai-gateway langyagent; do
            docker buildx imagetools create -t langwatch/${IMAGE}:${HASH} \
              langwatch/${IMAGE}:${HASH}-amd64 \
              langwatch/${IMAGE}:${HASH}-arm64
          done

      - name: Create multi-arch manifests (custom tag)
        if: needs.extract-version.outputs.is_release != 'true'
        env:
          TAG: ${{ inputs.tag || 'next' }}
          HASH: ${{ needs.extract-version.outputs.short_hash }}
        run: |
          for IMAGE in langwatch langwatch_nlp langevals ai-gateway langyagent; do
            docker buildx imagetools create -t langwatch/${IMAGE}:${TAG} \
              langwatch/${IMAGE}:${HASH}-amd64 \
              langwatch/${IMAGE}:${HASH}-arm64
          done

      - name: Create multi-arch manifests (version + latest)
        if: needs.extract-version.outputs.is_release == 'true'
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          HASH="${{ needs.extract-version.outputs.short_hash }}"

          for IMAGE in langwatch langwatch_nlp langevals ai-gateway langyagent; do
            # Version tag
            docker buildx imagetools create -t langwatch/${IMAGE}:${VERSION} \
              langwatch/${IMAGE}:${HASH}-amd64 \
              langwatch/${IMAGE}:${HASH}-arm64

            # Latest tag (skip for prerelease versions with a hyphen suffix)
            if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-.+'; then
              docker buildx imagetools create -t langwatch/${IMAGE}:latest \
                langwatch/${IMAGE}:${HASH}-amd64 \
                langwatch/${IMAGE}:${HASH}-arm64
            fi
          done

      - name: Delete temporary architecture-specific tags
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          HASH="${{ needs.extract-version.outputs.short_hash }}"
          for IMAGE in langwatch langwatch_nlp langevals ai-gateway langyagent; do
            for ARCH in amd64 arm64; do
              curl -s -X DELETE \
                -H "Authorization: JWT ${TOKEN}" \
                "https://hub.docker.com/v2/repositories/langwatch/${IMAGE}/tags/${HASH}-${ARCH}/"
            done
          done

  sign-and-attest:
    runs-on: ubuntu-latest
    needs: [extract-version, create-manifest]
    permissions:
      contents: write # upload SBOMs to GitHub release assets
      id-token: write # keyless OIDC signing via Sigstore
    env:
      COSIGN_YES: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          # Pin to cosign 2.x. cosign 3.x defaults to the new bundle format (OCI 1.1
          # referrers), which Docker Hub does not reliably serve, so cosign verify
          # reports "no signatures found" immediately after a successful cosign sign.
          # The 2.x line writes the tag-based signature format Docker Hub supports.
          cosign-release: v2.6.3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign manifests and attach per-platform CycloneDX SBOMs
        env:
          HASH: ${{ needs.extract-version.outputs.short_hash }}
          IS_RELEASE: ${{ needs.extract-version.outputs.is_release }}
          VERSION: ${{ needs.extract-version.outputs.version }}
          CERT_IDENTITY_REGEX: ^https://github\.com/langwatch/langwatch/
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          mkdir -p sboms
          # Release tags (VERSION + optionally latest) and the HASH tag should all point
          # at the same multi-arch manifest digest; sign-image.sh asserts this and signs
          # any tag whose digest drifted rather than leaving it unsigned.
          EXTRA_TAGS=""
          if [ "${IS_RELEASE}" = "true" ]; then
            EXTRA_TAGS="${VERSION}"
            if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-.+'; then
              EXTRA_TAGS="${EXTRA_TAGS} latest"
            fi
          fi
          for IMAGE in langwatch langwatch_nlp langevals ai-gateway langyagent; do
            REPO="langwatch/${IMAGE}" \
            IMAGE_NAME="${IMAGE}" \
            INSPECT_TAG="${HASH}" \
            SBOM_DIR="sboms" \
            EXTRA_TAGS="${EXTRA_TAGS}" \
            CERT_IDENTITY_REGEX="${CERT_IDENTITY_REGEX}" \
            CERT_OIDC_ISSUER="${CERT_OIDC_ISSUER}" \
            bash .github/scripts/sign-image.sh
          done

      - name: Upload SBOMs as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms-${{ needs.extract-version.outputs.short_hash }}
          path: sboms/*.cdx.json
          retention-days: 90

      - name: Attach SBOMs to GitHub release
        if: needs.extract-version.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" sboms/*.cdx.json --clobber --repo "${GITHUB_REPOSITORY}"

  # The PII redaction model's code is private: langwatch-saas pushes its plain
  # image for amd64 and arm64 to the artifacts ECR as http-git-<sha> (DECISIONS
  # 4.10 there). A release copies the newest one unchanged, then signs it like
  # the images above. Spec: specs/ci/pii-redaction-model-release.feature
  pii-redaction-model:
    runs-on: ubuntu-latest
    needs: [extract-version]
    if: needs.extract-version.outputs.is_release == 'true'
    # The workflow group above is per ref, so two releases could overlap and an
    # older run could move latest back after a newer one. One group for every
    # release run makes them take turns. Trade-off: GitHub keeps one waiting run
    # per group, so a third release queued meanwhile cancels the waiting one
    # before it starts. That release then needs a re-run, and its chart release
    # waits for it. A wrong latest, by contrast, would go unnoticed.
    concurrency:
      group: publish-pii-redaction-model-latest
      cancel-in-progress: false
    permissions:
      contents: write # upload the SBOMs to the release
      id-token: write # AWS OIDC and keyless signing via Sigstore
    env:
      AWS_REGION: eu-central-1
      COSIGN_YES: "true"
      REPO: langwatch/pii-redaction-model
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go for cmd/newestimage
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"

      # langwatch-oss-pii-model-reader trusts only this workflow on a langwatch@v
      # tag, and may only read langwatch-pii-redaction-model. It lives in the
      # artifacts account, which ARTIFACTS_ECR_OIDC_ROLE_ARN names, so the
      # account id stays in that secret, as in publish-docker-ecr.yml.
      - name: Name the role and the registry
        id: account
        env:
          ARTIFACTS_ROLE_ARN: ${{ secrets.ARTIFACTS_ECR_OIDC_ROLE_ARN }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "${ARTIFACTS_ROLE_ARN}" | cut -d: -f5)"
          echo "::add-mask::${ACCOUNT_ID}"
          echo "role=arn:aws:iam::${ACCOUNT_ID}:role/langwatch-oss-pii-model-reader" >> "$GITHUB_OUTPUT"
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ steps.account.outputs.role }}
          role-session-name: publish-pii-redaction-model-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        env:
          REGISTRY: ${{ steps.account.outputs.registry }}
        run: |
          set -euo pipefail
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${REGISTRY}"

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A re-run (this job fails until langwatch-saas has pushed an image) must
      # not move the version to a newer model build: the version keeps the
      # image it was first published and signed with. Any answer other than
      # "not found" fails, so an outage never looks like a first run.
      - name: Look for the image this release already published
        id: released
        run: |
          set -euo pipefail
          if digest="$(docker buildx imagetools inspect "${REPO}:${VERSION}" --format '{{.Manifest.Digest}}' 2>inspect.err)"; then
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          elif grep -q ': not found' inspect.err; then
            echo "digest=" >> "$GITHUB_OUTPUT"
          else
            cat inspect.err >&2
            exit 1
          fi

      - name: Pick the newest model image, or the one already published
        id: pick
        env:
          RELEASED: ${{ steps.released.outputs.digest }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          aws ecr describe-images --repository-name langwatch-pii-redaction-model \
            --filter tagStatus=TAGGED --output json \
            | go run ./cmd/newestimage -prefix http-git- -released "${RELEASED}" > pick.out
          cat pick.out >> "$GITHUB_OUTPUT"
          # Self-hosters run both chip types: look inside the index.
          if [ -z "${RELEASED}" ]; then
            DIGEST="$(sed -n 's/^digest=//p' pick.out)"
            docker buildx imagetools inspect --raw "${REGISTRY}/langwatch-pii-redaction-model@${DIGEST}" \
              | go run ./cmd/newestimage -platforms linux/amd64,linux/arm64
          fi

      # latest moves only for the highest published langwatch@v release, never
      # a draft or prerelease. So a re-run of an older release, after a newer
      # one shipped, leaves latest on the newer image. GitHub's own "latest
      # release" will not do: other packages (python-sdk@v...) release here too.
      - name: Decide whether this release moves latest
        id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          NEWEST_TAG="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -E '^langwatch@v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "${NEWEST_TAG}" = "${RELEASE_TAG}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      # By digest, so the copy is the index ECR holds, byte for byte.
      - name: Copy it to Docker Hub as the release
        env:
          SOURCE: ${{ steps.ecr.outputs.registry }}/langwatch-pii-redaction-model@${{ steps.pick.outputs.digest }}
          DIGEST: ${{ steps.pick.outputs.digest }}
          REUSED: ${{ steps.pick.outputs.reused }}
          TAG: ${{ steps.pick.outputs.tag }}
          NEWEST: ${{ steps.newest.outputs.latest }}
        run: |
          set -euo pipefail
          if [ "${REUSED}" != "true" ]; then
            echo "Copying ${TAG} as ${REPO}:${VERSION}"
            docker buildx imagetools create -t "${REPO}:${VERSION}" "${SOURCE}"
          else
            echo "${REPO}:${VERSION} already holds ${DIGEST}; a re-run keeps it"
          fi
          if [ "${NEWEST}" = "true" ]; then
            docker buildx imagetools create -t "${REPO}:latest" "${REPO}@${DIGEST}"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          # 2.x for Docker Hub; see the note in sign-and-attest.
          cosign-release: v2.6.3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      - name: Sign it and attach a CycloneDX SBOM per platform
        env:
          CERT_IDENTITY_REGEX: ^https://github\.com/langwatch/langwatch/
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
          NEWEST: ${{ steps.newest.outputs.latest }}
        run: |
          set -euo pipefail
          mkdir -p sboms
          EXTRA_TAGS=""
          if [ "${NEWEST}" = "true" ]; then
            EXTRA_TAGS="latest"
          fi
          IMAGE_NAME="pii-redaction-model" \
          INSPECT_TAG="${VERSION}" \
          SBOM_DIR="sboms" \
          EXTRA_TAGS="${EXTRA_TAGS}" \
          bash .github/scripts/sign-image.sh

      - name: Attach SBOMs to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" sboms/*.cdx.json --clobber --repo "${GITHUB_REPOSITORY}"

  notify:
    runs-on: ubuntu-latest
    needs: [extract-version, create-manifest, sign-and-attest, pii-redaction-model]
    if: needs.extract-version.outputs.is_release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Notify Slack
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
        run: |
          bash .github/scripts/notify-slack-release.sh \
            CHANGELOG.md \
            "LangWatch" \
            "${{ needs.extract-version.outputs.version }}"

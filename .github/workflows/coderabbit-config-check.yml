name: coderabbit-config-check

# Proves the semgrep ruleset CodeRabbit loads actually works, so no rule can
# silently go dead again (see #3754: the ruleset failed to parse and nothing
# noticed). The ruleset must validate AND the PII rule must still match its
# fixture. semgrep is PINNED — rule matching is version-sensitive; bump the pin
# deliberately (with the Makefile's SEMGREP_VERSION) and re-run the check.
on:
  pull_request:
    paths:
      - ".coderabbit.yaml"
      - "dev/lint/**"
      - ".github/workflows/coderabbit-config-check.yml"

concurrency:
  group: coderabbit-config-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are SHA-pinned (langwatch org policy requires full-SHA pins;
      # tag refs like @v4 fail to start). Same SHAs other repo workflows use.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false # read-only job, no git ops — don't persist the token

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pinned semgrep
        run: pip install "semgrep==1.164.0" "pyyaml>=6"

      - name: semgrep ruleset validates
        run: semgrep --validate --config dev/lint/semgrep/langwatch.yml

      - name: semgrep PII rule still matches its fixture (guard vs silent death)
        run: |
          python3 -c "import yaml; d=yaml.safe_load(open('dev/lint/semgrep/langwatch.yml')); r=next(x for x in d['rules'] if x['id']=='pii-in-logger-call'); r.pop('paths', None); yaml.safe_dump({'rules':[r]}, open('/tmp/pii_only.yml','w'))"
          n=$(semgrep --config /tmp/pii_only.yml dev/lint/semgrep/tests/pii-in-logger-call.ts --json --quiet | python3 -c "import sys, json; print(len(json.load(sys.stdin)['results']))")
          echo "pii-in-logger-call matched $n line(s) in the fixture (expect 4)"
          # 4, not 5: the userId case was removed when identifiers were made
          # explicitly loggable. The fixture still contains userId,
          # organizationId and projectId lines as `ok:` cases, so re-adding an
          # identifier pattern to the rule pushes this count back above 4 and
          # fails here rather than quietly reinstating the false positive.
          test "$n" -eq 4

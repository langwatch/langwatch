# Always-run workflow with internal path gating and one aggregator (see #3223).
# Branch protection can require `docs-site-complete` as a single check: it
# runs on every event, and passes when the docs jobs passed or were skipped
# because nothing they cover changed.
#
# Shape: `changes` gates; `verify` (typecheck, lint, unit tests) and `build` (the
# site at the root and under /docs, uploaded once) run in parallel; the
# browser and link checks, and the audit, download the build instead of
# rebuilding it. On main, `deploy` publishes the /docs build once the checks pass.
name: docs-site

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not a default activity type; without it taking a PR
    # out of draft fires no event at all.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  # Never on main: every merged commit keeps its own audit run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          filters: |
            relevant:
              - 'docs/**'
              - 'apps/docs/**'
              # Every workspace package `@langwatch/docs-site...` reaches: the
              # typecheck below is the only one that covers the docs app.
              - 'packages/design-system/**'
              - 'packages/design-system-internal/**'
              - 'packages/handled-error/**'
              - 'packages/observability/**'
              - 'packages/time/**'
              - 'packages/vitest-config/**'
              - 'sdks/typescript/**'
              - 'dev/tests/e2e-stack/**'
              - 'packages/oxlint-rules/**'
              - 'packages/architecture-enforcer/oxlint.architecture.jsonc'
              - 'packages/architecture-enforcer/oxlint-plugin.mjs'
              - '.oxlintrc*.jsonc'
              - 'CHANGELOG.md'
              - '.gitattributes'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/docs-site.yml'
              - 'cmd/docsdeploy/**'
              - 'tools/docsdeploy/**'
              - '.github/actions/setup-pnpm-node/**'
              - '.github/actions/nx-cache/**'
              - '.github/actions/detect-changes/**'

  verify:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/docs-site... @langwatch/architecture-enforcer... @langwatch/workspace"
      # The typecheck's references reach observability, which imports the built
      # SDK, so build it first (the workspace root install brings Nx).
      - uses: ./.github/actions/nx-cache
        with:
          suffix: docs-site
      - name: Build the TypeScript SDK
        run: pnpm exec nx run langwatch:build --outputStyle=static
      - name: Typecheck the docs app
        run: pnpm --filter @langwatch/docs-site typecheck
      # Every rule, the langwatch plugin's app-feature-layout included, over the docs app alone.
      # 0 turns off oxlint's local slot queue on a runner only this job uses.
      - name: Lint the docs app
        env:
          LANGWATCH_LINT_SLOTS: "0"
        run: pnpm exec oxlint --quiet --type-aware --config .oxlintrc.jsonc apps/docs
      - name: Test docs generation and local routing
        run: VITEST_MAX_WORKERS=2 pnpm --filter @langwatch/docs-site test

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # A cold media cache encodes every image and video (about 8 minutes), then the
    # 340 MB artifact uploads; warm runs finish well inside this.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Root: what the browser, performance and link checks read.
          - mount: root
            build-args: ""
            artifact: docs-site
          # Under /docs: the production address, which the audit reads.
          - mount: docs
            build-args: --base-path /docs
            artifact: docs-site-mounted
    name: build (${{ matrix.mount }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The /docs build on main is the one deployed: the sitemap dates each
          # page from git history, and a shallow clone yields no dates.
          fetch-depth: ${{ matrix.mount == 'docs' && github.ref == 'refs/heads/main' && '0' || '1' }}
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/docs-site..."
      - name: Restore content-addressed docs caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/node_modules/.cache/docs-site
          key: docs-site-${{ matrix.mount }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            docs-site-${{ matrix.mount }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Encoded images and videos, keyed on the media and the encoders' settings alone, so a
      # docs-only change never re-encodes; the build prunes entries it no longer uses.
      - name: Restore the encoded docs media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/node_modules/.cache/docs-media
          key: docs-media-${{ runner.os }}-${{ hashFiles('docs/images/**', 'docs/media/**', 'apps/docs/src/site/image-variants.ts', 'apps/docs/src/site/video-variants.ts') }}
          restore-keys: |
            docs-media-${{ runner.os }}-
      # The build transcodes the docs videos to AV1 and H.264 (src/site/video-variants.ts).
      # A stalled Ubuntu mirror once held this for 30 minutes: retry stalled
      # connections, and fail fast enough to rerun.
      - name: Install ffmpeg
        timeout-minutes: 10
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          command -v ffmpeg || {
            sudo apt-get $APT_OPTS update
            sudo apt-get $APT_OPTS install -y --no-install-recommends ffmpeg
          }
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(grep -m1 -oE '^  playwright@[0-9][^:]*' pnpm-lock.yaml | cut -d@ -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Install build browser
        timeout-minutes: 10
        run: pnpm --filter @langwatch/docs-site exec playwright install --with-deps chromium
      - name: Build the documentation
        run: pnpm --filter @langwatch/docs-site build ${{ matrix.build-args }}
      - name: Enforce the browser size budget
        if: matrix.mount == 'root'
        run: pnpm --filter @langwatch/docs-site size
      - name: Check the deployed build dates its pages
        if: matrix.mount == 'docs' && github.ref == 'refs/heads/main'
        run: grep -q '<lastmod>' apps/docs/dist/sitemap.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: apps/docs/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: smoke
            name: Test the built site
            script: test:smoke
            artifact: docs-site
            browser: true
          - check: performance
            name: Test static reading and navigation
            script: test:performance
            artifact: docs-site
            browser: true
          - check: assets
            name: Test font swaps, preloads and drawn wheel names
            script: test:assets
            artifact: docs-site
            browser: true
          - check: agent-controls
            name: Test agent setup controls, skill actions and the agent wheel
            script: test:agent-controls
            artifact: docs-site
            browser: true
          - check: code-preference
            name: Test code language choice, filenames and theme images
            script: test:code-preference
            artifact: docs-site
            browser: true
          - check: layout
            name: Test page layout across widths and themes
            script: test:layout
            artifact: docs-site
            browser: true
          - check: polish
            name: Test reading polish
            script: test:polish
            artifact: docs-site
            browser: true
          - check: news
            name: Test the release strip
            script: test:news
            artifact: docs-site
            browser: true
          - check: refinement
            name: Test reading refinements
            script: test:refinement
            artifact: docs-site
            browser: true
          - check: mount
            name: Test the docs mount behind haven
            script: test:mount --out-dir dist --base-path /docs
            artifact: docs-site-mounted
            browser: true
            haven: true
          - check: links
            name: Check internal links
            # The production mount, so the URL ledger is checked at /docs.
            script: test:links --base-path /docs
            artifact: docs-site-mounted
            browser: false
    name: check (${{ matrix.check }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/docs-site..."
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: apps/docs/dist
      - name: Read the Playwright version
        if: matrix.browser
        id: playwright
        run: |
          version=$(grep -m1 -oE '^  playwright@[0-9][^:]*' pnpm-lock.yaml | cut -d@ -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        if: matrix.browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Install the test browser
        if: matrix.browser
        run: pnpm --filter @langwatch/docs-site exec playwright install --with-deps chromium
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.haven
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - name: Build haven
        if: matrix.haven
        run: |
          go build -o "$RUNNER_TEMP/haven" ./cmd/haven
          echo "DOCS_HAVEN_BINARY=$RUNNER_TEMP/haven" >> "$GITHUB_ENV"
      - name: ${{ matrix.name }}
        run: pnpm --filter @langwatch/docs-site ${{ matrix.script }}
      - name: Upload the layout screenshots
        if: failure() && matrix.check == 'layout'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-layout-shots
          path: apps/docs/layout-shots
          retention-days: 7

  # Lighthouse on representative pages against budgets, one device per runner
  # so the two never share a CPU; static search and agent checks run once.
  audit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - form-factor: mobile
            extra-args: ""
          - form-factor: desktop
            extra-args: --skip-static
    name: audit (${{ matrix.form-factor }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/docs-site..."
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site-mounted
          path: apps/docs/dist
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(grep -m1 -oE '^  playwright@[0-9][^:]*' pnpm-lock.yaml | cut -d@ -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Install the audit browser
        run: pnpm --filter @langwatch/docs-site exec playwright install --with-deps chromium
      # Three runs per page, judged on the median, at two at a time on the
      # runner's four cores: one slow run neither passes nor fails a page.
      - name: Audit performance, accessibility, search and agent readiness
        run: >-
          pnpm --filter @langwatch/docs-site test:audit
          --out-dir dist --base-path /docs
          --form-factors ${{ matrix.form-factor }} --runs 3 --concurrency 2
          --report-dir "$RUNNER_TEMP/docs-audit" --summary "$GITHUB_STEP_SUMMARY"
          --lhr ${{ matrix.extra-args }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: docs-audit-${{ matrix.form-factor }}
          path: ${{ runner.temp }}/docs-audit
          if-no-files-found: ignore
          retention-days: 7

  # On main, once the checks pass: the /docs build to the docs bucket, the
  # redirects to the edge, one invalidation. The role trusts only this workflow
  # on main (langwatch-saas infrastructure/docs-site.tf); until its variables
  # are set, the job is skipped. Spec: specs/ci/docs-deploy.feature
  deploy:
    needs: [changes, verify, build, check]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.relevant == 'true'
      && vars.DOCS_SITE_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time, in order; a newer commit's waits for the one running.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC assume-role into the docs account
    env:
      AWS_REGION: eu-central-1
      BUCKET: ${{ vars.DOCS_SITE_BUCKET }}
      DISTRIBUTION: ${{ vars.DOCS_SITE_DISTRIBUTION_ID }}
      SITE: apps/docs/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site-mounted
          path: ${{ env.SITE }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.DOCS_DEPLOY_ROLE_ARN }}
          role-session-name: docs-deploy-${{ github.run_id }}
      # Cache-Control by file name: a content hash in the name is immutable;
      # pages, indexes and exports revalidate; other static files keep an hour.
      # Hashed files go first and are never deleted, so a page still open in a
      # tab loads its scripts; pages go last, so none names a missing file.
      - name: Upload the content-hashed files
        run: >-
          aws s3 sync "$SITE" "s3://$BUCKET/docs/" --only-show-errors
          --exclude '*' --include 'assets/*' --include '*.????????????.*'
          --cache-control 'public, max-age=31536000, immutable'
      - name: Upload the other static files
        run: >-
          aws s3 sync "$SITE" "s3://$BUCKET/docs/" --only-show-errors --delete
          --exclude 'assets/*' --exclude '*.????????????.*' --exclude '.vite/*'
          --exclude '*.br' --exclude '*.gz' --exclude '*.html' --exclude '*.json'
          --exclude '*.xml' --exclude '*.txt' --exclude '*.md' --exclude '*.claude'
          --exclude '*.agent'
          --cache-control 'public, max-age=3600, stale-while-revalidate=86400'
      - name: Upload the Markdown exports
        run: >-
          aws s3 sync "$SITE" "s3://$BUCKET/docs/" --only-show-errors --delete
          --exclude '*' --include '*.md' --include '*.claude' --include '*.agent'
          --content-type 'text/markdown; charset=utf-8' --cache-control 'no-cache'
      - name: Upload the pages and indexes
        run: >-
          aws s3 sync "$SITE" "s3://$BUCKET/docs/" --only-show-errors --delete
          --exclude '*' --include '*.html' --include '*.json' --include '*.xml'
          --include '*.txt' --exclude '.vite/*' --exclude 'skipped.json' --exclude '*.????????????.*'
          --cache-control 'no-cache'
      - name: Publish the redirects
        env:
          KVS_ARN: ${{ secrets.DOCS_SITE_REDIRECTS_KVS_ARN }}
        run: go run ./cmd/docsdeploy redirects -kvs-arn "$KVS_ARN" -file "$SITE/redirects.json"
      - name: Invalidate the distribution
        run: >-
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION"
          --paths '/docs' '/docs/*' --query Invalidation.Id --output text

  docs-site-complete:
    needs: [changes, verify, build, check, audit, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: verify, build, check, audit, deploy

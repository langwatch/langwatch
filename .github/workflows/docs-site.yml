name: docs-site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "apps/docs/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/design-system/**"
      - "packages/time/**"
      - "CHANGELOG.md"
      - ".gitattributes"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "apps/docs/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/design-system/**"
      - "packages/time/**"
      - "CHANGELOG.md"
      - ".gitattributes"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/docs-site..."
      - name: Install build browser
        run: pnpm --filter @langwatch/docs-site exec playwright install --with-deps chromium
      - name: Typecheck the docs app
        run: pnpm --filter @langwatch/docs-site typecheck
      - name: Test docs generation and local routing
        run: VITEST_MAX_WORKERS=2 pnpm --filter @langwatch/docs-site test
      - name: Build the documentation
        run: pnpm --filter @langwatch/docs-site build
      - name: Test the built site
        run: pnpm --filter @langwatch/docs-site test:smoke
      - name: Check internal links
        run: pnpm --filter @langwatch/docs-site test:links
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docs-site
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 7

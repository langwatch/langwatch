# Always-run workflow with internal path gating + aggregator. See #3223.
# Branch protection requires `langwatch-nlp-complete`.
#
# nlpgo is the sole NLP engine: the self-hosted `langwatch_nlp` image is
# built Go-only from infra/docker/Dockerfile.langwatch_nlp (a subcommand of the
# cmd/service monobinary). The Go source itself (build/test/lint/vet for
# services/nlpgo) is covered by go-ci.yaml; this workflow is the PR-time
# smoke check that the published image actually builds.
name: langwatch-nlp-ci

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review is NOT a default pull_request activity type. Without
    # it, taking a PR out of draft fires no event at all, so the jobs gated
    # on `heavy` below would never get their first non-draft run.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede an outdated run on a PR branch, never on main: every commit
  # that lands on main has to keep its own validation, and cancelling here
  # would let a merge silently void the run for the commit before it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      # Draft PRs keep the cheap signal and release the runner slots;
      # everything heavy returns on ready_for_review and in the merge queue.
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The gate reads no working-tree content: on pull_request events
          # dorny/paths-filter takes the changed-file list from the API, and
          # every file this job needs on disk lives under .github/. Checking
          # out the rest of the tree is pure runner time.
          sparse-checkout: .github
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          filters: |
            relevant:
              - 'infra/docker/Dockerfile.langwatch_nlp'
              - 'services/nlpgo/**'
              - 'cmd/service/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/langwatch-nlp-ci.yml'

  docker-build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile.langwatch_nlp
          push: false
          tags: langwatch/langwatch_nlp:test
          # Scoped: see the note in langevals-ci.yml. These two were the only
          # unscoped buildx caches left, which meant they shared one.
          cache-from: type=gha,scope=langwatch-nlp
          cache-to: type=gha,mode=max,scope=langwatch-nlp

  langwatch-nlp-complete:
    needs: [changes, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: docker-build

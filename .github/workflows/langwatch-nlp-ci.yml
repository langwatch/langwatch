# Always-run workflow with internal path gating + aggregator. See #3223.
# Branch protection requires `langwatch-nlp-complete`.
#
# nlpgo is the sole NLP engine: the self-hosted `langwatch_nlp` image is
# built Go-only from infra/docker/Dockerfile.langwatch_nlp (a subcommand of the
# cmd/service monobinary). The Go source itself (build/test/lint/vet for
# services/nlpgo) is covered by go-ci.yaml; this workflow is the PR-time
# smoke check that the published image actually builds.
name: langwatch-nlp-ci

on:
  # Pull requests and the merge queue reach this through pr.yml.
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: langwatch-nlp-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A newer commit supersedes an older run, on main too: the newest verdict
  # covers the commits before it. Image and release builds keep their own rule.
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      # Draft PRs keep the cheap signal and release the runner slots;
      # everything heavy returns on ready_for_review and in the merge queue.
      # A PR labelled `ci:full` runs it all, draft or not.
      heavy: ${{ steps.detect.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The gate reads no working-tree content: the changed paths come
          # from git trees (.github/actions/detect-changes),
          # and every file this job needs on disk lives under .github/.
          # Checking out the rest of the tree is pure runner time.
          sparse-checkout: .github
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          filters: |
            relevant:
              - 'infra/docker/Dockerfile.langwatch_nlp'
              - 'services/nlpgo/**'
              - 'cmd/service/**'
              - 'pkg/**'
              - '*/go.mod'
              - '*/go.sum'
              - '.github/workflows/langwatch-nlp-ci.yml'

  docker-build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.langwatch_nlp
          push: false
          tags: langwatch/langwatch_nlp:test
          # Scoped: see the note in langevals-ci.yml. These two were the only
          # unscoped buildx caches left, which meant they shared one.
          cache-from: type=gha,scope=langwatch-nlp
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=langwatch-nlp' || '' }}

  langwatch-nlp-complete:
    needs: [changes, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: docker-build

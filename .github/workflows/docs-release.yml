name: docs-release

on:
  workflow_dispatch:
    inputs:
      release_reason:
        description: "Reason for docs release"
        required: true
        default: "General"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-release.yml"
      - ".github/scripts/release-docs.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only the newest cache-bust matters, so a newer push supersedes an older run.
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_DOCS_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "LangWatch Docs Bot"
          git config --global user.email "y.budnyk789@gmail.com"

      - name: Trigger Release
        env:
          REASON: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_reason || 'auto-release on merge to main' }}
        run: bash ../.github/scripts/release-docs.sh "$REASON"

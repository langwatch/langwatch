name: docs-release

on:
  workflow_dispatch:
    inputs:
      release_reason:
        description: "Reason for docs release"
        required: true
        default: "General"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-release.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only the newest cache-bust matters, so a newer push supersedes an older run.
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_DOCS_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "LangWatch Docs Bot"
          git config --global user.email "y.budnyk789@gmail.com"

      # Main moves while this runs, so each attempt rewrites the redirect on the
      # newest main rather than pushing a commit made on the one it checked out.
      - name: Trigger Release
        env:
          REASON: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_reason || 'auto-release on merge to main' }}
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            jq --arg current_time_val "$(date +%s)" \
              '([.redirects[] | select(.source | startswith("/ci/cache/busted/"))] | length) as $n
              | if $n == 1 then
                  .redirects |= map(
                    if (.source | startswith("/ci/cache/busted/"))
                    then .source = ("/ci/cache/busted/" + $current_time_val)
                    else . end)
                else
                  error("Error: expected exactly one redirect with source /ci/cache/busted/*, found \($n)")
                end' \
              docs.json > docs.json.tmp
            mv docs.json.tmp docs.json
            git add docs.json
            git commit -m "Release docs ($REASON) [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::main kept moving; the docs release was not pushed after 5 attempts."
          exit 1

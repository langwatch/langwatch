# A closed pull request's caches are unreadable by anyone else, so delete them
# rather than leave them to count against the repository limit until they
# expire. Fork pull requests never saved one: they only read main's.
#
# Main saves a fresh copy of every cache keyed by the commit on each push, and
# nothing pruned them: they filled the repository's cache budget, after which
# GitHub refuses every save. The sweep keeps the newest copy of each
# (specs/ci/main-cache-sweep.feature).
name: cache-cleanup

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete this pull request's caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CACHE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          # A failed listing fails the job; a single failed delete only warns.
          ids=$(gh cache list --ref "$CACHE_REF" --limit 1000 --json id --jq '.[].id') || {
            echo "::error::Could not list caches on $CACHE_REF; nothing deleted."
            exit 1
          }
          for id in $ids; do
            gh cache delete "$id" || echo "::warning::Could not delete cache $id; continuing."
          done

  sweep-main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - name: Delete main's superseded per-commit cache copies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: go run ./cmd/cachesweep

name: architecture-section-check

# Fails when a code PR's description has no `## Architecture` section: the
# conformance box ticked and a "Needs a human look" part filled in. What
# counts as a code PR, and what a passing body looks like, is decided by
# .github/scripts/guard-architecture-section.ts.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

# Triggered on `edited` and reads the description, so an in-flight run may be
# grading a body the author has already rewritten.
concurrency:
  group: architecture-section-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    # Release PRs are exempt: release-please writes the description itself.
    # Same-repo only, so a fork cannot opt out by naming its branch.
    if: |
      !(github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # PR_AUTHOR is the pull request's author, NOT `github.actor`: on `edited`
      # the actor is whoever touched the PR last, which would flip the bot
      # exemption on and off.
      - name: Verify the Architecture section in the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # JSON, not newline-delimited names: a path may contain a newline.
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --slurp \
            > "${RUNNER_TEMP}/changed-files.json"
          echo "Author: $PR_AUTHOR"
          node --experimental-strip-types .github/scripts/guard-architecture-section.ts \
            "${RUNNER_TEMP}/changed-files.json"

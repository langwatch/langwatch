name: upgrade-rehearsal

# Plan 2026-10-08, section F, phases 0 to 2: the real upgrade from the 3.20.1 image and from an
# origin/main build to this head, with old and new processes overlapping. Report as an artifact.
# Spec: specs/upgrade/upgrade-rehearsal.feature. Scheduled runs use the default branch's copy.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    name: rehearse from ${{ matrix.origin }} (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { origin: "3.20.1", order: api-first, args: "" }
          - { origin: main, order: api-first, args: "--build-main" }
          - { origin: main, order: worker-first, args: "--build-main" }
          - { origin: empty, order: api-first, args: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: unit checks
        run: TZ=UTC node --test dev/scripts/upgrade-rehearsal/__tests__/*.unit.test.mjs
      - name: rehearse
        run: >-
          bash dev/scripts/upgrade-rehearsal/rehearse.sh --origin ${{ matrix.origin }}
          --order ${{ matrix.order }} --build-head ${{ matrix.args }}
          --run-dir "$RUNNER_TEMP/rehearsal"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-rehearsal-${{ matrix.origin }}-${{ matrix.order }}
          path: ${{ runner.temp }}/rehearsal
          if-no-files-found: warn

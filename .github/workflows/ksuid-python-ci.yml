name: ksuid-python-ci

# The JavaScript half of ksuid needs no workflow of its own: it is a workspace
# package with a `test` script, so the package-suite discovery in
# langwatch-app-ci runs it. The Python half lives outside the pnpm workspace,
# so it gets this small path-filtered job. Not a required check — a plain
# `paths:` filter is fine here (see sdk-python-ci for the always-run pattern
# required checks need).
on:
  push:
    branches:
      - main
    paths:
      - "packages/ksuid-python/**"
      # The Python uv workspace root (ADR-145): a re-lock or a root
      # resolution-setting change re-pins this package's dependencies.
      - "uv.lock"
      - "pyproject.toml"
      - ".python-version"
  pull_request:
    paths:
      - "packages/ksuid-python/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".python-version"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer commit supersedes an older run, on main too: the newest verdict
  # covers the commits before it. Image and release builds keep their own rule.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      # Beats the workspace root's .python-version, which would otherwise pin
      # every matrix leg to the same interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Run tests
        working-directory: packages/ksuid-python
        run: |
          uv sync --dev --extra dev
          uv run pytest tests/ -v

      - name: Build package
        working-directory: packages/ksuid-python
        run: uv build --out-dir dist

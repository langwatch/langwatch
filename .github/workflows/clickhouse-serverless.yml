# Always-run workflow with internal path gating + aggregator. See #3223.
# Branch protection can require `clickhouse-serverless-complete` as a
# single check. Jobs skip cleanly when the paths aren't relevant.
name: clickhouse-serverless

on:
  pull_request:
    # ready_for_review is NOT a default pull_request activity type. Without
    # it, taking a PR out of draft fires no event at all, so the jobs gated
    # on `heavy` below would never get their first non-draft run.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede an outdated run on a PR branch, never on main: every commit
  # that lands on main has to keep its own validation, and cancelling here
  # would let a merge silently void the run for the commit before it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      # Draft PRs keep the cheap signal and release the runner slots;
      # everything heavy returns on ready_for_review and in the merge queue.
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The gate reads no working-tree content: on pull_request events
          # dorny/paths-filter takes the changed-file list from the API, and
          # every file this job needs on disk lives under .github/. Checking
          # out the rest of the tree is pure runner time.
          sparse-checkout: .github
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          filters: |
            relevant:
              - 'infra/clickhouse-serverless/**'
              - 'charts/clickhouse-serverless/**'
              - '.github/workflows/clickhouse-serverless.yml'

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    name: go tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/clickhouse-serverless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Its own module declares the version; "1.26" here silently resolved
          # to whatever 1.26.x was newest that day.
          go-version-file: infra/clickhouse-serverless/go.mod
          cache-dependency-path: infra/clickhouse-serverless/go.sum
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - run: make test
      - run: make lint

  e2e:
    needs: [changes, test]
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    name: docker e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/clickhouse-serverless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Its own module declares the version; "1.26" here silently resolved
          # to whatever 1.26.x was newest that day.
          go-version-file: infra/clickhouse-serverless/go.mod
          cache-dependency-path: infra/clickhouse-serverless/go.sum
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: make e2e
      - run: make e2e-cold
      - run: make e2e-cold-move
      - run: make e2e-backup
      - name: Show logs on failure
        if: failure()
        run: |
          docker logs ch-e2e 2>&1 | tail -100 || true
          docker logs garage-e2e 2>&1 | tail -50 || true

  clickhouse-serverless-complete:
    needs: [changes, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test, e2e

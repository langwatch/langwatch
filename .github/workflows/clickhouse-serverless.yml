# Always-run workflow with internal path gating + aggregator. See #3223.
# Branch protection can require `clickhouse-serverless-complete` as a
# single check. Jobs skip cleanly when the paths aren't relevant.
name: clickhouse-serverless

on:
  # Pull requests and the merge queue reach this through pr.yml.
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: clickhouse-serverless-${{ github.ref }}
  # A newer commit supersedes an older run, on main too: the newest verdict
  # covers the commits before it. Image and release builds keep their own rule.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      # Draft PRs keep the cheap signal and release the runner slots;
      # everything heavy returns on ready_for_review and in the merge queue.
      # A PR labelled `ci:full` runs it all, draft or not.
      heavy: ${{ steps.detect.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The gate reads no working-tree content: the changed paths come
          # from git trees (.github/actions/detect-changes),
          # and every file this job needs on disk lives under .github/.
          # Checking out the rest of the tree is pure runner time.
          sparse-checkout: .github
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          filters: |
            relevant:
              - 'infra/clickhouse-serverless/**'
              - 'charts/clickhouse-serverless/**'
              - '.github/workflows/clickhouse-serverless.yml'

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    name: go tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/clickhouse-serverless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Its own module declares the version; "1.26" here silently resolved
          # to whatever 1.26.x was newest that day.
          go-version-file: infra/clickhouse-serverless/go.mod
          cache-dependency-path: infra/clickhouse-serverless/go.sum
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - run: make test
      - run: make lint

  e2e:
    needs: [changes, test]
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    name: docker e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/clickhouse-serverless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Its own module declares the version; "1.26" here silently resolved
          # to whatever 1.26.x was newest that day.
          go-version-file: infra/clickhouse-serverless/go.mod
          cache-dependency-path: infra/clickhouse-serverless/go.sum
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: make e2e
      - run: make e2e-cold
      - run: make e2e-cold-move
      - run: make e2e-backup
      - run: make e2e-access
      - name: Show logs on failure
        if: failure()
        run: |
          docker logs ch-e2e 2>&1 | tail -100 || true
          docker logs garage-e2e 2>&1 | tail -50 || true
          docker logs ch-backup 2>&1 | tail -100 || true

  clickhouse-serverless-complete:
    needs: [changes, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test, e2e

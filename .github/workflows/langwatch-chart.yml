name: langwatch-chart

on:
  pull_request:
    paths:
      - "charts/langwatch/**"
      - "charts/clickhouse-serverless/**"
      - "charts/gateway/**"
      - "charts/langyagent/**"
      - "charts/lib/**"
      - ".github/workflows/langwatch-chart.yml"
      # The shutdown budget is the one place where a code constant and a
      # chart value must agree: the pod's terminationGracePeriodSeconds is
      # sized from the same numbers budget.ts derives. Without this path a
      # change to those constants never runs the workers-shutdown job, and
      # the chart would keep asserting a margin the code no longer uses.
      - "platform/app/src/server/shutdown/**"
      # This job is the only thing in CI that builds the app image and runs a
      # stack against it — publish-docker-app fires on `release: published`, so
      # on a pull request nothing else touches the Dockerfile at all. Without
      # these paths a change to how the image is assembled reaches a release
      # unvalidated, which is exactly how a broken one nearly shipped: moving
      # the pnpm install root left every dependency symlink in the runtime
      # stage dangling, the build stayed green, and the container would have
      # died on its first import.
      - "infra/docker/Dockerfile"
      - "infra/docker/Dockerfile.go_service"
      - ".dockerignore"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "charts/langwatch/**"
      - "charts/clickhouse-serverless/**"
      - "charts/gateway/**"
      - "charts/langyagent/**"
      - "charts/lib/**"
      - ".github/workflows/langwatch-chart.yml"
      # The shutdown budget is the one place where a code constant and a
      # chart value must agree: the pod's terminationGracePeriodSeconds is
      # sized from the same numbers budget.ts derives. Without this path a
      # change to those constants never runs the workers-shutdown job, and
      # the chart would keep asserting a margin the code no longer uses.
      - "platform/app/src/server/shutdown/**"
      # This job is the only thing in CI that builds the app image and runs a
      # stack against it — publish-docker-app fires on `release: published`, so
      # on a pull request nothing else touches the Dockerfile at all. Without
      # these paths a change to how the image is assembled reaches a release
      # unvalidated, which is exactly how a broken one nearly shipped: moving
      # the pnpm install root left every dependency symlink in the runtime
      # stage dangling, the build stayed green, and the container would have
      # died on its first import.
      - "infra/docker/Dockerfile"
      - "infra/docker/Dockerfile.go_service"
      - ".dockerignore"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"

# The e2e jobs here are the most expensive in the repo — `e2e: infra` runs to
# 697s and `e2e: overlays` to 348s — and without a group every push to a chart
# PR left its predecessors running to completion alongside it. Same rule as
# langwatch-app-ci: supersede on a PR branch, never on main, because every
# commit that lands on main has to keep its own validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-template:
    name: "template (${{ matrix.name }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/langwatch
    strategy:
      fail-fast: false
      matrix:
        include:
          # Overlays
          - name: default
            flags: "--set autogen.enabled=true"
          - name: dev+nodeport
            flags: "--set autogen.enabled=true -f examples/overlays/size-dev.yaml -f examples/overlays/access-nodeport.yaml"
          - name: minimal+nodeport
            flags: "--set autogen.enabled=true -f examples/overlays/size-minimal.yaml -f examples/overlays/access-nodeport.yaml"
          - name: prod+ingress
            flags: "--set autogen.enabled=true -f examples/overlays/size-prod.yaml -f examples/overlays/access-ingress.yaml"
          - name: ha+ingress+replicated
            flags: "--set autogen.enabled=true -f examples/overlays/size-ha.yaml -f examples/overlays/access-ingress.yaml -f examples/overlays/clickhouse-replicated.yaml"
          - name: langy-gvisor
            flags: "--set autogen.enabled=true -f examples/overlays/langy-gvisor.yaml"
          - name: langy-disabled
            flags: "--set autogen.enabled=true -f examples/overlays/langy-disabled.yaml"
          - name: prod+external-ch
            flags: "--set autogen.enabled=true -f examples/overlays/size-prod.yaml -f examples/overlays/clickhouse-external.yaml"
          - name: prod+ext-pg+ext-redis
            flags: "--set autogen.enabled=true -f examples/overlays/size-prod.yaml -f examples/overlays/access-ingress.yaml -f examples/overlays/postgres-external.yaml -f examples/overlays/redis-external.yaml"
          # Profiles
          - name: local
            flags: "-f examples/values-local.yaml"
          - name: hosted-prod
            flags: "-f examples/values-hosted-prod.yaml"
          - name: scalable-prod
            flags: "-f examples/values-scalable-prod.yaml"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - run: helm repo add langwatch https://langwatch.github.io/langwatch
      - run: helm dependency build .
      - name: "helm template (${{ matrix.name }})"
        run: helm template lw . ${{ matrix.flags }} > /dev/null

  langevals-sizing:
    name: "langevals sizing"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/langwatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - run: helm repo add langwatch https://langwatch.github.io/langwatch
      - run: helm dependency build .
      # lint-template above only proves the YAML renders. This asserts the
      # numbers that reach the pod: the worker count the chart computed from
      # the CPU allowance, and a memory ceiling that count can live within.
      - name: "assert rendered worker count and memory ceiling"
        run: ./tests/langevals-sizing.sh

  restricted-rbac:
    name: "restricted rbac"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/langwatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No helm, on purpose. Every `lookup` in the matrix above renders against
      # no cluster and so returns empty, which is exactly what a lookup the
      # installer is FORBIDDEN to make does not do — that one aborts the render.
      # The templates have to be read to see it.
      - name: "assert no template needs cluster-scoped read access"
        run: ./tests/restricted-rbac.sh

  email-gateway:
    name: "email gateway"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/langwatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - run: helm repo add langwatch https://langwatch.github.io/langwatch
      - run: helm dependency build .
      # The overlays above never enable email, so nothing there would notice a
      # gateway that reaches only one Deployment. This renders both and compares
      # them, and checks that an unconfigurable provider stops the render.
      - name: "assert rendered email configuration"
        run: ./tests/email-gateway.sh

  sso-providers:
    name: "sso providers"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/langwatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - run: helm repo add langwatch https://langwatch.github.io/langwatch
      - run: helm dependency build .
      # A provider can be documented in the README and validated in the helpers
      # while the Deployment never emits its variables, which looks exactly like
      # the provider not being supported. Only rendering the container shows it.
      - name: "assert rendered SSO provider configuration"
        run: ./tests/sso-providers.sh

  workers-shutdown:
    name: "workers shutdown"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/langwatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - run: helm repo add langwatch https://langwatch.github.io/langwatch
      - run: helm dependency build .
      # Workers drain in-flight queue jobs and their ClickHouse writes on
      # SIGTERM. Too short a grace period turns that drain into a SIGKILL,
      # which severs in-flight statements — invisible in the template source,
      # visible only in the rendered value.
      - name: "assert workers get long enough to drain"
        run: ./tests/workers-shutdown.sh

  # The render matrix above proves the chart PARSES; these vitest suites
  # assert on what it EMITS (env selection per provider, identity guards,
  # migration postures, validation failures). They normally run inside the
  # app CI's integration shards, but that workflow deliberately does not
  # trigger on charts/** — so without this job a chart-only edit could break
  # every behavioral guarantee while CI stays green.
  behavioral:
    name: "behavioral (rendered-output assertions)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - run: helm repo add langwatch https://langwatch.github.io/langwatch
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/web..."
      - name: Generate required files
        run: pnpm start:prepare:files
      # The integration config's globalSetup runs ClickHouse migrations via
      # goose before any test file executes, helm-backed or not.
      - name: Install Goose migration tool
        working-directory: .
        run: bash .github/scripts/install-goose.sh
      - name: Run helm behavioral suites
        env:
          # Turns a silent helm-unavailable skip into a hard failure — this
          # job exists precisely so these suites cannot quietly not run.
          REQUIRE_HELM_TESTS: "1"
        run: |
          pnpm test:unit run src/server/stored-objects/__tests__/helm-and-docs-shape.unit.test.ts
          pnpm test:integration run src/server/stored-objects/__tests__/helm-azure-identity.integration.test.ts

  e2e:
    name: "e2e: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: lint-template
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: infra
            script: make test-e2e
            cluster: lw-test
            build_app: true
          - name: overlays
            script: make test-e2e-overlays
            cluster: lw-overlay
            build_app: false
    defaults:
      run:
        working-directory: charts/langwatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - name: Build clickhouse-serverless image
        run: docker build -t langwatch/clickhouse-serverless:next ../../infra/clickhouse-serverless/
      - name: Resolve app image
        if: matrix.build_app
        run: |
          APP_REPO=$(helm show values . | grep -A20 '^images:' | grep -A2 '^  app:' | grep 'repository:' | awk '{print $2}')
          APP_TAG=$(helm show values . | grep -A20 '^images:' | grep -A2 '^  app:' | grep 'tag:' | head -1 | awk '{print $2}')
          echo "APP_IMAGE=${APP_REPO}:${APP_TAG}" >> "$GITHUB_ENV"
      - name: Build app image
        if: matrix.build_app
        run: docker build -t "$APP_IMAGE" -f ../../infra/docker/Dockerfile ../..
      # The gateway image isn't published to ghcr yet — build it locally so
      # the chart e2e can install. values-e2e.yaml overrides
      # gateway.image.{repository,tag,pullPolicy} to match.
      - name: Build gateway image
        run: docker build -t langwatch/ai-gateway:e2e -f ../../infra/docker/Dockerfile.go_service ../..
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: ${{ matrix.cluster }}
      - name: Load images into Kind
        run: |
          kind load docker-image langwatch/clickhouse-serverless:next --name ${{ matrix.cluster }}
          kind load docker-image langwatch/ai-gateway:e2e --name ${{ matrix.cluster }}
          if [ "${{ matrix.build_app }}" = "true" ]; then
            kind load docker-image "$APP_IMAGE" --name ${{ matrix.cluster }}
          fi
      - run: ${{ matrix.script }}
        env:
          KEEP_CLUSTER: "true"
          CLUSTER_NAME: ${{ matrix.cluster }}
      - name: Show pod status on failure
        if: failure()
        run: |
          NS=$(kubectl get ns -o name 2>/dev/null | grep -o 'lw-test\|lw-overlay' | head -1)
          [ -z "$NS" ] && exit 0
          kubectl -n "$NS" get pods -o wide 2>/dev/null || true
          kubectl -n "$NS" get events --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true
          kubectl -n "$NS" describe pods 2>/dev/null || true
          for POD in $(kubectl -n "$NS" get pods -o name 2>/dev/null); do
            kubectl -n "$NS" logs "$POD" --all-containers --prefix --tail=-1 2>/dev/null || true
            kubectl -n "$NS" logs "$POD" --all-containers --prefix --previous --tail=-1 2>/dev/null || true
          done

name: langwatch-chart

on:
  pull_request:
    # ready_for_review is NOT a default activity type, and the two heaviest
    # jobs below skip on a draft. Without it, taking a PR out of draft fires
    # no event at all and they would never get their non-draft run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "charts/langwatch/**"
      - "charts/clickhouse-serverless/**"
      - "charts/gateway/**"
      - "charts/langyagent/**"
      - "charts/lib/**"
      - ".github/workflows/langwatch-chart.yml"
      # Where the processes declare what they read. The shutdown deadline must
      # agree with the pod's grace period (workers-shutdown.sh), and every
      # variable the chart sets must still be declared somewhere
      # (env-contract.mjs); without these paths a code change breaks either
      # while the chart CI never runs.
      - "packages/process-server/src/**"
      - "packages/process-stores/src/config-owner.ts"
      - "packages/secrets/src/shared-secrets.ts"
      - "packages/config/src/**"
      - "modules/*/contract/src/*.config.ts"
      - "enterprise/modules/*/contract/src/*.config.ts"
      - "apps/tasks/src/config.ts"
      # This job is the only thing in CI that builds the app image and runs a
      # stack against it — publish-docker-app fires on `release: published`, so
      # on a pull request nothing else touches the Dockerfile at all. Without
      # these paths a change to how the image is assembled reaches a release
      # unvalidated, which is exactly how a broken one nearly shipped: moving
      # the pnpm install root left every dependency symlink in the runtime
      # stage dangling, the build stayed green, and the container would have
      # died on its first import.
      - "infra/docker/Dockerfile"
      - "infra/docker/Dockerfile.go_service"
      - ".dockerignore"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "charts/langwatch/**"
      - "charts/clickhouse-serverless/**"
      - "charts/gateway/**"
      - "charts/langyagent/**"
      - "charts/lib/**"
      - ".github/workflows/langwatch-chart.yml"
      # Where the processes declare what they read. The shutdown deadline must
      # agree with the pod's grace period (workers-shutdown.sh), and every
      # variable the chart sets must still be declared somewhere
      # (env-contract.mjs); without these paths a code change breaks either
      # while the chart CI never runs.
      - "packages/process-server/src/**"
      - "packages/process-stores/src/config-owner.ts"
      - "packages/secrets/src/shared-secrets.ts"
      - "packages/config/src/**"
      - "modules/*/contract/src/*.config.ts"
      - "enterprise/modules/*/contract/src/*.config.ts"
      - "apps/tasks/src/config.ts"
      # This job is the only thing in CI that builds the app image and runs a
      # stack against it — publish-docker-app fires on `release: published`, so
      # on a pull request nothing else touches the Dockerfile at all. Without
      # these paths a change to how the image is assembled reaches a release
      # unvalidated, which is exactly how a broken one nearly shipped: moving
      # the pnpm install root left every dependency symlink in the runtime
      # stage dangling, the build stayed green, and the container would have
      # died on its first import.
      - "infra/docker/Dockerfile"
      - "infra/docker/Dockerfile.go_service"
      - ".dockerignore"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"

  workflow_dispatch:
    # Allow running kind e2e legs on demand against draft branches.
    # Skipped on draft PRs by the if: conditions at ~line 226 and ~270.
# The e2e jobs here are the most expensive in the repo — `e2e: infra` runs to
# 697s and `e2e: overlays` to 348s — and without a group every push to a chart
# PR left its predecessors running to completion alongside it. Same rule as
# langwatch-app-ci: supersede on a PR branch, never on main, because every
# commit that lands on main has to keep its own validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One runner renders every published preset and runs every rendered-output
  # assertion. This used to be seventeen jobs — a twelve-leg `helm template`
  # matrix plus five single-script jobs — and each one spent ~17s installing
  # helm and building chart dependencies to do 1-5s of real work. Every leg
  # measured under 30s end to end, so the runner lease, not the rendering,
  # was what this workflow actually cost.
  #
  # Diagnostic parity with the old matrix is deliberate and load-bearing. A
  # `fail-fast: false` matrix named every preset that broke in one run; a
  # naive loop would stop at the first. So the render step keeps going after a
  # failure and reports them together at the end, and each assertion step
  # carries `if: '!cancelled()'` so one failing assertion does not hide the
  # next four.
  render:
    name: "render + assertions"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/langwatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/workspace"
      - uses: ./.github/actions/nx-cache
        with:
          suffix: chart
      # Adds the repositories, builds the dependencies, then lints and renders
      # the smoke preset for every chart; each is cached by chart content.
      - name: "helm deps, lint and smoke render"
        working-directory: .
        run: pnpm exec nx run-many -t helm:deps helm:lint helm:template --projects "tag:helm" --outputStyle=static

      # `set +e` is deliberate and load-bearing. Actions runs `run:` steps with
      # `-e` already on, and `set -uo pipefail` does not clear it — so without
      # this line a preset that fails to render would abort the ones after it,
      # and a chart broken in three places would report one. The `if` around
      # the helm call below is exempt from `-e` on its own, but that exemption
      # is a property of `if`, not of this step: the next unguarded command
      # anyone adds would silently reintroduce fail-fast.
      - name: "render every published preset"
        run: |
          set +e
          set -uo pipefail
          failed=()
          render() {
            local name="$1"
            shift
            if helm template lw . "$@" >/dev/null 2>"${RUNNER_TEMP}/${name}.err"; then
              echo "ok    ${name}"
            else
              echo "FAIL  ${name}"
              sed 's/^/        /' "${RUNNER_TEMP}/${name}.err"
              failed+=("${name}")
            fi
          }

          # Overlays
          render default --set autogen.enabled=true
          render dev+nodeport --set autogen.enabled=true -f examples/overlays/size-dev.yaml -f examples/overlays/access-nodeport.yaml
          render minimal+nodeport --set autogen.enabled=true -f examples/overlays/size-minimal.yaml -f examples/overlays/access-nodeport.yaml
          render prod+ingress --set autogen.enabled=true -f examples/overlays/size-prod.yaml -f examples/overlays/access-ingress.yaml
          render ha+ingress+replicated --set autogen.enabled=true -f examples/overlays/size-ha.yaml -f examples/overlays/access-ingress.yaml -f examples/overlays/clickhouse-replicated.yaml
          render langy-gvisor --set autogen.enabled=true -f examples/overlays/langy-gvisor.yaml
          render langy-disabled --set autogen.enabled=true -f examples/overlays/langy-disabled.yaml
          render prod+external-ch --set autogen.enabled=true -f examples/overlays/size-prod.yaml -f examples/overlays/clickhouse-external.yaml
          render prod+ext-pg+ext-redis --set autogen.enabled=true -f examples/overlays/size-prod.yaml -f examples/overlays/access-ingress.yaml -f examples/overlays/postgres-external.yaml -f examples/overlays/redis-external.yaml

          # Profiles
          render local -f examples/values-local.yaml
          render hosted-prod -f examples/values-hosted-prod.yaml
          render scalable-prod -f examples/values-scalable-prod.yaml

          # autogen off, every Secret operator-owned: the Argo CD posture
          render autogen-off -f tests/values-autogen-off.yaml

          if [ "${#failed[@]}" -gt 0 ]; then
            echo
            echo "presets that failed to render: ${failed[*]}"
            exit 1
          fi

      # The render step above only proves the YAML parses. This asserts the
      # numbers that reach the pod: the worker count the chart computed from
      # the CPU allowance, and a memory ceiling that count can live within.
      - name: "assert rendered worker count and memory ceiling"
        if: "!cancelled()"
        run: ./tests/langevals-sizing.sh

      # Static on purpose, and helm being installed here changes nothing.
      # Every `lookup` in the render step runs against no cluster and so
      # returns empty, which is exactly what a lookup the installer is
      # FORBIDDEN to make does not do — that one aborts the render. The
      # templates have to be read to see it.
      - name: "assert no template needs cluster-scoped read access"
        if: "!cancelled()"
        run: ./tests/restricted-rbac.sh

      # The overlays above never enable email, so nothing there would notice a
      # gateway that reaches only one Deployment. This renders both and compares
      # them, and checks that an unconfigurable provider stops the render.
      - name: "assert rendered email configuration"
        if: "!cancelled()"
        run: ./tests/email-gateway.sh

      # A provider can be documented in the README and validated in the helpers
      # while the Deployment never emits its variables, which looks exactly like
      # the provider not being supported. Only rendering the container shows it.
      - name: "assert rendered SSO provider configuration"
        if: "!cancelled()"
        run: ./tests/sso-providers.sh

      # The app, the workers and the NLP service must carry one checked
      # code-block ceiling, and the chart must refuse ceilings the engine's
      # stream idle timeout cannot cover. Only the render shows both.
      - name: "assert every nlpgo caller gets the same code-block ceiling"
        if: "!cancelled()"
        run: ./tests/nlpgo-timeout-guard.sh

      # Workers drain in-flight queue jobs and their ClickHouse writes on
      # SIGTERM. Too short a grace period turns that drain into a SIGKILL,
      # which severs in-flight statements — invisible in the template source,
      # visible only in the rendered value.
      - name: "assert workers get long enough to drain"
        if: "!cancelled()"
        run: ./tests/workers-shutdown.sh

      - name: "assert ClickHouse pool sizing follows fleet capacity"
        if: "!cancelled()"
        run: ./tests/clickhouse-pool-sizing.sh

      # In local-filesystem mode the app and the workers mount one ReadWriteOnce
      # PVC, and a helm upgrade rolls both Deployments at once. The pre-upgrade
      # hook that orders them is a template over several values, so which
      # installs it renders for, how long it waits, and what it may touch are
      # only visible in the rendered output.
      - name: "assert stored-objects upgrades move one volume consumer at a time"
        if: "!cancelled()"
        run: ./tests/stored-objects-upgrade-ordering.sh

      # Issue #8258: the app always owns the LWQL access model, on every
      # ClickHouse/PostgreSQL posture. The chart's only job is handing the app
      # and workers the two passwords it converges the model with
      # (LWQL_CLICKHOUSE_PASSWORD, LWQL_POSTGRES_READER_PASSWORD) — no
      # rendered connection vars, no DDL switch, nothing else LWQL-shaped.
      # Visible only in the render.
      - name: "assert LWQL env is exactly the two query passwords, on every posture"
        if: "!cancelled()"
        run: ./tests/lwql-connection-env.sh

      - name: "assert app and workers get the in-cluster gateway address"
        if: "!cancelled()"
        run: ./tests/gateway-internal-url.sh

      - name: "assert the app knows the control plane address its gateway dials"
        if: "!cancelled()"
        run: ./tests/gateway-control-plane-url.sh
      # A plain install renders no Ingress for the app or the gateway, an
      # enabled gateway Ingress uses the class the operator picked, and no
      # PodDisruptionBudget can block a node drain.
      - name: "assert ingress is opt-in and disruption budgets allow drains"
        if: "!cancelled()"
        run: ./tests/gateway-ingress-and-pdbs.sh

      # Argo CD renders with no cluster access and as revision 1 every time.
      # With autogen off and operator Secrets the render must be stable, take
      # remapped key names, never block ClickHouse on LangWatchQL, and keep
      # every StatefulSet in sync under server-side diff.
      - name: "assert autogen-off installs converge under Argo CD"
        if: "!cancelled()"
        run: ./tests/autogen-off-and-argocd.sh

      # Connect's upgrade guarantee is a claim about absence: an install that
      # changes no value must carry no LANGWATCH_CONNECT_ variable, so nothing
      # in the app can decide to call LangWatch. A wrong `{{- if }}` emits the
      # block anyway and the source looks the same either way, so it is only
      # visible in the render (ADR-139).
      - name: "assert Connect emits nothing by default and reaches both workloads when on"
        if: "!cancelled()"
        run: ./tests/connect-env.sh

      # apps/api and apps/worker parse one config at each owner (ADR-132), so a
      # variable nothing declares is dead and a missing store URL refuses the
      # boot. Both are only visible by setting the render beside the source.
      - name: "assert every process env var is read, and the required ones are set"
        if: "!cancelled()"
        run: node tests/env-contract.mjs

      # release-please bumps the gateway and langyagent subchart versions on
      # every release, and clickhouse-serverless on its own releases. The
      # umbrella must still build its dependencies right after that bump,
      # which a committed Chart.lock breaks (the 3.19.1 chart release failed
      # on exactly this).
      - name: "assert dependencies build after a subchart version bump"
        if: "!cancelled()"
        run: ./tests/dependency-build-after-subchart-bump.sh

  # The render job above proves the chart PARSES; these vitest suites
  # assert on what it EMITS (env selection per provider, identity guards,
  # migration postures, validation failures). They normally run inside the
  # app CI's integration shards, but that workflow deliberately does not
  # trigger on charts/** — so without this job a chart-only edit could break
  # every behavioral guarantee while CI stays green.
  behavioral:
    name: "behavioral (rendered-output assertions)"
    # Skipped on a draft, like the e2e legs below. This workflow has no
    # `changes` gate to read `heavy` from, so the draft check is inline.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/platform-api... @langwatch/langy-browser..."
      - uses: ./.github/actions/nx-cache
        with:
          suffix: chart
      - name: Build chart dependencies
        run: pnpm exec nx run chart-langwatch:helm:deps --outputStyle=static
      - name: Generate required files
        run: pnpm start:prepare:files && pnpm ensure:built
      # The integration config's globalSetup runs ClickHouse migrations via
      # goose before any test file executes, helm-backed or not.
      - name: Install Goose migration tool
        run: bash .github/scripts/install-goose.sh
      - name: Run helm behavioral suites
        env:
          # Turns a silent helm-unavailable skip into a hard failure — this
          # job exists precisely so these suites cannot quietly not run.
          REQUIRE_HELM_TESTS: "1"
        run: |
          pnpm --filter @langwatch/stored-object-process exec vitest run \
            src/__tests__/stored-object-helm-and-docs-shape.unit.test.ts \
            src/__tests__/stored-object-helm-azure-identity.integration.test.ts
          pnpm --filter @langwatch/evaluation-process exec vitest run \
            src/__tests__/helm-langevals-memory.unit.test.ts
          pnpm --filter @langwatch/auth-process exec vitest run \
            src/transport/__tests__/helm-auth-base-url.unit.test.ts

  e2e:
    name: "e2e: ${{ matrix.name }}"
    # These two legs are the most expensive jobs in the repository — `e2e:
    # infra` runs to 697s and `e2e: overlays` to 348s, both building images and
    # standing up a kind cluster — so a draft releases the slots and they come
    # back on ready_for_review.
    #
    # This matters most for the release-please pull requests, which touch
    # `charts/**` and `package.json` on every merge to main and so fire this
    # workflow every time. Twelve workflows already skip their heavy jobs on a
    # draft via detect-changes' `heavy` output; this one has no gate job to
    # read it from, which left it the last heavy thing running on a version
    # bump.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    needs: render
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: infra
            script: make test-e2e
            cluster: lw-test
            build_app: true
          - name: overlays
            script: make test-e2e-overlays
            cluster: lw-overlay
            # The overlays leg installs chart-managed ClickHouse, which now
            # depends on the app image: the lwql-access-render Job runs it to
            # write the access Secret every ClickHouse pod mounts (required
            # mount). Without the image the Job hits ErrImageNeverPull and
            # ClickHouse never leaves ContainerCreating. Build + load it like
            # the infra leg (Resolve/Build/Load steps are gated on build_app).
            build_app: true
    defaults:
      run:
        working-directory: charts/langwatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.12.0
      - name: Build clickhouse-serverless image
        run: docker build -t langwatch/clickhouse-serverless:next ../../infra/clickhouse-serverless/
      - name: Resolve app image
        if: matrix.build_app
        run: |
          APP_REPO=$(helm show values . | grep -A20 '^images:' | grep -A2 '^  app:' | grep 'repository:' | awk '{print $2}')
          APP_TAG=$(helm show values . | grep -A20 '^images:' | grep -A2 '^  app:' | grep 'tag:' | head -1 | awk '{print $2}')
          echo "APP_IMAGE=${APP_REPO}:${APP_TAG}" >> "$GITHUB_ENV"
      - name: Build app image
        if: matrix.build_app
        run: docker build -t "$APP_IMAGE" -f ../../infra/docker/Dockerfile ../..
      # The gateway image isn't published to ghcr yet — build it locally so
      # the chart e2e can install. values-e2e.yaml overrides
      # gateway.image.{repository,tag,pullPolicy} to match.
      - name: Build gateway image
        run: docker build -t langwatch/ai-gateway:e2e -f ../../infra/docker/Dockerfile.go_service ../..
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: ${{ matrix.cluster }}
      - name: Load images into Kind
        run: |
          kind load docker-image langwatch/clickhouse-serverless:next --name ${{ matrix.cluster }}
          kind load docker-image langwatch/ai-gateway:e2e --name ${{ matrix.cluster }}
          if [ "${{ matrix.build_app }}" = "true" ]; then
            kind load docker-image "$APP_IMAGE" --name ${{ matrix.cluster }}
          fi
      - run: ${{ matrix.script }}
        env:
          KEEP_CLUSTER: "true"
          CLUSTER_NAME: ${{ matrix.cluster }}
      - name: Show pod status on failure
        if: failure()
        run: |
          NS=$(kubectl get ns -o name 2>/dev/null | grep -o 'lw-test\|lw-overlay' | head -1)
          [ -z "$NS" ] && exit 0
          kubectl -n "$NS" get pods -o wide 2>/dev/null || true
          kubectl -n "$NS" get events --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true
          kubectl -n "$NS" describe pods 2>/dev/null || true
          for POD in $(kubectl -n "$NS" get pods -o name 2>/dev/null); do
            kubectl -n "$NS" logs "$POD" --all-containers --prefix --tail=-1 2>/dev/null || true
            kubectl -n "$NS" logs "$POD" --all-containers --prefix --previous --tail=-1 2>/dev/null || true
          done

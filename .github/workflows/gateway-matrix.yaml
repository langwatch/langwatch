name: gateway-matrix

# AI Gateway provider × scenario matrix — runs the live-credential
# Go matrix (services/aigateway/tests/matrix) against real LLM
# providers + the LangWatch control plane. Costs ~$0.07 per full
# run (31 cells: 5 canonical scenarios — simple, streamed,
# tool_calling, structured_outputs, cache — across OpenAI/Anthropic/
# Gemini/Bedrock/Azure/Vertex on cheap models, plus 1 OpenAI-only
# streamed-auto-include-usage regression cell), plus the embeddings
# and audio cells; image cells (live_images) run only when a dispatch
# names them. Fires on gateway-touching PRs (path-filtered,
# drafts skip, concurrency-locked so parallel runs don't stack spend
# on the shared provider accounts — ~$0.07/run × N gateway-touching
# PRs/day), the nightly cron, and manual workflow_dispatch. Non-gateway
# PRs and fork PRs (secrets stripped on forks by GitHub) fall back to
# the unit-test layer that mocks providers at the bifrost adapter
# boundary.
#
# Every run seeds the stack it boots (cmd/matrixseed, spec
# specs/ci/gateway-matrix-seed.feature): an organization and project
# through the instance administrator API, then one model provider and
# one virtual key per provider whose credentials this job holds. A
# provider without credentials gets no key, so its cells skip.
#
# Touches needing this matrix:
#   - services/aigateway/**          (gateway data plane)
#   - pkg/**                         (shared HTTP/health helpers)
#   - modules/gateway/  (control plane, including
#     process/src/eventing/gateway-debit.process.ts, the sole writer of
#     gateway budget debits)
# Triggers:
#   - PR push (path-filtered to gateway-relevant files only — doc-only
#     PRs don't pay the ~$0.07 cost)
#   - Nightly, called from nightly.yml (catches drift in shared provider infra)
#   - Manual workflow_dispatch (with optional provider-tag override)
# Fork PRs without secrets: the per-job guard skips the live run
# cleanly so external contributors don't see a phantom CI red.

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Build tags (space-separated). Default = every live tag except live_images."
        type: string
        default: "live_openai live_anthropic live_gemini live_bedrock live_azure live_vertex live_embeddings live_audio"
      run_id_label:
        description: "Optional label appended to trace tags for grep."
        type: string
        default: ""
  pull_request:
    # `ready_for_review` on top of the defaults, because the job below
    # skips drafts: without it a PR opened as a draft and then marked
    # ready never runs the matrix until someone happens to push again,
    # and the gap is invisible.
    types: [opened, synchronize, reopened, ready_for_review]
    # Only fire when gateway-relevant code or this workflow itself
    # changes — doc-only / unrelated PRs stay free.
    paths:
      - "services/aigateway/**"
      - "pkg/**"
      - "cmd/**"
      - "tools/matrixseed/**"
      - "*/go.mod"
      - "*/go.sum"
      - "modules/gateway/**"
      - "charts/gateway/**"
      - ".github/workflows/gateway-matrix.yaml"
  # Nightly: the nightly suite (.github/workflows/nightly.yml, 01:00 UTC) calls
  # this with its secrets inherited. It owns the schedule.
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Serialize runs so parallel invocations don't stack spend and rate
  # limits on the shared provider accounts. Each run mints its own
  # virtual keys against its own database, so no key is shared.
  #
  # Only a run that dials providers needs that lock, so this group
  # lists exactly the same four exemptions as the job guard below and
  # the two must be edited together. GitHub cancels whichever run is
  # already pending in a group when a new one queues, independently of
  # `cancel-in-progress`, and that happens at queue time rather than
  # run time: a run parked here evicts a real PR's queued run even
  # when its own job never executes, so finishing in seconds is no
  # mitigation. Entering the group at all is the harm.
  #
  # The two automation exemptions take the branch prefix AND the
  # account that opened the PR, so a human branch that happens to be
  # named `dependabot/...` keeps its gateway coverage instead of
  # silently losing it to a name.
  group: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.draft || github.event.pull_request.head.repo.fork || (startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'langwatch-agent') || (startsWith(github.head_ref, 'dependabot/') && github.event.pull_request.user.login == 'dependabot[bot]'))) && format('gateway-matrix-idle-{0}', github.head_ref) || 'gateway-matrix-shared-vks' }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token lets the Bedrock step assume the matrix role by OIDC.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    # Four exemptions, mirrored by the concurrency group above.
    # Drafts, for cost discipline. Forks, because GitHub strips secrets
    # on `pull_request` from them, so a live-credential matrix can only
    # produce phantom red checks for external contributors. Release
    # PRs, because they bump `charts/gateway/Chart.yaml` and nothing
    # else this workflow watches, so the matrix would spend live
    # provider calls proving a version string still answers; the branch
    # prefix carries the double dash release-please actually emits, so
    # a hand-written `release-please-config-...` branch is not caught
    # by it. Dependabot, because its PRs bump the action SHAs pinned in
    # this file and read the Dependabot secret store rather than the
    # Actions one, so the matrix either bills real provider calls for a
    # SHA bump or goes green on empty credentials, and neither answers
    # a question about the gateway.
    #
    # Both automation exemptions require the opening account as well as
    # the branch prefix: a branch name is chosen by whoever pushes it,
    # so on its own it decides coverage by string rather than by who
    # actually raised the PR. Requiring both can only ever run the
    # matrix more often, which is the safe direction to fail in.
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.fork == false &&
       !(startsWith(github.head_ref, 'release-please--') &&
         github.event.pull_request.user.login == 'langwatch-agent') &&
       !(startsWith(github.head_ref, 'dependabot/') &&
         github.event.pull_request.user.login == 'dependabot[bot]'))
    env:
      # The tasks and api config parses refuse a missing NODE_ENV.
      NODE_ENV: "test"
      GATEWAY_URL: http://localhost:5563
      # The upgrade and the api both read ClickHouse through this one URL.
      CLICKHOUSE_URL: http://default:ci_password@localhost:8123/langwatch
      REDIS_URL: redis://localhost:6379
      # The upgrade preflight and the api both refuse a missing api-key pepper; a fixed non-secret CI value.
      API_KEY_PEPPER: synthetic-api-key-pepper
      LW_BASE_URL: http://localhost:5560
      # The hosted MCP endpoint refuses to boot without a public base URL.
      BASE_HOST: "http://localhost:5560"
      # Provider creds — set as repo/org secrets, NOT committed.
      OPENAI_API_KEY: ${{ secrets.MATRIX_OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.MATRIX_ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.MATRIX_GEMINI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.MATRIX_AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.MATRIX_AZURE_OPENAI_API_KEY }}
      # Bedrock credentials come from the AWS credentials steps below.
      AWS_DEFAULT_REGION: eu-central-1
      VERTEX_PROJECT: langwatch
      VERTEX_LOCATION: us-central1
      VERTEX_ACCESS_TOKEN: ${{ secrets.MATRIX_VERTEX_ACCESS_TOKEN }}
      VOYAGE_API_KEY: ${{ secrets.MATRIX_VOYAGE_API_KEY }}
      # The ElevenLabs cells also need a voice id for text to speech; they
      # skip without one.
      ELEVENLABS_VOICE_ID: ${{ secrets.MATRIX_ELEVENLABS_VOICE_ID }}
      # The gateway/control-plane shared secrets, the instance administrator
      # key, TEST_VK_* and LW_PROJECT_API_KEY are not set here: the steps
      # below generate or mint them per run and export them to $GITHUB_ENV.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langwatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      clickhouse:
        image: clickhouse/clickhouse-server:25.10.2.65
        ports: ["8123:8123", "9000:9000"]
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ci_password
          CLICKHOUSE_DB: langwatch
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Bedrock cells sign with this OIDC session (exported into the job
      # environment the gateway inherits); the seed stores Bedrock keyless and
      # skips it with no session. The role, named by MATRIX_AWS_ROLE_ARN, trusts
      # this workflow on pull requests and main and can only invoke models.
      - name: Configure AWS credentials (OIDC)
        # A refused assumption fails only the Bedrock cells, not the matrix.
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ vars.MATRIX_AWS_ROLE_ARN }}
          role-session-name: gateway-matrix-${{ github.run_id }}
          # The job runs for up to 30 minutes; leave headroom.
          role-duration-seconds: 3600

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"

      # node-pty is in the app's closure via mcp-server and falls back to
      # `node-gyp rebuild` on linux, so the install runs through the shared
      # action: it puts node-gyp on PATH and makes pnpm's bundled gyp_main.py
      # executable.
      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          install: "all"

      # The tasks and api processes import the generated Prisma client and
      # packages that resolve the SDK's built dist, which the shared action
      # prepares (it runs `start:prepare:files` and `ensure:built`, which reach
      # beyond the platform-api closure, hence the full install above).
      - uses: ./.github/actions/prepare-generated-files

      - name: Install Goose migration tool
        run: bash .github/scripts/install-goose.sh

      - name: Generate the per-run stack secrets
        # The api refuses to boot without a 32-byte hex encryption key, and the
        # gateway and control plane must share the internal secret, JWT secret
        # and virtual-key pepper. The instance administrator key is the seed's
        # first credential. The database is empty on every run, so nothing
        # needs these to outlive it. Generated per run: a committed hex
        # literal reads as a leaked key to the scanner.
        run: |
          for name in CREDENTIALS_SECRET LW_GATEWAY_INTERNAL_SECRET LW_GATEWAY_JWT_SECRET \
            LW_VIRTUAL_KEY_PEPPER LANGWATCH_INSTANCE_ADMIN_API_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Apply DB migrations
        working-directory: apps/tasks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/langwatch
        run: pnpm run task upgrade

      - name: Start control plane (background)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/langwatch
          REDIS_URL: redis://localhost:6379
          CLICKHOUSE_HOST: http://localhost:8123
          # The api listens on API_PORT (6560 by default); the matrix calls LW_BASE_URL.
          API_PORT: "5560"
        run: |
          pnpm start > /tmp/langwatch-dev.log 2>&1 &
          echo $! > /tmp/langwatch.pid
          # Wait up to 90s for /api/health
          for i in {1..45}; do
            curl -fsS http://localhost:5560/api/health && break
            sleep 2
          done

      # The gateway's traces reach ClickHouse through the event-sourcing
      # pipeline the worker drains: without it every cell's cost readback
      # waits out its budget.
      - name: Start worker (background)
        working-directory: apps/worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/langwatch
          REDIS_URL: redis://localhost:6379
          CLICKHOUSE_HOST: http://localhost:8123
          # The api's voice listener holds the default port; the worker needs none.
          VOICE_TUNNEL: "false"
          VOICE_WS_PORT: "0"
          WORKER_METRICS_PORT: "2999"
        # The seed's organization create waits on a grant projection the worker
        # folds, so the worker must answer /readyz before the seed runs.
        run: |
          set -euo pipefail
          pnpm start > /tmp/langwatch-worker.log 2>&1 &
          echo $! > /tmp/langwatch-worker.pid
          for attempt in $(seq 1 60); do
            if ! kill -0 "$(cat /tmp/langwatch-worker.pid)" 2> /dev/null; then
              echo "::error title=gateway-matrix::the worker exited before it was ready"
              tail -n 200 /tmp/langwatch-worker.log
              exit 1
            fi
            if curl -fsS -o /dev/null http://127.0.0.1:2999/readyz; then
              echo "worker ready after ${attempt} probes"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=gateway-matrix::the worker never answered /readyz"
          tail -n 200 /tmp/langwatch-worker.log
          exit 1

      # Mints LW_PROJECT_API_KEY and one TEST_VK_<PROVIDER> per provider with
      # credentials into $GITHUB_ENV. Bedrock's model provider carries only
      # the region, so the gateway signs with the session the AWS step above
      # exported. A control-plane refusal fails this step after the other
      # providers are seeded, and the matrix still runs on those.
      - name: Seed the matrix project and virtual keys
        id: seed
        env:
          VERTEX_SERVICE_ACCOUNT_JSON: ${{ secrets.MATRIX_VERTEX_SERVICE_ACCOUNT_JSON }}
          ELEVENLABS_API_KEY: ${{ secrets.MATRIX_ELEVENLABS_API_KEY }}
        run: go run ./cmd/matrixseed -base-url "$LW_BASE_URL"

      # The matrix also runs after a seed refusal, on the providers that were
      # seeded, so the gateway must start then too.
      - name: Start gateway (background)
        if: ${{ success() || steps.seed.outcome == 'failure' }}
        run: |
          go build -o /tmp/aigateway ./cmd/service
          /tmp/aigateway aigateway > /tmp/aigateway.log 2>&1 &
          echo $! > /tmp/aigateway.pid
          for i in {1..30}; do
            curl -fsS http://localhost:5563/healthz && break
            sleep 2
          done

      - name: Run provider matrix
        if: ${{ success() || steps.seed.outcome == 'failure' }}
        working-directory: services/aigateway
        env:
          # Force-include all configured tags so a partial-creds run
          # still produces useful coverage signal — a missing-cred
          # cell t.Skips with a clear reason instead of silently
          # being absent from the report.
          MATRIX_TAGS: ${{ github.event.inputs.providers || 'live_openai live_anthropic live_gemini live_bedrock live_azure live_vertex live_embeddings live_audio' }}
        # pipefail: without it the step takes tee's status and a failing cell
        # leaves the job green.
        run: |
          set -o pipefail
          go test -tags="$MATRIX_TAGS" -v -count=1 -timeout 1200s \
            ./tests/matrix/... 2>&1 | tee /tmp/matrix.log

      - name: Extract matrix results
        if: always()
        run: |
          echo "## Matrix run summary" >> $GITHUB_STEP_SUMMARY
          # Each cell logs `cell <provider>/<scenario>: trace=<id> duration=<ms>s captured_cost=$<usd>`
          grep -oE 'cell [a-z]+/[a-z_]+: .*captured_cost=\$[0-9.]+' /tmp/matrix.log | \
            sed 's/^cell /- ✅ /' >> $GITHUB_STEP_SUMMARY || true
          # Total cost
          total=$(grep -oE 'captured_cost=\$[0-9.]+' /tmp/matrix.log | \
            sed 's/captured_cost=\$//' | awk '{s+=$1} END {printf "%.4f", s}')
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total provider spend this run: \$$total**" >> $GITHUB_STEP_SUMMARY

      - name: Stop services
        if: always()
        run: |
          [ -f /tmp/aigateway.pid ] && kill $(cat /tmp/aigateway.pid) || true
          [ -f /tmp/langwatch.pid ] && kill $(cat /tmp/langwatch.pid) || true
          [ -f /tmp/langwatch-worker.pid ] && kill "$(cat /tmp/langwatch-worker.pid)" || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix-logs-${{ github.run_id }}
          path: |
            /tmp/matrix.log
            /tmp/aigateway.log
            /tmp/langwatch-dev.log
            /tmp/langwatch-worker.log
          retention-days: 7

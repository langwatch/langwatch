name: docs-site-deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-site-deploy.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-site-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/docs-site..."
      - name: Install build browser
        run: pnpm --filter @langwatch/docs-site exec playwright install --with-deps chromium
      - name: Test generators and edge routing
        run: VITEST_MAX_WORKERS=2 pnpm --filter @langwatch/docs-site test
      - name: Build the documentation
        run: pnpm --filter @langwatch/docs-site build
      - name: Test the built site
        run: pnpm --filter @langwatch/docs-site test:smoke
      - name: Check internal links
        run: pnpm --filter @langwatch/docs-site test:links
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docs-site
          path: docs/site/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: docs-production
    permissions:
      contents: read
      id-token: write
    env:
      DOCS_BUCKET: ${{ vars.DOCS_S3_BUCKET }}
      DOCS_DISTRIBUTION: ${{ vars.DOCS_CLOUDFRONT_DISTRIBUTION_ID }}
      DOCS_FUNCTION: ${{ vars.DOCS_CLOUDFRONT_FUNCTION_NAME }}
    steps:
      - name: Validate deployment configuration
        env:
          DOCS_REGION: ${{ vars.DOCS_AWS_REGION }}
          DOCS_ROLE: ${{ secrets.DOCS_AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          for name in DOCS_BUCKET DOCS_DISTRIBUTION DOCS_FUNCTION DOCS_REGION DOCS_ROLE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment setting: $name"
              exit 1
            fi
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: docs-site
          path: dist
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: ${{ vars.DOCS_AWS_REGION }}
          role-to-assume: ${{ secrets.DOCS_AWS_ROLE_ARN }}
          role-session-name: docs-site-${{ github.run_id }}
      - name: Upload immutable assets before pages
        run: |
          set -euo pipefail
          aws s3 sync dist/assets/ "s3://${DOCS_BUCKET}/assets/" \
            --cache-control 'public,max-age=31536000,immutable' --only-show-errors
      - name: Sync pages and mutable media
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://${DOCS_BUCKET}/" --delete \
            --exclude 'assets/*' --exclude '_deployment/*' \
            --exclude 'link-report.json' --exclude 'skipped.json' --exclude 'redirects.json' \
            --cache-control 'public,max-age=60,must-revalidate' --only-show-errors
      - name: Publish the existing viewer request function
        run: |
          set -euo pipefail
          etag=$(aws cloudfront describe-function --name "$DOCS_FUNCTION" --stage DEVELOPMENT --query ETag --output text)
          updated=$(aws cloudfront update-function --name "$DOCS_FUNCTION" --if-match "$etag" \
            --function-config file://dist/_deployment/function-config.json \
            --function-code fileb://dist/_deployment/viewer-request.js --query ETag --output text)
          aws cloudfront publish-function --name "$DOCS_FUNCTION" --if-match "$updated" > /dev/null
      - name: Invalidate cached pages and wait for completion
        run: |
          set -euo pipefail
          invalidation=$(aws cloudfront create-invalidation --distribution-id "$DOCS_DISTRIBUTION" \
            --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DOCS_DISTRIBUTION" --id "$invalidation"

# Publish `@langwatch/server` to npm. Hooked to the same release-please flow
# as the rest of the repo (see release-please-sdks.yml + release-please-config.json).
#
# Trigger policy:
# - `release.published` whose tag starts with `langwatch@` (the main langwatch
#   release tag — release-please uses `<component>@<version>`). Releases for
#   other components (typescript-sdk@*, mcp-server@*, etc.) are
#   filtered out by the `if:` guard on the publish job. The Go SDK is the one
#   exception to the `<component>@<version>` shape: Go requires a submodule's
#   tag to be `<subdir>/vX.Y.Z`, so it tags as `sdks/go/v*`.
# - `workflow_dispatch` from main for break-glass / first publish / beta
#   bumps. The dispatched run reads the version from apps/server/package.json — it does
#   NOT require a release tag.
#
# What a release ships (ADR-180): the AI gateway binaries and one prebuilt app archive per platform
# on the GitHub release v$VERSION, then the npm package, which is the CLI alone. npm publish waits
# for every archive, so a platform whose archive failed to build never meets a CLI that wants it.
#
# Version lock: apps/server/package.json and apps/api/package.json must match.
# Both are auto-bumped in lockstep by release-please-config.json. The
# pre-publish step verifies it.
#
# npm dist-tag is auto-derived from the package version:
#   3.1.0          → @latest
#   3.1.0-beta.0   → @prerelease (so beta/rc don't auto-rollout to existing users)
# Same convention as the scenario JS workflow.
#
# Trusted Publishers (npm OIDC, recommended after first manual publish):
# Configure at npmjs.com → @langwatch/server → settings → Trusted Publishers,
# add provider `GitHub Actions` with:
#   Repository:        langwatch/langwatch
#   Workflow filename: npx-server-publish.yml
#   Environment:       (leave empty: we do not use job environments)
# Once configured, the NPM_API_TOKEN secret can be deleted; the
# `id-token: write` permission below is sufficient for npm to mint a
# short-lived publish token from the OIDC token.

name: npx-server-publish

on:
  release:
    types: [published]
  workflow_dispatch:

# A publish run drains — see publish-docker-app. These jobs upload binaries and archives onto the
# GitHub release AND publish to npm, so a cancelled run can leave a release carrying a partial set
# of assets that nothing reconciles.
concurrency:
  group: npx-server-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # for creating/updating the GH release with binaries and app archives
  id-token: write # for npm provenance + Trusted Publishers OIDC exchange

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'langwatch@')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    timeout-minutes: 20
    outputs:
      version: ${{ steps.versions.outputs.version }}
      npm_tag: ${{ steps.versions.outputs.npm_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm-node

      - name: Resolve and verify versions
        id: versions
        run: |
          set -e
          pkg_version="$(node -p "require('./apps/server/package.json').version")"
          app_version="$(node -p "require('./apps/api/package.json').version")"
          tag="${GITHUB_REF_NAME:-}"
          echo "apps/server/package.json version: $pkg_version"
          echo "apps/api/package.json version:    $app_version"
          echo "release tag (if any):           $tag"

          if [ "$pkg_version" != "$app_version" ]; then
            echo "✗ version mismatch: server=$pkg_version langwatch=$app_version"
            echo "  release-please should keep these in lockstep — check release-please-config.json"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            # Release-please tag format: langwatch@v3.2.0 (component@vX.Y.Z,
            # `tag-separator: @` in release-please-config.json — release-please
            # itself prepends the `v` to semver tags). Strip the
            # `langwatch@v` prefix so what's left matches package.json's version.
            tag_version="${tag#langwatch@v}"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "✗ version mismatch: tag=$tag (parsed=$tag_version) package.json=$pkg_version"
              exit 1
            fi
          fi

          # Auto-derive npm dist-tag from version: any `-` suffix (beta, rc,
          # alpha, next, etc.) → `prerelease`; clean semver → `latest`.
          # Same convention as the langwatch/scenario JS publish.
          if [[ "$pkg_version" == *"-"* ]]; then
            npm_tag="prerelease"
          else
            npm_tag="latest"
          fi
          echo "resolved npm dist-tag:          $npm_tag"

          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true

      # Build the aigateway monobinary for all 4 platforms and create a
      # GitHub release with them attached at tag v$VERSION. The aigateway
      # predep at runtime fetches:
      #   https://github.com/langwatch/langwatch/releases/download/v$VERSION/aigateway-$PLATFORM
      # Without this step npx installs hit HTTP 404 and either fail or fall
      # through to the dev-only LANGWATCH_AIGATEWAY_DEV_BUILD=1 path.
      #
      # We always create a `v$VERSION` tag for the npx flow even when
      # release-please cuts a separate `langwatch@v$VERSION` release —
      # release-please's component-prefixed tag format is awkward to URL-
      # encode and tying the gateway artifact tag to a single, stable
      # `v$VERSION` is simpler.
      - name: Build aigateway monobinaries (4 platforms)
        run: |
          set -e
          mkdir -p _pack
          for tp in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os="${tp%-*}"; arch="${tp#*-}"
            echo "→ building aigateway-$tp"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -ldflags="-s -w -X main.Version=$VERSION" \
              -o "_pack/aigateway-$tp" \
              ./cmd/service
          done
          ls -lh _pack/aigateway-*
        env:
          VERSION: ${{ steps.versions.outputs.version }}

      - name: Create GH release v$VERSION with aigateway binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -e
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "→ release $tag exists, uploading binaries (clobber)"
            gh release upload "$tag" _pack/aigateway-* --clobber
          else
            echo "→ creating release $tag"
            prerelease_flag=""
            if [[ "$VERSION" == *"-"* ]]; then prerelease_flag="--prerelease"; fi
            gh release create "$tag" \
              --title "v$VERSION" \
              --notes "@langwatch/server@$VERSION — aigateway monobinaries and prebuilt app archives" \
              $prerelease_flag \
              _pack/aigateway-*
          fi

  # One archive per platform, each on a runner of that platform so native dependencies match
  # (ADR-180). The npx CLI's `app` predep downloads
  #   https://github.com/langwatch/langwatch/releases/download/v$VERSION/langwatch-app-$SLUG.tar.gz
  app-archive:
    needs: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - { slug: linux-amd64, runner: ubuntu-latest }
          - { slug: linux-arm64, runner: ubuntu-24.04-arm }
          - { slug: darwin-amd64, runner: macos-15-intel }
          - { slug: darwin-arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # The workspace install pulls node-pty through mcp-server; the shared action puts node-gyp
      # on PATH and makes pnpm's bundled gyp_main.py executable, and sets up Go for build:server.
      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          install: all

      # The one recipe the smoke workflow runs too: generated files, the dist bundles, the
      # declarations, then the browser bundle and the scenario child bundle.
      - name: Build what the backend serves (build:server)
        run: pnpm run build:server
        env:
          NODE_ENV: production

      - name: Build the app archive
        run: bash dev/scripts/build-app-archive.sh --out _pack

      - name: Check the app archive
        run: |
          set -e
          archive="_pack/langwatch-app-${{ matrix.slug }}.tar.gz"
          test -f "$archive" || { echo "✗ this runner built no $archive"; ls -l _pack; exit 1; }
          bash dev/scripts/check-app-archive.sh "$archive"

      - name: Upload the app archive to release v$VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "v$VERSION" \
            "_pack/langwatch-app-${{ matrix.slug }}.tar.gz" \
            "_pack/langwatch-app-${{ matrix.slug }}.tar.gz.sha256" \
            --clobber

  publish:
    needs: [release, app-archive]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/server..."
          registry-url: "https://registry.npmjs.org"

      - name: Build @langwatch/server CLI
        run: pnpm --filter @langwatch/server build

      # The package is the CLI alone; the script refuses anything else in it.
      - name: Pack the npm package
        id: pack
        run: |
          bash dev/scripts/pack-npm.sh --pack-destination "$GITHUB_WORKSPACE/_pack"
          tarball="$(ls "$GITHUB_WORKSPACE/_pack"/langwatch-server-*.tgz | head -n1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          ls -lh "$tarball"
          tar -tzf "$tarball"

      - name: Check the npm package carries the Apache-2.0 licence
        run: |
          set -e
          extract_dir="$(mktemp -d)"
          tar -xzf "${{ steps.pack.outputs.tarball }}" -C "$extract_dir" package/LICENSE.md
          grep -q "Apache License" "$extract_dir/package/LICENSE.md" \
            || { echo "✗ tarball LICENSE.md is not Apache-2.0"; head -5 "$extract_dir/package/LICENSE.md"; exit 1; }
          echo "✓ tarball ships Apache-2.0 LICENSE.md"

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}
        run: |
          set -e
          npm publish "${{ steps.pack.outputs.tarball }}" \
            --access public \
            --provenance \
            --tag "${{ needs.release.outputs.npm_tag }}"

  notify:
    needs: [release, app-archive, publish]
    # Only a release this workflow published from: other tags skip `release` and report nothing.
    if: always() && github.event_name == 'release' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          STATUS: ${{ needs.publish.result }}
          VERSION: ${{ needs.release.outputs.version }}
          NPM_TAG: ${{ needs.release.outputs.npm_tag }}
        run: |
          if [ -z "$SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL" ]; then exit 0; fi
          if [ "$STATUS" = "success" ]; then
            text="✅ @langwatch/server@${VERSION} published to npm (tag: ${NPM_TAG}) — \`npx @langwatch/server\` ready"
          else
            text="✗ @langwatch/server@${VERSION} publish failed — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$(printf '{"text":"%s"}' "$text")" \
            "$SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL"

name: go-services

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: write

concurrency:
  group: go-services-${{ github.ref_name }}
  # Supersede an outdated run on a PR branch, never on main: every commit
  # that lands on main has to keep its own validation, and cancelling here
  # would let a merge silently void the run for the commit before it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.service }}
      chart: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.chart }}
      langyagent: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.langyagent }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            service:
              - 'services/aigateway/**'
              - 'pkg/**'
              - 'cmd/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/Dockerfile.go_service'
              - '.github/workflows/go-services.yaml'
            chart:
              - 'charts/gateway/**'
              - '.github/workflows/go-services.yaml'
              # The `helm` job's ConfigMap/env-var assertions encode a
              # contract with these two Go files — a rename here that
              # doesn't touch charts/gateway/** would otherwise skip the
              # job that's supposed to catch exactly that regression.
              - 'pkg/config/server.go'
              - 'services/aigateway/config.go'
            langyagent:
              # The langyagent image bakes in the langwatch CLI, and that CLI is
              # generated AT IMAGE-BUILD TIME from inputs OUTSIDE the Go tree:
              # sdks/typescript/ + skills/ + feature-map.json + a handful of
              # platform/app + services/langevals source files (sdks/typescript/copy-types.sh +
              # generate-skills-bundle.mjs). A change to any of those can break
              # `docker build -f infra/docker/Dockerfile.langyagent` with no Go source
              # touched — exactly the gap that shipped a broken build once
              # (a new copy-types.sh input was never COPYed into the image).
              # Validate the image build whenever any build input moves.
              - 'services/langyagent/**'
              - 'pkg/**'
              - 'cmd/**'
              - 'sdks/go/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/Dockerfile.langyagent'
              - 'sdks/typescript/**'
              - 'packages/langy/**'
              - 'skills/**'
              - 'feature-map.json'
              - 'platform/app/src/server/tracer/types.ts'
              - 'platform/app/src/server/filters/types.ts'
              - 'platform/app/src/server/evaluations/types.ts'
              - 'platform/app/src/server/modelProviders/llmModels.json'
              - 'platform/app/src/app/api/openapiLangWatch.json'
              - 'services/langevals/ts-integration/evaluators.generated.ts'
              - '.github/workflows/go-services.yaml'

  docker:
    needs: changes
    if: ${{ needs.changes.outputs.service == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          repo_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo_lower}/ai-gateway" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          file: infra/docker/Dockerfile.go_service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.sha_tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max

  langyagent:
    needs: changes
    if: ${{ needs.changes.outputs.langyagent == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      # Build-only guard: this image is NEVER pushed from here. The langyagent
      # image is published solely by publish-docker-app.yml on a `langwatch@*`
      # release; this job exists to fail a PR fast when a build input breaks the
      # image, not to produce an artifact. amd64 only — the failure modes we're
      # guarding (a missing copy-types.sh input, an unresolved generated import,
      # a broken Go compile) are arch-independent, so an emulated arm64 build
      # would triple the runtime for no extra signal. Shares the release
      # workflow's amd64 cache scope so PR builds warm from it.
      - name: Build langyagent image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          file: infra/docker/Dockerfile.langyagent
          push: false
          platforms: linux/amd64
          build-args: |
            SERVICE_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=langyagent-amd64
          cache-to: type=gha,scope=langyagent-amd64,mode=max

  helm:
    needs: changes
    if: ${{ needs.changes.outputs.chart == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v4
        with:
          version: v3.18.0

      - name: helm lint (gateway)
        working-directory: charts/gateway
        run: helm lint .

      - name: helm template (gateway defaults)
        working-directory: charts/gateway
        run: helm template gateway . --dry-run > /tmp/defaults.yaml

      - name: helm template (gateway network policy on)
        working-directory: charts/gateway
        run: helm template gateway . --set networkPolicy.enabled=true --set redis.url=redis://test:6379 --dry-run > /tmp/netpol.yaml

      - name: Assert NetworkPolicy renders when enabled
        run: |
          if ! grep -q "kind: NetworkPolicy" /tmp/netpol.yaml; then
            echo "NetworkPolicy missing from rendered template"; exit 1
          fi
          if grep -q "kind: NetworkPolicy" /tmp/defaults.yaml; then
            echo "NetworkPolicy should NOT render by default"; exit 1
          fi

      # Regression guard: shutdown.preDrainWaitSeconds / timeoutSeconds
      # previously looked configurable in values.yaml but never reached the
      # container (no env var wiring in configmap.yaml, no
      # lifecycle.WithDrainDelay call in serve.go) — the values were
      # fiction. This asserts the ConfigMap actually carries them through.
      - name: Assert shutdown timing values reach the ConfigMap
        run: |
          if ! grep -q 'SERVER_DRAIN_DELAY_SECONDS: "5"' /tmp/defaults.yaml; then
            echo "SERVER_DRAIN_DELAY_SECONDS missing/wrong in rendered ConfigMap (expected shutdown.preDrainWaitSeconds default of 5)"; exit 1
          fi
          if ! grep -q 'SERVER_GRACEFUL_SECONDS: "15"' /tmp/defaults.yaml; then
            echo "SERVER_GRACEFUL_SECONDS missing/wrong in rendered ConfigMap (expected shutdown.timeoutSeconds default of 15)"; exit 1
          fi

      # values.yaml's own comment claims terminationGracePeriodSeconds "is
      # computed from preDrainWaitSeconds + timeoutSeconds + 10s slack" —
      # it's actually a static literal, so nothing enforced that until now.
      # Violating it means the kubelet force-kills the pod mid-drain.
      - name: Assert terminationGracePeriodSeconds covers drain + timeout + slack
        run: |
          drain=$(grep -oP 'SERVER_DRAIN_DELAY_SECONDS: "\K[0-9]+' /tmp/defaults.yaml)
          graceful=$(grep -oP 'SERVER_GRACEFUL_SECONDS: "\K[0-9]+' /tmp/defaults.yaml)
          grace_period=$(grep -oP 'terminationGracePeriodSeconds: \K[0-9]+' /tmp/defaults.yaml)
          slack=10
          required=$((drain + graceful + slack))
          if [ "$grace_period" -lt "$required" ]; then
            echo "terminationGracePeriodSeconds ($grace_period) must be >= preDrainWaitSeconds + timeoutSeconds + ${slack}s slack ($required)"; exit 1
          fi

      - name: helm dependency update (umbrella)
        working-directory: charts/langwatch
        run: helm dependency update

      - name: helm template (umbrella includes gateway)
        working-directory: charts/langwatch
        run: |
          helm template langwatch . --set autogen.enabled=true --dry-run > /tmp/umbrella.yaml

      - name: Assert gateway subchart renders under the umbrella
        run: |
          # Assert on the Source marker helm stamps on every rendered file, not on
          # the gateway's pod label: sibling charts legitimately SELECT that label
          # (langyagent's NetworkPolicy has an egress rule to the gateway), so a
          # label grep answers "does anything mention the gateway", not "did the
          # subchart render".
          if ! grep -q "^# Source: langwatch/charts/gateway/" /tmp/umbrella.yaml; then
            echo "umbrella chart did NOT include the gateway subchart — dependency broken?"
            exit 1
          fi
          if ! grep -q "targetPort: 5563" /tmp/umbrella.yaml; then
            echo "gateway Service targetPort !=5563 under the umbrella"
            exit 1
          fi

      - name: Assert the gateway follows the release name to the control plane
        working-directory: charts/langwatch
        run: |
          # A fixed control-plane address resolves only on an install named the
          # same as ours, and the failure is silent: every pod healthy, then
          # every virtual-key request refused. Render under a release name that
          # is deliberately NOT "langwatch" so a hardcoded default cannot pass.
          helm template lw . --set autogen.enabled=true --dry-run > /tmp/umbrella-lw.yaml
          if ! grep -q 'LW_GATEWAY_BASE_URL: "http://lw-app:5560"' /tmp/umbrella-lw.yaml; then
            echo "gateway control-plane URL does not follow the release name:"
            grep "LW_GATEWAY_BASE_URL" /tmp/umbrella-lw.yaml || echo "  (not rendered at all)"
            exit 1
          fi

          # An address the operator set is theirs, not a starting point.
          helm template lw . --set autogen.enabled=true \
            --set gateway.controlPlane.baseUrl=http://elsewhere.internal:9000 --dry-run \
            > /tmp/umbrella-cp-override.yaml
          if ! grep -q 'LW_GATEWAY_BASE_URL: "http://elsewhere.internal:9000"' /tmp/umbrella-cp-override.yaml; then
            echo "an explicit gateway.controlPlane.baseUrl was overridden by the derived one"
            exit 1
          fi

          # The derivation can only assume the default app port, so an app moved
          # off it has to be refused rather than silently dialled.
          if helm template lw . --set autogen.enabled=true --set app.service.port=8080 --dry-run \
            > /tmp/umbrella-cp-port.yaml 2>&1; then
            echo "a non-default app.service.port with no gateway.controlPlane.baseUrl should fail to render"
            exit 1
          fi
          if ! grep -q "gateway.controlPlane.baseUrl" /tmp/umbrella-cp-port.yaml; then
            echo "the refusal does not name the value that fixes it:"
            cat /tmp/umbrella-cp-port.yaml
            exit 1
          fi

      - name: helm template (umbrella gateway disabled)
        working-directory: charts/langwatch
        run: |
          helm template langwatch . --set autogen.enabled=true --set gateway.chartManaged=false --dry-run > /tmp/umbrella-no-gw.yaml

      - name: Assert opt-out drops the gateway
        run: |
          if grep -q "^# Source: langwatch/charts/gateway/" /tmp/umbrella-no-gw.yaml; then
            echo "gateway.chartManaged=false should suppress the subchart"
            exit 1
          fi

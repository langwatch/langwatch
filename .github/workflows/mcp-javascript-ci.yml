# Always-run workflow with internal path gating + aggregator. See #3223.
# Branch protection requires `mcp-javascript-complete`; upstream jobs
# skip when paths don't match, and `alls-green` reports the final status.
name: mcp-javascript-ci

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review is NOT a default pull_request activity type. Without
    # it, taking a PR out of draft fires no event at all, so the jobs gated
    # on `heavy` below would never get their first non-draft run.
    # `labeled` fires for every label; a run starts only for `ci:full`, which
    # also lifts the draft gate. Any other label is skipped by the gates below.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  pull_request_target:
    types: [labeled]
  merge_group:
  workflow_dispatch:

concurrency:
  # A label event for any label but `ci:full` gets its own group, so it neither
  # cancels a running full run nor is cancelled by one.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci:full') && format('label-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  # Supersede an outdated run on a PR branch, never on main: every commit
  # that lands on main has to keep its own validation, and cancelling here
  # would let a merge silently void the run for the commit before it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # Skips the whole run for a label event other than `ci:full`.
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      # Draft PRs keep the cheap signal and release the runner slots;
      # everything heavy returns on ready_for_review and in the merge queue.
      # A PR labelled `ci:full` runs it all, draft or not.
      heavy: ${{ steps.detect.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The gate reads no working-tree content: the changed paths come
          # from git trees (.github/actions/detect-changes),
          # and every file this job needs on disk lives under .github/.
          # Checking out the rest of the tree is pure runner time.
          sparse-checkout: .github
          # No token left on disk: every fetch in this job is anonymous.
          persist-credentials: false
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          # push-strategy diff + no release-please-manifest entry: the
          # integration step spends real LLM money (Anthropic), so it must
          # not run on pushes or release PRs that touched nothing under
          # mcp/typescript/. A release PR still matches via
          # mcp/typescript/CHANGELOG.md.
          push-strategy: diff
          filters: |
            relevant:
              - 'mcp/typescript/**'
              # The single lockfile, workspace definition, root manifest and
              # hoist config live at the repo root since ADR-076; a dependency
              # or override change touches only these.
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - '.github/workflows/mcp-javascript-ci.yml'
              - '.github/actions/setup-pnpm-node/**'

  typecheck:
    needs: changes
    if: >
      needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
      && (github.event_name != 'pull_request_target'
          || github.event.label.name == 'approved-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/mcp-server... @langwatch/prisma-client"

      # Build mode: the referenced packages' declarations do not exist on a
      # fresh checkout (TS6305). Their graph reaches eventing and observability,
      # which import the built SDK and the generated Prisma client.
      - name: Generate Prisma client and build the SDK
        run: pnpm --filter @langwatch/prisma-client prisma:generate && pnpm exec nx run langwatch:build --outputStyle=static

      - name: Run typecheck
        run: pnpm -w exec tsc -b mcp/typescript

  build_and_test:
    needs: changes
    if: >
      needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
      && (github.event_name != 'pull_request_target'
          || github.event.label.name == 'approved-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/mcp-server... @langwatch/workspace"

      - uses: ./.github/actions/nx-cache
        with:
          suffix: mcp

      - name: Build
        run: pnpm exec nx run @langwatch/mcp-server:build --outputStyle=static

      # The vendored scenario package the scenario tests load resolves
      # `langwatch` to the workspace SDK, whose exports point at its dist.
      - name: Build the SDK
        run: pnpm exec nx run langwatch:build --outputStyle=static

      - name: Run tests
        # Fork and Dependabot PRs don't receive repository secrets, so a
        # secret-backed run can only fail on a missing key. Skip it there;
        # same-repo PRs, pushes, and label-approved pull_request_target run.
        if: >
          (github.event_name != 'pull_request'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && (github.actor != 'dependabot[bot]'
           || github.event_name == 'pull_request_target')
        working-directory: mcp/typescript
        env:
          LANGWATCH_API_KEY: ${{ secrets.MCP_SERVER_LANGWATCH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.MCP_SERVER_ANTHROPIC_API_KEY }}
        run: pnpm run test && pnpm run test:integration && pnpm run test:scenario

  mcp-javascript-complete:
    needs: [changes, typecheck, build_and_test]
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: typecheck, build_and_test

# Always-run workflow with internal path gating + aggregator. See #3223.
#
# Why: branch protection on `main` requires specific checks to pass on
# every PR. A top-level `paths:` filter would make this workflow silently
# absent on unrelated PRs, leaving any required check stuck pending. So
# the workflow always runs; `changes` decides whether jobs do real work
# or skip; `sdk-python-complete` aggregates and reports one final status
# that branch protection requires.
name: sdk-python-ci

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review is NOT a default pull_request activity type. Without
    # it, taking a PR out of draft fires no event at all, so the jobs gated
    # on `heavy` below would never get their first non-draft run.
    # `labeled` fires for every label; a run starts only for `ci:full`, which
    # also lifts the draft gate. Any other label is skipped by the gates below.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  pull_request_target:
    types: [labeled]
  merge_group:
  workflow_dispatch:

concurrency:
  # A label event for any label but `ci:full` gets its own group, so it neither
  # cancels a running full run nor is cancelled by one.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci:full') && format('label-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  # Supersede an outdated run on a PR branch, never on main: every commit
  # that lands on main has to keep its own validation, and cancelling here
  # would let a merge silently void the run for the commit before it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # Skips the whole run for a label event other than `ci:full`.
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      # Draft PRs keep the cheap signal and release the runner slots;
      # everything heavy returns on ready_for_review and in the merge queue.
      # A PR labelled `ci:full` runs it all, draft or not.
      heavy: ${{ steps.detect.outputs.heavy == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The gate reads no working-tree content: on pull_request events
          # dorny/paths-filter takes the changed-file list from the API, and
          # every file this job needs on disk lives under .github/. Checking
          # out the rest of the tree is pure runner time.
          sparse-checkout: .github
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          # push-strategy diff + no release-please-manifest entry: the e2e
          # step spends real LLM money, so it must not run on pushes or
          # release PRs that touched nothing under sdks/python/. An SDK
          # release PR still matches via sdks/python/CHANGELOG.md.
          #
          # NO NEGATION PATTERNS. dorny/paths-filter ORs a filter's patterns
          # and evaluates each one independently, so a lone `!x` matches every
          # path that is not `x` — which is every path. This filter carried
          # `!sdks/python/src/langwatch/__version__.py` to keep a release-please
          # version bump from paying for the suite; instead it made `relevant`
          # true on every PR in the repo, and `test` ran its ~9 minutes on
          # changes that never touched sdks/python/. Measured on a PR with zero
          # python-sdk files: `Changes output set to ["relevant"]`.
          #
          # The exclusion is not expressible under OR semantics, so it is gone
          # rather than rewritten: a release PR now runs the suite it was meant
          # to skip, which costs one run per release instead of one per PR.
          # specs/ci/path-filters.feature already forbids negation here.
          push-strategy: diff
          filters: |
            relevant:
              - 'sdks/python/**'
              - '.github/workflows/sdk-python-ci.yml'
              # The Python uv workspace root (ADR-145): a re-lock or a root
              # resolution-setting change re-pins this SDK's dependencies.
              - 'uv.lock'
              - 'pyproject.toml'
              - '.python-version'

  test:
    needs: changes
    if: >
      needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
      && (github.event_name != 'pull_request_target'
          || github.event.label.name == 'approved-ci')
    runs-on: ubuntu-latest
    env:
      # The e2e step runs against this branch's own stack (api + worker below),
      # not production: the SDK is regenerated from the branch's OpenAPI document,
      # so routes only the branch serves must be reachable.
      DATABASE_URL: "postgresql://langwatch_ci:ci_password@localhost:5432/langwatch_test"
      BASE_HOST: "http://localhost:5560"
      NEXTAUTH_SECRET: "nextauth-secret-for-ci-testing"
      NEXTAUTH_URL: "http://localhost:5560"
      API_TOKEN_JWT_SECRET: "api-jwt-secret-for-ci-testing"
      CLICKHOUSE_URL: "http://default:ci_password@localhost:8123/langwatch"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: "test"
      SKIP_ENV_VALIDATION: "true"
      OPS_PII_STRICT_PRESIDIO_REDACTION_DISABLED: "1"
      LANGWATCH_LICENSE_PUBLIC_KEY: ${{ secrets.TEST_LICENSE_PUBLIC_KEY }}
      LANGWATCH_LOCAL_STORAGE_PATH: /tmp/langwatch-test-storage

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.10.2.65
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ci_password
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: langwatch_ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: langwatch_test
        options: >-
          --health-cmd "PGPASSWORD=ci_password psql -U langwatch_ci -d langwatch_test -c 'select 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python UV
        working-directory: sdks/python
        run: uv sync --all-groups --all-extras

      - name: Run unit tests
        working-directory: sdks/python
        env:
          LANGWATCH_DEBUG: "true"
        run: make test-unit

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.6.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # node-pty has no Linux prebuild; see sdk-javascript-ci.yml for why the
      # published node-gyp must replace pnpm's vendored copy.
      - name: Install node-gyp (for node-pty postinstall)
        shell: bash
        run: |
          set -euo pipefail
          npm install -g node-gyp@12.3.0
          gyp="$(npm root -g)/node-gyp/bin/node-gyp.js"
          test -f "$gyp"
          test -x "$(dirname "$gyp")/../gyp/gyp_main.py"
          echo "npm_config_node_gyp=$gyp" >> "$GITHUB_ENV"

      - name: Install LangWatch dependencies
        run: >
          CI=true pnpm install --frozen-lockfile
          --filter "@langwatch/platform-api..."
          --filter "@langwatch/worker..."
          --filter "@langwatch/ui..."
          --filter "@langwatch/tasks..."
          --filter "@langwatch/workspace"

      - uses: ./.github/actions/nx-cache
        with:
          suffix: sdk-python-e2e

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"

      - name: Prepare LangWatch files
        run: pnpm start:prepare:files && pnpm ensure:built

      - name: Generate a throwaway CREDENTIALS_SECRET
        # Generated per run: a committed hex literal reads as a leaked key to the scanner.
        run: echo "CREDENTIALS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Setup database
        run: pnpm prisma:migrate

      - name: Seed test project
        env:
          HAVEN_SEED_LANGWATCH_API_KEY: sk-lw-local-development-key
        run: pnpm prisma:seed

      - name: Install goose
        run: bash .github/scripts/install-goose.sh

      - name: Setup ClickHouse
        working-directory: apps/tasks
        run: pnpm task clickhouse-migrate

      - name: Build LangWatch browser bundle
        run: pnpm exec nx run workspace:build:types --outputStyle=static && pnpm exec nx run @langwatch/ui:build --outputStyle=static

      - name: Start LangWatch server and worker
        env:
          # Pointing a LangWatch process at its own ingest is a feedback loop.
          LANGWATCH_API_KEY: ""
        run: |
          API_PORT=5560 NODE_ENV=production pnpm --filter @langwatch/platform-api start > /tmp/langwatch-server.log 2>&1 &
          pnpm --filter @langwatch/worker start > /tmp/langwatch-workers.log 2>&1 &
          timeout 60 bash -c 'until curl -f http://localhost:5560 2>/dev/null | grep -q "LangWatch\|<!DOCTYPE"; do sleep 2; done'
          echo "LangWatch server is ready"

      - name: Run e2e tests
        # Fork and Dependabot PRs don't receive repository secrets, so a
        # secret-backed run can only fail on a missing key. Skip it there;
        # same-repo PRs, pushes, and label-approved pull_request_target run.
        if: >
          (github.event_name != 'pull_request'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && (github.actor != 'dependabot[bot]'
           || github.event_name == 'pull_request_target')
        working-directory: sdks/python
        env:
          LANGWATCH_DEBUG: "true"
          # The branch's own stack, seeded above; never production.
          LANGWATCH_ENDPOINT: http://localhost:5560
          LANGWATCH_API_KEY: sk-lw-local-development-key
          LANGWATCH_PROMPT_ID: ${{ secrets.PYTHON_SDK_LANGWATCH_PROMPT_ID }}
          TEST_EVALUATION_SLUG: "test-evaluation"
          AZURE_OPENAI_API_KEY: ${{ secrets.PYTHON_SDK_AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.PYTHON_SDK_AZURE_OPENAI_ENDPOINT }}
          # OpenAI traffic rides the LangWatch AI Gateway: the key is a
          # LangWatch virtual key, and both base-URL spellings cover every
          # client family in the examples (openai SDK and haystack read
          # OPENAI_BASE_URL; litellm, dspy and langchain read
          # OPENAI_API_BASE). Azure keeps its own endpoint above.
          OPENAI_API_KEY: ${{ secrets.PYTHON_SDK_GATEWAY_VIRTUAL_KEY }}
          OPENAI_BASE_URL: https://gateway.langwatch.ai/v1
          OPENAI_API_BASE: https://gateway.langwatch.ai/v1
        run: |
          make test-e2e
          make cli-examples
          make test-examples

      - name: Dump server and worker logs on failure
        if: failure()
        run: |
          echo "===== langwatch server (last 300 lines) ====="
          tail -300 /tmp/langwatch-server.log || true
          echo "===== langwatch workers (last 300 lines) ====="
          tail -300 /tmp/langwatch-workers.log || true

  # The ends of the interpreter range declared by requires-python. `test`
  # above covers the middle on the repo's own pinned version.
  #
  # Installs the package and its own dependencies only. The dev and examples
  # groups pull packages that have no wheels for the newest interpreter
  # (tiktoken, onnxruntime), and none of them are what a user installs, so
  # syncing them here would report a failure the published package does not
  # have.
  interpreters:
    needs: changes
    if: >
      needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
      && (github.event_name != 'pull_request_target'
          || github.event.label.name == 'approved-ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the package on Python ${{ matrix.python-version }}
        working-directory: sdks/python
        run: uv sync --no-default-groups --extra tests --python ${{ matrix.python-version }}

      - name: Check the declared range covers this interpreter
        working-directory: sdks/python
        run: >
          uv run --no-sync --python ${{ matrix.python-version }}
          pytest -q tests/test_supported_python_versions.py

      - name: Import the package
        working-directory: sdks/python
        run: >
          uv run --no-sync --python ${{ matrix.python-version }}
          python -c "import langwatch; langwatch.setup; langwatch.connect_agent"

  build:
    needs: changes
    if: >
      needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
      && (github.event_name != 'pull_request_target'
          || github.event.label.name == 'approved-ci')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python UV
        working-directory: sdks/python
        run: uv sync --all-groups --all-extras && uv pip install build

      - name: Build package
        working-directory: sdks/python
        run: uv run python -m build

  # One required check for the whole workflow. Reports success if every
  # upstream job either passed or was legitimately skipped (paths didn't
  # match). Reports failure if any upstream job failed. Uses `alls-green`
  # because GitHub's default `needs:` semantics treat skipped needs as
  # satisfied — that's the silent-success footgun we want to avoid.
  sdk-python-complete:
    needs: [changes, test, interpreters, build]
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci:full')
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test, interpreters, build

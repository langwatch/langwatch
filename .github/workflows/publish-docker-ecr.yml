name: publish-docker-ecr

# Mirrors the Docker Hub publish flow (publish-docker-app.yml) into the LangWatch
# shared "artifacts" AWS account ECR, so the private SaaS deployment can pin an
# OSS-built `git-<sha>` image instead of rebuilding this same source itself.
#
# Why a second workflow rather than extra steps in publish-docker-app.yml:
#   - Different trigger surface. ECR publishes on every merge to main, so SaaS
#     always has a `git-<sha>` to pin, and never on a release: a release build
#     must not move a `git-<sha>` tag Cloud already uses. Docker Hub stays
#     release/dispatch-only.
#   - Different auth. GitHub OIDC role assumption into the artifacts account —
#     no long-lived AWS keys in this public repository.
#   - Different tag policy. This workflow NEVER pushes `:latest`, and nothing
#     else writes it on these repositories. Their tags are immutable, so every
#     push here checks first (`go run ./cmd/ecrtag`, tools/ecrtag). A tag
#     already there is skipped only when it records this commit's full sha as
#     its org.opencontainers.image.revision (a custom `image_tag` too, so a
#     partly failed dispatch can be re-run); any other tag already there fails.
#   - Different architecture set. arm64 only. Every consumer of these images is
#     Graviton: the EKS node groups are AL2023_ARM_64_STANDARD on m8g, and every
#     Lambda is `architectures = ["arm64"]`. Building amd64 here doubled the
#     matrix to produce a manifest nothing ever pulled. Docker Hub still ships
#     both arches for the community — that flow is untouched.
#
# Two shapes of image:
#   - Service images (app, nlp-service, langevals, gateway, langy-agent): the
#     bare tag is a one-entry image index over a `-arm64` manifest, written last
#     by create-manifest.
#   - Lambda images (langwatch-nlp-lambda and the seven langwatch-eval-<pkg>
#     evaluator functions): the bare tag is a plain single-platform manifest,
#     because a Lambda function image cannot be an index. They have no `-arm64`
#     child. A consumer must not read a Lambda tag until this workflow's run for
#     the commit has completed successfully.
#
# Not signed. The Docker Hub release images are signed keyless through Sigstore,
# and every keyless signature is written to the public transparency log with
# the image reference in it. For these images that reference names the private
# registry, which this file keeps out of the public record (see the ECR login
# step).
#
# If a consumer of these ECR images is ever added on x86, restore the amd64 rows
# in the build table and add `-amd64` back to `sources` in `publish`. Both
# carry a pointer to this note.
#
# The tags written here, and only these:
#   - `git-<short-sha>`   always
#   - `<image_tag>`       instead of `git-<short-sha>`, on a manual dispatch
#                         that supplies one
#
# The OIDC role (`langwatch-oss-ecr-push`, langwatch/langwatch-saas#486) trusts
# exactly two subjects: `refs/heads/main` and `refs/tags/langwatch@v*`. The
# `meta` job runs only on main, so a dispatch on a tag ref does nothing. There is
# deliberately no `pull_request` trigger — a PR-ref assume-role is denied by that
# trust policy, so a PR-triggered run could only ever fail. End-to-end
# verification happens on the first merge to main.
#
# The role's push policy names every repository written here. An image added to
# this workflow needs its repository added to that policy first, or its push is
# denied.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Custom image tag (default: git-<short-sha>)"
        required: false
        type: string

permissions:
  contents: read

# Never cancel in flight: a superseded run may already have pushed per-arch layers.
# Merges that land while one builds wait as one: each newer commit replaces the
# waiting one, so a burst builds its first and its newest commit.
concurrency:
  group: publish-docker-ecr-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1

jobs:
  meta:
    # Every other job needs meta, so a dispatch on any other ref stops here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      custom_tag: ${{ steps.meta.outputs.custom_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Resolve tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          SHORT_HASH=$(git rev-parse --short HEAD)
          IMAGE_TAG="git-${SHORT_HASH}"

          # The dispatch input below becomes a Docker tag. Reject a malformed
          # one here, where the run has cost nothing, rather than at
          # the manifest step after eight images have already been pushed.
          #
          # `case` rather than `grep -E '^…$'`: grep matches line by line, so a
          # value whose FIRST line is well formed passes even when the rest is
          # not — and a newline is the input that matters most here, because the
          # `key=value` writes below are line-oriented and a second line would
          # define further step outputs. A shell glob matches the whole string,
          # newlines included.
          assert_docker_tag() {
            case "$2" in
              "") echo "::error::$1 is empty"; exit 1 ;;
              # The one tag this workflow must never write. Nothing else here
              # can produce it — but a dispatcher can type it into the input
              # box, and a `langwatch@vlatest` tag would reach the same place.
              latest) echo "::error::$1 must not be 'latest'; nothing writes that tag on these repositories"; exit 1 ;;
              *[!A-Za-z0-9._-]* | [!A-Za-z0-9_]*)
                echo "::error::$1 must match ^[A-Za-z0-9_][A-Za-z0-9._-]*$"; exit 1 ;;
            esac
            if [ "${#2}" -gt 128 ]; then
              echo "::error::$1 is longer than the 128 characters a Docker tag allows"; exit 1
            fi
          }

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_IMAGE_TAG}" ]; then
            assert_docker_tag "image_tag" "${INPUT_IMAGE_TAG}"
            IMAGE_TAG="${INPUT_IMAGE_TAG}"
          fi

          # A custom tag is never taken as a push run's re-tag (cmd/ecrtag).
          CUSTOM_TAG="false"
          if [ "${IMAGE_TAG}" != "git-${SHORT_HASH}" ]; then
            CUSTOM_TAG="true"
          fi

          {
            echo "image_tag=${IMAGE_TAG}"
            echo "custom_tag=${CUSTOM_TAG}"
          } >> "$GITHUB_OUTPUT"

  # On push:[main], skip the images a commit cannot have affected so a docs-only
  # merge does not pay for every image build. A dispatch always builds
  # everything: that is the run someone is waiting on a complete set from.
  changes:
    runs-on: ubuntu-latest
    needs: meta
    outputs:
      # A JSON `include:` list, one entry per (image, arch) worth rebuilding, and
      # the matching list of image names. A matrix rather than one boolean per image
      # because `jobs.<job_id>.if` cannot read the `matrix` context, so a
      # per-image gate has to be applied before the matrix is expanded.
      #
      # `built` is NOT the set of images that get a tag this run — every image
      # gets one, see create-manifest. It is only the set that needs rebuilding.
      build-matrix: ${{ steps.select.outputs.build-matrix }}
      lambda-matrix: ${{ steps.select.outputs.lambda-matrix }}
      built: ${{ steps.select.outputs.built }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # Nothing here reads working-tree content: dorny/paths-filter diffs two
          # commits out of the object store, and the rest of this job is jq.
          sparse-checkout: .github

      # NO NEGATION PATTERNS — dorny ORs a filter's patterns, so a lone `!x`
      # matches everything. See specs/ci/path-filters.feature.
      #
      # Each list mirrors the COPY lines of the corresponding Dockerfile, plus
      # this workflow itself so a change to the build definition republishes
      # every image it describes.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            langwatch-app:
              - 'infra/docker/Dockerfile'
              - 'infra/docker/Dockerfile.langyagent'
              - 'apps/**'
              - 'packages/**'
              - 'modules/**'
              - 'enterprise/**'
              - 'mcp/typescript/**'
              - 'sdks/typescript/**'
              - 'skills/**'
              - 'services/langevals/ts-integration/evaluators.generated.ts'
              - 'dev/tests/agentic-e2e/package.json'
              - 'dev/tests/e2e-stack/package.json'
              - 'tools/seedgen/runner/package.json'
              - 'patches/**'
              - 'dev/scripts/**'
              - 'vendor/**'
              - 'go.work'
              - 'go.work.sum'
              - 'cmd/go.*'
              - 'cmd/devscripts/**'
              - 'pkg/go.*'
              - 'services/go.*'
              - 'tools/go.*'
              - 'tools/devscripts/**'
              - 'sdks/go/go.*'
              - 'infra/clickhouse-serverless/go.*'
              # The Go scenario runner stage: its source and the two modules it imports.
              - 'services/scenariorunner/**'
              - 'pkg/**'
              - 'sdks/go/**'
              - 'tsconfig.*.json'
              - '.dockerignore'
              - 'feature-map.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/publish-docker-ecr.yml'
            langwatch-nlp-service:
              - 'infra/docker/Dockerfile.langwatch_nlp'
              - 'cmd/**'
              - 'pkg/**'
              - 'services/**'
              - 'sdks/go/**'
              - 'sdks/python/**'
              - 'packages/ksuid-python/**'
              - '*/go.mod'
              - '*/go.sum'
              - '.dockerignore'
              - '.github/workflows/publish-docker-ecr.yml'
            langwatch-nlp-lambda:
              - 'infra/docker/Dockerfile.langwatch_nlp.lambda'
              - 'go.work'
              - 'go.work.sum'
              - 'cmd/**'
              - 'pkg/**'
              - 'services/**'
              - 'tools/go.*'
              - 'sdks/go/**'
              - 'sdks/python/**'
              - 'packages/ksuid-python/**'
              - 'infra/clickhouse-serverless/go.*'
              - '.dockerignore'
              - '.github/workflows/publish-docker-ecr.yml'
            langwatch-langy-agent:
              - 'infra/docker/Dockerfile.langyagent'
              - 'go.work'
              - 'go.work.sum'
              - 'cmd/**'
              - 'pkg/**'
              - 'services/**'
              - 'tools/go.*'
              - 'sdks/go/**'
              - 'sdks/typescript/**'
              - 'infra/clickhouse-serverless/go.*'
              - 'skills/**'
              - 'modules/**'
              - 'packages/**'
              - 'patches/**'
              - 'apps/server/package.json'
              - 'mcp/typescript/package.json'
              - 'dev/tests/agentic-e2e/package.json'
              - 'feature-map.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.dockerignore'
              - '.github/workflows/publish-docker-ecr.yml'
            # The seven evaluator Lambda images share one Dockerfile and one
            # source tree, so they rebuild together.
            langwatch-eval:
              - 'infra/docker/Dockerfile.langevals.lambda'
              - 'services/langevals/**'
              - 'modules/model-provider/contract/src/catalog/model-catalog*.json'
              - '.dockerignore'
              - '.github/workflows/publish-docker-ecr.yml'
            langwatch-langevals:
              - 'infra/docker/Dockerfile.langevals'
              - 'services/langevals/**'
              - 'modules/model-provider/contract/src/catalog/model-catalog*.json'
              - '.dockerignore'
              - '.github/workflows/publish-docker-ecr.yml'
            langwatch-gateway:
              - 'infra/docker/Dockerfile.go_service'
              - 'cmd/**'
              - 'pkg/**'
              - 'services/**'
              - 'sdks/go/**'
              - '*/go.mod'
              - '*/go.sum'
              - '.dockerignore'
              - '.github/workflows/publish-docker-ecr.yml'
            langwatch-docs:
              - 'infra/docker/Dockerfile.docs'
              - 'docs/**'
              - 'apps/docs/**'
              - 'packages/**'
              - 'skills/**'
              - 'patches/**'
              - 'vendor/**'
              - 'CHANGELOG.md'
              - '.gitattributes'
              - 'tsconfig.*.json'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.github/workflows/publish-docker-ecr.yml'

      - name: Select the images to build
        id: select
        env:
          IS_PUSH: ${{ github.event_name == 'push' }}
          LANGWATCH_APP: ${{ steps.filter.outputs.langwatch-app }}
          LANGWATCH_NLP_SERVICE: ${{ steps.filter.outputs.langwatch-nlp-service }}
          LANGWATCH_LANGEVALS: ${{ steps.filter.outputs.langwatch-langevals }}
          LANGWATCH_GATEWAY: ${{ steps.filter.outputs.langwatch-gateway }}
          LANGWATCH_DOCS: ${{ steps.filter.outputs.langwatch-docs }}
          LANGWATCH_NLP_LAMBDA: ${{ steps.filter.outputs.langwatch-nlp-lambda }}
          LANGWATCH_LANGY_AGENT: ${{ steps.filter.outputs.langwatch-langy-agent }}
          LANGWATCH_EVAL: ${{ steps.filter.outputs.langwatch-eval }}
        run: |
          set -euo pipefail

          # The full build table. `image` doubles as the ECR repository name and
          # as the key of the path filter above, so the two cannot drift.
          #
          # arm64 only — see the header. Docker Hub still ships both arches for
          # the community; this registry serves one all-Graviton consumer.
          #
          # Runner labels mirror publish-docker-app.yml: every image, the app
          # included, builds on the standard hosted arm runner: the app build
          # peaked at about 5 GiB of its 16 GiB, with the contracts and app
          # bundle steps capping Node's heap at 4 GiB (infra/docker/Dockerfile).
          #
          # langwatch-docs (static files under /site, not meant to run) takes the
          # same service shape, so the re-tag fallback in create-manifest holds for it.
          ALL=$(cat <<'JSON'
          [
            {"image":"langwatch-app",         "dockerfile":"infra/docker/Dockerfile",              "arch":"arm64","platform":"linux/arm64/v8","runner":"ubuntu-24.04-arm"},
            {"image":"langwatch-nlp-service", "dockerfile":"infra/docker/Dockerfile.langwatch_nlp","arch":"arm64","platform":"linux/arm64/v8","runner":"ubuntu-24.04-arm"},
            {"image":"langwatch-langevals",   "dockerfile":"infra/docker/Dockerfile.langevals",    "arch":"arm64","platform":"linux/arm64/v8","runner":"ubuntu-24.04-arm"},
            {"image":"langwatch-gateway",     "dockerfile":"infra/docker/Dockerfile.go_service",   "arch":"arm64","platform":"linux/arm64/v8","runner":"ubuntu-24.04-arm"},
            {"image":"langwatch-docs",        "dockerfile":"infra/docker/Dockerfile.docs",         "arch":"arm64","platform":"linux/arm64/v8","runner":"ubuntu-24.04-arm"},
            {"image":"langwatch-langy-agent", "dockerfile":"infra/docker/Dockerfile.langyagent",   "arch":"arm64","platform":"linux/arm64/v8","runner":"ubuntu-24.04-arm"}
          ]
          JSON
          )

          # Lambda function images: pushed as plain manifests, never wrapped in
          # an index (see the header). `evaluator` is the langevals extra the
          # evaluator Dockerfile installs; empty for the NLP function.
          LAMBDAS=$(cat <<'JSON'
          [
            {"image":"langwatch-nlp-lambda",          "dockerfile":"infra/docker/Dockerfile.langwatch_nlp.lambda","evaluator":""},
            {"image":"langwatch-eval-azure",            "dockerfile":"infra/docker/Dockerfile.langevals.lambda",    "evaluator":"azure"},
            {"image":"langwatch-eval-langevals",        "dockerfile":"infra/docker/Dockerfile.langevals.lambda",    "evaluator":"langevals"},
            {"image":"langwatch-eval-lingua",           "dockerfile":"infra/docker/Dockerfile.langevals.lambda",    "evaluator":"lingua"},
            {"image":"langwatch-eval-openai",           "dockerfile":"infra/docker/Dockerfile.langevals.lambda",    "evaluator":"openai"},
            {"image":"langwatch-eval-presidio",         "dockerfile":"infra/docker/Dockerfile.langevals.lambda",    "evaluator":"presidio"},
            {"image":"langwatch-eval-ragas",            "dockerfile":"infra/docker/Dockerfile.langevals.lambda",    "evaluator":"ragas"},
            {"image":"langwatch-eval-topic_clustering", "dockerfile":"infra/docker/Dockerfile.langevals.lambda",    "evaluator":"topic_clustering"}
          ]
          JSON
          )

          if [ "${IS_PUSH}" = "true" ]; then
            BUILT=$(jq -cn \
              --arg app "${LANGWATCH_APP}" \
              --arg nlp "${LANGWATCH_NLP_SERVICE}" \
              --arg evals "${LANGWATCH_LANGEVALS}" \
              --arg gateway "${LANGWATCH_GATEWAY}" \
              --arg docs "${LANGWATCH_DOCS}" \
              --arg nlplambda "${LANGWATCH_NLP_LAMBDA}" \
              --arg langy "${LANGWATCH_LANGY_AGENT}" \
              --arg eval "${LANGWATCH_EVAL}" \
              --argjson lambdas "${LAMBDAS}" \
              '[{"langwatch-app": $app,
                 "langwatch-nlp-service": $nlp,
                 "langwatch-langevals": $evals,
                 "langwatch-gateway": $gateway,
                 "langwatch-docs": $docs,
                 "langwatch-langy-agent": $langy,
                 "langwatch-nlp-lambda": $nlplambda}
                | to_entries[] | select(.value == "true") | .key]
               + (if $eval == "true"
                  then [$lambdas[] | select(.evaluator != "") | .image]
                  else [] end)')
          else
            BUILT=$(jq -cn --argjson all "${ALL}" --argjson lambdas "${LAMBDAS}" \
              '[$all[].image, $lambdas[].image] | unique')
          fi

          MATRIX=$(printf '%s' "${ALL}" | jq -c --argjson built "${BUILT}" \
            '[.[] | select(.image as $i | $built | index($i))]')
          LAMBDA_MATRIX=$(printf '%s' "${LAMBDAS}" | jq -c --argjson built "${BUILT}" \
            '[.[] | select(.image as $i | $built | index($i))]')

          {
            echo "built=${BUILT}"
            echo "build-matrix=${MATRIX}"
            echo "lambda-matrix=${LAMBDA_MATRIX}"
          } >> "$GITHUB_OUTPUT"

          echo "Images to rebuild: ${BUILT}" >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    needs: [meta, changes]
    # An empty `include:` is a workflow startup error, so the "nothing changed"
    # case has to be caught here rather than by the matrix.
    if: needs.changes.outputs.build-matrix != '[]'
    permissions:
      contents: read
      id-token: write # OIDC assume-role into the artifacts account
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.build-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # The docs image dates its sitemap from git history and refuses a shallow clone.
          fetch-depth: ${{ matrix.image == 'langwatch-docs' && '0' || '1' }}

      # No teardown: the runner is discarded after the job, and `docker buildx
      # rm` on a builder holding the app's layers took 79s of every app run.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cleanup: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.ARTIFACTS_ECR_OIDC_ROLE_ARN }}
          role-session-name: publish-docker-ecr-${{ github.run_id }}

      # The AWS CLI rather than aws-actions/amazon-ecr-login: every `uses:` in
      # this repository is a first-party action or an already-approved pin, and
      # an unapproved third-party reference fails the run at startup (see the
      # note in code-scanners.yml). The CLI ships on the hosted runner images.
      #
      # The registry host is derived from the role ARN so the AWS account id
      # stays in a secret rather than being written into this public file.
      - name: Log in to Amazon ECR
        id: ecr
        env:
          ROLE_ARN: ${{ secrets.ARTIFACTS_ECR_OIDC_ROLE_ARN }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "${ROLE_ARN}" | cut -d: -f5)"
          echo "::add-mask::${ACCOUNT_ID}"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${REGISTRY}"

      - name: Set up Go for cmd/ecrtag
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"

      # The tags are immutable: a re-run skips a build whose push would be refused,
      # once the image there is shown to be this commit's (see the header).
      - name: Check whether ${{ matrix.image }} (${{ matrix.arch }}) is already published
        id: exists
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ needs.meta.outputs.image_tag }}-${{ matrix.arch }}
          CUSTOM_TAG: ${{ needs.meta.outputs.custom_tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          EXISTS=$(go run ./cmd/ecrtag published -repository "${IMAGE}" -tag "${TAG}" \
            -source label -revision "${GITHUB_SHA}" -custom="${CUSTOM_TAG}")
          if [ "${EXISTS}" = "true" ]; then
            echo "::notice::${IMAGE}:${TAG} is already in ECR; skipping the build"
          fi
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }} (${{ matrix.arch }})
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platform }}
          # Keep each per-arch push a plain manifest. With provenance on, buildx
          # pushes an index carrying an attestation manifest, and the multi-arch
          # index assembled below would then nest indexes — which several ECR
          # consumers (Lambda in particular) refuse to run.
          provenance: false
          cache-from: type=gha,scope=ecr-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=ecr-${{ matrix.image }}-${{ matrix.arch }}
          # The Go images stamp this into main.Version, which every log line and
          # the OTel resource report; the other images ignore it.
          build-args: |
            VERSION=${{ needs.meta.outputs.image_tag }}
            SERVICE_VERSION=${{ needs.meta.outputs.image_tag }}
            LANGWATCH_BUILD_COMMIT=${{ github.sha }}
          # Read back by the existence check above on a re-run.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:${{ needs.meta.outputs.image_tag }}-${{ matrix.arch }}

      # ── Frontend assets for the CDN (langwatch-app only) ──────────────────
      # The cloud serves the app's hashed assets from a CDN at
      # LANGWATCH_ASSET_BASE=https://<cdn-host>/<image tag>/ (ADR-086), so each
      # tag needs dist/client/assets under s3://<bucket>/<tag>/assets/. The
      # bucket is a repository variable; unset (forks, or before it exists) skips
      # the whole group. `.complete` is written last: a consumer treats the
      # prefix as usable only once it exists, and a re-run skips a finished one.
      - name: Check the CDN assets for this tag
        id: cdn
        if: matrix.image == 'langwatch-app'
        env:
          BUCKET: ${{ vars.FRONTEND_ASSETS_BUCKET }}
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -z "${BUCKET}" ]; then
            echo "::notice::FRONTEND_ASSETS_BUCKET is not set; skipping the CDN asset upload"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if aws s3api head-object --bucket "${BUCKET}" --key "${IMAGE_TAG}/.complete" \
              >/dev/null 2>"${RUNNER_TEMP}/head.err"; then
            echo "::notice::${IMAGE_TAG} is already on the CDN; skipping the upload"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif grep -qE 'Not Found|404' "${RUNNER_TEMP}/head.err"; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            cat "${RUNNER_TEMP}/head.err"
            exit 1
          fi

      # The `ui-assets` stage of the Dockerfile holds only the assets directory.
      # Same cache scope as the image build above, so the builder layers are
      # reused and nothing is pulled back from ECR.
      - name: Export the frontend assets
        if: steps.cdn.outputs.upload == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ui-assets
          push: false
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=ecr-${{ matrix.image }}-${{ matrix.arch }}
          outputs: type=local,dest=${{ runner.temp }}/cdn
          build-args: |
            VERSION=${{ needs.meta.outputs.image_tag }}
            LANGWATCH_BUILD_COMMIT=${{ github.sha }}

      # Only assets/ goes up: index.html is rewritten and served by the pod, and
      # public/ files stay same-origin (ADR-086). No --delete, so earlier tags'
      # prefixes survive. Sourcemaps stay off the public CDN.
      - name: Upload the frontend assets to the CDN
        if: steps.cdn.outputs.upload == 'true'
        env:
          BUCKET: ${{ vars.FRONTEND_ASSETS_BUCKET }}
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          test -n "$(ls -A "${RUNNER_TEMP}/cdn/assets")"
          # ~1,100 small files: at the CLI's default of 10 in flight the sync
          # took 35s, almost all of it request latency.
          aws configure set default.s3.max_concurrent_requests 64
          aws s3 sync "${RUNNER_TEMP}/cdn/assets" "s3://${BUCKET}/${IMAGE_TAG}/assets" \
            --size-only --no-progress --exclude "*.map" \
            --cache-control "public, max-age=31536000, immutable"
          : > "${RUNNER_TEMP}/complete"
          aws s3 cp "${RUNNER_TEMP}/complete" "s3://${BUCKET}/${IMAGE_TAG}/.complete" \
            --cache-control "no-cache"
          echo "Uploaded \`${IMAGE_TAG}\` frontend assets to the CDN bucket" >> "$GITHUB_STEP_SUMMARY"

  # Lambda function images. One plain arm64 manifest per image, pushed straight
  # to the bare tag: a function image cannot be an index, so there is no
  # `-arm64` child to wrap. The bare tag therefore appears before the rest of
  # the run has finished, which is why a consumer waits for the whole run to
  # succeed before it reads one (see the header).
  build-and-push-lambda:
    needs: [meta, changes]
    if: needs.changes.outputs.lambda-matrix != '[]'
    permissions:
      contents: read
      id-token: write # OIDC assume-role into the artifacts account
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.lambda-matrix) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      # Full history, without old file contents: the existence check below
      # finds the ancestor image a push run re-tagged as this commit's tag.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cleanup: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.ARTIFACTS_ECR_OIDC_ROLE_ARN }}
          role-session-name: publish-docker-ecr-lambda-${{ github.run_id }}

      # See the note on the same step in build-and-push.
      - name: Log in to Amazon ECR
        id: ecr
        env:
          ROLE_ARN: ${{ secrets.ARTIFACTS_ECR_OIDC_ROLE_ARN }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "${ROLE_ARN}" | cut -d: -f5)"
          echo "::add-mask::${ACCOUNT_ID}"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${REGISTRY}"

      - name: Set up Go for cmd/ecrtag
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"

      # See the same check in build-and-push. A push run may have re-tagged an
      # unchanged ancestor image as this commit's tag. A re-run of that push
      # run counts the copy as published; a dispatch, which builds every image,
      # fails on it, as the tag cannot be moved to the new build.
      - name: Check whether ${{ matrix.image }} is already published
        id: exists
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ needs.meta.outputs.image_tag }}
          CUSTOM_TAG: ${{ needs.meta.outputs.custom_tag }}
          RETAG: ${{ github.event_name == 'push' && 'accept' || 'refuse' }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          EXISTS=$(go run ./cmd/ecrtag published -repository "${IMAGE}" -tag "${TAG}" \
            -source label -revision "${GITHUB_SHA}" -custom="${CUSTOM_TAG}" -retag="${RETAG}")
          if [ "${EXISTS}" = "true" ]; then
            echo "::notice::${IMAGE}:${TAG} is already in ECR; skipping the build"
          fi
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"

      # `provenance: false` keeps the push a plain manifest; with it on, buildx
      # pushes an index carrying an attestation, which Lambda refuses.
      - name: Build and push ${{ matrix.image }}
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/arm64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ecr-${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,ignore-error=true,scope=ecr-${{ matrix.image }}-arm64
          build-args: |
            VERSION=${{ needs.meta.outputs.image_tag }}
            EVALUATOR=${{ matrix.evaluator }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:${{ needs.meta.outputs.image_tag }}

      - name: Check the pushed manifest is not an index
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          MEDIA_TYPE=$(aws ecr describe-images --repository-name "${IMAGE}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageManifestMediaType' --output text)
          case "${MEDIA_TYPE}" in
            application/vnd.oci.image.manifest.v1+json | application/vnd.docker.distribution.manifest.v2+json)
              echo "Published \`${IMAGE}:${IMAGE_TAG}\` (${MEDIA_TYPE})" >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::error::${IMAGE}:${IMAGE_TAG} is ${MEDIA_TYPE}; a Lambda function image must be a single manifest"
              exit 1 ;;
          esac

  # EVERY image gets this commit's tag, including the ones the path filter
  # skipped. The point of the whole workflow is that SaaS can pin one `git-<sha>`
  # across the whole deployment; if a docs-plus-gateway commit published
  # `langwatch-gateway:git-abc` and nothing else, that pin would fail to resolve
  # for the others. A skipped image is re-tagged from the manifest it
  # already has, which costs a manifest PUT and no build.
  #
  # One job looping over the images rather than a matrix: each image is a few
  # seconds of manifest writes, and a runner per image queued and booted one
  # after another added over a minute to the end of every run. A failure on
  # one image still lets the others publish; the job fails at the end.
  #
  # A failed Lambda build does not hold back the service images: their
  # consumers read the bare index tag, not the run's result. The Lambda image
  # that failed is reported below and fails this job, so the run ends red and
  # its Lambda consumers stop waiting.
  #
  # `!cancelled()` because build-and-push reports `skipped` when nothing needed
  # rebuilding, and this job still has every tag to write in that case. It brings
  # the implicit "all needs succeeded" check with it, hence the explicit results.
  create-manifest:
    needs: [meta, changes, build-and-push, build-and-push-lambda]
    if: >-
      ${{ !cancelled()
          && needs.meta.result == 'success'
          && needs.changes.result == 'success'
          && needs.build-and-push.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC assume-role into the artifacts account
    steps:
      # Only the publish scripts and the Go workspace cmd/ecrtag builds in are
      # read from the tree. The full commit history (without file contents)
      # lets them re-tag only images built from the nearest ancestor of this
      # commit.
      - name: Checkout the publish scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            cmd
            tools
            pkg
            services
            sdks/go
            infra/clickhouse-serverless
          fetch-depth: 0
          filter: blob:none

      - name: Set up Go for cmd/ecrtag
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.ARTIFACTS_ECR_OIDC_ROLE_ARN }}
          role-session-name: publish-docker-ecr-manifest-${{ github.run_id }}

      # See the note on the same step in build-and-push above.
      - name: Log in to Amazon ECR
        id: ecr
        env:
          ROLE_ARN: ${{ secrets.ARTIFACTS_ECR_OIDC_ROLE_ARN }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "${ROLE_ARN}" | cut -d: -f5)"
          echo "::add-mask::${ACCOUNT_ID}"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${REGISTRY}"

      # No `:latest` here, on purpose: see the header. A default tag already
      # there for this commit is left as it is; any other existing tag fails.
      - name: Publish this commit's tag
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          BUILT: ${{ needs.changes.outputs.built }}
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
          CUSTOM_TAG: ${{ needs.meta.outputs.custom_tag }}
          BUCKET: ${{ vars.FRONTEND_ASSETS_BUCKET }}
        run: |
          set -euo pipefail

          # A re-tagged app image needs its frontend assets under the new tag too:
          # the deployment points LANGWATCH_ASSET_BASE at this tag. Copied inside S3
          # from the tag it was re-tagged from; `.complete` last, as on a build.
          copy_cdn_assets() {
            local previous="$1"
            if aws s3api head-object --bucket "${BUCKET}" --key "${IMAGE_TAG}/.complete" >/dev/null 2>&1; then
              echo "Assets for ${IMAGE_TAG} already on the CDN."
              return 0
            fi
            if ! aws s3api head-object --bucket "${BUCKET}" --key "${previous}/.complete" >/dev/null; then
              echo "::error::${previous} has no complete CDN upload, so ${IMAGE_TAG} cannot reuse it; dispatch this workflow to rebuild langwatch-app"
              return 1
            fi
            aws configure set default.s3.max_concurrent_requests 64
            aws s3 sync "s3://${BUCKET}/${previous}/assets" "s3://${BUCKET}/${IMAGE_TAG}/assets" \
              --size-only --no-progress --exclude "*.map" \
              --cache-control "public, max-age=31536000, immutable" --metadata-directive REPLACE
            aws s3api put-object --bucket "${BUCKET}" --key "${IMAGE_TAG}/.complete" \
              --cache-control "no-cache" --content-length 0 >/dev/null
            echo "Copied CDN assets ${previous} -> ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          }

          # Runs in a subshell per image (see the loop), so `set -e` stops only
          # that image.
          publish() {
            local image="$1" repo="${REGISTRY}/$1" previous="" sources exists built=false
            local from=()
            if printf '%s' "${BUILT}" | jq -e --arg i "${image}" 'index($i)' >/dev/null; then
              built=true
              # An index already there must name this run's build, not an
              # ancestor's image a push run re-tagged.
              from=(-built-from "${IMAGE_TAG}-arm64")
            fi

            # Published by an earlier run for this commit (the index records
            # it). Only "not found" goes on; another commit's tag, a push run's
            # re-tag of an image this run built or a lookup error fails it.
            exists=$(go run ./cmd/ecrtag published -repository "${image}" -tag "${IMAGE_TAG}" \
              -source annotation -revision "${GITHUB_SHA}" -custom="${CUSTOM_TAG}" "${from[@]}")
            if [ "${exists}" = "true" ]; then
              echo "${image}:${IMAGE_TAG} is already published; leaving it"
              echo "\`${image}:${IMAGE_TAG}\` was already published" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            if [ "${built}" = "true" ]; then
              # Rebuilt this run: wrap the per-arch tag in an index. Single-source
              # `imagetools create` still writes a proper image index, so the
              # consumer-facing tag has the same shape whether the image was
              # rebuilt this run or re-tagged below.
              sources=("${repo}:${IMAGE_TAG}-arm64")
            else
              # Not rebuilt: copy the index of the bare `git-<sha>` tag of the
              # nearest ancestor of this commit (nearest-ancestor-tag.sh), never
              # an `-arm64` manifest (a different media type) and never an image
              # built from another line of history. The lookup and the choice are
              # separate statements so a failed `describe-images` still trips
              # `set -e`.
              local candidates
              candidates=$(aws ecr describe-images --repository-name "${image}" \
                --query 'imageDetails[].imageTags[]' --output text)
              previous=$(printf '%s\n' "${candidates}" | tr '\t' '\n' \
                | HEAD_COMMIT="${GITHUB_SHA}" .github/scripts/nearest-ancestor-tag.sh)

              if [ -z "${previous}" ]; then
                # Expected until every image has been published once. A dispatch
                # run builds every image and seeds them.
                echo "::warning::${image} has no previous git-* manifest to re-tag as ${IMAGE_TAG}; run this workflow via workflow_dispatch to seed it"
                return 0
              fi
              echo "Re-tagging ${image} ${previous} -> ${IMAGE_TAG} (unchanged by this commit)"
              sources=("${repo}:${previous}")
            fi

            # Assets before the tag: a failed copy then leaves no tag pointing at
            # assets that are not there.
            if [ "${image}" = "langwatch-app" ] && [ -n "${previous}" ] && [ -n "${BUCKET}" ]; then
              copy_cdn_assets "${previous}"
            fi

            # The commit this tag was published for, which a re-run compares
            # before it skips the tag. A re-tag names an older image, so the
            # image's own label cannot say it.
            local annotation="index:org.opencontainers.image.revision=${GITHUB_SHA}"
            docker buildx imagetools create --annotation "${annotation}" -t "${repo}:${IMAGE_TAG}" "${sources[@]}"

            echo "Published \`${image}\` to ECR with tags: ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          }

          FAILED=()
          for IMAGE in langwatch-app langwatch-nlp-service langwatch-langevals langwatch-gateway langwatch-docs langwatch-langy-agent \
              langwatch-nlp-lambda langwatch-eval-azure langwatch-eval-langevals langwatch-eval-lingua \
              langwatch-eval-openai langwatch-eval-presidio langwatch-eval-ragas langwatch-eval-topic_clustering; do
            echo "::group::${IMAGE}"
            # Not `if ! ( ... )`: bash ignores `set -e` inside a subshell whose
            # status a condition tests, so a failed command would not stop it.
            set +e
            case "${IMAGE}" in
              # Single manifests: see tools/ecrtag/lambda.go.
              langwatch-nlp-lambda | langwatch-eval-*)
                if printf '%s' "${BUILT}" | jq -e --arg i "${IMAGE}" 'index($i)' >/dev/null; then
                  LAMBDA_BUILT=true
                else
                  LAMBDA_BUILT=false
                fi
                go run ./cmd/ecrtag lambda -repository "${IMAGE}" -tag "${IMAGE_TAG}" \
                  -revision "${GITHUB_SHA}" -built="${LAMBDA_BUILT}" -custom="${CUSTOM_TAG}" ;;
              *)
                ( set -euo pipefail; publish "${IMAGE}" ) ;;
            esac
            STATUS=$?
            set -e
            if [ "${STATUS}" -ne 0 ]; then
              echo "::error::publishing ${IMAGE}:${IMAGE_TAG} failed"
              FAILED+=("${IMAGE}")
            fi
            echo "::endgroup::"
          done

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::not published: ${FAILED[*]}"
            exit 1
          fi

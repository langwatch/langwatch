# Always-run workflow with internal path gating + aggregator. See #3223.
# Branch protection requires `langwatch-app-complete`. Upstream jobs
# skip when paths don't match, and `alls-green` reports the final
# consolidated status — no per-step `if:` guards needed.
#
# LEAN CHECKOUT
# Every checkout below excludes the repository's marketing media: docs/media,
# docs/images and assets/. Together they are 165 MB of .gif and .mp4 — a
# single 26 MB mp4, gifs of 20/16/10 MB — against 81 MB for platform/, the
# thing we actually build. Naming a sparse-checkout makes actions/checkout
# fetch with `--filter=blob:none`, so those blobs never cross the wire at
# all. Measured on a depth-1 clone: 180 MB -> 42 MB of .git, 490 MB ->
# 188 MB on disk.
#
# It excludes the MEDIA, not docs/ wholesale, and that distinction is load
# bearing. error-remediation.unit.test.ts resolves ../../../../../../docs and
# asserts every remediation link maps to a real .mdx, so dropping all of
# docs/ fails three test-unit shards. The .mdx tree is ~10 MB of the 138;
# the media is the other 128, and nothing in CI reads it.
#
# That is per checkout, and this workflow runs a dozen of them. It also
# compresses the tail, which is what actually sets wall clock: in run
# 31396568900 the six integration shards spent 9s, 9s, 10s, 19s, 151s and
# 185s in checkout, and the job totals tracked it (599s vs 891s).
#
# Non-cone mode is deliberate. Cone mode only accepts an include list, so
# every new top-level directory would silently go missing from CI until
# someone noticed; the negation form says what we are dropping and lets
# everything else through by default.
name: langwatch-app-ci

on:
  # Pull requests and the merge queue reach this through pr.yml.
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_ENV: "test"

concurrency:
  # A manual run (coverage, duration weights) has its own group, so a push cannot cancel it.
  group: langwatch-app-ci-${{ github.event_name }}-${{ github.ref }}
  # A newer commit supersedes an older run, except a push to main: there
  # package-suites runs as one long job (see `suites-one-job`), so a run finishes
  # and the newest commit waits behind it. Guarded by tools/ciguard/mainsuites.go.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      feature-parity: ${{ steps.detect.outputs.feature-parity }}
      # Drafts and release-please PRs (rewritten on every merge) get lint, typecheck and
      # feature-parity only; `ci:full` lifts that. merge_group is never a draft and main
      # runs the full suite, so nothing lands without it.
      heavy: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'langwatch-agent')) || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
      # A push to main runs package-suites as one job: nobody waits on it, and one
      # setup instead of eight saves about a fifth of its Actions minutes (#9146).
      suites-one-job: ${{ github.event_name == 'push' }}
      # Coverage instrumentation costs ~45% of the run (measured: a unit subset
      # goes 3.7s -> 6.6s with --coverage). Nothing gates on it — there is no
      # codecov.yml, no codecov status check, and both uploads are
      # fail_ci_if_error: false — so it is a trend line, not a gate.
      #
      # A trend line does not need recomputing on every merge to main. It now
      # runs on the weekly schedule and on demand, which keeps the graph while
      # taking the instrumentation off the path between a merge and a green
      # main. The provider is already the fast one (vitest 4 defaults to v8,
      # not istanbul), so frequency was the only lever left.
      coverage: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      # Refresh the shard sequencer's duration weights.
      #
      # The sequencer splits the matrix by measured cost where it has a figure
      # and by file size where it does not (src/test-utils/shardWeights.ts). The
      # figures come from vitest.durations.json, which is COMMITTED rather than
      # cached, because every shard computes the split independently and they
      # must all read identical weights — a manifest one shard has and another
      # does not means two different splits, and a file silently running twice
      # or not at all.
      #
      # So the run that WRITES the manifest is deliberately not the run that
      # reads it: dispatch this workflow manually, download the
      # `shard-durations` artifact it produces, and commit it. On demand rather
      # than on a schedule because it is a handful of seconds of imbalance, not
      # a correctness gate, and a weekly bot PR against a 1000-entry generated
      # file is a poor trade for that.
      durations: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The gate reads no working-tree content: the changed paths come
          # from git trees (.github/actions/detect-changes),
          # and every file this job needs on disk lives under .github/.
          # Checking out the rest of the tree is pure runner time.
          sparse-checkout: .github
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          filters: |
            relevant:
              # The three deployable applications — apps/api, apps/worker,
              # apps/ui — plus apps/server, the npx self-host CLI. This IS the
              # code these jobs exist to protect: the monolith they were
              # written for is gone, and every transport, router, worker
              # installer and browser screen lives here, under modules/ or
              # under packages/.
              - 'apps/**'
              # Workspace members the applications' `...` closures install from
              # source — a change there is a change to all three.
              - 'packages/**'
              - 'modules/**'
              - 'enterprise/**'
              # @langwatch/langyworker tests + typecheck run on unit shard 1;
              # without this a wrapper-only change runs zero app CI.
              - 'services/langyworker/**'
              # The single lockfile, workspace definition, root manifest and
              # hoist config all live at the repo root since ADR-076. A PR that
              # bumps a dependency or adds a security override touches ONLY
              # these — without them here, such a PR runs zero app CI while
              # langwatch-app-complete reports success via allowed-skips.
              # Dependabot targets the root weekly, so that is the common case,
              # not the odd one.
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              # NOTE: 'charts/**' is deliberately NOT listed. Integration suites
              # do render the chart and assert on the output, so a chart-only
              # edit can break a package test without touching a file
              # there — but this one flag gates nine jobs (typecheck, every unit
              # and integration shard, e2e), so adding it would run the entire
              # app suite for a comment change in values.yaml. That trade is a
              # repo-wide cost decision, not part of this change; tracked
              # separately.
              - '.github/workflows/langwatch-app-ci.yml'
              # Read by .github/scripts/nightly-workflows.test.ts in ci-scripts-test.
              - '.github/workflows/nightly.yml'
              - '.github/workflows/codebase-health.yml'
              - '.github/workflows/migration-compat.yml'
              - '.github/workflows/npx-server-smoke.yml'
              - '.github/workflows/gateway-matrix.yaml'
              # Read by .github/scripts/release-please-timer.test.ts.
              - '.github/workflows/release-please-sdks.yml'
              # Read by .github/scripts/pr-workflow-filters.test.ts.
              - '.github/workflows/e2e-ci.yml'
              - '.github/workflows/langwatch-nlp-ci.yml'
              - '.github/workflows/langevals-ci.yml'
              - '.github/workflows/mcp-javascript-ci.yml'
              - '.github/workflows/sdk-go-ci.yml'
              - '.github/workflows/sdk-javascript-ci.yml'
              - '.github/workflows/docs-ci.yml'
              - '.github/workflows/codeql.yml'
              - '.github/workflows/clickhouse-serverless.yml'
              - '.github/.release-please-manifest.json'
              - '.github/scripts/**'
              # ci-scripts-test reads this workflow's path filters and its
              # re-tag step, so an edit to the workflow alone must reach it.
              - '.github/workflows/publish-docker-ecr.yml'
              # Composite actions are covered by ci-scripts-test through the
              # scripts they call, so an edit that only touches an action.yml
              # has to reach the gate too.
              #
              # NAMED, not `.github/actions/**`. This flag gates nine jobs —
              # typecheck, all ten test shards, build, e2e — and the glob
              # matched every composite action in the repository, including
              # ones this workflow has never used. A pull request adding
              # `.github/actions/go-build-cache` for go-ci ran the entire app
              # suite on two Go CI files and nothing else.
              #
              # The trade is real and worth stating: a list can go stale where
              # a glob cannot. If you add a `uses: ./.github/actions/<name>`
              # step to this workflow, add it here in the same edit, or an
              # edit to that action will silently not re-run the suite it
              # feeds. These entries cover every action this file uses
              # (`grep -o "uses: \./\.github/actions/[a-z-]*"`).
              - '.github/actions/detect-changes/**'
              - '.github/actions/prepare-generated-files/**'
              - '.github/actions/setup-pnpm-node/**'
            # The parity scanner binds @scenario annotations from test files
            # across many roots, not just specs/. This list MUST
            # cover every root the scanner reads (DEFAULT_TEST_ROOTS,
            # DEFAULT_GO_TEST_ROOTS, DEFAULT_PYTHON_TEST_ROOTS,
            # DEFAULT_BATS_TEST_ROOTS, DEFAULT_SHELL_TEST_ROOTS in
            # the parity scanner),
            # otherwise a binding change in an unlisted root merges without the
            # gate ever running and silently breaks parity on main (e.g. #5143
            # edited only dev/scripts/__tests__/*.bats and slipped through).
            feature-parity:
              - 'specs/**'
              - 'charts/langwatch/tests/**'
              - 'charts/gateway/tests/**'
              - 'apps/**'
              - 'packages/**'
              - 'modules/**'
              - 'enterprise/**'
              - 'skills/**'
              - 'plugins/**'
              - 'tools/**'
              - 'mcp/typescript/**'
              - 'sdks/typescript/**'
              - 'sdks/python/**'
              - 'sdks/go/**'
              - 'services/**'
              - 'pkg/**'
              - 'services/langevals/**'
              - 'dev/scripts/**'
              - '.github/scripts/**'
              - '.gitattributes'
              - '.github/workflows/langwatch-app-ci.yml'

  # Which applications a change actually reaches, from the Nx project graph
  # (ADR-150) rather than from path globs.
  #
  # `changes` answers "did a relevant path move". It cannot answer "does this
  # reach @langwatch/ui", because a path glob has no view of a dependency edge:
  # a package changes, and a dependent that should be tested is not, because no
  # pattern matched its directory. This job answers the second question.
  #
  # Measured over the eighteen commits before 317d961fa5: eleven reached `ui`
  # alone and only four reached all three applications, while every one of them
  # ran all three `test-unit` legs. That is the waste this recovers -- whole
  # legs skipped, with no change to sharding, services or file splits.
  #
  # It costs one install (~2 min) ahead of a lane whose legs run up to 25 min
  # each, so it pays the moment a single leg is skipped.
  #
  # NARROWING IS GUARDED. This is the one job here that can cause something NOT
  # to run, so every uncertain answer is the full set:
  #   - main and merge_group never narrow. The merge path always runs all three.
  #   - a global input (root tsconfigs, nx.json, dev/nx, prisma schema) means
  #     all three, because those are inputs to everything and the graph models
  #     them as a shared hash rather than an edge.
  #   - any failure -- bad base sha, nx error, unparseable output -- means all
  #     three. `continue-on-error` plus the `|| echo` fallbacks below exist so
  #     that a broken graph degrades to today's behaviour instead of to a
  #     green job that tested nothing.
  #
  # To run this in shadow (compute, log, change nothing), set APPLY to 'false'.
  affected:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # Read the checkout; write only to prune this pull request's older cache copies.
    permissions:
      contents: read
      actions: write
    timeout-minutes: 12
    env:
      # Flip to 'false' to observe the selection for a few weeks without
      # letting it skip anything. The step summary records what it WOULD have
      # skipped either way.
      APPLY: "true"
    outputs:
      # From `guard`, never from `pick`: `pick` is continue-on-error, so on a
      # failure its outputs are empty and only `guard` is guaranteed to name a
      # non-empty set.
      apps: ${{ steps.guard.outputs.apps }}
      narrowed: ${{ steps.pick.outputs.narrowed }}
      # Only on a narrowed pull request; empty means package-suites runs all.
      projects: ${{ steps.pick.outputs.projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # nx affected diffs against a base commit, so the shallow default
          # checkout is not enough -- without history the base sha is absent
          # and every run falls back to the full set.
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: all

      # The graph is derived, not source: it is rebuilt whenever the workspace
      # shape changes and is cheap to recompute, so a miss costs seconds.
      # Main and same-repository pull requests save; a pull request keeps one copy.
      - name: Restore the Nx project graph
        if: ${{ !((github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/workspace-data
          key: ${{ runner.os }}-nx-graph-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-graph-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
            ${{ runner.os }}-nx-graph-

      - name: Cache the Nx project graph
        if: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/workspace-data
          key: ${{ runner.os }}-nx-graph-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-graph-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
            ${{ runner.os }}-nx-graph-

      - uses: ./.github/actions/prune-pr-caches
        with:
          prefix: ${{ runner.os }}-nx-graph-

      - name: Decide which applications this change reaches
        id: pick
        continue-on-error: true
        env:
          ALL: '["platform-api","worker","ui"]'
        run: |
          set -uo pipefail
          # The merge path is never narrowed.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"
            echo "narrowed=false" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — running all three applications." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"
            echo "narrowed=false" >> "$GITHUB_OUTPUT"
            echo "Base commit unavailable — running all three applications." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Inputs that belong to everything, handled by name: the root
          # tsconfigs, the Nx plugins that shape every target (dev/nx), the
          # workspace file and CI itself. Nx 23.2 has no task-level affected
          # (ADR-150, 2026-10-10). The lockfile is diffed per package by Nx.
          if git diff --name-only "$BASE" HEAD | grep -qE \
            '^(pnpm-workspace\.yaml|nx\.json|tsconfig(\.[a-z]+)?\.json|dev/nx/|packages/prisma-client/prisma/|\.github/)'; then
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"
            echo "narrowed=false" >> "$GITHUB_OUTPUT"
            echo "A global input changed — running all three applications." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RAW=$(pnpm exec nx show projects --affected --base="$BASE" --head=HEAD --json 2>/dev/null | tail -1)
          PICKED=$(printf '%s' "$RAW" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              let a;try{a=new Set(JSON.parse(s))}catch{process.stdout.write("");return}
              const m={"platform-api":"@langwatch/platform-api","worker":"@langwatch/worker","ui":"@langwatch/ui"};
              const hit=Object.keys(m).filter(k=>a.has(m[k]));
              process.stdout.write(JSON.stringify(hit));
            });' 2>/dev/null)

          # An empty string means nx or the parse failed. An empty ARRAY is a
          # real answer -- nothing reached an application -- but this lane is
          # not the only thing gating a merge, so it still runs one leg rather
          # than reporting a green lane that executed nothing.
          if [ -z "$PICKED" ]; then
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"
            echo "narrowed=false" >> "$GITHUB_OUTPUT"
            echo "Could not compute affected projects — running all three applications." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$PICKED" = "[]" ]; then PICKED='["platform-api"]'; fi

          {
            echo "### Applications this change reaches"
            echo ""
            echo "Graph says: \`$PICKED\`  (of \`$ALL\`)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${APPLY}" != "true" ]; then
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"
            echo "narrowed=false" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Shadow mode (\`APPLY\` is not \`true\`) — all three ran anyway." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "apps=$PICKED" >> "$GITHUB_OUTPUT"
          echo "narrowed=true" >> "$GITHUB_OUTPUT"
          echo "projects=$RAW" >> "$GITHUB_OUTPUT"

      # continue-on-error above means a failed step still arrives here with
      # empty outputs. Nothing downstream may read an empty matrix, so the
      # full set is restored by name.
      - name: Fall back to every application if the decision did not produce one
        id: guard
        run: |
          APPS='${{ steps.pick.outputs.apps }}'
          if [ -z "$APPS" ]; then
            echo "The affected step did not complete — running all three applications." >> "$GITHUB_STEP_SUMMARY"
            echo 'apps=["platform-api","worker","ui"]' >> "$GITHUB_OUTPUT"
          else
            echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          fi

  # Every workspace package's own typecheck, through the root `typecheck`
  # script: `tsc -b` over the root solution, after the api and ui closures as
  # their own processes to bound memory (ADR-100).
  #
  # This used to be two jobs. One ran `pnpm run typecheck` for the three
  # applications; the other ran its own `pnpm -r` over `packages/`,
  # `modules/`, `enterprise/` and `apps/`, because the root script covered
  # only the three applications and 146 packages were never typechecked by CI
  # at all otherwise. The bespoke machinery that scoped the root script that
  # way (dev/scripts/typecheck*.mjs, the declaration-cache action) is gone,
  # replaced by plain `tsc -b` project references in every package, so the
  # root script now runs across the whole workspace and one job covers what
  # both used to.
  #
  # `-r` runs each package's own script, so a package opts in by declaring one
  # and opts out by not declaring one. That is the property a named list of
  # jobs could not have: a package added tomorrow is covered without editing
  # this file.
  #
  # `install: all` because it runs every package, so every package's
  # dependencies have to be present — the same reasoning as package-suites.
  typecheck:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # Read the checkout; write only to prune this pull request's older cache copies.
    permissions:
      contents: read
      actions: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false

      # The one job that saves the pnpm store (not on the critical path).
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: all
          save-store: "true"

      - uses: ./.github/actions/prepare-generated-files

      # Each package writes its own .tsbuildinfo beside its output, to
      # dist/tsconfig.<stem>.tsbuildinfo, per the repo rule that every package
      # tsconfig sets `incremental` and its own tsBuildInfoFile -- never under
      # node_modules. The whole dist/ is the cached unit, not the stamp alone:
      # tsc -b rebuilds a project whose declaration outputs are absent, so
      # caching the stamp without them still runs cold. Same unit nx.json
      # declares as typecheck's outputs.
      #
      # The restore key is pinned to the lockfile and the root compiler
      # options: a snapshot built against other dependency types is never
      # restored. Saved below, once the typecheck has run; a pull request keeps one copy.
      - name: Restore TypeScript incremental build info
        id: tsbuildinfo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # One level per package: a `**` walks every node_modules symlink below
          # it, and the save then outlives the job's timeout.
          path: |
            packages/*/dist
            modules/*/*/dist
            enterprise/modules/*/*/dist
            apps/*/dist
            node_modules/.cache/typecheck-dist
          key: ${{ runner.os }}-pkg-dist-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pkg-dist-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.*.json') }}-

      # A restored dist is trusted only where the package and its workspace
      # dependencies are unchanged since the snapshot: tsc 7 keeps a stale
      # declaration once read and dependants re-emit it as up to date. Each
      # changed package's dist and its dependants' are dropped and built cold
      # (handoff: .claude/handoffs/ci-typecheck-stale-dist.md).
      - name: Drop restored declarations whose sources changed
        run: |
          manifest=node_modules/.cache/typecheck-dist/sources.txt
          current="$RUNNER_TEMP/typecheck-dist-sources.txt"
          pnpm ls -r --depth -1 --json | jq -r --arg root "$PWD/" '.[].path | select(startswith($root)) | ltrimstr($root)' | LC_ALL=C sort > "$RUNNER_TEMP/typecheck-packages.txt"
          while read -r dir; do
            hash=$(cd "$dir" && find . \( -name node_modules -o -name dist \) -prune -o -type f ! -name '*.tsbuildinfo' -print0 | LC_ALL=C sort -z | xargs -0 -r sha1sum | sha1sum | cut -d' ' -f1)
            echo "$dir $hash"
          done < "$RUNNER_TEMP/typecheck-packages.txt" > "$current"
          if [ ! -f "$manifest" ]; then
            echo "No snapshot restored; every project builds cold."
          else
            changed=$(LC_ALL=C comm -13 <(LC_ALL=C sort "$manifest") <(LC_ALL=C sort "$current") | cut -d' ' -f1)
            wiped=0
            if [ -n "$changed" ]; then
              filters=()
              for dir in $changed; do filters+=("--filter=...{./$dir}"); done
              for dir in $(pnpm "${filters[@]}" ls --depth -1 --json | jq -r --arg root "$PWD/" '.[].path | ltrimstr($root)'); do
                if [[ $dir =~ ^(packages/[^/]+|modules/[^/]+/[^/]+|enterprise/modules/[^/]+/[^/]+|apps/[^/]+)$ ]] && [ -d "$dir/dist" ]; then
                  rm -rf "$dir/dist"
                  wiped=$((wiped + 1))
                fi
              done
            fi
            echo "$(echo "$changed" | wc -w) packages changed since the snapshot; dropped $wiped restored dist directories (them and their dependants)."
            # ensure:built's outputs live in these dist directories too.
            if [ "$wiped" -gt 0 ]; then pnpm run ensure:built; fi
          fi
          mkdir -p "$(dirname "$manifest")"
          cp "$current" "$manifest"

      # Not --no-bail: one package's failure should not hide the rest, and a
      # migration in flight tends to break several at once. The job still fails.
      # One pass: the step above leaves no stale declaration to re-check against.
      - name: Run typecheck (every workspace package)
        id: typecheck
        run: pnpm run typecheck

      # Saved even when the typecheck fails, so one red commit on main does not
      # leave every later run cold. Safe: tsbuildinfo keeps the errors, and a
      # fix changes the package's sources, which drops it and its dependants.
      - name: Save TypeScript incremental build info
        if: ${{ !cancelled() && steps.tsbuildinfo.outputs.cache-hit != 'true' && (steps.typecheck.outcome == 'success' || steps.typecheck.outcome == 'failure') && ((github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/dist
            modules/*/*/dist
            enterprise/modules/*/*/dist
            apps/*/dist
            node_modules/.cache/typecheck-dist
          key: ${{ steps.tsbuildinfo.outputs.cache-primary-key }}

      # After the save, so a run that fails before saving keeps the previous copy.
      - uses: ./.github/actions/prune-pr-caches
        if: ${{ !cancelled() && steps.typecheck.outcome != 'skipped' }}
        with:
          prefix: ${{ runner.os }}-pkg-dist-

      - name: Set up Go for the Slack notifier
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: go run ./cmd/slacknotify -job typecheck

  test-unit:
    needs: [changes, affected]
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        # One job per deployable. The sharded matrix this replaced existed for
        # the monolith's five-thousand-file suite; the three applications hold
        # about two thousand tests between them and each is its own vitest
        # root, so the parallelism that pays is per application rather than per
        # slice of one corpus.
        #
        # The list is now the applications the change actually reaches, from
        # the Nx graph -- see the `affected` job, which falls back to all three
        # on main, on merge_group, on a global-input change, and on any
        # failure. A leg absent here was not skipped by a path glob guessing;
        # it was skipped because nothing in the graph connects it to the diff.
        # The `||` is load-bearing, not defensive habit: a matrix expression is
        # evaluated even when the job is skipped, so a skipped or output-less
        # `affected` would make fromJSON('') a hard error rather than a skip.
        app: ${{ fromJSON(needs.affected.outputs.apps || '["platform-api","worker","ui"]') }}
    env:
      VITEST_MAX_WORKERS: "4" # physical core count on GitHub-hosted ubuntu runners
      DATABASE_URL: "postgresql://langwatch_ci:ci_password@localhost:5432/langwatch_test"
      BASE_HOST: "localhost:3000"
      NEXTAUTH_SECRET: "nextauth-secret-for-ci-testing"
      NEXTAUTH_URL: "http://localhost:3000"
      API_TOKEN_JWT_SECRET: "api-jwt-secret-for-ci-testing"
      REDIS_URL: "redis://localhost:6379"
      BUILD_TIME: "true"

    runs-on: ubuntu-latest
    # Same fail-fast cap as test-integration: a worker that wedges post-test
    # (open handle, coverage finalize, etc.) should fail in ~25 min instead of
    # burning the 6h default.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/platform-api... @langwatch/worker... @langwatch/ui..."

      - uses: ./.github/actions/prepare-generated-files

      - name: Generate a throwaway CREDENTIALS_SECRET
        # Anything encrypted at rest (webhook header values, signing secrets,
        # stored idempotency responses) needs a real key to round-trip, and a
        # test asserting that ciphertext is not readable text cannot mock the
        # cipher it is asserting about. Generated per run rather than written
        # into this file: a committed 32-byte hex literal is indistinguishable
        # from a leaked key, to a scanner and to a reader.
        run: echo "CREDENTIALS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # Every other workspace package suite (the shared packages, modules and
      # enterprise modules) runs in `package-suites`, which discovers them.

      - name: Run @langwatch/${{ matrix.app }} tests
        id: unit-tests
        run: |
          COV=""
          if [ "${{ needs.changes.outputs.coverage }}" = "true" ]; then
            COV="--coverage --coverage.reporter=lcov --coverage.reporter=text"
          fi
          # shellcheck disable=SC2086
          # `github-actions` annotates each failure on the diff it happened on.
          # Vitest adds it by itself when GITHUB_ACTIONS is set, but only to the
          # DEFAULT reporter list, which naming any --reporter replaces — so it
          # has to be named here or the annotations are silently dropped.
          pnpm --filter @langwatch/${{ matrix.app }} exec vitest run $COV \
            --reporter=default --reporter=github-actions \
            --reporter=json --outputFile=test-results.json \
            --dangerouslyIgnoreUnhandledErrors

      - name: Extract test failures
        if: failure()
        working-directory: apps/${{ matrix.app == 'platform-api' && 'api' || matrix.app }}
        run: bash ../../.github/scripts/extract-failures.sh test-results.json test-failures.txt

      - name: Notify Slack on new failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/${{ matrix.app == 'platform-api' && 'api' || matrix.app }}
        run: bash ../../.github/scripts/notify-slack-test-failure.sh test-unit

      - name: Upload unit test coverage to Codecov
        if: always() && hashFiles('apps/*/coverage/lcov.info') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          files: apps/api/coverage/lcov.info,apps/worker/coverage/lcov.info,apps/ui/coverage/lcov.info
          flags: unit
          name: unit-tests-${{ matrix.app }}
          fail_ci_if_error: false

  # The `.integration.test.*` files that need no datastore.
  #
  # 540 of the app's 1017 integration files declare jsdom and name no database,
  # queue or cache — they render a component and mock their boundaries. They
  # were running on `test-integration` below, which means every one of them paid
  # for a Postgres, a ClickHouse and a Redis container, a Prisma migration, a
  # goose install, a ClickHouse schema replay and a Helm setup before it could
  # render a button.
  #
  # This job is the unit job's shape, because those files are unit-shaped in
  # everything except their name: no `services:` block, no migrations, no helm,
  # concurrent files, a reused module registry. Which files land here is decided
  # by src/test-utils/integrationLanes.ts, which vitest.integration.config.ts
  # also calls, so the two lanes are exact complements and no file can go
  # missing from CI. See specs/ci/integration-test-lanes.feature.
  package-suites:
    needs: [changes, affected]
    # A draft or release-please PR skips the datastore suites (see `heavy`).
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    env:
      BUILD_TIME: "true"
      BASE_HOST: "localhost:3000"
      NEXTAUTH_SECRET: "nextauth-secret-for-ci-testing"
      NEXTAUTH_URL: "http://localhost:3000"
      API_TOKEN_JWT_SECRET: "api-jwt-secret-for-ci-testing"
      # The datastores this job now stands up. A package suite that needs one
      # is expected to self-skip when its connection string is absent, which is
      # exactly why they have to be PRESENT here: a suite that skips itself in
      # the only job that runs it has no coverage at all, and reports green.
      DATABASE_URL: "postgresql://langwatch_ci:ci_password@localhost:5432/langwatch_test"
      CLICKHOUSE_URL: "http://default:ci_password@localhost:8123/test_langwatch"
      REDIS_URL: "redis://localhost:6379"
      CI_REDIS_URL: "redis://localhost:6379"
      CI_CLICKHOUSE_URL: "http://default:ci_password@localhost:8123/test_langwatch"
      LANGWATCH_NLP_SERVICE: "http://localhost:5561"
      LANGWATCH_ENDPOINT: "http://localhost:3000"
      VITEST_ISOLATE_WORKER_REDIS: "1"
      CI: "true"
    runs-on: ubuntu-latest
    # Read the checkout; write only to prune this pull request's older suite results.
    permissions:
      contents: read
      actions: write
    # Bounded within a leg: PACKAGE_SUITES_CONCURRENCY suites at once, a heavy
    # suite alone, integration and browser suites one at a time (run-package-suites.ts).
    # Parallel across legs: over two hundred package suites run one after
    # another take well past two hours, so the list is split by measured weight
    # (PACKAGE_SUITES_SHARD, .github/package-suites.weights) over separate runners.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.suites-one-job == 'true' && '[1]' || '[1, 2, 3, 4, 5, 6, 7, 8]') }}
    name: package-suites (${{ matrix.shard }}/${{ strategy.job-total }})
    #
    # It DOES have services. This job absorbed the datastore lane at the
    # deployment cutover: `test-integration` existed to shard the monolith's
    # 1,017 integration files, and that corpus is gone — what is left are
    # package suites, which this job already discovers. Standing the datastores
    # up here is what keeps their integration halves running for real instead
    # of self-skipping into a green job.
    timeout-minutes: ${{ needs.changes.outputs.suites-one-job == 'true' && 120 || 45 }}

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: langwatch_ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: langwatch_test
        options: >-
          --health-cmd "PGPASSWORD=ci_password psql -U langwatch_ci -d langwatch_test -c 'select 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false

      # The migration-safety suites read the released cutoff from the newest
      # langwatch@v* tag and fail without one; this shallow clone has no tags.
      - name: Fetch release tags
        run: git fetch --no-tags --depth=1 --filter=blob:none origin '+refs/tags/langwatch@v*:refs/tags/langwatch@v*'

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "all"

      - uses: ./.github/actions/prepare-generated-files

      # Each browser lane runs `playwright install --with-deps chromium` in its own
      # script (browser-test-lane.md), and the first one on a shard spent ~17s
      # downloading Chromium. Cached by Playwright version, that install finds the
      # browser already there and only checks the system libraries. Keyed on the
      # version rather than the lockfile, so an unrelated dependency bump keeps
      # the cache and the repository's cache quota is not churned.
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(grep -m1 -oE '^  playwright@[0-9][^:]*' pnpm-lock.yaml | cut -d@ -f2)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Generate a throwaway CREDENTIALS_SECRET
        # Same reason as test-unit and test-component: anything encrypted at
        # rest has to round-trip through a real key, and a test asserting that
        # ciphertext is not readable text cannot mock the cipher it asserts on.
        run: echo "CREDENTIALS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install Goose migration tool
        run: bash .github/scripts/install-goose.sh

      - name: Start ClickHouse with storage policy
        env:
          CLICKHOUSE_PASSWORD: ci_password
        run: bash .github/scripts/start-clickhouse-with-storage-policy.sh

      # Build only: the upgrade runs below without BUILD_TIME, which it reads as
      # "no datastore here" (that made every package suite skip).
      - name: Build workspace packages
        run: pnpm run ensure:built

      # BUILD_TIME is set job-wide and the ClickHouse migrator returns early
      # under it, so the whole upgrade runs here with it unset, once.
      - name: Run the upgrade (Postgres and ClickHouse migrations)
        working-directory: apps/tasks
        # ClickHouse's HTTP probe can answer SELECT 1 via curl while the
        # Node @clickhouse/client still sees ECONNREFUSED on its first
        # connect (IPv6/IPv4 dual-stack bind race under --network host).
        # Retry the whole migrate step a couple of times to absorb the
        # cold-start window. BUILD_TIME is unset for this one command: the
        # task reads it as "no datastore here" and returns without migrating.
        run: |
          for i in 1 2 3; do
            if env -u BUILD_TIME pnpm task upgrade; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "upgrade attempt $i failed; sleeping 5s and retrying"
              sleep 5
            fi
          done
          exit 1

      # The chart-rendering suites shell out to `helm template` and skip
      # themselves when helm or the chart dependencies are missing. That
      # honesty is only honest if CI supplies both — otherwise the suite
      # reports "skipped", the job exits 0, and every guard it contains is
      # silently unenforced. REQUIRE_HELM_TESTS below turns a skip into a
      # failure, so this setup can never quietly rot.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Build chart dependencies
        run: pnpm exec nx run chart-langwatch:helm:deps --outputStyle=static

      # The suites' own Nx cache, apart from the build cache so it holds only test
      # results and stays small. Per shard: a re-push to the same change splits alike.
      # Main's one job saves under `all`, which a shard falls back to.
      - name: Restore the package suite results
        if: ${{ !((github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/suites
          key: ${{ runner.os }}-nx-suites-${{ needs.changes.outputs.suites-one-job == 'true' && 'all' || matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-suites-${{ needs.changes.outputs.suites-one-job == 'true' && 'all' || matrix.shard }}-
            ${{ runner.os }}-nx-suites-all-

      - name: Restore the package suite results, saving them at the end of the job
        if: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/suites
          key: ${{ runner.os }}-nx-suites-${{ needs.changes.outputs.suites-one-job == 'true' && 'all' || matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-suites-${{ needs.changes.outputs.suites-one-job == 'true' && 'all' || matrix.shard }}-
            ${{ runner.os }}-nx-suites-all-

      - uses: ./.github/actions/prune-pr-caches
        with:
          prefix: ${{ runner.os }}-nx-suites-${{ matrix.shard }}-

      - name: Adopt the restored suite results index
        run: mkdir -p .nx/suites/data && bash .github/scripts/adopt-nx-cache-index.sh .nx/suites/data

      # Vitest's transformed modules (fsModuleCache), kept between runs so a suite
      # skips the transform share of its time (specs/ci/package-suites-transform-cache.feature).
      # Vitest keys each entry by the module's own source, the vitest config and its
      # plugins, and drops the whole cache when the lockfile changes. It does not key
      # how an import resolves (package manifests) or what a tsconfig tells the
      # transform, so a cache is restored only when those are identical too: the
      # hash is over the blob ids of the lockfile, every package.json and tsconfig,
      # and packages/vitest-config: the shared config is loaded from the package, so
      # vitest does not count its source (plugin options, React compiler) as a config file.
      # Main's one job saves under `all`, which a shard falls back to: entries are keyed by content.
      - name: Hash what a cached transform depends on besides its source
        id: transform-inputs
        run: echo "hash=$(git ls-files -s -- pnpm-lock.yaml '*package.json' '*tsconfig*.json' packages/vitest-config | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore the vitest transforms
        if: ${{ !((github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: ${{ runner.os }}-vitest-transforms-${{ needs.changes.outputs.suites-one-job == 'true' && 'all' || matrix.shard }}-${{ steps.transform-inputs.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitest-transforms-${{ needs.changes.outputs.suites-one-job == 'true' && 'all' || matrix.shard }}-${{ steps.transform-inputs.outputs.hash }}-
            ${{ runner.os }}-vitest-transforms-all-${{ steps.transform-inputs.outputs.hash }}-

      - name: Restore the vitest transforms, saving them at the end of the job
        if: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: ${{ runner.os }}-vitest-transforms-${{ needs.changes.outputs.suites-one-job == 'true' && 'all' || matrix.shard }}-${{ steps.transform-inputs.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitest-transforms-${{ needs.changes.outputs.suites-one-job == 'true' && 'all' || matrix.shard }}-${{ steps.transform-inputs.outputs.hash }}-
            ${{ runner.os }}-vitest-transforms-all-${{ steps.transform-inputs.outputs.hash }}-

      - uses: ./.github/actions/prune-pr-caches
        with:
          prefix: ${{ runner.os }}-vitest-transforms-${{ matrix.shard }}-

      - name: Run every workspace package suite
        env:
          NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/suites/cache
          NX_WORKSPACE_DATA_DIRECTORY: ${{ github.workspace }}/.nx/suites/data
          REQUIRE_HELM_TESTS: "1"
          PACKAGE_SUITES_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          # Each suite gets two vitest workers (patches/vitest@5.0.1.patch), so one
          # at a time left half the cores idle. A heavy suite still runs alone.
          PACKAGE_SUITES_CONCURRENCY: "2"
          # A pull request runs the suites its change reaches; main runs all.
          PACKAGE_SUITES_ONLY: ${{ needs.affected.outputs.projects }}
          # The hook records what each cached suite reads outside its package (ADR-150).
          TEST_READS_OUT: ${{ runner.temp }}/test-reads
        run: |
          export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--require $GITHUB_WORKSPACE/dev/nx/test-reads-hook.cjs"
          node --experimental-strip-types .github/scripts/run-package-suites.ts

      # The suites that walk the whole tree, uncached and on every change (ADR-150).
      - name: Run the repo-scanning suites
        if: ${{ matrix.shard == 1 }}
        run: pnpm exec nx run-many -t test:repo --outputStyle=static

      # A read outside what the test cache key hashes replays a stale pass once that file
      # changes; this names the `reads` row that closes it. Runs after a red suite too.
      - name: Check suites declare what they read outside their package
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types .github/scripts/check-test-reads.ts "$RUNNER_TEMP/test-reads"

      # Keeps the saved cache bounded. Nothing records which entry a run read: a
      # restored file keeps the time it was first written, so purging by age would
      # drop the hottest entries first. A new lockfile, manifest, tsconfig or shared
      # config already starts a fresh cache (the key above); between those, a cache
      # past 400 MB is emptied, so the save stores a small one the next run restores.
      - name: Drop the vitest transforms before saving if they grew past 400 MB
        if: ${{ !cancelled() }}
        run: size=$(du -sm node_modules/.vitest-cache 2>/dev/null | cut -f1); if [ "${size:-0}" -gt 400 ]; then rm -rf node_modules/.vitest-cache && mkdir -p node_modules/.vitest-cache; fi

  # Its own job, so a run that times out (cancelled, no failed step) still posts.
  package-suites-notify:
    needs: [changes, package-suites]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.package-suites.result == 'failure' || needs.package-suites.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      # A repeat counts a failed or cancelled (timed-out) job in the previous
      # finished main run, so a timeout posts once too (tools/slacknotify).
      - name: Notify Slack on failure
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: go run ./cmd/slacknotify -job "package-suites (1/1)"

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    env:
      # 0 turns off oxlint's local slot queue (patches/oxlint@1.85.0.patch). On a
      # runner only this job uses, it parks the third process of `lint:types`.
      LANGWATCH_LINT_SLOTS: "0"
    # Read-only. This job used to carry `pull-requests: write` so that a
    # reviewdog pass could post inline lint annotations through the Review
    # API. The Oxlint gate reports through the job's exit code and writes
    # nothing back, so the write scope went with it.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          # `--no-renames` is not ours to set here, so keep in mind that a PR
          # which does touch docs/ will lazily fetch just those blobs when the
          # diff below reads them — correct, and rare.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false

      # Oxlint's type-aware pass resolves every governed file's imports, so it
      # needs every workspace project installed, not only the applications'.
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "all"

      # The ADR-076 workspace invariants: one lockfile, one workspace
      # definition, no member carrying overrides pnpm would ignore, the app and
      # the SDK on different names. They previously ran only in
      # npx-server-smoke, which is deliberately NOT a required check and whose
      # path filter misses most of the manifests these assert about — so the
      # exact drift they exist to catch (a second lockfile reappearing, a
      # member overrides block) merged with no job running at all. This job is
      # required via langwatch-app-complete and now triggers on the root
      # manifests. Takes ~200ms.
      - name: Check the workspace invariants (ADR-076)
        run: pnpm --filter @langwatch/server run test:invariants

      - name: Oxfmt (blocking)
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Architecture policy tests (blocking)
        if: ${{ !cancelled() }}
        run: |
          pnpm --filter @langwatch/architecture-enforcer typecheck
          pnpm --filter @langwatch/architecture-enforcer test

      - name: Oxlint rule tests (blocking)
        if: ${{ !cancelled() }}
        run: pnpm --filter @langwatch/oxlint-rules test

      - name: Lint rule reference is current (blocking)
        if: ${{ !cancelled() }}
        run: pnpm --filter @langwatch/architecture-enforcer docs:check

      # Every tsconfig's project references match the Nx project graph, as `nx sync`
      # (@nx/js:typescript-sync) writes them. ADR-150's 2026-10-10 amendment.
      - name: TypeScript project references are in sync (blocking)
        if: ${{ !cancelled() }}
        run: NX_LOAD_DOT_ENV_FILES=false pnpm exec nx sync:check

      # `pnpm lint:architecture` in CI: the architecture-enforcer policies that
      # read zero findings on this tree, named one by one; a policy joins the
      # list when its findings reach zero. `declarations` is left out because
      # it reads the output of `tsc -b`.
      - name: Architecture lint (blocking)
        if: ${{ !cancelled() }}
        run: >-
          pnpm --filter @langwatch/architecture-enforcer lint --
          --no-declarations
          --policies application-boundaries,default-test-lane,prisma-migration-access,prisma-table-ownership,service-projection-boundaries,workspace-seams,teaching-citations,deleted-spellings-in-teaching,lint-rule-skill-pointers,feature-configuration,rest-namespace-owners,cycles,architecture-records,browser-package-exports,manifests,browser-node-leak,migration-owners,eventing-table-access,feature-layout,service-ceilings,rerunnable-migrations

      # THE GATE. Oxlint over the whole governed tree, and a non-zero exit
      # fails the job. A config error and a lint violation both surface here.
      #
      # It replaced a two-part step: a blocking full-tree lint plus a
      # reviewdog pass that made the previous linter's `warn`-tier rules
      # blocking on the lines a PR added, gated by a script that counted
      # violations per (file, rule) on both sides of the merge base and
      # failed only on an increase. See
      # packages/architecture-enforcer/adrs/003-unified-oxc-toolchain.md.
      #
      # NONE OF THAT MACHINERY HAS AN EQUIVALENT HERE, AND NONE IS NEEDED.
      # It existed because that ruleset carried a warn tier with a baseline
      # in the thousands, and a rule that cannot block full-tree has to be
      # narrowed to the diff somehow. /.oxlintrc.jsonc has no
      # warn tier: a rule is `error` for the whole tree, and where a backlog
      # exists the offending files are named in the debt register at the
      # bottom of that file. The gate is full-tree and the register is the
      # exemption, in place of a diff filter that had to guess which findings
      # the author wrote.
      #
      # The register is also strictly better on the failure mode that
      # motivated the delta gate: a formatter rewrapping a signature re-added
      # the declaration line and handed the PR a whole function's backlog,
      # because the rules anchored there counted lines. No carried rule
      # counts lines, so nothing anchors that way any more.
      #
      # What IS lost: inline annotations on the diff. Findings now arrive as
      # job output rather than as review comments.
      #
      # `pnpm lint` runs oxlint's native rules and the langwatch plugin as two
      # parallel processes. A PR lints what it affected (dependents included, since
      # the cross-file rules can fail in a file the PR did not touch); a push runs all.
      # The Prisma client, the generated SDK types and the built SDK dist are
      # imports the type-aware rules resolve; without them they read as `any`.
      - uses: ./.github/actions/prepare-generated-files
        if: ${{ !cancelled() }}

      # After the generated files, so the REST cross-check can mount the api.
      - name: Set up Go
        if: ${{ !cancelled() }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"

      # After the generated files: listing the steps boots the tasks app, which imports the built SDK.
      - name: Image code step list is current (blocking)
        if: ${{ !cancelled() }}
        run: node --disable-warning=ExperimentalWarning --experimental-transform-types packages/upgrade/scripts/image-code-steps.ts --check

      - name: Generated READMEs are current (blocking)
        if: ${{ !cancelled() }}
        run: pnpm check:readmes

      # A PR lints what it affected; a push, or a global lint input changing, lints
      # every project. Nx diffs the lockfile per package, but oxlint is a root tool
      # no project reaches, so a lockfile change that moves it lints everything.
      - name: Decide the lint scope
        if: ${{ !cancelled() }}
        id: lint-scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null && ! git diff --name-only "$BASE" HEAD \
            | grep -qE '^(\.oxlintrc(\.[a-z]+)?\.jsonc|packages/oxlint-rules/|pnpm-workspace\.yaml|nx\.json|tsconfig(\.[a-z]+)?\.json|dev/nx/)' \
            && ! git diff "$BASE" HEAD -- pnpm-lock.yaml | grep -qE '^[-+].*oxlint'; then
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Oxlint (blocking -- config errors included)
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.lint-scope.outputs.base }}
        run: pnpm lint ${BASE:+--base "$BASE"}

      # Type-aware rules over the affected projects in one process (shared parse;
      # ADR-150), beside the native and plugin processes its directive check needs.
      - name: Oxlint type-aware, affected projects (blocking)
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.lint-scope.outputs.base }}
        run: pnpm lint:types ${BASE:+--base "$BASE"}

      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: go run ./cmd/slacknotify -job lint

  feature-parity:
    needs: changes
    if: needs.changes.outputs.feature-parity == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/architecture-enforcer..."

      # The parity scanner moved into @langwatch/architecture-enforcer with the
      # rest of the repository-wide checks.
      - name: Check feature-file parity
        run: pnpm --filter @langwatch/architecture-enforcer run check:feature-parity

      # The dev scripts' own node:test suites (log renderer, supervisor watch)
      # ran in no job until now. TZ=UTC because the
      # log renderer prints local wall time and the fixture is pinned to UTC.
      - name: Test dev scripts
        run: TZ=UTC node --test dev/scripts/__tests__/*.unit.test.mjs dev/nx/__tests__/*.unit.test.mjs

      - name: Set up Go for the Slack notifier
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: go run ./cmd/slacknotify -job feature-parity

  # The SDK clients and the docs site copy against the OpenAPI document the
  # routes generate.
  #
  # The document itself is never committed: the api builds it from the routes
  # it mounts, and `pnpm --filter @langwatch/platform-api openapi:generate`
  # writes the same document to specs/api-reference/openapi-document.json,
  # which git ignores. The TypeScript, Python and Go clients and the docs copy
  # are generated from it and committed, so this job regenerates all of them
  # with `make sync-all-openapi` and fails when any of them changes. The fix is
  # to run the same target locally and commit the result.
  openapi-clients:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/platform-api... @langwatch/ui... langwatch..."

      - uses: ./.github/actions/prepare-generated-files

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdks/go/client/go.mod
          cache: true
          cache-dependency-path: sdks/go/client/go.sum

      # The default cache glob is **/uv.lock, which walks the installed
      # node_modules tree; name the workspace lockfile instead.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-dependency-glob: uv.lock

      - name: Regenerate the clients and the docs copy
        run: make sync-all-openapi

      - name: Check the committed clients match the routes
        run: |
          STALE=0
          if ! git diff --exit-code --stat; then
            STALE=1
          fi
          UNTRACKED=$(git ls-files --others --exclude-standard \
            sdks/typescript/src/internal/generated/openapi \
            sdks/python/src/langwatch/generated \
            sdks/go/client/internal/openapi \
            docs/api-reference)
          if [ -n "$UNTRACKED" ]; then
            echo "These generated files are not committed:"
            echo "$UNTRACKED"
            STALE=1
          fi
          if [ "$STALE" = "1" ]; then
            echo "::error::The committed OpenAPI clients or docs copy do not match the routes. Run 'make sync-all-openapi' and commit the result."
            exit 1
          fi

      - name: Set up Go for the Slack notifier
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: go run ./cmd/slacknotify -job openapi-clients

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    # Read the checkout; write only to prune this pull request's older cache copies.
    permissions:
      contents: read
      actions: write
    env:
      # Disable telemetry and optimize build for CI
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false

      # Cache Prisma client separately for faster regeneration
      - name: Cache Prisma client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/prisma-client/src/generated
          key: ${{ runner.os }}-prisma-${{ hashFiles('packages/prisma-client/prisma/schema.prisma') }}

      # Cache Vite build artifacts.
      #
      # The key deliberately does NOT hash apps/ui/src/**. It used to,
      # which made the primary key change on every commit: the cache was
      # therefore never a hit, and every run still wrote a fresh multi-MB
      # entry, churning the repository's 10GB cache quota for a cache that
      # could not be read. Hashing that tree also costs real time on its own.
      #
      # What is cached here is Vite's dependency pre-bundle, which is keyed by
      # the dependency set, not by app source — and Vite re-optimizes on its
      # own when its internal hash moves. So the key tracks the lockfile and
      # the Vite config, and nothing else.
      - name: Cache Vite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ui/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'apps/ui/vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      # node-pty@1.1.0 only ships prebuilds for darwin/win32, so on Linux
      # its postinstall always falls back to `node-gyp rebuild`, which pnpm
      # runs with its own vendored node-gyp. That copy ships `gyp/gyp_main.py`
      # mode 644, so an mtime-driven Makefile regeneration executes it and
      # dies with "Permission denied" / error 126. Installing node-gyp
      # globally does not displace it on its own: pnpm exports
      # `npm_config_node_gyp` at its vendored copy and that wins over PATH.
      # Point the variable at the published node-gyp, which ships the script
      # executable. sdk-javascript-ci.yml and npx-server-smoke.yml do the same.
      - name: Install node-gyp (for node-pty postinstall)
        shell: bash
        run: |
          set -euo pipefail
          npm install -g node-gyp@12.3.0
          gyp="$(npm root -g)/node-gyp/bin/node-gyp.js"
          test -f "$gyp"
          test -x "$(dirname "$gyp")/../gyp/gyp_main.py"
          echo "npm_config_node_gyp=$gyp" >> "$GITHUB_ENV"

      # One install covering the three deployables. mcp-server is a workspace
      # dependency of the API through @langwatch/hosted-mcp-process, so the
      # trailing `...` pulls it in. See ADR-076.
      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: >-
            @langwatch/platform-api...
            @langwatch/worker...
            @langwatch/ui...
            @langwatch/workspace

      # build:types reads the generated Prisma client and the SDK's
      # declarations, so the generated files and the four dist-resolving
      # packages (SDK, mcp-server, ksuid, mail) come first.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"

      # Before the first nx call, so prepare's tasks read and fill it too.
      - uses: ./.github/actions/nx-cache
        with:
          suffix: build

      - name: Prepare files
        run: pnpm start:prepare:files && pnpm ensure:built

      # apps/api and apps/worker declare no build — they run from source through
      # node. What is built here is the browser bundle the API process serves,
      # plus every workspace dependency that has a build of its own.
      - name: Build
        run: pnpm run build:types && pnpm exec nx run @langwatch/ui:build --outputStyle=static

      # A successful `vite build` only proves the bundle compiles, not that it
      # boots. Serve the built output and load it in a headless browser to
      # catch runtime boot failures (white screens from chunk-init errors).
      # Uses the runner's preinstalled Google Chrome (no browser download).
      - name: Boot smoke test
        timeout-minutes: 8
        working-directory: apps/ui
        env:
          SMOKE_BROWSER_CHANNEL: chrome
        run: |
          node --test scripts/__tests__/smoke-boot.browser.test.mjs
          pnpm exec vite preview --configLoader runner --port 4173 --outDir dist/client &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          # Under the runner's `bash -e`, a non-zero exit here fails the step
          # (the gate we want); the EXIT trap still stops the preview server.
          node scripts/smoke-boot.mjs

      - name: Set up Go for the Slack notifier
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: go run ./cmd/slacknotify -job build

  ci-scripts-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false

      - name: Test extract-failures.sh
        run: bash .github/scripts/__tests__/extract-failures.test.sh

      - name: Test vitest-changed-files.sh
        run: bash .github/scripts/__tests__/vitest-changed-files.test.sh

      - name: Test start-clickhouse-with-storage-policy.sh
        run: bash .github/scripts/__tests__/start-clickhouse-with-storage-policy.test.sh

      - name: Test notify-slack-release.sh
        run: bash .github/scripts/__tests__/notify-slack-release.test.sh

      - name: Test release-docs.sh
        run: bash .github/scripts/__tests__/release-docs.test.sh

      - name: Test run-package-suites.ts
        run: node --test --experimental-strip-types .github/scripts/run-package-suites.test.ts

      - name: Test check-test-reads.ts
        run: node --test --experimental-strip-types .github/scripts/check-test-reads.test.ts

      - name: Test check-added-images.sh
        run: bash .github/scripts/__tests__/check-added-images.test.sh

      - name: Test publish-lambda-tag.sh
        run: bash .github/scripts/__tests__/publish-lambda-tag.test.sh

      - name: Test publish-docker-ecr.yml path filters
        run: bash .github/scripts/__tests__/publish-ecr-filters.test.sh

      - name: Test nearest-ancestor-tag.sh
        run: bash .github/scripts/__tests__/nearest-ancestor-tag.test.sh

      - name: Test detect-changes-source.sh
        run: bash .github/scripts/__tests__/detect-changes-source.test.sh

      - name: Test detect-changes-by-sha.sh
        run: bash .github/scripts/__tests__/detect-changes-by-sha.test.sh

      - name: Test pull-request-diff-base.sh
        run: bash .github/scripts/__tests__/pull-request-diff-base.test.sh

      - name: Test the change detector's pathspec parity with dorny's matcher
        run: |
          picomatch_dir="$(mktemp -d)"
          npm install --prefix "$picomatch_dir" --no-save --no-audit --no-fund picomatch@^2.3.1
          export PICOMATCH="$picomatch_dir/node_modules/picomatch"
          bash .github/scripts/__tests__/detect-changes-pathspec-parity.test.sh

      # Lives here rather than in deployment-impact-check.yml because that
      # workflow filters `on.paths` down to deployment surface, which
      # .github/** is not — so it would never start for a change to its own
      # guard. This job's gate already lists `.github/scripts/**`.
      - name: Test guard-deployment-impact.ts
        run: node --test --experimental-strip-types .github/scripts/guard-deployment-impact.test.ts

      - name: Test that every generated file is marked generated
        run: node --test --experimental-strip-types .github/scripts/generated-attributes.test.ts

      - name: Test the PR impact map categories
        run: node --test --experimental-strip-types .github/scripts/pr-impact-map-categories.test.ts

      # The nightly suite's reports and its workflow promises (specs/ci/nightly-suite.feature).
      - name: Test the nightly suite's scripts
        run: >-
          node --test --experimental-strip-types
          .github/scripts/nightly-hygiene.test.ts
          .github/scripts/nightly-flaky.test.ts
          .github/scripts/nightly-dashboard.test.ts
          .github/scripts/nightly-workflows.test.ts

      - name: Test when release pull requests refresh
        run: node --test --experimental-strip-types .github/scripts/release-please-timer.test.ts

  ci-self-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/platform-api..."

      - name: Stage canary fixture inside vitest root
        working-directory: apps/api
        run: cp ../../.github/scripts/__fixtures__/intentional-failure.test.ts ./src/_ci_canary.test.ts

      - name: Run intentional failure
        id: canary
        continue-on-error: true
        working-directory: apps/api
        run: |
          pnpm exec vitest run src/_ci_canary.test.ts \
            --reporter=default --reporter=json --outputFile=test-results.json

      - name: Extract failures
        if: always()
        working-directory: apps/api
        run: bash ../../.github/scripts/extract-failures.sh test-results.json test-failures.txt

      - name: Assert detection worked
        if: always()
        run: |
          if [ "${{ steps.canary.outcome }}" != "failure" ]; then
            echo "FAIL: canary step should have failed (vitest should exit non-zero for a failing test), got outcome=${{ steps.canary.outcome }}"
            exit 1
          fi
          if [ ! -s apps/api/test-failures.txt ]; then
            echo "FAIL: test-failures.txt is missing or empty — failure extraction did not work"
            exit 1
          fi
          echo "PASS: canary failed as expected and failures were extracted"
          cat apps/api/test-failures.txt

  langwatch-app-complete:
    needs: [
        changes,
        # `affected` decides test-unit's matrix, and test-unit is an allowed
        # skip. It is named here so its own result votes: a failed `affected`
        # fails this gate, since allowed-skips excuses only a skip. It is
        # also in allowed-skips because it skips when `changes` found no
        # relevant path, and then there is nothing for it to select.
        affected,
        typecheck,
        test-unit,
        package-suites,
        lint,
        feature-parity,
        openapi-clients,
        build,
        ci-scripts-test,
        ci-self-test,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2

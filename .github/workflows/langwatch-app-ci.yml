# Always-run workflow with internal path gating + aggregator. See #3223.
# Branch protection requires `langwatch-app-complete`. Upstream jobs
# skip when paths don't match, and `alls-green` reports the final
# consolidated status — no per-step `if:` guards needed.
#
# LEAN CHECKOUT
# Every checkout below excludes the repository's marketing media: docs/media,
# docs/images and assets/. Together they are 165 MB of .gif and .mp4 — a
# single 26 MB mp4, gifs of 20/16/10 MB — against 81 MB for platform/, the
# thing we actually build. Naming a sparse-checkout makes actions/checkout
# fetch with `--filter=blob:none`, so those blobs never cross the wire at
# all. Measured on a depth-1 clone: 180 MB -> 42 MB of .git, 490 MB ->
# 188 MB on disk.
#
# It excludes the MEDIA, not docs/ wholesale, and that distinction is load
# bearing. error-remediation.unit.test.ts resolves ../../../../../../docs and
# asserts every remediation link maps to a real .mdx, so dropping all of
# docs/ fails three test-unit shards. The .mdx tree is ~10 MB of the 138;
# the media is the other 128, and nothing in CI reads it.
#
# That is per checkout, and this workflow runs a dozen of them. It also
# compresses the tail, which is what actually sets wall clock: in run
# 31396568900 the six integration shards spent 9s, 9s, 10s, 19s, 151s and
# 185s in checkout, and the job totals tracked it (599s vs 891s).
#
# Non-cone mode is deliberate. Cone mode only accepts an include list, so
# every new top-level directory would silently go missing from CI until
# someone noticed; the negation form says what we are dropping and lets
# everything else through by default.
name: langwatch-app-ci

on:
  push:
    branches:
      - main
  # ready_for_review is NOT a default pull_request activity type. Without it,
  # taking a PR out of draft fires no event, so the heavy jobs gated on
  # `draft == false` below would never get their first run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

env:
  NODE_ENV: "test"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede an outdated run on a PR branch, never on main: every commit
  # that lands on main has to keep its own validation, and cancelling here
  # would let a merge silently void the run for the commit before it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      feature-parity: ${{ steps.detect.outputs.feature-parity }}
      # Draft PRs get the fast, cheap signal only: lint, ast-grep, typecheck,
      # feature-parity. The 10 test shards and the build are the runner budget,
      # and on a draft they mostly re-run against work in progress.
      #
      # Everything heavy comes back on ready_for_review, and `merge_group`
      # is never a draft — so nothing reaches main without the full suite
      # having run on it.
      heavy: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
      # One shard each on a draft, because the draft run is affected-tests-only
      # and a subset does not need splitting.
      #
      # Integration runs four shards, each running its files serially.
      #
      # An earlier four-shard split traded wall-clock for runner-minutes on the
      # strength of running two files AT ONCE inside a shard, and it did not
      # hold: shards ran 7.4-9.2 min against the ~6 min the six-way serial split
      # took, and two groupQueue suites began failing non-deterministically with
      # Redis state disappearing underneath them (a staged job never dispatched;
      # `j1` gone from a group set). That is why files are still serial here.
      #
      # The two kinds of parallelism are not interchangeable. A shard is its
      # own runner with its own Redis service container, so shards cannot
      # reach each other. Files inside a shard share one Redis server and are
      # kept apart only by logical-database juggling, which is exactly what
      # stopped holding. Buy the parallelism where it is free.
      #
      # Four is affordable again for a different reason: the lane is now ~477
      # files rather than 1024, because the ones that never needed a datastore
      # moved to `test-component`. Fewer files over fewer shards, with files
      # still strictly serial — the property above is untouched.
      #
      # The counts below are the `--shard=N/COUNT` denominators, and they MUST
      # track the arrays. They were a literal `/4` in both run steps, which is
      # how raising integration to six produced `--shard=5/4` and a startup
      # error. Emitting the count next to the array is what keeps the two from
      # drifting apart again.
      #
      # It also fixes the draft case, which was silently wrong: a draft got
      # `shards: [1]` and still ran `--shard=1/4`, so it executed a quarter of
      # its files while reporting a pass over all of them.
      unit-shards: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && '[1,2,3,4]' || '[1]' }}
      unit-shard-count: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && '4' || '1' }}
      # Six became four when the component lane took the files that never
      # needed a datastore. 540 of the 1017 integration files declare jsdom and
      # name no database, queue or cache; they now run on `test-component`
      # below, with no service containers at all. What is left here is ~477
      # files that genuinely talk to something, so the same per-shard file count
      # fits in fewer shards — and two runners come off the critical path,
      # which is its own win while every shard is queueing 5-10 minutes for one.
      #
      # The lane splits again by whether a file can share a module registry.
      # Import was 42% of this lane's runner time — ~1.6s per file rebuilding
      # the same Prisma client and server graph — and 331 of the 477 files can
      # share one. The other 146 call `vi.mock`, which cannot apply to a
      # registry an earlier file already populated, so they keep isolation.
      # See packages/test-harness/src/integration-module-graph.ts.
      #
      # Two shards each rather than four of one kind: measured on src/app/api,
      # the shared lane runs ~4x faster per file, so 331 shared files and 146
      # mocking ones are close to balanced at 2+2 — the same four runners as
      # before, finishing sooner.
      integration-matrix: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && '[{"lane":"shared","shard":1,"count":2},{"lane":"shared","shard":2,"count":2},{"lane":"mocking","shard":1,"count":2},{"lane":"mocking","shard":2,"count":2}]' || '[{"lane":"shared","shard":1,"count":1},{"lane":"mocking","shard":1,"count":1}]' }}
      # The component lane is unit-shaped: forked VM workers and concurrent
      # files, with no service containers to wait on, so a shard gets through
      # its files far faster than a datastore shard does. (It does NOT share a
      # module registry the way the unit lane does, see the `isolate` note in
      # vitest.component.config.ts.)
      #
      # Three rather than two, because two put the lane inside a minute of the
      # hard floor. The floor in src/test-unit-global-setup.ts fires at 4 min
      # and is calibrated for a lane whose healthy shard takes ~3 min; measured
      # on 540 files over two shards, shard 1 spent 3m34s in the test step, so
      # 26 seconds separated a green lane from one the floor cut mid-run. Six
      # more files crossed it. The floor then reports the shard as red with no
      # failed test in it, which reads as a wedge rather than as a lane that
      # outgrew its split, so the cost of being close to it is a confusing
      # failure rather than a slow pass. Every PR that adds a component test
      # spends that margin, so the split has to leave some.
      component-shards: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && '[1,2,3]' || '[1]' }}
      component-shard-count: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && '3' || '1' }}
      # Coverage instrumentation costs ~45% of the run (measured: a unit subset
      # goes 3.7s -> 6.6s with --coverage). Nothing gates on it — there is no
      # codecov.yml, no codecov status check, and both uploads are
      # fail_ci_if_error: false — so it is a trend line, not a gate.
      #
      # A trend line does not need recomputing on every merge to main. It now
      # runs on the weekly schedule and on demand, which keeps the graph while
      # taking the instrumentation off the path between a merge and a green
      # main. The provider is already the fast one (vitest 4 defaults to v8,
      # not istanbul), so frequency was the only lever left.
      coverage: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      # Refresh the shard sequencer's duration weights.
      #
      # The sequencer splits the matrix by measured cost where it has a figure
      # and by file size where it does not (src/test-utils/shardWeights.ts). The
      # figures come from vitest.durations.json, which is COMMITTED rather than
      # cached, because every shard computes the split independently and they
      # must all read identical weights — a manifest one shard has and another
      # does not means two different splits, and a file silently running twice
      # or not at all.
      #
      # So the run that WRITES the manifest is deliberately not the run that
      # reads it: dispatch this workflow manually, download the
      # `shard-durations` artifact it produces, and commit it. On demand rather
      # than on a schedule because it is a handful of seconds of imbalance, not
      # a correctness gate, and a weekly bot PR against a 1000-entry generated
      # file is a poor trade for that.
      durations: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The gate reads no working-tree content: on pull_request events
          # dorny/paths-filter takes the changed-file list from the API, and
          # every file this job needs on disk lives under .github/. Checking
          # out the rest of the tree is pure runner time.
          sparse-checkout: .github
      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          filters: |
            relevant:
              # The three deployable applications — apps/api, apps/worker,
              # apps/ui — plus apps/server, the npx self-host CLI. This IS the
              # code these jobs exist to protect: the monolith they were
              # written for is gone, and every transport, router, worker
              # installer and browser screen lives here or under packages/.
              - 'apps/**'
              # Workspace members the applications' `...` closures install from
              # source — a change there is a change to all three.
              - 'packages/**'
              # @langwatch/langyworker tests + typecheck run on unit shard 1;
              # without this a wrapper-only change runs zero app CI.
              - 'services/langyworker/**'
              # The single lockfile, workspace definition, root manifest and
              # hoist config all live at the repo root since ADR-076. A PR that
              # bumps a dependency or adds a security override touches ONLY
              # these — without them here, such a PR runs zero app CI while
              # langwatch-app-complete reports success via allowed-skips.
              # Dependabot targets the root weekly, so that is the common case,
              # not the odd one.
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              # NOTE: 'charts/**' is deliberately NOT listed. Integration suites
              # do render the chart and assert on the output, so a chart-only
              # edit can break a package test without touching a file
              # there — but this one flag gates nine jobs (typecheck, every unit
              # and integration shard, e2e), so adding it would run the entire
              # app suite for a comment change in values.yaml. That trade is a
              # repo-wide cost decision, not part of this change; tracked
              # separately.
              - '.github/workflows/langwatch-app-ci.yml'
              - '.github/.release-please-manifest.json'
              - '.github/scripts/**'
              # Composite actions are covered by ci-scripts-test through the
              # scripts they call, so an edit that only touches an action.yml
              # has to reach the gate too.
              #
              # NAMED, not `.github/actions/**`. This flag gates nine jobs —
              # typecheck, all ten test shards, build, e2e — and the glob
              # matched every composite action in the repository, including
              # ones this workflow has never used. A pull request adding
              # `.github/actions/go-build-cache` for go-ci ran the entire app
              # suite on two Go CI files and nothing else.
              #
              # The trade is real and worth stating: a list can go stale where
              # a glob cannot. If you add a `uses: ./.github/actions/<name>`
              # step to this workflow, add it here in the same edit, or an
              # edit to that action will silently not re-run the suite it
              # feeds. These three are every action this file currently uses
              # (`grep -o "uses: \./\.github/actions/[a-z-]*"`).
              - '.github/actions/detect-changes/**'
              - '.github/actions/prepare-generated-files/**'
              - '.github/actions/setup-pnpm-node/**'
            # The parity scanner binds @scenario annotations from test files
            # across many roots, not just specs/. This list MUST
            # cover every root the scanner reads (DEFAULT_TEST_ROOTS,
            # DEFAULT_GO_TEST_ROOTS, DEFAULT_PYTHON_TEST_ROOTS,
            # DEFAULT_BATS_TEST_ROOTS, DEFAULT_SHELL_TEST_ROOTS in
            # the parity scanner),
            # otherwise a binding change in an unlisted root merges without the
            # gate ever running and silently breaks parity on main (e.g. #5143
            # edited only dev/scripts/__tests__/*.bats and slipped through).
            feature-parity:
              - 'specs/**'
              - 'charts/langwatch/tests/**'
              - 'charts/gateway/tests/**'
              - 'apps/**'
              - 'packages/**'
              - 'skills/**'
              - 'plugins/**'
              - 'tools/**'
              - 'mcp/typescript/**'
              - 'sdks/typescript/**'
              - 'sdks/python/**'
              - 'sdks/go/**'
              - 'services/**'
              - 'pkg/**'
              - 'services/langevals/**'
              - 'dev/scripts/**'
              - '.github/scripts/**'
              - '.github/workflows/langwatch-app-ci.yml'

  typecheck:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/platform-api... @langwatch/worker... @langwatch/ui..."

      - uses: ./.github/actions/prepare-generated-files

      # tsc writes incremental .tsbuildinfo caches to explicit paths under each
      # application's node_modules/.cache/tsbuildinfo (see their tsconfig.json).
      # A warm cache turns the full cold check into a revalidation of only the
      # files whose content changed. Restored after install so pnpm can't
      # clobber it; keyed rolling per-SHA with a prefix fallback so every run
      # refreshes the cache off the most recent match (mirrors the Turbo cache
      # pattern used by the build job).
      - name: Cache TypeScript incremental build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/api/node_modules/.cache/tsbuildinfo
            apps/worker/node_modules/.cache/tsbuildinfo
            apps/ui/node_modules/.cache/tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', 'apps/*/tsconfig.json', 'apps/*/tsconfig.test.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', 'apps/*/tsconfig.json', 'apps/*/tsconfig.test.json') }}-
            ${{ runner.os }}-tsbuildinfo-

      # Each application's own `typecheck` runs its source and its tests as two
      # programs, which is what the monolith's `typecheck:all` did in one.
      # `typecheck-packages` below covers everything under `packages/`.
      - name: Run typecheck (the three applications, source and tests)
        run: pnpm run typecheck

      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/notify-slack-job-failure.sh typecheck

  # Every workspace package's own typecheck, as one recursive run.
  #
  # This exists because the alternative was an allowlist and the allowlist went
  # stale exactly the way an allowlist does. 156 packages under `packages/` and
  # `apps/` declare a `typecheck` script; ten were named individually across
  # this file (identity, share, redaction, system-migrations and friends), so
  # 146 were never typechecked by CI at all — `@langwatch/api`, the design
  # system, every enterprise package, and every feature contract/server/web
  # package the core-application extraction has been moving code INTO. The root
  # `pnpm typecheck` does not cover them either: it checks the three
  # applications alone.
  #
  # `-r` runs each package's own script, so a package opts in by declaring one
  # and opts out by not declaring one. That is the property the named list
  # could not have: a package added tomorrow is covered without editing this
  # file, which is the whole failure mode being fixed.
  #
  # `install: all` because it runs every package, so every package's
  # dependencies have to be present — the same reasoning as package-suites.
  typecheck-packages:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: all

      - uses: ./.github/actions/prepare-generated-files

      # Each package writes its own .tsbuildinfo to
      # node_modules/.cache/tsbuildinfo/<pkg>.tsbuildinfo, per the repo rule
      # that every package tsconfig sets `incremental` and a per-package path.
      # Without the per-package path they would clobber each other's cache and
      # this job would be cold every time.
      - name: Cache TypeScript incremental build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/**/node_modules/.cache/tsbuildinfo
            apps/*/node_modules/.cache/tsbuildinfo
          key: ${{ runner.os }}-pkg-tsbuildinfo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pkg-tsbuildinfo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-pkg-tsbuildinfo-

      # Not --no-bail: one package's failure should not hide the rest, and a
      # migration in flight tends to break several at once. The job still fails.
      - name: Run every package typecheck
        run: pnpm -r --no-bail --filter "./packages/**" --filter "./apps/**" typecheck

      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/notify-slack-job-failure.sh typecheck-packages

  test-unit:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        # One job per deployable. The sharded matrix this replaced existed for
        # the monolith's five-thousand-file suite; the three applications hold
        # about two thousand tests between them and each is its own vitest
        # root, so the parallelism that pays is per application rather than per
        # slice of one corpus.
        app: [platform-api, worker, ui]
    env:
      VITEST_MAX_WORKERS: "4" # physical core count on GitHub-hosted ubuntu runners
      DATABASE_URL: "postgresql://langwatch_ci:ci_password@localhost:5432/langwatch_test"
      BASE_HOST: "localhost:3000"
      NEXTAUTH_SECRET: "nextauth-secret-for-ci-testing"
      NEXTAUTH_URL: "http://localhost:3000"
      API_TOKEN_JWT_SECRET: "api-jwt-secret-for-ci-testing"
      REDIS_URL: "redis://localhost:6379"
      BUILD_TIME: "true"

    runs-on: ubuntu-latest
    # Same fail-fast cap as test-integration: a worker that wedges post-test
    # (open handle, coverage finalize, etc.) should fail in ~25 min instead of
    # burning the 6h default.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          # langyworker is not a dependency of any application, and its tests
          # and typecheck run on this job's platform-api leg, so it needs its
          # own install root.
          install: "@langwatch/platform-api... @langwatch/worker... @langwatch/ui... @langwatch/langyworker..."

      - uses: ./.github/actions/prepare-generated-files

      - name: Generate a throwaway CREDENTIALS_SECRET
        # Anything encrypted at rest (webhook header values, signing secrets,
        # stored idempotency responses) needs a real key to round-trip, and a
        # test asserting that ciphertext is not readable text cannot mock the
        # cipher it is asserting about. Generated per run rather than written
        # into this file: a committed 32-byte hex literal is indistinguishable
        # from a leaked key, to a scanner and to a reader.
        run: echo "CREDENTIALS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # @langwatch/api ships raw TypeScript the app inlines, so its own suite
      # runs here rather than in a workflow of its own. Shard 1 only: the
      # package suite is not sharded, and shard 1 exists in every matrix shape
      # (drafts run [1]).
      - name: Run @langwatch/api unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/api run test:unit

      # Same reason as @langwatch/api above: a package suite is not reachable
      # from an application's vitest root, so without a step naming it, it runs
      # nowhere. `package-suites` discovers the rest; these are named here
      # because they gate this job.
      - name: Run @langwatch/redis-client unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/redis-client run test:unit

      # Same reason again. This one decides the level and the shape of every
      # request record the fleet emits, so a suite that never runs is the worst
      # place in the repo to have one — a regression here is invisible until
      # someone reads a dashboard and finds it empty.
      - name: Run @langwatch/observability unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/observability run test:unit

      # Same reason again. This package owns the retry classifier, the
      # concurrency limiter and the tenant routing every ClickHouse statement
      # passes through — and the app's own suites exercise it only through the
      # managedClient assembly, so a regression in an unassembled path (the
      # query client, the router) would otherwise ship untested.
      - name: Run @langwatch/clickhouse-client unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/clickhouse-client run test:unit

      # @langwatch/redaction is the canonical secret and PII scrubber the
      # ingestion pipeline runs on every attribute, and the CLI ships a
      # byte-for-byte copy of it. Same reason again, and the sharpest one: its
      # suite was the only thing asserting which values a rule must NOT take,
      # and while it ran nowhere a rule change reached production that blanked
      # the product's own record ids.
      - name: Run @langwatch/redaction unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/redaction run test:unit

      - name: Typecheck @langwatch/redaction
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/redaction run typecheck

      # @langwatch/authz is the pure authorization engine (ADR-092) and
      # @langwatch/authz-server its storage-port runtime — raw TypeScript the
      # app inlines the same way, same shard-1 arrangement.
      - name: Run @langwatch/authz unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/authz run test

      # @langwatch/actor is the actor vocabulary (who caused an action) —
      # dependency-free raw TypeScript, same shard-1 arrangement.
      - name: Run @langwatch/actor unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/actor run test

      - name: Run @langwatch/authz-server unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/authz-server run test

      # @langwatch/identity-contract is the pure identity core (ADR-115) and
      # @langwatch/identity-server its storage-port runtime — same raw
      # TypeScript, same shard-1 arrangement as authz. Both get the typecheck
      # step the authz pair lacks: sources and tests are only compiled here.
      - name: Run @langwatch/identity-contract unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/identity-contract run test

      - name: Typecheck @langwatch/identity-contract
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/identity-contract run typecheck

      - name: Run @langwatch/identity-server unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/identity-server run test

      - name: Typecheck @langwatch/identity-server
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/identity-server run typecheck

      # @langwatch/identity-eventing is the third of the identity trio: the
      # framework envelope, commands, folds, process managers and the four
      # pipeline definitions the worker registers. It carries the seven suites
      # that moved out of the monolith with them, so without these steps that
      # coverage would run nowhere.
      - name: Run @langwatch/identity-eventing unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/identity-eventing run test

      - name: Typecheck @langwatch/identity-eventing
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/identity-eventing run typecheck

      # @langwatch/system-migrations is the in-place data-migration runner
      # (ADR-092 stage B) — same raw-TypeScript, shard-1 arrangement.
      - name: Run @langwatch/system-migrations unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/system-migrations run test

      # `pnpm typecheck` at the root checks the three applications alone, so
      # without this the package's own TypeScript — sources and tests both — is
      # never compiled by CI at all.
      - name: Typecheck @langwatch/system-migrations
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/system-migrations run typecheck

      # @langwatch/platform-api-client owns `trpcQueryKey`, which re-derives
      # tRPC's React Query cache-key encoding from a procedure path. Every
      # feature web package invalidating a procedure its own map does not
      # declare goes through it, so if the encoding drifts from
      # `@trpc/react-query`'s the failure is silent — an invalidation that
      # matches nothing, and stale UI nobody can trace back here. Its suite is
      # the only thing that pins the encoding, and it ran nowhere.
      - name: Run @langwatch/platform-api-client unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/platform-api-client run test:unit

      - name: Typecheck @langwatch/platform-api-client
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/platform-api-client run typecheck

      # @langwatch/trace-web is the first feature web package, and the largest
      # body of browser code that left the monolith — 406 tests over 42 files,
      # none of which CI ran for a long time: a package suite is unreachable
      # from an application's vitest root.
      - name: Run @langwatch/trace-web unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/trace-web run test:unit

      - name: Typecheck @langwatch/trace-web
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/trace-web run typecheck

      # Eleven more suites that ran nowhere. Between them they hold ~4,550
      # tests and cost about a minute: `@langwatch/eventing` and
      # `@langwatch/trace-server` alone are 963 and 1,390. Every one of them
      # was red when first run, and none of the failures was a bug in the code
      # under test — they were fixtures, doubles and assertions that had drifted
      # from the interfaces around them, which is exactly what a suite nobody
      # runs turns into. Naming them here is what stops that happening again.
      # the event-sourcing framework itself — pipelines, projections, replay, the process-manager fleet.
      - name: Run @langwatch/eventing tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/eventing run test
      # the largest feature package, including the ingestion subscribers.
      - name: Run @langwatch/trace-server tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/trace-server run test
      # simulation execution and the child-process spawn policy.
      - name: Run @langwatch/scenario-server tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/scenario-server run test
      # the suite and run-plan forms.
      - name: Run @langwatch/suite-web tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/suite-web run test
      # the assistant's browser behaviour.
      - name: Run @langwatch/langy-web tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/langy-web run test
      # the studio's pickers and flows.
      - name: Run @langwatch/workflow-web tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/workflow-web run test
      # the grants vocabulary every authorization path validates against.
      - name: Run @langwatch/authz-contract tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/authz-contract run test
      # usage reporting and the Stripe error masking.
      - name: Run @langwatch/enterprise-billing-server tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/enterprise-billing-server run test
      # the back-office single sign-on surface and its hidden-surface denials.
      - name: Run @langwatch/enterprise-sso-server tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/enterprise-sso-server run test
      # the resource-limit rows.
      - name: Run @langwatch/enterprise-licensing-web tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/enterprise-licensing-web run test
      # endpoint validation and delivery.
      - name: Run @langwatch/enterprise-webhook-server tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/enterprise-webhook-server run test

      # The six enterprise contract packages whose suites `vitest` could not
      # even discover until `packages/enterprise/vitest.config.ts` learned the
      # `src/__tests__/` layout their tests moved to. 155 tests, all green the
      # first time they ran; naming them keeps them that way.
      - name: Run @langwatch/enterprise-billing-contract tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/enterprise-billing-contract run test
      - name: Run @langwatch/enterprise-licensing-contract tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/enterprise-licensing-contract run test
      - name: Run @langwatch/enterprise-managed-provider-contract tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/enterprise-managed-provider-contract run test
      - name: Run @langwatch/enterprise-saas-contract tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/enterprise-saas-contract run test
      - name: Run @langwatch/enterprise-scim-contract tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/enterprise-scim-contract run test
      - name: Run @langwatch/enterprise-sso-contract tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/enterprise-sso-contract run test

      # @langwatch/langyworker is the langy-worker pi-harness wrapper
      # (services/langyworker) the langyagent image compiles into the worker
      # binary. It is not in any application's dependency closure, so the root
      # typecheck and the application suites never see it — same
      # raw-TypeScript, one-leg arrangement as the packages above.
      - name: Run @langwatch/langyworker unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/langyworker run test

      - name: Typecheck @langwatch/langyworker
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/langyworker run typecheck

      # The share feature (ADR-057 / share ADR-001) owns trace-link minting,
      # token resolution, audience and expiry, the view budget and the
      # share-safe payload cache. Its suites live under packages/, so the app's
      # vitest root cannot see them and nothing here named them: the whole
      # feature's own coverage ran nowhere, while the scenarios it binds in
      # packages/features/share/specs/share.feature still counted as bound by
      # check-feature-parity.ts. Same raw-TypeScript, shard-1 arrangement as
      # the packages above.
      - name: Run @langwatch/share-contract unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/share-contract run test

      - name: Typecheck @langwatch/share-contract
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/share-contract run typecheck

      # The Postgres-backed suite here self-skips without DATABASE_URL, so this
      # step runs the unit coverage and stays green on a runner with no
      # database — it does not silently drop the integration file, which runs
      # wherever a database is present.
      - name: Run @langwatch/share-server unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/share-server run test

      - name: Typecheck @langwatch/share-server
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/share-server run typecheck

      - name: Run @langwatch/share-web unit tests
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/share-web run test

      - name: Typecheck @langwatch/share-web
        if: matrix.app == 'platform-api'
        run: pnpm --filter @langwatch/share-web run typecheck

      - name: Run @langwatch/${{ matrix.app }} tests
        id: unit-tests
        run: |
          COV=""
          if [ "${{ needs.changes.outputs.coverage }}" = "true" ]; then
            COV="--coverage --coverage.reporter=lcov --coverage.reporter=text"
          fi
          # shellcheck disable=SC2086
          pnpm --filter @langwatch/${{ matrix.app }} exec vitest run $COV \
            --reporter=default --reporter=json --outputFile=test-results.json \
            --dangerouslyIgnoreUnhandledErrors

      - name: Extract test failures
        if: failure()
        working-directory: apps/${{ matrix.app == 'platform-api' && 'api' || matrix.app }}
        run: bash ../../.github/scripts/extract-failures.sh test-results.json test-failures.txt

      - name: Notify Slack on new failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/${{ matrix.app == 'platform-api' && 'api' || matrix.app }}
        run: bash ../../.github/scripts/notify-slack-test-failure.sh test-unit

      - name: Upload unit test coverage to Codecov
        if: always() && hashFiles('apps/*/coverage/lcov.info') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          files: apps/api/coverage/lcov.info,apps/worker/coverage/lcov.info,apps/ui/coverage/lcov.info
          flags: unit
          name: unit-tests-${{ matrix.app }}
          fail_ci_if_error: false

  # The `.integration.test.*` files that need no datastore.
  #
  # 540 of the app's 1017 integration files declare jsdom and name no database,
  # queue or cache — they render a component and mock their boundaries. They
  # were running on `test-integration` below, which means every one of them paid
  # for a Postgres, a ClickHouse and a Redis container, a Prisma migration, a
  # goose install, a ClickHouse schema replay and a Helm setup before it could
  # render a button.
  #
  # This job is the unit job's shape, because those files are unit-shaped in
  # everything except their name: no `services:` block, no migrations, no helm,
  # concurrent files, a reused module registry. Which files land here is decided
  # by src/test-utils/integrationLanes.ts, which vitest.integration.config.ts
  # also calls, so the two lanes are exact complements and no file can go
  # missing from CI. See specs/ci/integration-test-lanes.feature.
  package-suites:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    env:
      BUILD_TIME: "true"
      BASE_HOST: "localhost:3000"
      NEXTAUTH_SECRET: "nextauth-secret-for-ci-testing"
      NEXTAUTH_URL: "http://localhost:3000"
      API_TOKEN_JWT_SECRET: "api-jwt-secret-for-ci-testing"
      # The datastores this job now stands up. A package suite that needs one
      # is expected to self-skip when its connection string is absent, which is
      # exactly why they have to be PRESENT here: a suite that skips itself in
      # the only job that runs it has no coverage at all, and reports green.
      DATABASE_URL: "postgresql://langwatch_ci:ci_password@localhost:5432/langwatch_test"
      CLICKHOUSE_URL: "http://default:ci_password@localhost:8123/test_langwatch"
      REDIS_URL: "redis://localhost:6379"
      CI_REDIS_URL: "redis://localhost:6379"
      CI_CLICKHOUSE_URL: "http://default:ci_password@localhost:8123/test_langwatch"
      LANGWATCH_NLP_SERVICE: "http://localhost:5561"
      LANGWATCH_ENDPOINT: "http://localhost:3000"
      VITEST_ISOLATE_WORKER_REDIS: "1"
      CI: "true"
    runs-on: ubuntu-latest
    # No shards: a hundred and fifty small suites, run one after another.
    # Serial is not thrift — each suite is its own vitest with its own worker
    # pool, and several at once on a 4-core runner produce "[vitest-pool]:
    # Worker forks emitted error", which reads as a broken test and is not one.
    #
    # It DOES have services. This job absorbed the datastore lane at the
    # deployment cutover: `test-integration` existed to shard the monolith's
    # 1,017 integration files, and that corpus is gone — what is left are
    # package suites, which this job already discovers. Standing the datastores
    # up here is what keeps their integration halves running for real instead
    # of self-skipping into a green job.
    timeout-minutes: 45

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: langwatch_ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: langwatch_test
        options: >-
          --health-cmd "PGPASSWORD=ci_password psql -U langwatch_ci -d langwatch_test -c 'select 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "all"

      - uses: ./.github/actions/prepare-generated-files

      - name: Generate a throwaway CREDENTIALS_SECRET
        # Same reason as test-unit and test-component: anything encrypted at
        # rest has to round-trip through a real key, and a test asserting that
        # ciphertext is not readable text cannot mock the cipher it asserts on.
        run: echo "CREDENTIALS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Setup database
        run: pnpm prisma:migrate

      - name: Install Goose migration tool
        run: bash .github/scripts/install-goose.sh

      - name: Start ClickHouse with storage policy
        env:
          CLICKHOUSE_PASSWORD: ci_password
        run: bash .github/scripts/start-clickhouse-with-storage-policy.sh

      - name: Run ClickHouse migrations
        working-directory: apps/api
        # ClickHouse's HTTP probe can answer SELECT 1 via curl while the
        # Node @clickhouse/client still sees ECONNREFUSED on its first
        # connect (IPv6/IPv4 dual-stack bind race under --network host).
        # Retry the whole migrate step a couple of times to absorb the
        # cold-start window.
        run: |
          for i in 1 2 3; do
            if pnpm task:clickhouse-migrate; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "task:clickhouse-migrate attempt $i failed; sleeping 5s and retrying"
              sleep 5
            fi
          done
          exit 1

      # The chart-rendering suites shell out to `helm template` and skip
      # themselves when helm or the chart dependencies are missing. That
      # honesty is only honest if CI supplies both — otherwise the suite
      # reports "skipped", the job exits 0, and every guard it contains is
      # silently unenforced. REQUIRE_HELM_TESTS below turns a skip into a
      # failure, so this setup can never quietly rot.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Add chart dependency repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add langwatch https://langwatch.github.io/langwatch

      - name: Run every workspace package suite
        env:
          REQUIRE_HELM_TESTS: "1"
        run: bash .github/scripts/run-package-suites.sh

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # Read-only. This job used to carry `pull-requests: write` so that a
    # reviewdog pass could post inline lint annotations through the Review
    # API. The Oxlint gate reports through the job's exit code and writes
    # nothing back, so the write scope went with it.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          # `--no-renames` is not ours to set here, so keep in mind that a PR
          # which does touch docs/ will lazily fetch just those blobs when the
          # diff below reads them — correct, and rare.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/platform-api... @langwatch/ui... @langwatch/architecture-lint..."

      # The ADR-076 workspace invariants: one lockfile, one workspace
      # definition, no member carrying overrides pnpm would ignore, the app and
      # the SDK on different names. They previously ran only in
      # npx-server-smoke, which is deliberately NOT a required check and whose
      # path filter misses most of the manifests these assert about — so the
      # exact drift they exist to catch (a second lockfile reappearing, a
      # member overrides block) merged with no job running at all. This job is
      # required via langwatch-app-complete and now triggers on the root
      # manifests. Takes ~200ms.
      - name: Check the workspace invariants (ADR-076)
        run: |
          pnpm install --frozen-lockfile --filter "@langwatch/server..."
          pnpm --filter @langwatch/server run test:invariants

      - name: Oxfmt (blocking)
        run: pnpm format:check

      - name: Architecture policy tests (blocking)
        run: |
          pnpm --filter @langwatch/architecture-lint typecheck
          pnpm --filter @langwatch/architecture-lint test

      # Debt inventories are ceilings, not a second place to hide debt. Compare
      # each one with the merge-base copy when it exists. The first reviewed
      # inventory bootstraps explicitly; after that, the CLI rejects growth.
      - name: Read architecture debt inventories at the merge base
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          base_sha="${PULL_REQUEST_BASE_SHA:-${MERGE_GROUP_BASE_SHA:-}}"
          if [ -z "$base_sha" ]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          merge_base="$(git merge-base "$base_sha" HEAD)"
          reference_directory="$RUNNER_TEMP/architecture-lint-baselines"
          mkdir -p "$reference_directory"
          for baseline in service-quality-baseline.json port-module-baseline.json; do
            source_path="packages/architecture-lint/src/$baseline"
            reference="$reference_directory/$baseline"
            if git cat-file -e "$merge_base:$source_path"; then
              git show "$merge_base:$source_path" > "$reference"
            else
              rm -f "$reference"
            fi
          done

      - name: Architecture debt inventories (blocking)
        run: |
          pnpm --filter @langwatch/architecture-lint lint -- \
            --shrinking-baseline-only \
            --baseline-reference-dir "$RUNNER_TEMP/architecture-lint-baselines"

      # THE GATE. Oxlint over the whole governed tree, and a non-zero exit
      # fails the job. A config error and a lint violation both surface here.
      #
      # It replaced a two-part step: a blocking full-tree lint plus a
      # reviewdog pass that made the previous linter's `warn`-tier rules
      # blocking on the lines a PR added, gated by a script that counted
      # violations per (file, rule) on both sides of the merge base and
      # failed only on an increase. See
      # packages/architecture-lint/adrs/003-unified-oxc-toolchain.md.
      #
      # NONE OF THAT MACHINERY HAS AN EQUIVALENT HERE, AND NONE IS NEEDED.
      # It existed because that ruleset carried a warn tier with a baseline
      # in the thousands, and a rule that cannot block full-tree has to be
      # narrowed to the diff somehow. /.oxlintrc.architecture.json has no
      # warn tier: a rule is `error` for the whole tree, and where a backlog
      # exists the offending files are named in the debt register at the
      # bottom of that file. The gate is full-tree and the register is the
      # exemption, in place of a diff filter that had to guess which findings
      # the author wrote.
      #
      # The register is also strictly better on the failure mode that
      # motivated the delta gate: a formatter rewrapping a signature re-added
      # the declaration line and handed the PR a whole function's backlog,
      # because the rules anchored there counted lines. No carried rule
      # counts lines, so nothing anchors that way any more.
      #
      # What IS lost: inline annotations on the diff. Findings now arrive as
      # job output rather than as review comments.
      #
      # `lint:oxlint` rather than `lint`, because `lint` also runs the
      # architecture-lint CLI, and the step above already runs it with the
      # merge-base baselines this job needs. `lint:oxlint` is the same binary,
      # config and path set that `pnpm lint` gives a contributor.
      - name: Oxlint (blocking -- config errors included)
        run: pnpm lint:oxlint

      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/notify-slack-job-failure.sh lint

  # The ast-grep ruleset at dev/lint/ast-grep/ encodes deterministic house rules.
  # coderabbit-config-check.yml only proves each rule still matches its own
  # fixture; until this job existed, nothing ran them against actual code
  # except CodeRabbit, once per PR, as a comment.
  #
  # Scans changed files only. The rules are severity: warning during rollout,
  # so this reports without failing; promote a rule to severity: error in its
  # .yml once its baseline is clean and this job starts gating on it.
  ast-grep:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          # `--no-renames` is not ours to set here, so keep in mind that a PR
          # which does touch docs/ will lazily fetch just those blobs when the
          # diff below reads them — correct, and rare.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Pinned to the same version coderabbit-config-check.yml uses —
      # rule-matching behaviour is version-sensitive. Bump both together.
      - name: Install pinned ast-grep
        run: pip install "ast-grep-cli==0.42.3"

      - name: Rule fixtures must still pass
        working-directory: dev/lint/ast-grep
        run: ast-grep test -c sgconfig.yml -t rule-tests

      - name: Scan changed files
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          files=$(git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD" -- '*.ts' '*.tsx')
          if [ -z "$files" ]; then
            echo "No changed TS/TSX files."
            exit 0
          fi
          echo "$files" | sed 's/^/  /'
          # shellcheck disable=SC2086
          ast-grep scan -c dev/lint/ast-grep/sgconfig.yml $files

      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/notify-slack-job-failure.sh ast-grep

  feature-parity:
    needs: changes
    if: needs.changes.outputs.feature-parity == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/architecture-lint..."

      # The parity scanner moved into @langwatch/architecture-lint with the
      # rest of the repository-wide checks.
      - name: Check feature-file parity
        run: pnpm --filter @langwatch/architecture-lint run check:feature-parity

      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/notify-slack-job-failure.sh feature-parity

  # The frozen OpenAPI document against the surface the API process mounts.
  #
  # This replaces `openapi-completeness`, which was deleted at the deployment
  # cutover along with the generator it read. The check is not the same one and
  # deliberately so. The old pair asserted that every documented operation
  # carried a body, parameters and a success response; this one asserts the
  # fact those presupposed — that the operation is still SERVED.
  #
  # `apps/api/src/features/discovery/openapi-document.json` is frozen: three
  # routes serve it and both SDKs generate clients from it, so this job never
  # writes it. The task describes the mounted surface into a scratch file and
  # diffs the two.
  #
  # ONE direction fails: an operation the document lists that no route on the
  # process answers. An integrator generated a client from it, and the call now
  # 404s. Operations served and undocumented are printed and never failed on,
  # because the document is frozen and every route added since the freeze is
  # one of them — failing there would make this a wall rather than a signal.
  openapi-drift:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/platform-api..."

      - uses: ./.github/actions/prepare-generated-files

      - name: Check the frozen OpenAPI document against the served surface
        run: pnpm --filter @langwatch/platform-api run task:openapi-check

      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/notify-slack-job-failure.sh openapi-drift

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    env:
      # Disable telemetry and optimize build for CI
      NEXT_TELEMETRY_DISABLED: 1
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      # Use pnpm store caching instead of node_modules for better cache efficiency
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Cache Prisma client separately for faster regeneration
      - name: Cache Prisma client
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/prisma-client/src/generated
          key: ${{ runner.os }}-prisma-${{ hashFiles('packages/prisma-client/prisma/schema.prisma') }}

      # Cache Vite build artifacts.
      #
      # The key deliberately does NOT hash apps/ui/src/**. It used to,
      # which made the primary key change on every commit: the cache was
      # therefore never a hit, and every run still wrote a fresh multi-MB
      # entry, churning the repository's 10GB cache quota for a cache that
      # could not be read. Hashing that tree also costs real time on its own.
      #
      # What is cached here is Vite's dependency pre-bundle, which is keyed by
      # the dependency set, not by app source — and Vite re-optimizes on its
      # own when its internal hash moves. So the key tracks the lockfile and
      # the Vite config, and nothing else.
      - name: Cache Vite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/ui/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'apps/ui/vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      # node-pty@1.1.0 only ships prebuilds for darwin/win32, so on Linux
      # its postinstall always falls back to `node-gyp rebuild`, which pnpm
      # runs with its own vendored node-gyp. That copy ships `gyp/gyp_main.py`
      # mode 644, so an mtime-driven Makefile regeneration executes it and
      # dies with "Permission denied" / error 126. Installing node-gyp
      # globally does not displace it on its own: pnpm exports
      # `npm_config_node_gyp` at its vendored copy and that wins over PATH.
      # Point the variable at the published node-gyp, which ships the script
      # executable. sdk-javascript-ci.yml and npx-server-smoke.yml do the same.
      - name: Install node-gyp (for node-pty postinstall)
        shell: bash
        run: |
          set -euo pipefail
          npm install -g node-gyp@12.3.0
          gyp="$(npm root -g)/node-gyp/bin/node-gyp.js"
          test -f "$gyp"
          test -x "$(dirname "$gyp")/../gyp/gyp_main.py"
          echo "npm_config_node_gyp=$gyp" >> "$GITHUB_ENV"

      # One install covering the three deployables. mcp-server is a workspace
      # dependency of the API through @langwatch/hosted-mcp-server, so the
      # trailing `...` pulls it in — it used to be installed separately here
      # from its own lockfile, i.e. twice per run. See ADR-076.
      - name: Install dependencies
        run: >
          CI=true pnpm install --frozen-lockfile
          --filter "@langwatch/platform-api..."
          --filter "@langwatch/worker..."
          --filter "@langwatch/ui..."

      - name: Build mcp-server
        run: pnpm --filter @langwatch/mcp-server run build

      # apps/api and apps/worker declare no build — they run from source through
      # tsx. What is built here is the browser bundle the API process serves,
      # plus every workspace dependency that has a build of its own.
      - name: Build
        run: pnpm --filter "@langwatch/ui..." run build

      # A successful `vite build` only proves the bundle compiles, not that it
      # boots. Serve the built output and load it in a headless browser to
      # catch runtime boot failures (white screens from chunk-init errors).
      # Uses the runner's preinstalled Google Chrome (no browser download).
      - name: Boot smoke test
        working-directory: apps/ui
        env:
          SMOKE_BROWSER_CHANNEL: chrome
        run: |
          pnpm exec vite preview --port 4173 --outDir dist/client &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          # Under the runner's `bash -e`, a non-zero exit here fails the step
          # (the gate we want); the EXIT trap still stops the preview server.
          node scripts/smoke-boot.mjs

      - name: Notify Slack on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_NOTIFICATION_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/notify-slack-job-failure.sh build

  ci-scripts-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - name: Test extract-failures.sh
        run: bash .github/scripts/__tests__/extract-failures.test.sh

      - name: Test start-clickhouse-with-storage-policy.sh
        run: bash .github/scripts/__tests__/start-clickhouse-with-storage-policy.test.sh

      - name: Test start-boxd-ssh-agent.sh
        run: bash .github/scripts/__tests__/start-boxd-ssh-agent.test.sh

      - name: Test notify-slack-release.sh
        run: bash .github/scripts/__tests__/notify-slack-release.test.sh

      - name: Test run-package-suites.sh
        run: bash .github/scripts/__tests__/run-package-suites.test.sh

      # Lives here rather than in deployment-impact-check.yml because that
      # workflow filters `on.paths` down to deployment surface, which
      # .github/** is not — so it would never start for a change to its own
      # guard. This job's gate already lists `.github/scripts/**`.
      - name: Test guard-deployment-impact.ts
        run: node --test --experimental-strip-types .github/scripts/guard-deployment-impact.test.ts

  # The npm artifact's staging filters, run over the real tree.
  #
  # dev/scripts/pack-npm.sh decides what every `npx @langwatch/server` user
  # receives. Its filters are rsync patterns, and a pattern that is broader than
  # it means to be drops application source: twice already the published server
  # died at first boot ~20 minutes in on exactly that. The guard inside the
  # script compares what git tracks against what staging kept, and `--check-filters`
  # runs it without a build and without packing, in about ten seconds.
  #
  # It used to run only inside npx-server-smoke, which does not run on main and
  # whose path filter names none of the trees the guard reads. A `.gitignore`
  # added under dev/scripts therefore merged green and turned every branch that
  # merged main red.
  #
  # No `if:` gate, on purpose. The guard reads every tree `files` in the root
  # package.json names, and a path filter listing them would be a second copy of
  # that list, stale the day someone edits it. A minute on an unrelated pull
  # request is the cheaper mistake.
  pack-filters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          # None of it is in the package's `files`.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - name: Check the npm pack filters
        run: bash dev/scripts/pack-npm.sh --check-filters

  ci-self-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Drops docs/ + assets/ media. See LEAN CHECKOUT at the top of this file.
          sparse-checkout: |
            /*
            !/docs/media/
            !/docs/images/
            !/assets/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install: "@langwatch/platform-api..."

      - name: Stage canary fixture inside vitest root
        working-directory: apps/api
        run: cp ../../.github/scripts/__fixtures__/intentional-failure.test.ts ./src/_ci_canary.test.ts

      - name: Run intentional failure
        id: canary
        continue-on-error: true
        working-directory: apps/api
        run: |
          pnpm exec vitest run src/_ci_canary.test.ts \
            --reporter=default --reporter=json --outputFile=test-results.json

      - name: Extract failures
        if: always()
        working-directory: apps/api
        run: bash ../../.github/scripts/extract-failures.sh test-results.json test-failures.txt

      - name: Assert detection worked
        if: always()
        run: |
          if [ "${{ steps.canary.outcome }}" != "failure" ]; then
            echo "FAIL: canary step should have failed (vitest should exit non-zero for a failing test), got outcome=${{ steps.canary.outcome }}"
            exit 1
          fi
          if [ ! -s apps/api/test-failures.txt ]; then
            echo "FAIL: test-failures.txt is missing or empty — failure extraction did not work"
            exit 1
          fi
          echo "PASS: canary failed as expected and failures were extracted"
          cat apps/api/test-failures.txt

  langwatch-app-complete:
    needs:
      [
        changes,
        typecheck,
        typecheck-packages,
        test-unit,
        package-suites,
        lint,
        ast-grep,
        feature-parity,
        openapi-drift,
        build,
        ci-scripts-test,
        ci-self-test,
        pack-filters,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: typecheck, typecheck-packages, test-unit, package-suites, lint, ast-grep, feature-parity, openapi-drift, build, ci-scripts-test, ci-self-test

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LangWatch README: sign-up button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 260px; height: 56px; display: flex; align-items: center; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    height: 48px; padding: 0 28px; border-radius: 999px;
    background: #111111; color: #ffffff;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  .btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>
  <div class="btn">
    Sign up
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LangWatch README: the four areas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 340px;
    background: #f5f3ee; color: #1d293d;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    box-sizing: border-box; padding: 32px 40px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 20px; height: 100%; }
  .card {
    background: #ffffff; border: 1px solid rgba(29, 41, 61, 0.10); border-radius: 18px;
    padding: 26px 28px; box-shadow: 0 1px 2px rgba(29, 41, 61, 0.04);
    display: flex; align-items: center; gap: 22px;
  }
  .chip {
    flex: none; width: 64px; height: 64px; border-radius: 14px; background: #eef1f6;
    display: flex; align-items: center; justify-content: center;
  }
  .chip img { width: 40px; height: 40px; }
  .text { display: flex; flex-direction: column; gap: 6px; }
  h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; font-size: 16px; line-height: 1.5; color: #5b6778; max-width: 420px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="chip"><img src="icon-evals.png" alt=""></div>
      <div class="text">
        <h2>LLM Ops</h2>
        <p>Trace, test and improve the agents you build</p>
      </div>
    </div>
    <div class="card">
      <div class="chip"><img src="icon-coding.svg" alt=""></div>
      <div class="text">
        <h2>Coding Agents</h2>
        <p>Track Claude Code and friends and find token savings</p>
      </div>
    </div>
    <div class="card">
      <div class="chip"><img src="icon-gateway.png" alt=""></div>
      <div class="text">
        <h2>AI Gateway</h2>
        <p>One endpoint for every provider, with virtual keys, budgets and routing</p>
      </div>
    </div>
    <div class="card">
      <div class="chip"><img src="icon-governance.png" alt=""></div>
      <div class="text">
        <h2>AI Governance</h2>
        <p>Control all AI subscriptions and usage across the company</p>
      </div>
    </div>
  </div>
</body>
</html>

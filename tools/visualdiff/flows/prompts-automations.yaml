# Flows for prompts, automations and dashboards (vf-prompts-automations).
# Every flow creates what it needs under a {uid} name, so any number run side by side.
# Not scripted: automation-activity-log (needs a seeded fired automation) and the widget
# drag-to-move (the grid cards carry no test id); both are named in the lane handoff.
flows:
  - id: prompt-create-and-save
    title: Create a prompt, name it and find it in the list
    steps:
      - action: go
        with:
          path: "/{slug}/prompts"
      - action: click
        with:
          testId: "prompt-new-button"
      - action: fill
        with:
          field: "Enter your prompt..."
          value: "You are the visual diff assistant."
      - action: click
        with:
          testId: "save-prompt-button"
      - action: fill
        with:
          testId: "prompt-handle-input"
          value: "vd-prompt-{uid}"
      - action: click
        with:
          testId: "prompt-handle-submit"
      - action: expect
        with:
          api: "/api/prompts"
          contains: "vd-prompt-{uid}"
      - action: go
        with:
          path: "/{slug}/prompts"
      - action: expect
        with:
          testId: "prompt-row-vd-prompt-{uid}"

  - id: prompt-edit-new-version
    title: Edit a saved prompt and commit it as a second version
    steps:
      - action: go
        with:
          path: "/{slug}/prompts"
      - action: click
        with:
          testId: "prompt-new-button"
      - action: fill
        with:
          field: "Enter your prompt..."
          value: "Version one of the visual diff prompt."
      - action: click
        with:
          testId: "save-prompt-button"
      - action: fill
        with:
          testId: "prompt-handle-input"
          value: "vd-prompt-{uid}"
      - action: click
        with:
          testId: "prompt-handle-submit"
      - action: expect
        with:
          api: "/api/prompts"
          contains: "vd-prompt-{uid}"
      - action: fill
        with:
          field: "Enter your prompt..."
          value: "Version two of the visual diff prompt."
      - action: click
        with:
          testId: "save-prompt-button"
      - action: fill
        with:
          testId: "prompt-save-version-message"
          value: "second version {uid}"
      - action: click
        with:
          testId: "prompt-save-version-submit"
      - action: expect
        with:
          api: "/api/prompts/vd-prompt-{uid}/versions"
          min: "2"

  - id: prompt-version-history-and-diff
    title: Open the version history and read a version's changes
    steps:
      - action: go
        with:
          path: "/{slug}/prompts"
      - action: click
        with:
          testId: "prompt-new-button"
      - action: fill
        with:
          field: "Enter your prompt..."
          value: "History one."
      - action: click
        with:
          testId: "save-prompt-button"
      - action: fill
        with:
          testId: "prompt-handle-input"
          value: "vd-prompt-{uid}"
      - action: click
        with:
          testId: "prompt-handle-submit"
      - action: expect
        with:
          api: "/api/prompts"
          contains: "vd-prompt-{uid}"
      - action: fill
        with:
          field: "Enter your prompt..."
          value: "history edit {uid}"
      - action: click
        with:
          testId: "save-prompt-button"
      - action: fill
        with:
          testId: "prompt-save-version-message"
          value: "edit v2 {uid}"
      - action: click
        with:
          testId: "prompt-save-version-submit"
      - action: expect
        with:
          api: "/api/prompts/vd-prompt-{uid}/versions"
          min: "2"
      - action: click
        with:
          testId: "version-history-button"
      - action: expect
        with:
          text: "Current"
      - action: expect
        with:
          text: "edit v2 {uid}"
      - action: click
        with:
          testId: "version-changes-toggle-2"
      - action: expect
        with:
          text: "history edit {uid}"

  - id: prompt-tags-and-deploy-labels
    title: Add a deploy tag and point it at a prompt version
    steps:
      - action: go
        with:
          path: "/{slug}/prompts"
      - action: click
        with:
          testId: "prompt-new-button"
      - action: fill
        with:
          field: "Enter your prompt..."
          value: "Tagged prompt."
      - action: click
        with:
          testId: "save-prompt-button"
      - action: fill
        with:
          testId: "prompt-handle-input"
          value: "vd-prompt-{uid}"
      - action: click
        with:
          testId: "prompt-handle-submit"
      - action: expect
        with:
          api: "/api/prompts"
          contains: "vd-prompt-{uid}"
      - action: click
        with:
          testId: "prompt-deploy-button"
      - action: click
        with:
          testId: "prompt-deploy-add-tag"
      - action: fill
        with:
          testId: "prompt-deploy-tag-name-input"
          value: "canary-{uid}"
      - action: click
        with:
          testId: "prompt-deploy-tag-add-confirm"
      - action: click
        with:
          testId: "prompt-deploy-tag-trigger-canary-{uid}"
      - action: click
        with:
          testId: "prompt-deploy-tag-canary-{uid}-version-1"
      - action: click
        with:
          testId: "prompt-deploy-save"
      - action: expect
        with:
          api: "/api/prompts/tags"
          contains: "canary-{uid}"
      - action: expect
        with:
          api: "/api/prompts/vd-prompt-{uid}:canary-{uid}"
          contains: "vd-prompt-{uid}"

  - id: prompt-playground-run-and-variables
    title: Fill a variable and get a real model reply in the playground
    steps:
      - action: go
        with:
          path: "/{slug}/prompts"
      - action: click
        with:
          testId: "prompt-new-button"
      - action: fill
        with:
          field: "Enter your prompt..."
          value: "Repeat the input back exactly and nothing else: {{input}}"
      - action: click
        with:
          testId: "save-prompt-button"
      - action: fill
        with:
          testId: "prompt-handle-input"
          value: "vd-prompt-{uid}"
      - action: click
        with:
          testId: "prompt-handle-submit"
      - action: expect
        with:
          api: "/api/prompts"
          contains: "vd-prompt-{uid}"
      - action: click
        with:
          testId: "prompt-tab-variables"
      - action: fill
        with:
          testId: "variable-value-input-input"
          value: "echo-{uid}"
      - action: click
        with:
          testId: "prompt-tab-conversation"
      - action: fill
        with:
          testId: "prompt-chat-input"
          value: "Go"
      - action: click
        with:
          testId: "prompt-chat-send"
      - action: expect
        with:
          text: "echo-{uid}"
          timeout: "60000"

  - id: prompt-playground-change-model
    title: Pick another model and commit it as a new version
    steps:
      - action: go
        with:
          path: "/{slug}/prompts"
      - action: click
        with:
          testId: "prompt-new-button"
      - action: fill
        with:
          field: "Enter your prompt..."
          value: "Model change prompt."
      - action: click
        with:
          testId: "save-prompt-button"
      - action: fill
        with:
          testId: "prompt-handle-input"
          value: "vd-prompt-{uid}"
      - action: click
        with:
          testId: "prompt-handle-submit"
      - action: expect
        with:
          api: "/api/prompts"
          contains: "vd-prompt-{uid}"
      - action: click
        with:
          testId: "prompt-model-selector-trigger"
      - action: fill
        with:
          testId: "prompt-model-search-input"
          value: "mini"
      - action: click
        with:
          testIdPrefix: "prompt-model-option-"
      - action: click
        with:
          testId: "save-prompt-button"
      - action: fill
        with:
          testId: "prompt-save-version-message"
          value: "model change {uid}"
      - action: click
        with:
          testId: "prompt-save-version-submit"
      - action: expect
        with:
          api: "/api/prompts/vd-prompt-{uid}/versions"
          min: "2"

  - id: prompt-delete
    title: Delete a prompt through the row menu and confirm it is gone
    steps:
      - action: go
        with:
          path: "/{slug}/prompts"
      - action: click
        with:
          testId: "prompt-new-button"
      - action: fill
        with:
          field: "Enter your prompt..."
          value: "Doomed prompt."
      - action: click
        with:
          testId: "save-prompt-button"
      - action: fill
        with:
          testId: "prompt-handle-input"
          value: "vd-prompt-{uid}"
      - action: click
        with:
          testId: "prompt-handle-submit"
      - action: expect
        with:
          api: "/api/prompts"
          contains: "vd-prompt-{uid}"
      - action: go
        with:
          path: "/{slug}/prompts"
      - action: click
        with:
          testId: "prompt-actions-menu-vd-prompt-{uid}"
      - action: click
        with:
          testId: "prompt-actions-delete"
      - action: fill
        with:
          testId: "prompt-delete-confirm-input"
          value: "delete"
      - action: click
        with:
          testId: "prompt-delete-confirm-button"
      - action: expect
        with:
          api: "/api/prompts/vd-prompt-{uid}"
          status: "404"

  - id: automation-create-full-form
    title: Create a trace automation with cadence and email delivery
    steps:
      - action: go
        with:
          path: "/{slug}/automations/automations"
      - action: click
        with:
          testId: "automation-add-automations"
      - action: fill
        with:
          testId: "automation-name-input"
          value: "vd-automation-{uid}"
      - action: click
        with:
          testId: "automation-subject-code"
      - action: click
        with:
          testId: "automation-subject-example-status:error"
      - action: fill
        with:
          testId: "automation-settle-window-input"
          value: "30"
      - action: click
        with:
          testId: "automation-cadence-trigger"
      - action: click
        with:
          testId: "automation-cadence-hourly_digest"
      - action: click
        with:
          testId: "automation-delivery-send-email"
      - action: fill
        with:
          testId: "automation-email-input"
          value: "vd-{uid}@example.com"
      - action: click
        with:
          testId: "automation-email-add"
      - action: click
        with:
          testId: "automation-setup-done"
      - action: click
        with:
          testId: "automation-save-automation"
      - action: expect
        with:
          api: "/api/triggers"
          contains: "vd-automation-{uid}"
      - action: go
        with:
          path: "/{slug}/automations/automations"
      - action: expect
        with:
          testId: "automation-row-actions-vd-automation-{uid}"

  - id: automation-create-alert
    title: Create a graph alert with a series and a severity
    steps:
      - action: go
        with:
          path: "/{slug}/automations/alerts"
      - action: click
        with:
          testId: "automation-add-alerts"
      - action: fill
        with:
          testId: "automation-name-input"
          value: "vd-alert-{uid}"
      - action: select
        with:
          testId: "automation-alert-graph-select"
          option: "Visual Diff Graph"
      - action: select
        with:
          testId: "automation-alert-series-select"
          option: "Traces"
      - action: click
        with:
          testId: "automation-severity-trigger"
      - action: click
        with:
          testId: "automation-severity-warning"
      - action: click
        with:
          testId: "automation-delivery-send-email"
      - action: fill
        with:
          testId: "automation-email-input"
          value: "vd-{uid}@example.com"
      - action: click
        with:
          testId: "automation-email-add"
      - action: click
        with:
          testId: "automation-setup-done"
      - action: click
        with:
          testId: "automation-save-alert"
      - action: expect
        with:
          api: "/api/triggers"
          contains: "vd-alert-{uid}"
      - action: go
        with:
          path: "/{slug}/automations/alerts"
      - action: expect
        with:
          testId: "automation-row-actions-vd-alert-{uid}"

  - id: automation-schedule-report
    title: Schedule a recurring graph report
    steps:
      - action: go
        with:
          path: "/{slug}/automations/schedules"
      - action: click
        with:
          testId: "automation-add-schedules"
      - action: fill
        with:
          testId: "automation-name-input"
          value: "vd-schedule-{uid}"
      - action: select
        with:
          testId: "automation-schedule-source-select"
          option: "A custom graph (chart)"
      - action: select
        with:
          testId: "automation-schedule-graph-select"
          option: "Visual Diff Graph"
      - action: select
        with:
          testId: "automation-schedule-frequency-select"
          option: "Weekly"
      - action: fill
        with:
          testId: "automation-schedule-time-input"
          value: "09:30"
      - action: click
        with:
          testId: "automation-delivery-send-email"
      - action: fill
        with:
          testId: "automation-email-input"
          value: "vd-{uid}@example.com"
      - action: click
        with:
          testId: "automation-email-add"
      - action: click
        with:
          testId: "automation-setup-done"
      - action: click
        with:
          testId: "automation-save-schedule"
      - action: expect
        with:
          api: "/api/triggers"
          contains: "vd-schedule-{uid}"
      - action: go
        with:
          path: "/{slug}/automations/schedules"
      - action: expect
        with:
          testId: "automation-row-actions-vd-schedule-{uid}"

  - id: automation-enable-disable
    title: Switch an automation off and see it stay off after a reload
    steps:
      - action: go
        with:
          path: "/{slug}/automations/automations"
      - action: click
        with:
          testId: "automation-add-automations"
      - action: fill
        with:
          testId: "automation-name-input"
          value: "vd-toggle-{uid}"
      - action: click
        with:
          testId: "automation-subject-code"
      - action: click
        with:
          testId: "automation-subject-example-status:error"
      - action: click
        with:
          testId: "automation-delivery-send-email"
      - action: fill
        with:
          testId: "automation-email-input"
          value: "vd-{uid}@example.com"
      - action: click
        with:
          testId: "automation-email-add"
      - action: click
        with:
          testId: "automation-setup-done"
      - action: click
        with:
          testId: "automation-save-automation"
      - action: expect
        with:
          api: "/api/triggers"
          contains: "vd-toggle-{uid}"
      - action: go
        with:
          path: "/{slug}/automations/automations"
      - action: expect
        with:
          count: '[data-testid="automation-toggle-vd-toggle-{uid}"][data-state="checked"]'
          equals: "1"
      - action: click
        with:
          testId: "automation-toggle-vd-toggle-{uid}"
      - action: expect
        with:
          count: '[data-testid="automation-toggle-vd-toggle-{uid}"][data-state="unchecked"]'
          equals: "1"
      - action: wait
        with:
          millis: "1000"
      - action: go
        with:
          path: "/{slug}/automations/automations"
      - action: expect
        with:
          count: '[data-testid="automation-toggle-vd-toggle-{uid}"][data-state="unchecked"]'
          equals: "1"

  - id: automation-edit
    title: Rename an automation through its row menu and save the edit
    steps:
      - action: go
        with:
          path: "/{slug}/automations/automations"
      - action: click
        with:
          testId: "automation-add-automations"
      - action: fill
        with:
          testId: "automation-name-input"
          value: "vd-edit-{uid}"
      - action: click
        with:
          testId: "automation-subject-code"
      - action: click
        with:
          testId: "automation-subject-example-status:error"
      - action: click
        with:
          testId: "automation-delivery-send-email"
      - action: fill
        with:
          testId: "automation-email-input"
          value: "vd-{uid}@example.com"
      - action: click
        with:
          testId: "automation-email-add"
      - action: click
        with:
          testId: "automation-setup-done"
      - action: click
        with:
          testId: "automation-save-automation"
      - action: expect
        with:
          api: "/api/triggers"
          contains: "vd-edit-{uid}"
      - action: go
        with:
          path: "/{slug}/automations/automations"
      - action: click
        with:
          testId: "automation-row-actions-vd-edit-{uid}"
      - action: click
        with:
          testId: "automation-action-edit"
      - action: fill
        with:
          testId: "automation-name-input"
          value: "vd-edited-{uid}"
      - action: click
        with:
          testId: "automation-save-automation"
      - action: expect
        with:
          api: "/api/triggers"
          contains: "vd-edited-{uid}"
      - action: go
        with:
          path: "/{slug}/automations/automations"
      - action: expect
        with:
          testId: "automation-row-actions-vd-edited-{uid}"

  - id: automation-delete
    title: Delete an automation and see it leave the list
    steps:
      - action: go
        with:
          path: "/{slug}/automations/automations"
      - action: click
        with:
          testId: "automation-add-automations"
      - action: fill
        with:
          testId: "automation-name-input"
          value: "vd-delete-{uid}"
      - action: click
        with:
          testId: "automation-subject-code"
      - action: click
        with:
          testId: "automation-subject-example-status:error"
      - action: click
        with:
          testId: "automation-delivery-send-email"
      - action: fill
        with:
          testId: "automation-email-input"
          value: "vd-{uid}@example.com"
      - action: click
        with:
          testId: "automation-email-add"
      - action: click
        with:
          testId: "automation-setup-done"
      - action: click
        with:
          testId: "automation-save-automation"
      - action: expect
        with:
          api: "/api/triggers"
          contains: "vd-delete-{uid}"
      - action: go
        with:
          path: "/{slug}/automations/automations"
      - action: expect
        with:
          testId: "automation-row-actions-vd-delete-{uid}"
      - action: click
        with:
          testId: "automation-row-actions-vd-delete-{uid}"
      - action: click
        with:
          testId: "automation-action-delete"
      - action: wait
        with:
          millis: "1500"
      - action: go
        with:
          path: "/{slug}/automations/automations"
      - action: expect
        with:
          testId: "automation-add-automations"
      - action: expect
        with:
          testId: "automation-row-actions-vd-delete-{uid}"
          equals: "0"

  - id: dashboard-create
    title: Create a dashboard and find it in the sidebar
    steps:
      - action: go
        with:
          path: "/{slug}/analytics/reports"
      - action: click
        with:
          testId: "analytics-dashboard-add"
      - action: fill
        with:
          testId: "analytics-dashboard-name-input"
          value: "vd-dash-{uid}"
      - action: click
        with:
          testId: "analytics-dashboard-create-confirm"
      - action: expect
        with:
          api: "/api/dashboards"
          contains: "vd-dash-{uid}"
      - action: go
        with:
          path: "/{slug}/analytics/reports"
      - action: expect
        with:
          testId: "analytics-dashboard-menu-vd-dash-{uid}"

  - id: dashboard-widget-add-edit-delete
    title: Add a chart to a dashboard, rename it, then delete it
    steps:
      - action: go
        with:
          path: "/{slug}/analytics/reports"
      - action: click
        with:
          testId: "analytics-dashboard-add"
      - action: fill
        with:
          testId: "analytics-dashboard-name-input"
          value: "vd-widgets-{uid}"
      - action: click
        with:
          testId: "analytics-dashboard-create-confirm"
      - action: expect
        with:
          testId: "analytics-dashboard-menu-vd-widgets-{uid}"
      - action: click
        with:
          testId: "analytics-add-chart"
      - action: click
        with:
          label: "Rename New widget"
      - action: fill
        with:
          selector: "input:focus"
          value: "vd-widget-{uid}"
      - action: click
        with:
          testId: "analytics-widget-tab-queries"
      - action: click
        with:
          testId: "analytics-widget-save"
      - action: expect
        with:
          text: "vd-widget-{uid}"
      - action: click
        with:
          testId: "analytics-chart-menu"
      - action: click
        with:
          testId: "analytics-chart-edit"
      - action: click
        with:
          label: "Rename vd-widget-{uid}"
      - action: fill
        with:
          selector: "input:focus"
          value: "vd-widget-edited-{uid}"
      - action: click
        with:
          testId: "analytics-widget-tab-queries"
      - action: click
        with:
          testId: "analytics-widget-save"
      - action: expect
        with:
          text: "vd-widget-edited-{uid}"
      - action: click
        with:
          testId: "analytics-chart-menu"
      - action: click
        with:
          testId: "analytics-chart-delete"
      - action: expect
        with:
          text: "vd-widget-edited-{uid}"
          equals: "0"

  - id: dashboard-rename-and-delete
    title: Rename a dashboard from its menu, then delete it
    steps:
      - action: go
        with:
          path: "/{slug}/analytics/reports"
      - action: click
        with:
          testId: "analytics-dashboard-add"
      - action: fill
        with:
          testId: "analytics-dashboard-name-input"
          value: "vd-rename-{uid}"
      - action: click
        with:
          testId: "analytics-dashboard-create-confirm"
      - action: expect
        with:
          testId: "analytics-dashboard-menu-vd-rename-{uid}"
      - action: click
        with:
          testId: "analytics-dashboard-menu-vd-rename-{uid}"
      - action: click
        with:
          testId: "analytics-dashboard-rename"
      - action: fill
        with:
          testId: "analytics-dashboard-rename-input"
          value: "vd-renamed-{uid}"
      - action: type
        with:
          testId: "analytics-dashboard-rename-input"
          text: ""
          submit: "true"
      - action: expect
        with:
          api: "/api/dashboards"
          contains: "vd-renamed-{uid}"
      - action: expect
        with:
          testId: "analytics-dashboard-menu-vd-renamed-{uid}"
      - action: click
        with:
          testId: "analytics-dashboard-menu-vd-renamed-{uid}"
      - action: click
        with:
          testId: "analytics-dashboard-delete"
      - action: click
        with:
          text: "/^Delete$/"
      - action: expect
        with:
          testId: "analytics-dashboard-menu-vd-renamed-{uid}"
          equals: "0"

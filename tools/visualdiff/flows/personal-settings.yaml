# A person's own settings, /settings/profile and /settings/security, each change read back after a
# reload. Every mutation runs as an invited member in a cookieless browser (never the shared admin,
# whose name, addresses and second factor every other flow depends on); the admin removes the
# member at the end. The photo is files-media.yaml, the password change, sessions and sign-out are
# auth.yaml. Labels and test ids are main's (platform/app/src/components/me/*).
# Passkeys use the `passkey` action (a virtual authenticator), two-step the `totp` action.
# Not scripted: delete account and notification preferences (main has neither on a person's own
# settings). Unrun: first run proves them.
flows:
  - id: personal-profile-name-round-trip
    title: Change your name, see it kept after a reload and shown in the directory
    serial: true
    steps:
      - action: go
        with:
          path: /settings/directory
      - action: click
        with:
          text: Invite people
      - action: fill
        with:
          field: 'alice@example.com, bob@example.com'
          value: 'vd-pn-{uid}@mail.langwatch.localhost'
      - action: click
        with:
          text: /^\s*(Send|Create) invites\s*$/
      - action: mail
        with:
          to: vd-pn-{uid}@mail.langwatch.localhost
          as: inviteLink
      - action: acceptInvite
        with:
          link: "{inviteLink}"
          email: vd-pn-{uid}@mail.langwatch.localhost
          name: vd-pn-{uid}
      - action: signIn
        with:
          anonymous: member
          email: vd-pn-{uid}@mail.langwatch.localhost
          password: "{actorPassword}"
      - action: go
        with:
          path: /settings/profile
          anonymous: member
      - action: click
        with:
          text: Not now
          optional: "true"
          anonymous: member
      - action: expect
        with:
          text: Your details
          timeout: "20000"
          anonymous: member
      - action: expect
        with:
          testId: profile-email
          hasText: vd-pn-{uid}@mail.langwatch.localhost
          anonymous: member
      - action: expect
        with:
          testId: profile-standing-chip
          hasText: /^Member of /
          anonymous: member
      - action: expect
        with:
          count: '[data-testid="profile-name-save"][disabled]'
          equals: "1"
          anonymous: member
      - action: fill
        with:
          testId: profile-name-input
          value: vd-pn-{uid}-renamed
          anonymous: member
      - action: click
        with:
          testId: profile-name-save
          anonymous: member
      - action: expect
        with:
          text: Name updated
          timeout: "20000"
          anonymous: member
      - action: go
        with:
          path: /settings/profile
          anonymous: member
      - action: expect
        with:
          count: '[data-testid="profile-name-input"][value="vd-pn-{uid}-renamed"]'
          timeout: "20000"
          anonymous: member
      - action: go
        with:
          path: /settings/directory
      - action: expect
        with:
          text: vd-pn-{uid}-renamed
          timeout: "20000"
      - action: click
        with:
          label: /^Actions for vd-pn-{uid}/
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*(Delete|Remove from organization)\s*$/
      - action: go
        with:
          path: /settings/directory
      - action: expect
        with:
          text: vd-pn-{uid}
          equals: "0"

  - id: personal-security-address-add-confirm-remove
    title: Add a second email address, confirm it from the mailed link in the same browser, then remove it
    serial: true
    steps:
      - action: go
        with:
          path: /settings/directory
      - action: click
        with:
          text: Invite people
      - action: fill
        with:
          field: 'alice@example.com, bob@example.com'
          value: 'vd-ps-{uid}@mail.langwatch.localhost'
      - action: click
        with:
          text: /^\s*(Send|Create) invites\s*$/
      - action: mail
        with:
          to: vd-ps-{uid}@mail.langwatch.localhost
          as: inviteLink
      - action: acceptInvite
        with:
          link: "{inviteLink}"
          email: vd-ps-{uid}@mail.langwatch.localhost
          name: vd-ps-{uid}
      - action: signIn
        with:
          anonymous: member
          email: vd-ps-{uid}@mail.langwatch.localhost
          password: "{actorPassword}"
      - action: go
        with:
          path: /settings/security
          anonymous: member
      - action: click
        with:
          text: Not now
          optional: "true"
          anonymous: member
      - action: expect
        with:
          text: Linked Accounts
          timeout: "20000"
          anonymous: member
      - action: expect
        with:
          testId: email-identifier-row
          anonymous: member
      - action: expect
        with:
          testId: passkeys-section
          anonymous: member
      - action: expect
        with:
          text: No passkeys yet
          anonymous: member
      - action: expect
        with:
          testId: create-passkey
          anonymous: member
      - action: expect
        with:
          testId: password-section
          anonymous: member
      - action: click
        with:
          testId: add-address
          anonymous: member
      - action: fill
        with:
          testId: new-address
          value: vd-ps2-{uid}@mail.langwatch.localhost
          anonymous: member
      - action: click
        with:
          testId: confirm-add-address
          anonymous: member
      - action: expect
        with:
          testId: address-link-sent
          timeout: "20000"
          anonymous: member
      - action: expect
        with:
          testId: address-unconfirmed
          anonymous: member
      - action: go
        with:
          path: /settings/security
          anonymous: member
      - action: expect
        with:
          text: vd-ps2-{uid}@mail.langwatch.localhost
          timeout: "20000"
          anonymous: member
      - action: expect
        with:
          testId: address-unconfirmed
          anonymous: member
      - action: mail
        with:
          to: vd-ps2-{uid}@mail.langwatch.localhost
          as: addressLink
      - action: go
        with:
          path: "{addressLink}"
          anonymous: member
      - action: expect
        with:
          testId: address-confirmed-now
          timeout: "20000"
          anonymous: member
      - action: go
        with:
          path: /settings/security
          anonymous: member
      - action: expect
        with:
          testId: address-unconfirmed
          equals: "0"
          timeout: "20000"
          anonymous: member
      - action: expect
        with:
          testId: address-confirmed
          min: "2"
          anonymous: member
      - action: click
        with:
          selector: '[data-testid="email-identifier-row"]:has-text("vd-ps2-{uid}") [data-testid="remove-address"]'
          anonymous: member
      - action: expect
        with:
          text: Address removed
          timeout: "20000"
          anonymous: member
      - action: go
        with:
          path: /settings/security
          anonymous: member
      - action: expect
        with:
          text: vd-ps2-{uid}@mail.langwatch.localhost
          equals: "0"
          timeout: "20000"
          anonymous: member
      - action: go
        with:
          path: /settings/directory
      - action: click
        with:
          label: /^Actions for vd-ps-{uid}/
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*(Delete|Remove from organization)\s*$/
      - action: go
        with:
          path: /settings/directory
      - action: expect
        with:
          text: vd-ps-{uid}
          equals: "0"

  # Stops at the shared secret: turning it on needs a TOTP code, and an enrolled admin would sign
  # every other flow into a code prompt. The pending secret a started setup leaves is replaced by
  # the next start.
  - id: personal-security-passkeys-and-two-step-offers
    title: Security offers passkeys and two-step verification, and setup shows a scannable code and a shared secret
    steps:
      - action: go
        with:
          path: /settings/security
      - action: click
        with:
          text: Not now
          optional: "true"
      - action: expect
        with:
          testId: passkeys-section
          timeout: "20000"
      - action: expect
        with:
          text: Passkeys
      - action: expect
        with:
          testId: two-factor-section
      - action: expect
        with:
          testId: two-factor-empty
      - action: click
        with:
          testId: set-up-two-factor
      - action: expect
        with:
          text: Confirm your password to begin
      - action: fill
        with:
          testId: two-factor-password
          value: "{actorPassword}"
      - action: click
        with:
          testId: start-two-factor
      - action: expect
        with:
          testId: two-factor-shared-secret
          timeout: "20000"
      - action: expect
        with:
          testId: two-factor-scannable-code
      - action: expect
        with:
          testId: two-factor-shown-once
      - action: click
        with:
          text: /^\s*Cancel\s*$/
      - action: go
        with:
          path: /settings/security
      - action: expect
        with:
          testId: two-factor-empty
          timeout: "20000"
      - action: expect
        with:
          testId: two-factor-status
          equals: "0"

  - id: personal-profile-api-key-listed-then-revoked
    title: A personal API key created on the API Keys page is listed under Your API keys on Profile, and gone once revoked
    isolated: true
    steps:
      - action: go
        with:
          path: /settings/api-keys
      - action: click
        with:
          text: Create new secret key
      - action: fill
        with:
          field: e.g., CI Pipeline
          value: vd-ppk-{uid}
      - action: click
        with:
          text: Create secret key
      - action: expect
        with:
          text: Token Created
      - action: click
        with:
          label: Close
      - action: go
        with:
          path: /settings/profile
      - action: click
        with:
          text: Not now
          optional: "true"
      - action: expect
        with:
          text: Your API keys
          timeout: "20000"
      - action: expect
        with:
          testId: personal-api-key-row
          hasText: vd-ppk-{uid}
          timeout: "20000"
      - action: expect
        with:
          testId: api-keys-manage
      - action: click
        with:
          text: Manage API keys
      - action: expect
        with:
          url: /settings/api-keys
      - action: click
        with:
          label: Revoke API key vd-ppk-{uid}
      - action: click
        with:
          text: /^\s*Revoke\s*$/
      - action: go
        with:
          path: /settings/profile
      - action: expect
        with:
          text: Your API keys
          timeout: "20000"
      - action: expect
        with:
          testId: personal-api-key-row
          hasText: vd-ppk-{uid}
          equals: "0"
          timeout: "20000"

  - id: personal-profile-manage-links-to-security
    title: The sign-in methods band on Profile links to Security
    steps:
      - action: go
        with:
          path: /settings/profile
      - action: click
        with:
          text: Not now
          optional: "true"
      - action: expect
        with:
          text: Sign-in methods
          timeout: "20000"
      - action: click
        with:
          testId: sign-in-methods-manage
      - action: expect
        with:
          url: /settings/security
          timeout: "20000"
      - action: expect
        with:
          text: Linked Accounts

  # A passkey's whole life as an invited member, on one page with a virtual authenticator: create,
  # rename, sign out and back in with it, delete. Never the shared admin: a passkey on that
  # account would change every other flow's sign-in. The admin removes the member at the end.
  - id: personal-security-passkey-create-rename-sign-in-delete
    title: Create a passkey, rename it, sign in with it after signing out, then delete it
    serial: true
    steps:
      - action: go
        with:
          path: /settings/directory
      - action: click
        with:
          text: Invite people
      - action: fill
        with:
          field: 'alice@example.com, bob@example.com'
          value: 'vd-pk-{uid}@mail.langwatch.localhost'
      - action: click
        with:
          text: /^\s*(Send|Create) invites\s*$/
      - action: mail
        with:
          to: vd-pk-{uid}@mail.langwatch.localhost
          as: inviteLink
      - action: acceptInvite
        with:
          link: "{inviteLink}"
          email: vd-pk-{uid}@mail.langwatch.localhost
          name: vd-pk-{uid}
      - action: signIn
        with:
          anonymous: member
          email: vd-pk-{uid}@mail.langwatch.localhost
          password: "{actorPassword}"
      - action: go
        with:
          path: /settings/security
          anonymous: member
      - action: click
        with:
          text: Not now
          optional: "true"
          anonymous: member
      - action: passkey
        with:
          anonymous: member
      - action: expect
        with:
          testId: passkeys-empty
          timeout: "20000"
          anonymous: member
      - action: click
        with:
          testId: create-passkey
          anonymous: member
      - action: expect
        with:
          text: Passkey created
          timeout: "20000"
          anonymous: member
      - action: go
        with:
          path: '/settings/security'
          anonymous: member
      - action: expect
        with:
          testId: passkey-card
          equals: "1"
          timeout: "20000"
          anonymous: member
      - action: click
        with:
          label: '/^Actions for /'
          anonymous: member
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: '/^\s*Rename\s*$/'
          anonymous: member
      - action: fill
        with:
          testId: passkey-name
          value: vd-pk-{uid}-renamed
          anonymous: member
      - action: click
        with:
          testId: save-passkey-name
          anonymous: member
      - action: expect
        with:
          text: Passkey renamed
          timeout: "20000"
          anonymous: member
      - action: go
        with:
          path: '/settings/security'
          anonymous: member
      - action: expect
        with:
          text: vd-pk-{uid}-renamed
          timeout: "20000"
          anonymous: member
      - action: click
        with:
          label: '/^Open user menu/'
          anonymous: member
      - action: click
        with:
          text: Logout
          anonymous: member
      - action: go
        with:
          path: '/auth/signin'
          anonymous: member
      - action: click
        with:
          testId: passkey-sign-in
          anonymous: member
      - action: expect
        with:
          url: '/^\/(?!auth\/)/'
          timeout: "30000"
          anonymous: member
      - action: go
        with:
          path: '/settings/security'
          anonymous: member
      - action: expect
        with:
          text: vd-pk-{uid}-renamed
          timeout: "20000"
          anonymous: member
      - action: click
        with:
          label: '/^Actions for /'
          anonymous: member
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: '/^\s*Remove\s*$/'
          anonymous: member
      - action: click
        with:
          testId: confirm-remove-passkey
          anonymous: member
      - action: expect
        with:
          text: Passkey removed
          timeout: "20000"
          anonymous: member
      - action: go
        with:
          path: '/settings/security'
          anonymous: member
      - action: expect
        with:
          testId: passkeys-empty
          timeout: "20000"
          anonymous: member
      - action: go
        with:
          path: /settings/directory
      - action: click
        with:
          label: /^Actions for vd-pk-{uid}/
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*(Delete|Remove from organization)\s*$/
      - action: go
        with:
          path: /settings/directory
      - action: expect
        with:
          text: vd-pk-{uid}
          equals: "0"

  # Two-step verification, enrolled and switched off again by an invited member: the secret is read
  # off the setup dialog, the code computed from it (totp), recovery codes shown, then turned off
  # with a code. Never the shared admin, whose second factor every other flow's sign-in depends on.
  - id: personal-security-two-step-enrol-codes-turn-off
    title: Turn on two-step verification with a computed code, see recovery codes, then turn it off
    serial: true
    steps:
      - action: go
        with:
          path: /settings/directory
      - action: click
        with:
          text: Invite people
      - action: fill
        with:
          field: 'alice@example.com, bob@example.com'
          value: 'vd-ts-{uid}@mail.langwatch.localhost'
      - action: click
        with:
          text: /^\s*(Send|Create) invites\s*$/
      - action: mail
        with:
          to: vd-ts-{uid}@mail.langwatch.localhost
          as: inviteLink
      - action: acceptInvite
        with:
          link: "{inviteLink}"
          email: vd-ts-{uid}@mail.langwatch.localhost
          name: vd-ts-{uid}
      - action: signIn
        with:
          anonymous: member
          email: vd-ts-{uid}@mail.langwatch.localhost
          password: "{actorPassword}"
      - action: go
        with:
          path: /settings/security
          anonymous: member
      - action: click
        with:
          text: Not now
          optional: "true"
          anonymous: member
      - action: click
        with:
          testId: set-up-two-factor
          anonymous: member
      - action: fill
        with:
          testId: two-factor-password
          value: '{actorPassword}'
          anonymous: member
      - action: click
        with:
          testId: start-two-factor
          anonymous: member
      - action: expect
        with:
          testId: two-factor-shared-secret
          timeout: "20000"
          anonymous: member
      - action: capture
        with:
          selector: '[data-testid="two-factor-shared-secret"] input'
          as: totpSecret
          anonymous: member
      - action: totp
        with:
          secret: '{totpSecret}'
          testId: two-factor-code
          anonymous: member
      - action: click
        with:
          testId: confirm-two-factor
          anonymous: member
      - action: expect
        with:
          testId: two-factor-backup-codes
          timeout: "20000"
          anonymous: member
      - action: expect
        with:
          testIdPrefix: two-factor-backup-code
          min: "1"
          anonymous: member
      - action: click
        with:
          testId: backup-codes-done
          anonymous: member
      - action: go
        with:
          path: '/settings/security'
          anonymous: member
      - action: expect
        with:
          testId: two-factor-status
          hasText: "On"
          timeout: "20000"
          anonymous: member
      - action: click
        with:
          testId: turn-off-two-factor
          anonymous: member
      - action: fill
        with:
          testId: turn-off-password
          value: '{actorPassword}'
          anonymous: member
      - action: totp
        with:
          secret: '{totpSecret}'
          testId: turn-off-code
          anonymous: member
      - action: click
        with:
          testId: confirm-turn-off-two-factor
          anonymous: member
      - action: go
        with:
          path: '/settings/security'
          anonymous: member
      - action: expect
        with:
          testId: two-factor-empty
          timeout: "20000"
          anonymous: member
      - action: expect
        with:
          testId: two-factor-status
          equals: "0"
          anonymous: member
      - action: go
        with:
          path: /settings/directory
      - action: click
        with:
          label: /^Actions for vd-ts-{uid}/
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*(Delete|Remove from organization)\s*$/
      - action: go
        with:
          path: /settings/directory
      - action: expect
        with:
          text: vd-ts-{uid}
          equals: "0"

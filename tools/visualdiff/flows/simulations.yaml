# Simulations and agent testing: agents, test suites, scenarios and their runs.
#
# Every name carries {uid}, so any number of flows share one stack. The agent
# points at an address that need not answer: creating and listing an agent
# never calls it. A run does call it, then the simulator and judge models with
# the seeded provider key, and the flow waits for the verdict the run panel
# prints. The /agent-testing page renders only with
# release_ui_agent_testing_v2_enabled, which the seed turns on.
# Skipped on purpose: share-simulation-run (no UI: sharing is wired into the
# trace explorer alone) and the empty-state "Setup agent" button (present only
# while the project has no agent, which parallel flows cannot promise).
flows:
  - id: sim-connect-agent
    title: Connect an HTTP agent and find it after a reload
    steps:
      - action: go
        with:
          path: /{slug}/agents
      - action: click
        with:
          text: New Agent
      - action: click
        with:
          testId: agent-type-http
      - action: fill
        with:
          testId: agent-name-input
          value: vd-agent-{uid}
      - action: fill
        with:
          testId: url-input
          value: https://example.com/vd-agent-{uid}
      - action: click
        with:
          testId: save-agent-button
      - action: expect
        with:
          api: /api/agents
          contains: vd-agent-{uid}
      - action: go
        with:
          path: /{slug}/agents
      - action: expect
        with:
          text: vd-agent-{uid}

  - id: sim-create-suite
    title: Name a test suite and find it in the rail after a reload
    steps:
      - action: go
        with:
          path: /{slug}/agent-testing
      - action: click
        with:
          text: New Test Suite
      - action: fill
        with:
          label: Test suite name
          value: vd-suite-{uid}
      - action: click
        with:
          testId: suite-name-confirm
      - action: expect
        with:
          testId: suite-rail-item-vd-suite-{uid}
      - action: go
        with:
          path: /{slug}/agent-testing
      - action: expect
        with:
          testId: suite-rail-item-vd-suite-{uid}

  - id: sim-rename-suite
    title: Rename a test suite in its editor and find the new name after a reload
    steps:
      - action: go
        with:
          path: /{slug}/agent-testing
      - action: click
        with:
          text: New Test Suite
      - action: fill
        with:
          label: Test suite name
          value: vd-suite-{uid}
      - action: click
        with:
          testId: suite-name-confirm
      - action: expect
        with:
          testId: suite-rail-item-vd-suite-{uid}
      - action: click
        with:
          testId: edit-suite-button
      - action: fill
        with:
          label: Test suite name
          value: vd-suite-{uid}-edited
      - action: click
        with:
          testId: suite-editor-save
      - action: expect
        with:
          testId: suite-rail-item-vd-suite-{uid}-edited
      - action: go
        with:
          path: /{slug}/agent-testing
      - action: expect
        with:
          testId: suite-rail-item-vd-suite-{uid}-edited

  - id: sim-create-scenario
    title: Write a scenario into a new test suite and find it after a reload
    steps:
      - action: go
        with:
          path: /{slug}/agent-testing
      - action: click
        with:
          text: New Test Suite
      - action: fill
        with:
          label: Test suite name
          value: vd-suite-{uid}
      - action: click
        with:
          testId: suite-name-confirm
      - action: click
        with:
          text: New scenario
      - action: fill
        with:
          label: Title
          value: vd-scenario-{uid}
      - action: fill
        with:
          label: Situation
          value: A customer asks the agent where their refund is.
      - action: fill
        with:
          label: Criteria
          value: '|-'
      - action: click
        with:
          testId: case-modal-save
      - action: expect
        with:
          testId: case-row-vd-scenario-{uid}
      - action: expect
        with:
          api: /api/scenarios
          contains: vd-scenario-{uid}
      - action: go
        with:
          path: /{slug}/agent-testing
      - action: click
        with:
          testId: suite-rail-item-vd-suite-{uid}
      - action: expect
        with:
          testId: case-row-vd-scenario-{uid}

  - id: sim-run-scenario
    title: Run one scenario against an agent and read its verdict
    steps:
      - action: go
        with:
          path: /{slug}/agents
      - action: click
        with:
          text: New Agent
      - action: click
        with:
          testId: agent-type-http
      - action: fill
        with:
          testId: agent-name-input
          value: vd-agent-{uid}
      - action: fill
        with:
          testId: url-input
          value: https://example.com/vd-agent-{uid}
      - action: click
        with:
          testId: save-agent-button
      - action: expect
        with:
          api: /api/agents
          contains: vd-agent-{uid}
      - action: go
        with:
          path: /{slug}/agent-testing
      - action: click
        with:
          text: New Test Suite
      - action: fill
        with:
          label: Test suite name
          value: vd-suite-{uid}
      - action: click
        with:
          testId: suite-name-confirm
      - action: click
        with:
          text: New scenario
      - action: fill
        with:
          label: Title
          value: vd-scenario-{uid}
      - action: fill
        with:
          label: Situation
          value: A customer asks the agent where their refund is.
      - action: fill
        with:
          label: Criteria
          value: Answers the customer politely
      - action: click
        with:
          testId: case-modal-save
      - action: click
        with:
          testId: case-row-vd-scenario-{uid}-run
      - action: click
        with:
          selector: '[data-testid^="run-dialog-agent-"]'
          text: vd-agent-{uid}
      - action: fill
        with:
          testId: run-dialog-name
          value: vd-run-{uid}
      - action: click
        with:
          testId: run-dialog-run
      - action: expect
        with:
          testId: run-verdict-panel
          timeout: "240000"
      - action: expect
        with:
          count: '[data-testid="run-verdict-status-passed"], [data-testid="run-verdict-status-failed"]'
      - action: go
        with:
          path: /{slug}/agent-testing/results
      - action: click
        with:
          text: vd-run-{uid}

  - id: sim-run-suite
    title: Run a whole test suite and open a run from its results
    steps:
      - action: go
        with:

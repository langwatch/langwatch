      - action: fill
        with:
          testId: url-input
          value: https://example.com/vd-agent-{uid}
      - action: click
        with:
          testId: save-agent-button
      - action: expect
        with:
          api: /api/agents
          contains: vd-agent-{uid}
      - action: go
        with:
          path: /{slug}/agent-testing
      - action: click
        with:
          text: New Test Suite
      - action: fill
        with:
          label: Test suite name
          value: vd-suite-{uid}
      - action: click
        with:
          testId: suite-name-confirm
      - action: click
        with:
          text: New scenario
      - action: fill
        with:
          label: Title
          value: vd-scenario-{uid}
      - action: fill
        with:
          label: Situation
          value: A customer asks the agent where their refund is.
      - action: fill
        with:
          label: Criteria
          value: Answers the customer politely
      - action: click
        with:
          testId: case-modal-save
      - action: expect
        with:
          testId: case-row-vd-scenario-{uid}
      - action: click
        with:
          text: Run suite
      - action: click
        with:
          selector: '[data-testid^="run-dialog-agent-"]'
          text: vd-agent-{uid}
      - action: fill
        with:
          testId: run-dialog-name
          value: vd-suite-run-{uid}
      - action: click
        with:
          testId: run-dialog-run
      - action: go
        with:
          path: /{slug}/agent-testing/results
      - action: click
        with:
          text: vd-suite-run-{uid}
      - action: expect
        with:
          testId: agent-testing-run-plan-detail
      - action: click
        with:
          testIdPrefix: run-result-row-
      - action: expect
        with:
          testId: run-verdict-panel
          timeout: "240000"
      - action: expect
        with:
          count: '[data-testid="run-verdict-status-passed"], [data-testid="run-verdict-status-failed"]'


# Automations beyond the email flows in prompts-automations.yaml: a webhook channel and a
# condition built from the query chips, each read back from the API and the list after a
# reload. Slack is not scripted: new Slack automations need a connected Slack app.
# Unrun: written under load.
flows:
  - id: automation-channel-webhook
    title: Deliver an automation to a webhook and find it after a reload
    steps:
      - action: go
        with:
          path: /{slug}/automations/automations
      - action: click
        with:
          text: New automation
      - action: fill
        with:
          field: Flag failing traces
          value: 'vd-hook-{uid}'
      - action: click
        with:
          text: /^\s*Code\s*$/
      - action: click
        with:
          text: 'status:error'
      - action: click
        with:
          text: /^\s*Webhook/
      - action: fill
        with:
          field: 'https://example.com/hooks/langwatch'
          value: 'https://example.com/hooks/vd-{uid}'
      - action: click
        with:
          text: /^\s*Done\s*$/
      - action: click
        with:
          text: /^\s*Create automation\s*$/
      - action: expect
        with:
          api: /api/triggers
          contains: vd-hook-{uid}
      - action: expect
        with:
          api: /api/triggers
          contains: https://example.com/hooks/vd-{uid}
      - action: go
        with:
          path: /{slug}/automations/automations
      - action: expect
        with:
          label: 'Actions for vd-hook-{uid}'

  - id: automation-condition-preview-and-save
    title: Build a condition from the query chips, see the trace preview and keep it after saving
    steps:
      - action: go
        with:
          path: /{slug}/automations/automations
      - action: click
        with:
          text: New automation
      - action: fill
        with:
          field: Flag failing traces
          value: 'vd-cond-{uid}'
      - action: click
        with:
          text: /^\s*Code\s*$/
      - action: click
        with:
          text: 'model:gpt*'
      - action: expect
        with:
          text: /matched/
          timeout: "20000"
      - action: click
        with:
          text: /^\s*Email/
      - action: fill
        with:
          field: 'alerts@partner.com'
          value: 'vd-{uid}@example.com'
      - action: click
        with:
          text: Add email
      - action: click
        with:
          text: /^\s*Done\s*$/
      - action: click
        with:
          text: /^\s*Create automation\s*$/
      - action: expect
        with:
          api: /api/triggers
          contains: vd-cond-{uid}
      - action: expect
        with:
          api: /api/triggers
          contains: model:gpt*
      - action: go
        with:
          path: /{slug}/automations/automations
      - action: expect
        with:
          label: 'Actions for vd-cond-{uid}'

# Analytics dashboards: each widget kind on a dashboard, read back after a reload.
#
# Complements the dashboard-create, dashboard-widget-add-edit-delete and dashboard-rename-and-delete
# flows in prompts-automations.yaml, which prove the dashboard row itself. A dashboard and a builder
# graph on it are posted by setup, so these flows begin on the dashboard's own address.
# Not scripted, with the reason:
#  - a shared dashboard: nothing in the dashboard or analytics modules shares one;
#  - a saved LangWatchQL chart placed on a dashboard, and a code widget seeded over REST: both
#    routes are project-scoped (/api/v1/projects/:projectId/...) and no fixture carries the id.
flows:
  - id: dashboard-graph-edit-and-delete
    title: Open a builder graph from its dashboard, rename it in the builder, then delete it
    setup:
      - post: /api/dashboards
        body:
          name: vd-dash-graph-setup
        as:
          dashId: id
      - post: /api/graphs
        body:
          name: vd-graph-seeded
          dashboardId: "{dashId}"
          graph:
            graphType: line
            includePrevious: false
            timeScale: 60
            series:
              - metric: metadata.trace_id
                aggregation: cardinality
                name: Traces
                colorSet: orangeTones
        as:
          graphId: id
    steps:
      - action: go
        with:
          path: /{slug}/analytics/reports?dashboard={dashId}
      - action: expect
        with:
          text: vd-graph-seeded
      - action: click
        with:
          selector: 'button:has(svg.lucide-ellipsis-vertical[width="24"])'
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*Edit( Graph)?\s*$/
      - action: fill
        with:
          selector: 'input[name="title"]'
          value: "vd-graph-{uid}"
      - action: click
        with:
          text: /^\s*Update\s*$/
      - action: expect
        with:
          api: /api/graphs/{graphId}
          field: name
          equals: vd-graph-{uid}
      - action: go
        with:
          path: /{slug}/analytics/reports?dashboard={dashId}
      - action: expect
        with:
          text: vd-graph-{uid}
      - action: click
        with:
          selector: 'button:has(svg.lucide-ellipsis-vertical[width="24"])'
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: Delete Graph
      - action: expect
        with:
          text: vd-graph-{uid}
          equals: "0"
      - action: expect
        with:
          api: /api/graphs?dashboardId={dashId}
          equals: "[]"

  - id: dashboard-code-widget-persists
    title: Add a code widget to a dashboard and see it again after a reload
    setup:
      - post: /api/dashboards
        body:
          name: vd-dash-widget-setup
        as:
          dashId: id
    steps:
      - action: go
        with:
          path: /{slug}/analytics/reports?dashboard={dashId}
      - action: click
        with:
          text: Add chart
      - action: click
        with:
          label: Rename New widget
      - action: fill
        with:
          selector: "input:focus"
          value: vd-widget-{uid}
      - action: click
        with:
          text: /^\s*Queries/
      - action: click
        with:
          text: /^\s*Save\s*$/
      - action: expect
        with:
          text: vd-widget-{uid}
      - action: go
        with:
          path: /{slug}/analytics/reports?dashboard={dashId}
      - action: expect
        with:
          text: vd-widget-{uid}
      - action: expect
        with:
          count: 'button:has(svg.lucide-ellipsis-vertical[width="24"])'
          equals: "1"

  - id: dashboard-graph-delete-reads-back
    title: A dashboard's graphs, read from the API, follow a graph being deleted from its card
    setup:
      - post: /api/dashboards
        body:
          name: vd-dash-count-setup
        as:
          dashId: id
      - post: /api/graphs
        body:
          name: vd-graph-count
          dashboardId: "{dashId}"
          graph:
            graphType: line
            includePrevious: false
            timeScale: 60
            series:
              - metric: metadata.trace_id
                aggregation: cardinality
                name: Traces
                colorSet: orangeTones
        as:
          graphId: id
    steps:
      - action: expect
        with:
          api: /api/dashboards/{dashId}
          field: graphs
          min: "1"
      - action: go
        with:
          path: /{slug}/analytics/reports?dashboard={dashId}
      - action: click
        with:
          selector: 'button:has(svg.lucide-ellipsis-vertical[width="24"])'
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: Delete Graph
      - action: expect
        with:
          api: /api/dashboards/{dashId}
          field: graphs
          equals: "[]"

  - id: analytics-custom-chart-lifecycle
    title: Build a custom chart on a dashboard, reload, rename it in the builder, reload, then delete it
    setup:
      - post: /api/dashboards
        body:
          name: vd-dash-chart-{uid}
        as:
          dashId: id
    steps:
      - action: go
        with:
          path: /{slug}/analytics/custom?dashboard={dashId}
      - action: fill
        with:
          selector: 'input[name="title"]'
          value: vd-chart-{uid}
      - action: click
        with:
          selector: 'button:text-is("Save")'
      - action: expect
        with:
          url: /analytics/reports
      - action: expect
        with:
          text: vd-chart-{uid}
      - action: go
        with:
          path: /{slug}/analytics/reports?dashboard={dashId}
      - action: expect
        with:
          text: vd-chart-{uid}
      - action: expect
        with:
          api: /api/graphs?dashboardId={dashId}
          contains: vd-chart-{uid}
      - action: click
        with:
          selector: 'button:has(svg.lucide-ellipsis-vertical[width="24"])'
      - action: click
        with:
          selector: '[role=menuitem]:has-text("Edit Graph")'
      - action: fill
        with:
          selector: 'input[name="title"]'
          value: vd-chart-{uid}-b
      - action: click
        with:
          selector: 'button:text-is("Update")'
      - action: expect
        with:
          url: /analytics/reports
      - action: go
        with:
          path: /{slug}/analytics/reports?dashboard={dashId}
      - action: expect
        with:
          text: vd-chart-{uid}-b
      - action: click
        with:
          selector: 'button:has(svg.lucide-ellipsis-vertical[width="24"])'
      - action: click
        with:
          selector: '[role=menuitem]:has-text("Delete Graph")'
      - action: expect
        with:
          text: vd-chart-{uid}-b
          equals: "0"
      - action: go
        with:
          path: /{slug}/analytics/reports?dashboard={dashId}
      - action: expect
        with:
          text: vd-chart-{uid}-b
          equals: "0"
      - action: expect
        with:
          api: /api/graphs?dashboardId={dashId}
          equals: "[]"

# The signal-focused home (lane home-briefing). Labels come from origin/main:
# features/briefing/components/{QuietHeadline,SetupHairline}.tsx and components/home/HomePage.tsx.
# The home only composes as the briefing when release_ui_home_signal_focused_enabled is on for the
# stack; without it both sides render the classic home and this flow is red on both.
# A project with no traces is quiet, so the sheet shows QuietHeadline, not the anomaly feed.
flows:
  - id: home-briefing-quiet-project-invitation
    title: A quiet project's signal-focused home leads with sending the first trace and lands on traces
    isolated: true
    steps:
      - action: go
        with:
          path: /{isolatedSlug}
      - action: expect
        with:
          text: Your project is quiet. Send a trace and the watch begins.
          timeout: "30000"
      - action: expect
        with:
          text: Send your first trace
      - action: expect
        with:
          text: Learn more →
      - action: click
        with:
          text: Send your first trace
      - action: expect
        with:
          url: /{isolatedSlug}/traces
          timeout: "20000"

  - id: home-briefing-setup-hairline
    title: The signal-focused home carries the setup hairline with its count and collapses on Hide
    isolated: true
    steps:
      - action: go
        with:
          path: /{isolatedSlug}
      - action: expect
        with:
          text: /Setup · \d+ of 9 done/
          timeout: "30000"
      - action: expect
        with:
          text: Hide
      - action: click
        with:
          text: Hide
      - action: expect
        with:
          text: Finish setup
      - action: expect
        with:
          text: Sync your first message
          equals: "0"

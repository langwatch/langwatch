# Langy, the assistant panel: open it, send a message, see the reply or the error, come back to it
# in the recent chats, start a new chat and minimise it. Steps use what main has too (aria labels,
# the data-langy-composer anchor, langy-transcript-notice); the one branch-only step is marked.
# Needs release_langy_enabled on for the project (the orb does not draw without it) and, for a
# reply, a model provider the langy worker can reach; without one the outcome step shows the
# stack, not a script fault. Names carry {uid}.
flows:
  - id: langy-send-message-and-reply
    title: Open Langy, send a message and see it answered, or a clear notice
    steps:
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: expect
        with:
          label: Langy assistant
      - action: click
        with:
          label: /^Model:/
      - action: type
        with:
          placeholder: Search models
          text: langy-echo
      - action: click
        with:
          selector: "[role=option]"
          text: /langy.?echo/
      - action: fill
        with:
          selector: "[data-langy-composer] textarea"
          value: Say hello to vd{uid} in one short sentence
      - action: click
        with:
          label: Send
      - action: expect
        with:
          text: vd{uid}
      # branch-only: main has no langy-assistant-message id; langy-transcript-notice is shared.
      - action: expect
        with:
          count: '[data-testid="langy-assistant-message"], [data-testid="langy-transcript-notice"]'
          timeout: "90000"

  - id: langy-history-and-new-chat
    title: A sent message shows in the recent chats after a reload, and New chat starts an empty one
    steps:
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: fill
        with:
          selector: "[data-langy-composer] textarea"
          value: Remember the word vd{uid}
      - action: click
        with:
          label: Send
      - action: expect
        with:
          text: vd{uid}
      - action: click
        with:
          label: New chat
      - action: expect
        with:
          text: vd{uid}
          equals: "0"
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: click
        with:
          label: Recent chats
      - action: expect
        with:
          label: /vd{uid}/
          timeout: "30000"
      - action: click
        with:
          label: /vd{uid}/
      - action: expect
        with:
          text: vd{uid}
          timeout: "30000"

  - id: langy-minimise-and-reopen
    title: Minimise Langy, then reopen it on the same conversation
    steps:
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: fill
        with:
          selector: "[data-langy-composer] textarea"
          value: Keep this open vd{uid}
      - action: click
        with:
          label: Send
      - action: expect
        with:
          text: vd{uid}
      - action: click
        with:
          label: Minimise Langy
      - action: expect
        with:
          label: Langy assistant
          equals: "0"
      - action: click
        with:
          label: Open Langy assistant
      - action: expect
        with:
          text: vd{uid}

  # Flows below need the stack's llmsim (`haven up +llm`): the model picker offers langy-echo, and
  # in that mode a plain message comes back verbatim and a `/tool <name> <json>` line makes exactly
  # that tool call (services/llmsim/README.md). Labels and test ids are main's.
  - id: langy-open-from-home
    title: Open Langy from the project home, then minimise it
    steps:
      - action: go
        with:
          path: /{slug}
      - action: click
        with:
          label: Open Langy assistant
      - action: expect
        with:
          label: Langy assistant
      - action: expect
        with:
          count: "[data-langy-composer] textarea"
      - action: click
        with:
          label: Minimise Langy
      - action: expect
        with:
          label: Langy assistant
          equals: "0"

  - id: langy-open-from-page
    title: Open Langy from a product page and keep the page behind it
    steps:
      - action: go
        with:
          path: /{slug}/datasets
      - action: click
        with:
          label: Open Langy assistant
      - action: expect
        with:
          label: Langy assistant
      - action: expect
        with:
          count: "[data-langy-composer] textarea"
      - action: expect
        with:
          url: /datasets

  - id: langy-ask-and-answer-llmsim
    title: Ask a question with the llmsim echo model and read the answer under it
    steps:
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: click
        with:
          label: /^Model:/
      - action: type
        with:
          placeholder: Search models
          text: langy-echo
      - action: click
        with:
          selector: "[role=option]"
          text: /langy.?echo/
      - action: fill
        with:
          selector: "[data-langy-composer] textarea"
          value: Answer this with vd{uid} and nothing else
      - action: click
        with:
          label: Send
      # The question and its verbatim echo both carry the token.
      - action: expect
        with:
          text: vd{uid}
          min: "2"
          timeout: "90000"
      - action: expect
        with:
          label: Langy conversation

  - id: langy-history-rename
    title: Rename a recent chat, see the new title after a reload and reopen the chat by it
    steps:
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: click
        with:
          label: /^Model:/
      - action: type
        with:
          placeholder: Search models
          text: langy-echo
      - action: click
        with:
          selector: "[role=option]"
          text: /langy.?echo/
      - action: fill
        with:
          selector: "[data-langy-composer] textarea"
          value: Rename this chat vd{uid}
      - action: click
        with:
          label: Send
      - action: expect
        with:
          text: vd{uid}
      - action: click
        with:
          label: Recent chats
      - action: click
        with:
          selector: 'li:has-text("Rename this chat vd{uid}") [aria-label="Conversation actions"]'
      - action: click
        with:
          selector: "[role=menuitem]"
          text: Rename
      - action: fill
        with:
          label: Conversation title
          value: Titled vd{uid}
      - action: click
        with:
          label: Save title
      - action: expect
        with:
          label: /Titled vd{uid}/
          timeout: "30000"
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: click
        with:
          label: Recent chats
      - action: expect
        with:
          label: /Titled vd{uid}/
          timeout: "30000"
      - action: click
        with:
          label: /Titled vd{uid}/
      - action: expect
        with:
          text: Rename this chat vd{uid}
          timeout: "30000"

  - id: langy-history-delete
    title: Delete a recent chat and see it gone after a reload
    steps:
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: fill
        with:
          selector: "[data-langy-composer] textarea"
          value: Delete this chat vd{uid}
      - action: click
        with:
          label: Send
      - action: expect
        with:
          text: vd{uid}
      - action: click
        with:
          label: Recent chats
      - action: click
        with:
          selector: 'li:has-text("Delete this chat vd{uid}") [aria-label="Conversation actions"]'
      - action: click
        with:
          selector: "[role=menuitem]"
          text: Rename
      - action: fill
        with:
          label: Conversation title
          value: Doomed vd{uid}
      - action: click
        with:
          label: Save title
      - action: expect
        with:
          label: /Doomed vd{uid}/
          timeout: "30000"
      - action: click
        with:
          selector: 'li:has-text("Doomed vd{uid}") [aria-label="Conversation actions"]'
      - action: click
        with:
          selector: "[role=menuitem]"
          text: Delete
      - action: expect
        with:
          label: /Doomed vd{uid}/
          equals: "0"
          timeout: "30000"
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: click
        with:
          label: Recent chats
      - action: expect
        with:
          label: /Doomed vd{uid}/
          equals: "0"

  - id: langy-code-access-card-asks
    title: The code access card asks how to reach the code, and the describe way out stays off
    steps:
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: click
        with:
          label: /^Model:/
      - action: type
        with:
          placeholder: Search models
          text: langy-echo
      - action: click
        with:
          selector: "[role=option]"
          text: /langy.?echo/
      - action: fill
        with:
          selector: "[data-langy-composer] textarea"
          value: '/tool code_access {"reason":"wire tracing in vd{uid}"}'
      - action: click
        with:
          label: Send
      - action: expect
        with:
          testId: langy-code-access-card
          timeout: "90000"
      - action: expect
        with:
          text: How should I reach your code?
      - action: expect
        with:
          text: Share local folder
      - action: expect
        with:
          text: Connect to GitHub
      - action: expect
        with:
          testId: langy-remember-code-access
      - action: expect
        with:
          testId: langy-code-access-describe
          equals: "0"

  - id: langy-code-access-card-offers-describe
    title: A code access call that offers the describe way out shows it on the card
    steps:
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: click
        with:
          label: /^Model:/
      - action: type
        with:
          placeholder: Search models
          text: langy-echo
      - action: click
        with:
          selector: "[role=option]"
          text: /langy.?echo/
      - action: fill
        with:
          selector: "[data-langy-composer] textarea"
          value: '/tool code_access {"reason":"wire tracing in vd{uid}","offer_describe":true}'
      - action: click
        with:
          label: Send
      - action: expect
        with:
          testId: langy-code-access-card
          timeout: "90000"
      - action: expect
        with:
          testId: langy-code-access-describe
          hasText: I'd rather describe it

  - id: langy-code-access-card-waits-for-the-terminal
    title: Choosing the local folder turns the card into the command and the wait
    steps:
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          label: Open Langy assistant
          optional: "true"
      - action: click
        with:
          label: /^Model:/
      - action: type
        with:
          placeholder: Search models
          text: langy-echo
      - action: click
        with:
          selector: "[role=option]"
          text: /langy.?echo/
      - action: fill
        with:
          selector: "[data-langy-composer] textarea"
          value: '/tool code_access {"reason":"wire tracing in vd{uid}"}'
      - action: click
        with:
          label: Send
      - action: expect
        with:
          testId: langy-code-access-card
          timeout: "90000"
      - action: click
        with:
          testId: langy-code-access-option
          hasText: Share local folder
      - action: expect
        with:
          text: "Run this in the folder you want me to work in:"
          timeout: "30000"
      - action: expect
        with:
          text: Waiting for you to approve in the terminal
      - action: expect
        with:
          label: Copy the command

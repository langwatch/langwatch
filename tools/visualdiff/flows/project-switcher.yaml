# The project switcher opened from a page inside a project: its search field and New Project row
# (main: ProjectSwitcherComboboxPopup). Creating and switching live in shell-navigation.yaml.
flows:
  - id: shell-project-switcher-opens-with-search-and-new-project
    title: Open the project switcher on the experiments page and find its search field and New Project row
    steps:
      - action: go
        with:
          path: /{slug}/experiments
      - action: click
        with:
          label: Switch project
      - action: expect
        with:
          label: Search projects
      - action: expect
        with:
          text: New Project

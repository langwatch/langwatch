      - action: go
        with:
          path: /{slug}/analytics/custom/vd-missing-{uid}
      - action: expect
        with:
          text: Graph not found
      - action: expect
        with:
          text: does not exist or you do not have access

  - id: dashboard-reorder-dashboards-reads-back
    title: Move a dashboard up in the sidebar and see the order again after a reload
    setup:
      - post: /api/dashboards
        body:
          name: vd-reorder-first
      - post: /api/dashboards
        body:
          name: vd-reorder-second
    steps:
      - action: go
        with:
          path: /{slug}/analytics/reports
      - action: expect
        with:
          count: 'xpath=//a[normalize-space()="vd-reorder-first"]/following::a[normalize-space()="vd-reorder-second"]'
          equals: "1"
      - action: click
        with:
          selector: 'xpath=//a[normalize-space()="vd-reorder-second"]/following-sibling::button[contains(@class,"menu-btn")]'
      - action: click
        with:
          selector: '[role="menuitem"]'
          text: /^\s*Move Up\s*$/
      - action: expect
        with:
          count: 'xpath=//a[normalize-space()="vd-reorder-second"]/following::a[normalize-space()="vd-reorder-first"]'
          equals: "1"
      - action: go
        with:
          path: /{slug}/analytics/reports
      - action: expect
        with:
          count: 'xpath=//a[normalize-space()="vd-reorder-second"]/following::a[normalize-space()="vd-reorder-first"]'
          equals: "1"

  - id: dashboard-reorder-graphs-reads-back

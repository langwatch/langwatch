# Analytics on main's addresses: overview cards, the period switch, the users and topics pages,
# every chart kind the builder offers, dashboard rename/reorder/widget edits read back after a
# reload, and saved charts reopened.
#
# Labels, headings and test ids come from origin/main (platform/app/src/components/analytics,
# components/PeriodSelector.tsx, pages/[project]/analytics). Every name carries {uid}, except where
# a setup-made row is found by its own fixed name (a setup {uid} is not the flow's).
# Not scripted, with the reason:
#  - CSV and PNG export: main's analytics pages and dashboards have no export control to click;
#  - a saved LangWatchQL chart or the workbench: main has no workbench page, and the saved-chart
#    REST route is project-scoped (/api/v1/projects/:projectId/...) with no fixture carrying the id;
#  - topic data: topics are clustered offline, so the topics page is read as its cards, not rows.
flows:
  - id: analytics-overview-cards
    title: The analytics overview shows its user, LLM, evaluation and topic cards
    steps:
      - action: go
        with:
          path: /{slug}/analytics
      - action: expect
        with:
          text: Top Topics
      - action: expect
        with:
          text: Thread Metrics
      - action: expect
        with:
          text: LLM Metrics
      - action: expect
        with:
          text: Evaluations Summary
      - action: expect
        with:
          text: Error Trend
      - action: expect
        with:
          text: Latency Trend
      - action: expect
        with:
          text: Custom Dashboards
      - action: expect
        with:
          count: "[role=tab]"
          min: "3"

  - id: analytics-overview-tabs
    title: The overview's user card switches between traces, threads and users
    steps:
      - action: go
        with:
          path: /{slug}/analytics
      - action: click
        with:
          selector: "[role=tab]"
          text: /Threads/
      - action: expect
        with:
          count: '[role=tab][aria-selected="true"]:has-text("Threads")'
          equals: "1"
      - action: click
        with:
          selector: "[role=tab]"
          text: /Users/
      - action: expect
        with:
          count: '[role=tab][aria-selected="true"]:has-text("Users")'
          equals: "1"

  - id: analytics-overview-period-switch
    title: Switch the overview's time range from the picker and see it again after a reload
    steps:
      - action: go
        with:
          path: /{slug}/analytics
      - action: expect
        with:
          text: Last 30 days
      - action: click
        with:
          selector: button
          text: /Last 30 days/
      - action: expect
        with:
          text: Select Date Range
      - action: click
        with:
          selector: button
          text: /^\s*Last 7 days\s*$/
      - action: wait
        with:
          millis: "1500"
      - action: expect
        with:
          count: 'button:has-text("Last 7 days")'
          equals: "1"
      - action: go
        with:
          path: /{slug}/analytics?period=7d
      - action: expect
        with:
          text: Last 7 days
      - action: go
        with:
          path: /{slug}/analytics?period=90d
      - action: expect
        with:
          text: Last 90 days

  - id: analytics-overview-period-custom-range
    title: Type a start date into the picker and read the range back on the trigger
    steps:
      - action: go
        with:
          path: /{slug}/analytics
      - action: click
        with:
          selector: button
          text: /Last 30 days/
      - action: fill
        with:
          selector: 'input[type="datetime-local"]'
          value: "2026-01-01T00:00"
      - action: expect
        with:
          text: /Jan 1 - /

  - id: analytics-overview-navigation
    title: The analytics menu and the overview's links reach users, topics, LLM metrics and back
    steps:
      - action: go
        with:
          path: /{slug}/analytics
      - action: click
        with:
          label: View LLM Metrics
      - action: expect
        with:
          url: /analytics/metrics
      - action: click
        with:
          selector: a
          text: /^\s*Users\s*$/
      - action: expect
        with:
          url: /analytics/users
      - action: click
        with:
          selector: a
          text: /^\s*Topics\s*$/
      - action: expect
        with:
          url: /analytics/topics
      - action: click
        with:
          selector: a
          text: /^\s*Overview\s*$/
      - action: expect
        with:
          url: /\/analytics$/

  - id: analytics-overview-dashboard-card
    title: A dashboard shows as a card on the overview and opens its report
    setup:
      - post: /api/dashboards
        body:
          name: vd-overview-card
        as:
          dashId: id
    steps:
      - action: go
        with:
          path: /{slug}/analytics
      - action: expect
        with:
          text: vd-overview-card
      - action: click
        with:
          selector: a
          text: vd-overview-card
      - action: expect
        with:
          url: /analytics/reports

  - id: analytics-users-page
    title: The users page shows its user, thread, leaderboard and feedback cards
    steps:
      - action: go
        with:
          path: /{slug}/analytics/users
      - action: expect

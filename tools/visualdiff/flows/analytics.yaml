          selector: 'button:text-is("Update")'
      - action: expect
        with:
          api: /api/graphs/{graphId}
          field: name
          equals: vd-saved-chart-{uid}
      - action: expect
        with:
          api: /api/graphs/{graphId}
          field: graph.graphType
          equals: bar

  - id: analytics-saved-chart-missing

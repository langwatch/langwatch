  - id: analytics-chart-kind-summary
    title: Build a summary on a dashboard, save it and read its kind back after a reload
    setup:
      - post: /api/dashboards
        body:
          name: vd-dash-kind-summary
        as:
          dashId: id
    steps:
      - action: go
        with:
          path: /{slug}/analytics/custom?dashboard={dashId}
      - action: click
        with:
          selector: "[role=combobox]"
          text: /Line Chart/
      - action: click
        with:
          selector: "[role=option]"
          text: /^\s*Summary\s*$/
      - action: fill
        with:
          selector: 'input[name="title"]'
          value: vd-summary-{uid}
      - action: click
        with:
          selector: 'button:text-is("Save")'
      - action: expect
        with:
          url: /analytics/reports
      - action: go
        with:
          path: /{slug}/analytics/reports?dashboard={dashId}
      - action: expect
        with:
          text: vd-summary-{uid}
      - action: expect
        with:
          api: /api/graphs?dashboardId={dashId}
          field: 0.graph.graphType
          equals: summary


  - id: dashboard-lifecycle-reload-readback
    title: Create a dashboard, add a widget, rename the dashboard, delete it, reloading after each
    setup:
      - post: /api/dashboards
        body:
          name: vd-lifecycle-keeper
    steps:
      - action: go
        with:
          path: /{slug}/analytics/reports
      - action: click
        with:
          text: Add Dashboard
      - action: fill
        with:
          field: Dashboard name
          value: vd-life-{uid}
      - action: click
        with:
          selector: button
          text: /^\s*Create Dashboard\s*$/
      - action: expect
        with:
          api: /api/dashboards
          contains: vd-life-{uid}
      - action: click
        with:
          text: Add chart
      - action: click
        with:
          label: Rename New widget
      - action: fill
        with:
          selector: "input:focus"
          value: vd-life-widget-{uid}
      - action: click
        with:
          text: /^\s*Queries/
      - action: click
        with:
          text: /^\s*Save\s*$/
      - action: expect
        with:
          text: vd-life-widget-{uid}
      - action: go
        with:
          path: /{slug}/analytics/reports
      - action: click
        with:
          selector: a
          text: vd-life-{uid}
      - action: expect
        with:
          text: vd-life-widget-{uid}
      - action: click
        with:
          selector: 'xpath=//a[normalize-space()="vd-life-{uid}"]/following-sibling::button[contains(@class,"menu-btn")]'
      - action: click
        with:
          selector: '[role="menuitem"]'
          text: /^\s*Rename\s*$/
      - action: fill
        with:
          selector: "input:focus"
          value: vd-life-renamed-{uid}
      - action: type
        with:
          selector: "input:focus"
          text: ""
          submit: "true"
      - action: expect
        with:
          api: /api/dashboards
          contains: vd-life-renamed-{uid}
      - action: go
        with:
          path: /{slug}/analytics/reports
      - action: expect
        with:
          text: vd-life-renamed-{uid}
      - action: click
        with:
          selector: 'xpath=//a[normalize-space()="vd-life-renamed-{uid}"]/following-sibling::button[contains(@class,"menu-btn")]'
      - action: click
        with:
          selector: '[role="menuitem"]'
          text: /^\s*Delete\s*$/
      - action: click
        with:
          text: /^Delete$/
      - action: go
        with:
          path: /{slug}/analytics/reports
      - action: expect
        with:
          text: vd-life-renamed-{uid}
          equals: "0"
      - action: expect
        with:
          text: vd-lifecycle-keeper

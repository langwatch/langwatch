          name: vd-graph-order-first
          dashboardId: "{dashId}"
          gridColumn: 0
          gridRow: 0
          graph:
            graphType: line
            includePrevious: false
            timeScale: 60
            series:
              - metric: metadata.trace_id
                aggregation: cardinality
                name: Traces
                colorSet: orangeTones
      - post: /api/graphs
        body:
          name: vd-graph-order-second
          dashboardId: "{dashId}"
          gridColumn: 0
          gridRow: 3
          graph:
            graphType: line
            includePrevious: false
            timeScale: 60
            series:
              - metric: metadata.trace_id
                aggregation: cardinality
                name: Traces
                colorSet: orangeTones
    steps:
      - action: go
        with:
          path: /{slug}/analytics/reports?dashboard={dashId}
      - action: expect
        with:
          count: .chart-grid-item
          equals: "2"
      - action: expect
        with:
          api: /api/graphs?dashboardId={dashId}
          field: 0.name
          equals: vd-graph-order-first
      - action: drag
        with:
          fromSelector: ".chart-grid-item:nth-of-type(1) .chart-grid-drag-handle"
          toSelector: ".chart-grid-item:nth-of-type(2) .chart-grid-drag-handle"
      - action: expect
        with:
          api: /api/graphs?dashboardId={dashId}
          field: 0.name
          equals: vd-graph-order-second
          timeout: "15000"
      - action: go
        with:
          path: /{slug}/analytics/reports?dashboard={dashId}
      - action: expect
        with:
          api: /api/graphs?dashboardId={dashId}
          field: 0.name
          equals: vd-graph-order-second


  - id: analytics-chart-kind-edit-reads-back
    title: Change a saved chart's kind in the builder, update it and read the kind back
    setup:
      - post: /api/dashboards
        body:
          name: vd-dash-kind-edit
        as:
          dashId: id
      - post: /api/graphs
        body:
          name: vd-graph-kind-edit
          dashboardId: "{dashId}"
          graph:
            graphType: line
            includePrevious: false
            timeScale: 60
            series:
              - metric: metadata.trace_id
                aggregation: cardinality
                name: Traces
                colorSet: orangeTones
        as:
          graphId: id
    steps:
      - action: go
        with:
          path: /{slug}/analytics/custom/{graphId}?dashboard={dashId}
      - action: expect
        with:
          text: Line Chart
      - action: click
        with:
          selector: "[role=combobox]"
          text: /Line Chart/
      - action: click
        with:
          selector: "[role=option]"
          text: /^\s*Horizontal Bar Chart\s*$/
      - action: click
        with:
          selector: 'button:text-is("Update")'
      - action: expect
        with:
          url: /analytics/reports
      - action: expect
        with:
          api: /api/graphs/{graphId}
          field: graph.graphType
          equals: horizontal_bar
      - action: go
        with:
          path: /{slug}/analytics/custom/{graphId}?dashboard={dashId}
      - action: expect
        with:
          text: Horizontal Bar Chart


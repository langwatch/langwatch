        with:
          text: New version published

  # Same journey as eval-online-toggle-edit-delete, for main: the monitor is posted through the
  # API and every click uses handles both trees draw (Actions for <name>, menu words, the
  # drawer's name placeholder and its Save Changes button).
  - id: eval-online-disable-edit-delete-shared
    title: Disable an online evaluation, rename it, delete it, each read back from the API
    setup:
      - post: /api/evaluators
        body:
          name: vd-ev-{uid}
          config:
            evaluatorType: lingua/language_detection
        as:
          evaluatorId: id
      - post: /api/monitors
        body:
          name: vd-mon-{uid}
          checkType: lingua/language_detection
          evaluatorId: "{evaluatorId}"
          parameters: {}
          mappings:
            mapping:
              output:
                source: output
            expansions: []
        as:
          monitorId: id
          monitorName: name
    steps:
      - action: go
        with:
          path: /{slug}/online-evaluations
      - action: expect
        with:
          text: Active
          role: row
          name: "{monitorName}"
      - action: click
        with:
          label: Actions for {monitorName}
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*Disable\s*$/
      - action: expect
        with:
          api: /api/monitors/{monitorId}
          field: enabled
          equals: "false"
      - action: go
        with:
          path: /{slug}/online-evaluations
      - action: expect
        with:
          text: Paused
          role: row
          name: "{monitorName}"
      - action: click
        with:
          label: Actions for {monitorName}
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*Edit\s*$/
      - action: fill
        with:
          field: Enter evaluation name
          value: "{monitorName}-renamed"
      - action: click
        with:
          text: Save Changes
      - action: expect
        with:
          api: /api/monitors/{monitorId}
          field: name
          equals: "{monitorName}-renamed"
      - action: go
        with:
          path: /{slug}/online-evaluations
      - action: expect
        with:
          count: 'tr:has-text("{monitorName}-renamed")'
          min: "1"
      - action: click
        with:
          label: Actions for {monitorName}-renamed
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*Delete\s*$/
      - action: click
        with:
          text: /^\s*Delete\s*$/
      - action: expect
        with:
          api: /api/monitors/{monitorId}
          status: "404"
      - action: go
        with:
          path: /{slug}/online-evaluations
      - action: expect
        with:
          count: 'tr:has-text("{monitorName}-renamed")'
          equals: "0"

  # Sampling and preconditions on an existing online evaluation, edited in the drawer and read
  # back from the API. Main's sampling box has no label or test id, so it is found by its
  # number input; a new precondition row starts as metadata.labels contains "".
  - id: eval-online-edit-sampling-filters
    title: Edit an online evaluation's sampling and add then remove a precondition, each read back
    setup:
      - post: /api/evaluators
        body:
          name: vd-ev-{uid}
          config:
            evaluatorType: lingua/language_detection
        as:
          evaluatorId: id
      - post: /api/monitors
        body:
          name: vd-mon-{uid}
          checkType: lingua/language_detection
          evaluatorId: "{evaluatorId}"
          parameters: {}
          mappings:
            mapping:
              output:
                source: output
            expansions: []
        as:
          monitorId: id
          monitorName: name
    steps:
      - action: go
        with:
          path: /{slug}/online-evaluations
      - action: click
        with:
          label: Actions for {monitorName}
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*Edit\s*$/
      - action: fill
        with:
          selector: input[type="number"][max="1"]
          value: "0.5"
      - action: click
        with:
          text: Add Precondition
      - action: fill
        with:
          selector: input[placeholder="text"]
          value: vd-label-{uid}
      - action: click
        with:
          text: Save Changes
      - action: expect
        with:
          api: /api/monitors/{monitorId}
          field: sample
          equals: "0.5"
      - action: expect
        with:
          api: /api/monitors/{monitorId}
          field: preconditions.0.value
          equals: vd-label-{uid}
      - action: expect
        with:
          api: /api/monitors/{monitorId}
          field: preconditions.0.field
          equals: metadata.labels
      - action: go
        with:
          path: /{slug}/online-evaluations
      - action: click
        with:
          label: Actions for {monitorName}
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*Edit\s*$/
      - action: expect
        with:
          count: input[placeholder="text"]
          min: "1"
      - action: click
        with:
          label: Remove precondition 1
      - action: click
        with:
          text: Save Changes
      - action: expect
        with:
          api: /api/monitors/{monitorId}
          field: preconditions
          equals: "[]"

  # The evaluation runs through langevals (needs `haven up +langevals`; without it the result
  # is an error status and the flow fails on both sides). lingua/language_detection needs no
  # model, only the output the mapping reads from the trace.
  - id: eval-online-scores-on-trace
    title: A trace sent after an online evaluation exists gets a processed result, in the API and the drawer
    setup:
      - post: /api/evaluators
        body:
          name: vd-ev-{uid}
          config:
            evaluatorType: lingua/language_detection
        as:
          evaluatorId: id
      - post: /api/monitors
        body:
          name: vd-mon-{uid}
          checkType: lingua/language_detection
          evaluatorId: "{evaluatorId}"
          parameters: {}
          mappings:
            mapping:
              output:
                source: output
            expansions: []
        as:
          monitorId: id
          monitorName: name
      - post: /api/collector
        body:
          trace_id: vd-scored-{uid}
          spans:
            - type: llm
              span_id: vd-scored-span-{uid}
              trace_id: vd-scored-{uid}
              name: vd-scored-call
              model: gpt-5
              vendor: openai
              input:
                type: text
                value: Say hello in English
              output:
                type: text
                value: Hello, how are you doing today? I hope everything is going well for you.
              metrics:
                prompt_tokens: 6
                completion_tokens: 18
              timestamps:
                started_at: 1790723307541
                finished_at: 1790723308041
    steps:
      - action: expect
        with:
          api: /api/traces/vd-scored-{uid}
          field: evaluations
          contains: vd-mon-{uid}
          timeout: "120000"
      - action: expect
        with:
          api: /api/traces/vd-scored-{uid}
          field: evaluations.0.status
          equals: processed
          timeout: "60000"
      - action: go
        with:
          path: /{slug}/traces/vd-scored-{uid}
      - action: expect
        with:
          text: vd-mon-{uid}
          timeout: "20000"

  - id: eval-evaluator-edit-code
    title: Create a custom code evaluator, rename it from the library card menu and find the new name
    steps:
      - action: go
        with:
          path: /{slug}/evaluators
      - action: click
        with:
          text: New Evaluator
      - action: click
        with:
          testId: evaluator-category-code
      - action: fill
        with:
          testId: code-evaluator-name
          value: vd-code-{uid}
      - action: click
        with:
          testId: code-evaluator-input-add
      - action: fill
        with:
          testId: code-evaluator-input-identifier-0
          value: output
      - action: click
        with:
          testId: save-code-evaluator
      - action: expect
        with:
          api: /api/evaluators
          contains: vd-code-{uid}
      - action: go
        with:
          path: /{slug}/evaluators
      - action: click
        with:
          selector: '[data-testid^="evaluator-card-"]:has-text("vd-code-{uid}") .js-inner-menu'
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*Edit\s*$/
      - action: fill
        with:
          testId: code-evaluator-name
          value: vd-code-{uid}-edited
      - action: click
        with:
          testId: save-code-evaluator
      - action: expect
        with:
          api: /api/evaluators
          contains: vd-code-{uid}-edited
      - action: go
        with:
          path: /{slug}/evaluators
      - action: expect
        with:
          text: vd-code-{uid}-edited

  - id: eval-evaluator-edit-builtin
    title: Rename a built-in evaluator from the library card menu and read the name back
    setup:
      - post: /api/evaluators
        body:
          name: vd-ev-{uid}
          config:
            evaluatorType: langevals/exact_match

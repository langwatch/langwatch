  - id: eval-guardrail-drawer
    title: Open Set up Guardrail, pick an evaluator and get the integration code
    setup:
      - post: /api/evaluators
        body:
          name: vd-ev-{uid}
          config:
            evaluatorType: langevals/exact_match
        as:
          evaluatorId: id
    steps:
      - action: go
        with:
          path: /{slug}/online-evaluations
      - action: click
        with:
          text: Set up Guardrail
      - action: expect
        with:
          text: New Guardrail
      - action: click
        with:
          text: Select Evaluator
      - action: click
        with:
          testId: evaluator-card-{evaluatorId}
      - action: expect

      - action: expect
        with:
          text: vd-ev-{uid}-edited

  - id: eval-evaluator-delete
    title: Delete an evaluator from the library, typing delete to confirm, and see it gone after a reload
    setup:
      - post: /api/evaluators
        body:
          name: vd-ev-{uid}
          config:
            evaluatorType: langevals/exact_match
        as:
          evaluatorId: id
    steps:
      - action: go
        with:
          path: /{slug}/evaluators
      - action: expect
        with:
          testId: evaluator-card-{evaluatorId}
      - action: click
        with:
          selector: '[data-testid="evaluator-card-{evaluatorId}"] .js-inner-menu'
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*Delete\s*$/
      - action: fill
        with:
          testId: cascade-archive-confirm-input
          value: delete
      - action: click
        with:
          testId: cascade-archive-confirm-button
      - action: expect
        with:
          count: '[data-testid="evaluator-card-{evaluatorId}"]'
          equals: "0"
      - action: go
        with:
          path: /{slug}/evaluators
      - action: expect
        with:
          count: '[data-testid="evaluator-card-{evaluatorId}"]'
          equals: "0"

  - id: eval-evaluator-use-in-monitor-then-delete
    title: Use a custom evaluator in an online evaluation, then delete the evaluator and lose the monitor
    steps:
      - action: go
        with:
          path: /{slug}/evaluators
      - action: click
        with:
          text: New Evaluator
      - action: click
        with:
          testId: evaluator-category-code
      - action: fill
        with:
          testId: code-evaluator-name

        with:
          text: Usage

  - id: gateway-billing-events-screen-renders
    title: The billing events screen opens with its status filter
    steps:
      - action: go
        with:
          path: /gateway/billing-events
      - action: expect
        with:
          text: Billing Events
      - action: expect
        with:
          testId: filter-status

  - id: gateway-spend-events-api-answers
    title: The spend-events pull answers 200 with a data page for an organisation key, and 401 without one
    steps:
      - action: expect
        with:
          api: /api/gateway/v1/spend-events?from=1&to=9007199254740991
          auth: "{orgKey}"
          status: "200"
          contains: '"data":['
      - action: expect
        with:
          api: /api/gateway/v1/spend-events?from=1&to=9007199254740991
          auth: none
          status: "401"

  - id: gateway-spend-summaries-api-answers
    title: The spend-summaries rollup answers 200 with a data page for each grouping
    steps:
      - action: expect
        with:
          api: /api/gateway/v1/spend-summaries?group_by=virtual_key&from=1&to=9007199254740991
          auth: "{orgKey}"
          status: "200"
          contains: '"data":['
      - action: expect
        with:
          api: /api/gateway/v1/spend-summaries?group_by=model&from=1&to=9007199254740991
          auth: "{orgKey}"
          status: "200"
          contains: '"data":['

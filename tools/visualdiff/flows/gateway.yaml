  - id: gateway-routing-policy-edit-and-delete
    title: Rename a routing policy from its row, then delete it and see it gone after a reload
    isolated: true
    steps:
      - action: go
        with:
          path: /gateway/routing-policies
      - action: click
        with:
          testId: gateway-routing-policy-new
      - action: fill
        with:
          testId: gateway-routing-policy-name
          value: policy-edit-{uid}
      - action: click
        with:
          testId: gateway-routing-policy-submit
      - action: go
        with:
          path: /gateway/routing-policies
      - action: click
        with:
          label: Actions for policy-edit-{uid}
      - action: click
        with:
          testId: gateway-routing-policy-row-edit
      - action: fill
        with:
          testId: gateway-routing-policy-name
          value: policy-renamed-{uid}
      - action: click
        with:
          testId: gateway-routing-policy-submit
      - action: go
        with:
          path: /gateway/routing-policies
      - action: expect
        with:
          text: policy-renamed-{uid}
      - action: expect
        with:
          text: policy-edit-{uid}
          equals: "0"
      - action: click
        with:
          label: Actions for policy-renamed-{uid}
      - action: click
        with:
          testId: gateway-routing-policy-row-delete
      - action: click
        with:
          text: Delete
          hasText: ^Delete$
      - action: go
        with:
          path: /gateway/routing-policies
      - action: expect
        with:
          text: policy-renamed-{uid}
          equals: "0"

  - id: gateway-routing-policy-set-default

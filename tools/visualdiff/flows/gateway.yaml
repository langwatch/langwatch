          path: /gateway/webhooks
      - action: click
        with:
          testId: webhook-new
      - action: fill
        with:
          testId: webhook-url-input
          value: https://example.com/vd-{uid}
      - action: click
        with:
          testId: webhook-save
      - action: go
        with:
          path: /gateway/webhooks
      - action: expect
        with:
          text: example.com/vd-{uid}


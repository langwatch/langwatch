          option: /^(?!Pick a|Loading).+/
      - action: fill
        with:
          testId: gateway-budget-limit
          value: "60"
      - action: click
        with:
          testId: gateway-budget-create-submit
      - action: go
        with:
          path: /gateway/budgets
      - action: expect
        with:
          testId: gateway-budget-row
          hasText: /budget-team-{uid}.*team/is
          min: "1"

  - id: gateway-budget-project-create
    title: Create a budget on a project and see the project as its scope after a reload
    isolated: true
    steps:
      - action: go
        with:

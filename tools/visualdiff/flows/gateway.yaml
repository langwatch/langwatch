    isolated: true
    steps:
      - action: go
        with:
          path: /gateway/routing-policies
      - action: click
        with:
          testId: gateway-routing-policy-new
      - action: fill
        with:
          testId: gateway-routing-policy-name
          value: policy-default-{uid}
      - action: click
        with:
          testId: gateway-routing-policy-submit
      - action: go
        with:
          path: /gateway/routing-policies
      - action: click
        with:
          label: Actions for policy-default-{uid}
      - action: click
        with:
          testId: gateway-routing-policy-row-default
      - action: go
        with:
          path: /gateway/routing-policies
      - action: click
        with:
          label: Actions for policy-default-{uid}
      - action: expect
        with:
          testId: gateway-routing-policy-row-default
          equals: "0"

  # The evaluation itself runs in the gateway data plane; this proves the guardrail is
  # stored and attaches to a key. The evaluator is a monitor set to run as a guardrail.
  - id: gateway-guardrail-create-and-attach
    title: Create a guardrail over a guardrail evaluator, see it after a reload and attach it to a key
    setup:
      - post: /api/evaluators
        body:
          name: vd-guard-evaluator-{uid}
          config:
            evaluatorType: langevals/exact_match
        as:
          evaluatorId: id
      - post: /api/monitors
        body:
          name: vd-guard-monitor-{uid}
          checkType: langevals/exact_match
          evaluatorId: "{evaluatorId}"
          executionMode: AS_GUARDRAIL
          sample: 1
        as:
          monitorName: name
      - post: /api/gateway/v1/virtual-keys
        body:
          name: vd-vk-guard-{uid}
        as:
          vkId: virtual_key.id
    steps:
      - action: go
        with:
          path: /gateway/guardrails
      - action: click
        with:
          testId: gateway-guardrail-new
      - action: fill
        with:
          testId: gateway-guardrail-name
          value: guardrail-{uid}
      - action: select
        with:
          testId: gateway-guardrail-evaluator
          option: "{monitorName}"
      - action: click
        with:
          testId: gateway-guardrail-submit
      - action: go
        with:
          path: /gateway/guardrails
      - action: expect
        with:
          testId: gateway-guardrail-row
          hasText: guardrail-{uid}
          min: "1"
      - action: go
        with:
          path: /gateway/virtual-keys/{vkId}
      - action: click
        with:
          testId: gateway-guardrail-attach
          hasText: guardrail-{uid}
      - action: click
        with:
          testId: gateway-guardrail-attach-save
      - action: expect
        with:
          text: Guardrails updated

  - id: gateway-guardrail-archive
    title: Archive a guardrail from its row and see it gone after a reload
    setup:
      - post: /api/evaluators
        body:
          name: vd-guard-archive-evaluator-{uid}
          config:
            evaluatorType: langevals/exact_match
        as:
          evaluatorId: id
      - post: /api/monitors
        body:
          name: vd-guard-archive-monitor-{uid}
          checkType: langevals/exact_match
          evaluatorId: "{evaluatorId}"
          executionMode: AS_GUARDRAIL
          sample: 1
        as:
          monitorName: name
    steps:
      - action: go
        with:
          path: /gateway/guardrails
      - action: click
        with:
          testId: gateway-guardrail-new
      - action: fill
        with:
          testId: gateway-guardrail-name
          value: guardrail-archive-{uid}
      - action: select
        with:
          testId: gateway-guardrail-evaluator
          option: "{monitorName}"
      - action: click
        with:
          testId: gateway-guardrail-submit
      - action: click
        with:
          label: Archive guardrail-archive-{uid}
      - action: click
        with:
          text: Archive
          hasText: ^Archive$
      - action: go
        with:
          path: /gateway/guardrails
      - action: expect
        with:
          testId: gateway-guardrail-row
          hasText: guardrail-archive-{uid}
          equals: "0"


  - id: gateway-cache-rule-create
    title: Create a cache rule that forces caching for a model and see it listed and in the API
    isolated: true
    steps:
      - action: go
        with:
          path: /gateway/cache-rules
      - action: click
        with:
          text: New rule
      - action: fill
        with:
          field: e.g. force-cache-on-enterprise
          value: cr-{uid}
      - action: fill
        with:
          field: claude-3-5-sonnet-latest
          value: gpt-5-mini
      - action: select
        with:
          selector: 'xpath=//label[contains(normalize-space(.),"Cache control mode")]/following::select[1]'
          option: /^force/
      - action: click
        with:
          text: Create rule
      - action: go
        with:
          path: /gateway/cache-rules
      - action: expect
        with:
          text: cr-{uid}
      - action: expect
        with:
          api: /api/gateway/v1/cache-rules?limit=200
          contains: cr-{uid}

  - id: gateway-cache-rule-edit-toggle-archive
    title: Switch a cache rule's mode from its row, turn it off, then archive it and see it gone after a reload
    setup:
      - post: /api/gateway/v1/cache-rules
        body:
          name: vd-cache-{uid}
          matchers:
            model: gpt-5-mini
          action:
            mode: force
        as:
          ruleId: cache_rule.id
          ruleName: cache_rule.name
    steps:
      - action: go
        with:
          path: /gateway/cache-rules
      - action: click
        with:
          selector: 'tr:has-text("{ruleName}") button[aria-label="Actions"]'
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: /^\s*Edit\s*$/
      - action: select
        with:
          selector: 'xpath=//label[contains(normalize-space(.),"Cache control mode")]/following::select[1]'
          option: /^disable/
      - action: click
        with:
          text: /^\s*Save changes\s*$/
      - action: expect
        with:
          api: /api/gateway/v1/cache-rules/{ruleId}
          field: cache_rule.action.mode
          equals: disable
      - action: click
        with:
          selector: 'tr:has-text("{ruleName}") [data-scope="switch"][data-part="control"]'
      - action: expect
        with:
          api: /api/gateway/v1/cache-rules/{ruleId}
          field: cache_rule.enabled
          equals: "false"
      - action: click
        with:
          selector: 'tr:has-text("{ruleName}") button[aria-label="Actions"]'
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: Archive
      - action: click
        with:
          text: Archive
          hasText: ^Archive$
      - action: go
        with:
          path: /gateway/cache-rules
      - action: expect
        with:
          count: 'tr:has-text("{ruleName}")'
          equals: "0"

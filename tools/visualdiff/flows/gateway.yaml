# Gateway flows (builder C): virtual keys, budgets, routing policies, guardrails,
# webhooks, usage and the spend reads. Steps click and fill by data-testid; text only
# asserts. A `setup:` prerequisite is posted through the public API and captured, and
# its names come from the setup's own {uid}, so a flow reaches it through a capture.
# Not scriptable here: a call made WITH a virtual key (needs the gateway data plane and
# a POST through its own origin) and a budget crossing its limit (needs spend on the ledger).
flows:
  - id: gateway-virtual-key-create-reveal-revoke
    title: Create a virtual key, reveal its secret once, revoke it and see its menu gone
    isolated: true
    steps:
      - action: go
        with:
          path: /gateway/virtual-keys
      - action: click
        with:
          testId: gateway-virtual-key-new
      - action: fill
        with:
          testId: gateway-virtual-key-name
          value: vk-{uid}
      - action: click
        with:
          testId: gateway-virtual-key-create-submit
      - action: click
        with:
          testId: gateway-virtual-key-secret-reveal
      - action: capture
        with:
          testId: gateway-virtual-key-secret
          as: vkSecret
      - action: click
        with:
          testId: gateway-virtual-key-secret-confirm
      - action: click
        with:
          testId: gateway-virtual-key-secret-close
      - action: expect
        with:
          text: "{vkSecret}"
          equals: "0"
      - action: expect
        with:
          api: /api/gateway/v1/virtual-keys
          contains: vk-{uid}
      - action: go
        with:
          path: /gateway/virtual-keys
      - action: click
        with:
          label: Actions for vk-{uid}
      - action: click
        with:
          testId: gateway-virtual-key-row-revoke
      - action: click
        with:
          text: Revoke key
      - action: go
        with:
          path: /gateway/virtual-keys
      - action: expect
        with:
          label: Actions for vk-{uid}
          equals: "0"

  - id: gateway-virtual-key-revoke-reads-back
    title: Revoke a virtual key from its row and read the revoked status back from the API
    isolated: true
    setup:
      - post: /api/gateway/v1/virtual-keys
        body:
          name: vd-vk-revoke-{uid}
        as:
          vkId: virtual_key.id
          vkName: virtual_key.name
    steps:
      - action: expect
        with:
          api: /api/gateway/v1/virtual-keys/{vkId}
          field: virtual_key.status
          equals: active
      - action: go
        with:
          path: /gateway/virtual-keys
      - action: click
        with:
          label: Actions for {vkName}
      - action: click
        with:
          testId: gateway-virtual-key-row-revoke
      - action: click
        with:
          text: Revoke key
      - action: expect
        with:
          api: /api/gateway/v1/virtual-keys/{vkId}
          field: virtual_key.status
          equals: revoked
      - action: expect
        with:
          api: /api/gateway/v1/virtual-keys/{vkId}
          field: virtual_key.revoked_at
          min: "1"

  - id: gateway-virtual-key-rotate-reveals-new-secret
    title: Rotate a virtual key, reveal the new secret once and see the API hold its prefix
    isolated: true
    setup:
      - post: /api/gateway/v1/virtual-keys
        body:
          name: vd-vk-rotate-{uid}
        as:
          vkId: virtual_key.id
          vkName: virtual_key.name
          oldSecret: secret
    steps:
      - action: go
        with:
          path: /gateway/virtual-keys
      - action: click
        with:
          label: Actions for {vkName}
      - action: click
        with:
          testId: gateway-virtual-key-row-rotate
      - action: click
        with:
          text: Rotate secret
      - action: click
        with:
          testId: gateway-virtual-key-secret-reveal
      - action: capture
        with:
          testId: gateway-virtual-key-secret
          match: "^(.{13})"
          as: newPrefix
      - action: expect
        with:
          api: /api/gateway/v1/virtual-keys/{vkId}
          field: virtual_key.display_prefix
          equals: "{newPrefix}"
      - action: expect
        with:
          api: /api/gateway/v1/virtual-keys/{vkId}
          field: virtual_key.status
          equals: active
      - action: click
        with:
          testId: gateway-virtual-key-secret-confirm
      - action: click
        with:
          testId: gateway-virtual-key-secret-close
      - action: expect
        with:
          text: "{oldSecret}"
          equals: "0"

  - id: gateway-budget-create
    title: Create a budget and see it in the budgets API and list
    isolated: true
    steps:
      - action: go
        with:
          path: /gateway/budgets
      - action: click
        with:
          testId: gateway-budget-new
      - action: fill
        with:
          testId: gateway-budget-name
          value: budget-{uid}
      - action: fill
        with:
          testId: gateway-budget-limit
          value: "25"
      - action: click
        with:
          testId: gateway-budget-create-submit
      - action: expect
        with:
          api: /api/gateway/v1/budgets
          contains: budget-{uid}
      - action: go
        with:
          path: /gateway/budgets
      - action: expect
        with:
          text: budget-{uid}
      - action: expect
        with:
          testId: gateway-budget-row
          hasText: budget-{uid}
          min: "1"

  - id: gateway-budget-org-warn-create
    title: Create an organisation budget that only warns on breach and see both in its row
    isolated: true
    steps:
      - action: go
        with:
          path: /gateway/budgets
      - action: click
        with:
          testId: gateway-budget-new
      - action: fill
        with:
          testId: gateway-budget-name
          value: budget-org-{uid}
      - action: click
        with:
          testId: budget-kind-organization
      - action: select
        with:
          testId: gateway-budget-window
          option: Per day
      - action: fill
        with:
          testId: gateway-budget-limit
          value: "40"
      - action: select
        with:
          testId: gateway-budget-on-breach
          option: /^Warn/
      - action: click
        with:
          testId: gateway-budget-create-submit
      - action: go
        with:
          path: /gateway/budgets
      - action: expect
        with:
          testId: gateway-budget-row
          hasText: /budget-org-{uid}.*organization.*day.*warn/is
          min: "1"

  - id: gateway-budget-team-create

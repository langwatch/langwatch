      - action: click
        with:
          testId: gateway-budget-new
      - action: fill
        with:
          testId: gateway-budget-name
          value: budget-project-{uid}
      - action: click
        with:
          testId: budget-kind-project
      - action: select
        with:
          testId: budget-target
          option: /^(?!Pick a|Loading).+/
      - action: fill
        with:
          testId: gateway-budget-limit
          value: "70"
      - action: click
        with:
          testId: gateway-budget-create-submit
      - action: go
        with:
          path: /gateway/budgets
      - action: expect
        with:
          testId: gateway-budget-row
          hasText: /budget-project-{uid}.*project/is
          min: "1"

  - id: gateway-budget-virtual-key-create
    title: Create a budget on a virtual key and see the key as its scope after a reload
    isolated: true
    setup:
      - post: /api/gateway/v1/virtual-keys
        body:
          name: vd-vk-budget-{uid}
        as:
          vkName: virtual_key.name
    steps:
      - action: go
        with:
          path: /gateway/budgets
      - action: click
        with:
          testId: gateway-budget-new
      - action: fill
        with:
          testId: gateway-budget-name
          value: budget-key-{uid}
      - action: click
        with:
          testId: budget-kind-virtual_key
      - action: select
        with:
          testId: budget-target
          option: "{vkName}"
      - action: fill
        with:
          testId: gateway-budget-limit
          value: "15"
      - action: click
        with:
          testId: gateway-budget-create-submit
      - action: go
        with:
          path: /gateway/budgets
      - action: expect
        with:
          testId: gateway-budget-row
          hasText: /budget-key-{uid}.*{vkName}/is
          min: "1"

  - id: gateway-budget-edit-limit-and-breach
    title: Raise a budget's limit and switch it to warn, and read both back from the API
    setup:
      - post: /api/gateway/v1/budgets
        body:
          scope:
            kind: virtual_key
            virtual_key_id: "{virtualKey}"
          name: vd-budget-edit-{uid}
          window: month
          limit_usd: 20
        as:
          budgetId: budget.id
          budgetName: budget.name
    steps:
      - action: go
        with:
          path: /gateway/budgets
      - action: click
        with:
          testId: gateway-budget-row-actions
          hasText: "{budgetName}"
      - action: click
        with:
          testId: gateway-budget-row-edit
      - action: fill
        with:
          testId: gateway-budget-edit-limit
          value: "55"
      - action: select
        with:
          testId: gateway-budget-edit-on-breach
          option: /^Warn/
      - action: click
        with:
          testId: gateway-budget-edit-submit
      - action: expect
        with:
          api: /api/gateway/v1/budgets/{budgetId}
          field: budget.on_breach
          equals: warn
      - action: expect
        with:
          api: /api/gateway/v1/budgets/{budgetId}
          field: budget.limit_usd
          contains: "55"

  - id: gateway-budget-archive
    title: Archive a budget from its row and see it gone from the list after a reload
    setup:
      - post: /api/gateway/v1/budgets
        body:
          scope:
            kind: virtual_key
            virtual_key_id: "{virtualKey}"
          name: vd-budget-archive-{uid}
          window: month
          limit_usd: 10
        as:
          budgetId: budget.id
          budgetName: budget.name
    steps:
      - action: go
        with:
          path: /gateway/budgets
      - action: expect
        with:
          testId: gateway-budget-row
          hasText: "{budgetName}"
          min: "1"
      - action: click
        with:
          testId: gateway-budget-row-actions
          hasText: "{budgetName}"
      - action: click
        with:
          testId: gateway-budget-row-archive
      - action: click
        with:
          text: Archive
          hasText: ^Archive$
      - action: go
        with:
          path: /gateway/budgets
      - action: expect
        with:
          testId: gateway-budget-row
          hasText: "{budgetName}"
          equals: "0"

  - id: gateway-budget-detail-page
    title: A budget opens on its own page, showing its name and the scope it applies to
    setup:
      - post: /api/gateway/v1/budgets
        body:
          scope:
            kind: virtual_key
            virtual_key_id: "{virtualKey}"
          name: vd-budget-detail-{uid}
          window: week
          limit_usd: 12
        as:
          budgetId: budget.id
          budgetName: budget.name
    steps:
      - action: go
        with:
          path: /gateway/budgets/{budgetId}
      - action: expect
        with:
          text: "{budgetName}"
      - action: expect
        with:
          api: /api/gateway/v1/budgets/{budgetId}
          field: budget.window
          equals: week

  - id: gateway-webhook-create

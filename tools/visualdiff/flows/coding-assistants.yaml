# Coding-assistant flows (builder C): sessions ingested through the OTLP receivers the
# `langwatch ingest` hooks post to, their list and replay, git context, session traces and
# the GitHub connection. The seed (seed_coding.go) files two sessions in the seeded project:
#   vd-coding-alpha  Claude Code, vd-org/vd-repo on feat/vd-alpha, "Visual diff alpha session"
#   vd-coding-beta   Codex, vd-org/vd-repo, declared on main and then on feat/vd-beta
# They are named literally: a reseed folds into the same rows. Not scriptable here: a
# pull request linked to a session (needs a real GitHub App installation and its API).
flows:
  - id: coding-session-list-shows-ingested-sessions
    title: Sessions ingested through OTLP appear in the project session list with their repository and branch
    steps:
      - action: go
        with:
          path: /{slug}/sessions
      - action: expect
        with:
          testId: coding-agent-session-row
          hasText: Visual diff alpha session
          min: "1"
      - action: expect
        with:
          testId: coding-agent-session-row
          hasText: Visual diff beta session
          min: "1"
      - action: expect
        with:
          text: vd-org/vd-repo
          min: "2"

  - id: coding-session-git-context-branch-attribution
    title: A session shows the branch it declared, and a later declaration moves it
    steps:
      - action: go
        with:
          path: /{slug}/sessions
      - action: expect
        with:
          testId: coding-agent-session-row
          hasText: /Visual diff alpha session.*feat\/vd-alpha/s
          min: "1"
      - action: expect
        with:
          testId: coding-agent-session-row
          hasText: /Visual diff beta session.*feat\/vd-beta/s
          min: "1"
      - action: expect
        with:
          testId: coding-agent-session-row
          hasText: /Visual diff beta session.*vd-repo · main/s
          equals: "0"

  - id: coding-session-list-search-narrows
    title: Searching the session list narrows it to the matching session, and clearing restores it
    steps:
      - action: go
        with:
          path: /{slug}/sessions
      - action: expect
        with:
          testId: coding-agent-session-row
          hasText: Visual diff beta session
          min: "1"
      - action: type
        with:
          placeholder: Search sessions
          text: alpha
      - action: expect
        with:
          testId: coding-agent-session-row
          hasText: Visual diff alpha session
          min: "1"
      - action: expect
        with:
          testId: coding-agent-session-row
          hasText: Visual diff beta session
          equals: "0"
      - action: fill
        with:
          field: Search sessions
          value: ""
      - action: expect
        with:
          testId: coding-agent-session-row
          hasText: Visual diff beta session
          min: "1"

  - id: coding-session-opens-terminal-replay
    title: Opening a session from its row menu finds its stored trace and replays it
    steps:
      - action: go
        with:
          path: /{slug}/sessions
      - action: click
        with:
          label: Actions for Visual diff alpha session
      - action: click
        with:
          testId: coding-agent-session-replay
      - action: wait
        with:
          millis: "2500"
      - action: expect
        with:
          text: No stored traces for this session yet
          equals: "0"

  - id: coding-session-events-api-reads-back
    title: The session events API returns the ingested prompt and model call, filters by kind and pages
    steps:
      - action: expect
        with:
          api: /api/coding-agent/sessions/{codingSession}/events
          field: events
          min: "2"
      - action: expect
        with:
          api: /api/coding-agent/sessions/{codingSession}/events?kinds=model_call
          field: events
          min: "1"
      - action: expect
        with:
          api: /api/coding-agent/sessions/{codingSession}/events?kinds=user_prompt
          field: events
          min: "1"
      - action: expect
        with:
          api: /api/coding-agent/sessions/{codingSession}/events?limit=1
          field: nextCursor
          min: "1"

  - id: coding-session-events-api-refusals
    title: The session events API refuses no credential, and an unknown session has no events
    steps:
      - action: expect
        with:
          api: /api/coding-agent/sessions/{codingSession}/events
          auth: none
          status: "401"
      - action: expect
        with:
          api: /api/coding-agent/sessions/vd-coding-does-not-exist/events
          field: events
          equals: "[]"

  - id: coding-session-trace-readable
    title: The session's model call is stored as a readable trace tied to the session
    steps:
      - action: expect
        with:
          api: /api/trace/5c0d1a6e0000000000000000000000a1
          field: trace_id
          equals: 5c0d1a6e0000000000000000000000a1
      - action: go
        with:
          path: /{slug}/traces/5c0d1a6e0000000000000000000000a1
      - action: expect
        with:
          text: claude_code.llm_request

  - id: coding-personal-sessions-screen
    title: The personal sessions page opens with its heading and either its table or its empty state
    steps:
      - action: go
        with:
          path: /me/sessions
      - action: expect
        with:
          text: Every coding-agent session you ran

  - id: coding-pull-requests-screen-reports-github-state
    title: The project pull requests page says GitHub is not connected, or lists pull requests once it is
    steps:
      - action: go
        with:
          path: /{slug}/pull-requests
      - action: expect
        with:
          text: /GitHub is not connected|No pull requests yet|Search pull requests/

  - id: github-integrations-card-renders
    title: The integrations settings page shows the GitHub card, connectable or saying it is unavailable
    steps:
      - action: go
        with:
          path: /settings/integrations
      - action: expect
        with:
          testId: github-connection-card
      - action: expect
        with:
          text: /Connect GitHub|not available on this instance|Installed/

  - id: github-setup-route-refuses-unsigned-callbacks
    title: GitHub's Setup URL answers 400 without a signed state, on the current path and the legacy one
    steps:
      - action: expect
        with:
          api: /api/github/setup
          auth: none
          status: "400"
      - action: expect
        with:
          api: /api/github/setup?state=not-a-signed-state&installation_id=1
          auth: none
          status: "400"
      - action: expect
        with:
          api: /api/github-langy/setup
          auth: none
          status: "400"

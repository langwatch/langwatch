# Coding-assistant flows (builder C): sessions ingested through the OTLP receivers the
# `langwatch ingest` hooks post to, their list and replay, git context, session traces and
# the GitHub connection. The seed (seed_coding.go) files two sessions in the seeded project:
#   vd-coding-alpha  Claude Code, vd-org/vd-repo on feat/vd-alpha, "Visual diff alpha session"
#   vd-coding-beta   Codex, vd-org/vd-repo, declared on main and then on feat/vd-beta
# They are named literally: a reseed folds into the same rows. Not scriptable here: a
# pull request linked to a session (needs a real GitHub App installation and its API).
flows:
  - id: coding-session-list-shows-ingested-sessions
    title: Sessions ingested through OTLP appear in the project session list with their repository and branch
    steps:
      - action: go
        with:
          path: /{slug}/sessions
      - action: expect
        with:
          count: 'tbody tr:has-text("Visual diff alpha session")'
          min: "1"
      - action: expect
        with:
          count: 'tbody tr:has-text("Visual diff beta session")'
          min: "1"
      - action: expect
        with:
          text: vd-org/vd-repo
          min: "2"

  - id: coding-session-git-context-branch-attribution
    title: A session shows the branch it declared, and a later declaration moves it
    steps:
      - action: go
        with:
          path: /{slug}/sessions
      - action: expect
        with:
          count: 'tbody tr:has-text("Visual diff alpha session"):has-text("feat/vd-alpha")'
          min: "1"
      - action: expect
        with:
          count: 'tbody tr:has-text("Visual diff beta session"):has-text("feat/vd-beta")'
          min: "1"
      - action: expect
        with:
          count: 'tbody tr:has-text("Visual diff beta session"):has-text("vd-repo · main")'
          equals: "0"

  - id: coding-session-list-search-narrows
    title: Searching the session list narrows it to the matching session, and clearing restores it
    steps:
      - action: go
        with:
          path: /{slug}/sessions
      - action: expect
        with:
          count: 'tbody tr:has-text("Visual diff beta session")'
          min: "1"
      - action: type
        with:
          placeholder: Search sessions
          text: alpha
      - action: expect
        with:
          count: 'tbody tr:has-text("Visual diff alpha session")'
          min: "1"
      - action: expect
        with:
          count: 'tbody tr:has-text("Visual diff beta session")'
          equals: "0"
      - action: fill
        with:
          selector: 'input[placeholder="Search sessions"]'
          value: ""
      - action: expect
        with:
          count: 'tbody tr:has-text("Visual diff beta session")'
          min: "1"

  - id: coding-session-opens-terminal-replay
    title: Opening a session from its row menu finds its stored trace and replays it
    steps:
      - action: go
        with:
          path: /{slug}/sessions
      - action: click
        with:
          label: Actions for Visual diff alpha session
      - action: click
        with:
          selector: '[role="menuitem"]'
          hasText: Open terminal replay
      - action: wait
        with:
          millis: "2500"
      - action: expect
        with:
          text: No stored traces for this session yet
          equals: "0"

  - id: coding-session-events-api-reads-back
    title: The session events API returns the ingested prompt and model call, filters by kind and pages
    steps:
      - action: expect
        with:
          api: /api/coding-agent/sessions/{codingSession}/events
          field: events
          min: "2"
      - action: expect
        with:
          api: /api/coding-agent/sessions/{codingSession}/events?kinds=model_call
          field: events
          min: "1"
      - action: expect
        with:
          api: /api/coding-agent/sessions/{codingSession}/events?kinds=user_prompt
          field: events
          min: "1"
      - action: expect
        with:
          api: /api/coding-agent/sessions/{codingSession}/events?limit=1
          field: nextCursor
          min: "1"

  - id: coding-session-events-api-refusals
    title: The session events API refuses no credential, and an unknown session has no events
    steps:
      - action: expect
        with:
          api: /api/coding-agent/sessions/{codingSession}/events
          auth: none
          status: "401"
      - action: expect
        with:
          api: /api/coding-agent/sessions/vd-coding-does-not-exist/events
          field: events
          equals: "[]"

  - id: coding-session-trace-readable
    title: The session's model call is stored as a readable trace tied to the session
    steps:
      - action: expect
        with:
          api: /api/trace/5c0d1a6e0000000000000000000000a1
          field: trace_id
          equals: 5c0d1a6e0000000000000000000000a1
      - action: go
        with:
          path: /{slug}/traces/5c0d1a6e0000000000000000000000a1
      - action: expect
        with:
          text: claude_code.llm_request

  - id: coding-personal-sessions-screen
    title: The personal sessions page opens with its heading and either its table or its empty state
    steps:
      - action: go
        with:
          path: /me/sessions
      - action: expect
        with:
          text: Every coding-agent session you ran

  - id: coding-pull-requests-screen-reports-github-state
    title: The project pull requests page says GitHub is not connected, or lists pull requests once it is
    steps:
      - action: go
        with:
          path: /{slug}/pull-requests
      - action: expect
        with:
          text: /GitHub is not connected|No pull requests yet|Search pull requests/

  - id: github-integrations-card-renders
    title: The integrations settings page shows the GitHub card, connectable or saying it is unavailable
    steps:
      - action: go
        with:
          path: /settings/integrations
      - action: expect
        with:
          count: "#github"
      - action: expect
        with:
          text: /Connect GitHub|not available on this instance|Installed/

  - id: github-setup-route-refuses-unsigned-callbacks
    title: GitHub's Setup URL answers 400 without a signed state, on the current path and the legacy one
    steps:
      - action: expect
        with:
          api: /api/github/setup
          auth: none
          status: "400"
      - action: expect
        with:
          api: /api/github/setup?state=not-a-signed-state&installation_id=1
          auth: none
          status: "400"
      - action: expect
        with:
          api: /api/github-langy/setup
          auth: none
          status: "400"

  - id: github-install-error-comes-back-as-toast
    title: GitHub's redirect back with a refusal shows the failure once and does not repeat on reload
    steps:
      - action: go
        with:
          path: /settings/integrations?githubError=vd-github-refused-{uid}
      - action: expect
        with:
          text: GitHub installation failed
      - action: expect
        with:
          text: vd-github-refused-{uid}
      - action: go
        with:
          path: /settings/integrations
      - action: expect
        with:
          text: Lets LangWatch open pull requests on the repositories you choose
      - action: expect
        with:
          text: GitHub installation failed
          equals: "0"

  - id: github-integrations-not-connected-state
    title: With no installation the card offers Connect or says it is unavailable, and shows no installed account
    steps:
      - action: go
        with:
          path: /settings/integrations
      - action: expect
        with:
          text: /Connect GitHub|The GitHub integration is not available on this instance/
      - action: expect
        with:
          text: Add another account
          equals: "0"
      - action: expect
        with:
          text: /^\s*Installed\s*$/
          equals: "0"

  - id: coding-session-usage-tab-in-trace-drawer
    title: A coding-agent trace opens with a Usage tab that reads the session summary
    steps:
      - action: go
        with:
          path: /{slug}/traces/5c0d1a6e0000000000000000000000a1
      - action: expect
        with:
          text: claude_code.llm_request
      - action: click
        with:
          text: /^\s*Usage\s*$/
      - action: expect
        with:
          text: /Where the tokens went|What it did|Where the time went|No usage summary for this session/

  - id: coding-session-replay-drawer-tabs
    title: Opening a replay from a session row shows the Terminal and Usage tabs, and Usage reads
    steps:
      - action: go
        with:
          path: /{slug}/sessions
      - action: click
        with:
          label: Actions for Visual diff alpha session
      - action: click
        with:
          text: /^\s*Open terminal replay\s*$/
      - action: expect
        with:
          text: /^\s*Terminal\s*$/
      - action: click
        with:
          text: /^\s*Usage\s*$/
      - action: expect
        with:
          text: /Where the tokens went|What it did|Where the time went|No usage summary for this session/

  - id: coding-session-usage-shows-tool-run
    title: A session's Usage tab counts its Bash tool run and lists it under what it did, with a cost
    steps:
      - action: go
        with:
          path: /{slug}/traces/5c0d1a6e0000000000000000000000a1
      - action: expect
        with:
          text: claude_code.llm_request
      - action: click
        with:
          text: /^\s*Usage\s*$/
      - action: expect
        with:
          text: What it did
      - action: expect
        with:
          text: /^\s*Tools run\s*$/
      - action: expect
        with:
          text: /^\s*Bash\s*$/
      - action: expect
        with:
          text: No tools were run
          equals: "0"
      - action: expect
        with:
          text: No usage summary for this session
          equals: "0"
      - action: expect
        with:
          text: /^\s*Cost\s*$/

  - id: coding-session-list-shows-token-cost
    title: The session list prices each session in its Token cost column
    steps:
      - action: go
        with:
          path: /{slug}/sessions
      - action: expect
        with:
          text: /^\s*Token cost\s*$/
      - action: expect
        with:
          count: 'tbody tr:has-text("Visual diff alpha session"):has-text("$0.")'
          min: "1"

  - id: coding-personal-usage-card-links-to-sessions
    title: The personal overview carries the coding-agent usage card, and its View sessions link opens the sessions page
    steps:
      - action: go
        with:
          path: /me
      - action: expect
        with:
          text: Coding-agent usage (last 30 days)
      - action: expect
        with:
          text: /No coding-agent usage yet|Active time/
      - action: click
        with:
          text: /^\s*View sessions\s*$/
      - action: expect
        with:
          url: /me/sessions
      - action: expect
        with:
          text: Every coding-agent session you ran

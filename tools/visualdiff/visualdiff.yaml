# visualdiff — what `visualdiff run` renders on both refs.
#
# Extending the coverage is editing this file: add a path under `routes`, or a
# flow under `flows` whose steps name actions the runner implements
# (tools/visualdiff/runner/src/flows). `{slug}` is the project slug the run
# signs in as. See tools/visualdiff/README.md.

viewport: 1440x900

settle:
  # The runner waits for its in-flight requests to finish and stay finished for
  # quietMillis, and gives up at deadlineMillis rather than hanging on a page
  # that polls forever. A request older than three seconds counts as a poll; the
  # skeleton wait after it still keeps a screen whose data is late from a shot.
  quietMillis: 500
  deadlineMillis: 8000

# Pages each side opens in one signed-in session, the larger of the two, used
# only when the machine cannot be read: -pages (half the CPUs) decides it.
concurrency:
  routes: 6
  flows: 6

# After a run, the screens its pull request shows, in one comment edited in
# place: these key pages, then findings and changes, largest first, one per
# area before any repeats; never a blank or failed capture. Each is scaled to
# `width` and cut at `maxHeight`. -no-publish skips it.
publish:
  screens: 12
  width: 1000
  maxHeight: 2000
  keyPages:
    - /{slug}
    - /{slug}/traces
    - /{slug}/traces/{trace}
    - /settings/members
    - /me

# Ids the run seeds deterministically (seed.go), filling a route's {name}.
# team and actor are the seeded identity's, the same on main and the branch.
# {dataset} {experiment} {monitor} {graph} {virtualKey} {budget} need no line:
# each stack's seed fills them with its own ids (seed_entities.go).
fixtures:
  trace: trace_visualdiff_0
  openTab: spans
  span: trace_visualdiff_0_llm
  team: local-dev-team
  actor: admin@mail.langwatch.localhost

# Every route either ref declares is rendered above or excluded here with a
# reason; anything else is an `uncovered` finding (coverage.go).
coverage:
  basePages: platform/app/src/pages
  excluded:
    - route: /dev/error-test
      reason: a development page that throws on purpose to exercise the error boundary
    - route: /{slug}/studio/{workflow}
      reason: no REST route creates a workflow on main (/api/workflows lists, reads, patches, deletes and evaluates one; /api/agents only links an existing workflowId), so neither side has one to open
    - route: /{slug}/chat/{workflow}
      reason: needs a published workflow, which no REST route creates on main (see /{slug}/studio/{workflow})
    - route: /share/{id}
      reason: a share token is minted only by the signed-in share tRPC mutation; no REST route creates one on main
    - route: /ops/projections/{runId}
      reason: a run id exists only once an operator starts a projection replay, which rebuilds the stack's projections under the capture
    - route: /governance/inventory/{id}
      reason: declared by the candidate only, and the ingestion source it opens is created only through the governance tRPC; no REST route creates one on either ref


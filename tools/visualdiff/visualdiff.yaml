flows:
  - id: automation-create
    title: Create an automation using every part of its form
    steps:
      - action: createAutomation
        with:
          name: VD Automation
          cadence: Every 15 minutes
          settleWindow: "45"
      - action: go
        with:
          path: /{slug}/automations/automations

  - id: automation-alert
    title: Create an alert through the automation drawer
    steps:
      - action: createAutomation
        with:
          name: VD Alert
          kind: alert
      - action: go
        with:
          path: /{slug}/automations/alerts

  - id: online-evaluation
    title: Walk the online-evaluation wizard
    steps:
      - action: createEvaluation
        with:
          start: /{slug}/online-evaluations
          steps: "3"

  - id: prompt-create
    title: Add a prompt and a version
    steps:
      - action: createPrompt
        with:
          message: You are the visual-diff assistant.
      - action: go
        with:
          path: /{slug}/prompts

  - id: experiment-create
    title: Add an experiment
    steps:
      - action: createExperiment

  - id: trace-view
    title: Open a seeded trace and read its spans
    steps:
      - action: sendTrace
        with:
          traceId: trace_visualdiff_4
      - action: openTrace
        with:
          traceId: trace_visualdiff_0

  - id: annotate-trace
    title: Add an annotation to a trace
    steps:
      - action: annotate
        with:
          traceId: trace_visualdiff_1
          comment: Visual diff note
      - action: go
        with:
          path: /{slug}/annotations

  - id: trace-filters
    title: Use the trace explorer filters
    steps:
      - action: go
        with:
          path: /{slug}/traces
      - action: click
        with:
          text: Errors
      - action: click
        with:
          text: Filters
      - action: type
        with:
          placeholder: Search filters, free text
          text: faithfulness
          submit: "true"
      - action: click
        with:
          text: Last 30 days
      - action: click
        optional: true
        with:
          text: Last 24 hours

  - id: analytics-dashboard
    title: Build a custom analytics chart
    steps:
      - action: createDashboard
        with:
          start: /{slug}/analytics/custom

  - id: sql-dashboard
    title: Run a query and open the reports
    steps:
      - action: createRunSet
        with:
          start: /{slug}/analytics/query
          query: SELECT 1
      - action: go
        with:
          path: /{slug}/analytics/reports

  - id: agent-testing
    title: Open agent testing and its scenarios
    steps:
      - action: createScenario
        with:
          start: /{slug}/agent-testing

  - id: project-settings
    title: Edit project and organization settings
    steps:
      - action: editProjectSettings
        with:
          name: Visual Diff
      - action: go
        with:
          path: /settings/projects
      - action: go
        with:
          path: /settings/members

  - id: pairwise
    title: Open a pairwise comparison
    steps:
      - action: createPairwise
        with:
          start: /{slug}/experiments/workbench

# visualdiff — what `visualdiff run` renders on both refs.
#
# Extending the coverage is editing this file: add a path under `routes`, or a
# flow under `flows` whose steps name actions the runner implements
# (tools/visualdiff/runner/src/flows). `{slug}` is the project slug the run
# signs in as. See tools/visualdiff/README.md.

viewport: 1440x900

settle:
  # The runner waits for the in-flight request count to sit at zero for
  # quietMillis, and gives up at deadlineMillis rather than hanging on a page
  # that polls forever.
  quietMillis: 500
  deadlineMillis: 20000


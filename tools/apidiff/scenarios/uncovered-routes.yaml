  auth: none
  request:
    path: /api/unsubscribe
    query: { token: "vd-{uid}.tampered" }
  expect:
    status: 400

- id: unsub-project-key-does-not-replace-the-token
  endpoint: POST /api/unsubscribe
  auth: project
  request:
    path: /api/unsubscribe
    query: { token: "vd-{uid}" }
  expect:
    status: 400

- id: unsub-get-is-method-not-allowed
  endpoint: GET /api/unsubscribe
  auth: none
  request:
    path: /api/unsubscribe
    query: { token: "vd-{uid}" }
  expect:
    status: 405


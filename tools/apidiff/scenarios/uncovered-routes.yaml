# ---- agent-cache (project key with agentCache:manage; entries are per project and expire) ----

- id: agent-cache-put-then-read-back
  endpoint: PUT /api/agent-cache/{name}
  auth: project
  request:
    method: PUT
    path: "/api/agent-cache/VD_{UID}"
    body: { value: "value-{uid}", ttl_seconds: 300 }
  expect:
    status: 200
    body: { name: "VD_{UID}", ttl_seconds: 300 }
  verify:
    - request: GET /api/agent-cache/VD_{UID}
      expect: { status: 200, body: { name: "VD_{UID}", value: "value-{uid}" } }

- id: agent-cache-put-overwrites-the-value
  endpoint: PUT /api/agent-cache/{name}
  auth: project
  setup:
    - request: PUT /api/agent-cache/VD_{UID}
      body: { value: "first-{uid}" }
      expect: { status: 200 }
  request:
    method: PUT
    path: "/api/agent-cache/VD_{UID}"
    body: { value: "second-{uid}" }
  expect:
    status: 200
  verify:
    - request: GET /api/agent-cache/VD_{UID}
      expect: { status: 200, body: { value: "second-{uid}" } }

- id: agent-cache-claim-of-a-held-name-loses-and-keeps-the-value
  endpoint: POST /api/agent-cache/{name}/claim
  auth: project
  setup:
    - request: PUT /api/agent-cache/VD_{UID}
      body: { value: "held-{uid}" }
      expect: { status: 200 }
  request:
    path: "/api/agent-cache/VD_{UID}/claim"
    body: { value: "late-{uid}" }
  expect:
    status: 200
    body: { name: "VD_{UID}", claimed: false }
  verify:
    - request: GET /api/agent-cache/VD_{UID}
      expect: { status: 200, body: { value: "held-{uid}" } }

- id: agent-cache-claim-of-a-free-name-wins

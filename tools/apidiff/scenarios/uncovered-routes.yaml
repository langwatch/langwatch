# Routes the coverage audit (gap 7) found with no scenario: token and upload surfaces first, then
# onboarding, agent-cache, dashboard-widgets, saved-workbench-charts, voice, workflow run and studio,
# OTLP metrics aliases and copilotkit. Paths follow main (legacy /api/<x>, /api/v1 where main is v1-only).
# Not scripted, with the reason:
#  - unsubscribe happy path: the token is an HMAC over a secret no public API reveals.
#  - scim-webhook and elevenlabs-webhook happy path: the shared secret / provider signing secret is
#    per stack (env or a provider row), so only the refusals are reachable.
#  - image-proxy happy path: needs an outside image and the egress fence refuses this host.
#  - workflow-run happy path: a published workflow can only be made through tRPC (session), not REST.
# Needs a stack that has them on: the dashboard-widgets and analytics-charts happy paths (flags
# release_custom_chart_playground and lwql; both 403 with the flag's code where they are off), every
# `auth: session` scenario (the seeded admin must sign in), and every `auth: restricted` one (needs the
# authz grants projection, so a worker). Where the stack lacks one the harness reports ERROR or the 403.
# Branch-only routes (main answers 404): stored-objects uploads family (create, confirm, PUT, get, delete).
# Removed on purpose on the branch (parity-rest.go): /api/copilotkit.

# ---- unsubscribe (RFC 8058 one-click; the ?token= is the credential; 10 per minute per caller) ----

- id: unsub-missing-token-is-400
  endpoint: POST /api/unsubscribe
  auth: none
  request:
    path: /api/unsubscribe
  expect:
    status: 400

- id: unsub-tampered-token-is-400

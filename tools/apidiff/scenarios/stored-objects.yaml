# The stored-object round trip: POST createUpload returns a presigned uploadUrl, a PUT of the bytes
# goes to that URL (absolute-URL step, no side credentials, raw body), POST confirmation makes the
# object available, GET /api/files/{projectId}/{objectId} reads it back. Main has no upload routes
# (it answers 404), so these are branch-only like the stored-objects scenarios in uncovered-routes.yaml;
# the read half (/api/files) is main's. Each scenario runs in its own project shard so
# the objects it makes are its own.

- id: stored-objects-roundtrip-uploads-and-reads-back
  endpoint: POST /api/stored-objects/uploads/{storedObjectId}/confirmation
  shard: project
  setup:
    - request: POST /api/stored-objects/uploads
      body:
        projectId: "{projectId}"
        purpose: dataset_attachment
        filename: "vd-{uid}.txt"
        mediaType: text/plain
        byteLength: 5
      capture: { objectId: objectId, uploadUrl: uploadUrl }
    - request: "PUT {uploadUrl}"
      bodyRaw: "hello"
      contentType: text/plain
      expect: { status: [200, 201, 204] }
  request:
    path: /api/stored-objects/uploads/{objectId}/confirmation
    body: { projectId: "{projectId}" }
  expect:
    status: [200, 201]
  verify:
    - request: GET /api/files/{projectId}/{objectId}
      expect: { status: 200, contains: hello }
    - request: GET /api/files/{objectId}
      expect: { status: 200, contains: hello }


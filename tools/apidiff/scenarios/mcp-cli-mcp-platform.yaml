# ── secrets: platform_create_secret, list, update, delete ─────────────────────

- id: "mcp-secrets-create-list-update-delete-with-project-id"
  endpoint: "POST /api/v1/secrets"
  request:
    path: "/api/v1/secrets"
    body: {"projectId": "{projectId}", "name": "VD_MCP_{UID}", "value": "sekret-{uid}"}
  capture: {"secretId": "id"}
  expect:
    status: 201
    body: {"id": "<any>", "projectId": "{projectId}", "name": "VD_MCP_{UID}", "createdAt": "<any>", "updatedAt": "<any>"}
    notContains: "sekret-{uid}"
  verify:
    - request: "GET /api/v1/secrets?projectId={projectId}"
      expect: {"status": 200, "contains": ["VD_MCP_{UID}", "{secretId}", "updatedAt"], "notContains": "sekret-{uid}"}
    - request: "GET /api/v1/secrets/{secretId}?projectId={projectId}"
      expect: {"status": 200, "body": {"id": "{secretId}", "name": "VD_MCP_{UID}"}}
    - request: "PUT /api/v1/secrets/{secretId}"
      body: {"projectId": "{projectId}", "value": "sekret2-{uid}"}
      expect: {"status": 200, "body": {"id": "{secretId}", "name": "VD_MCP_{UID}"}, "notContains": "sekret2-{uid}"}
    - request: "DELETE /api/v1/secrets/{secretId}"
      body: {"projectId": "{projectId}"}
      expect: {"status": 200, "body": {"id": "{secretId}", "deleted": true}}
    - request: "GET /api/v1/secrets/{secretId}?projectId={projectId}"
      expect: {"status": 404}

# ── API keys: platform_create_api_key, list, revoke (the org key, as the tool needs) ──

- id: "mcp-api-keys-create-list-revoke"
  endpoint: "POST /api/v1/api-keys"
  auth: "org"
  request:
    path: "/api/v1/api-keys"
    body: {"keyType": "service", "name": "vd-{uid}", "description": "apidiff", "projectIds": ["{projectId}"]}
  capture: {"keyId": "apiKey.id"}
  expect:
    status: [200, 201]
    body: {"token": "<any>", "apiKey": {"id": "<any>", "name": "vd-{uid}", "createdAt": "<any>"}}
  verify:
    - request: "GET /api/v1/api-keys"
      auth: "org"
      expect: {"status": 200, "path": "data", "contains": ["vd-{uid}", "{keyId}", "roleBindings", "revokedAt"]}
    - request: "DELETE /api/v1/api-keys/{keyId}"
      auth: "org"
      expect: {"status": 200, "body": {"success": true}}
    - request: "GET /api/v1/api-keys"
      auth: "org"
      expect: {"status": 200, "contains": "revokedAt"}

# ── projects: platform_create_project, list, get, update, archive (/api/projects, no /v1) ──

- id: "mcp-projects-create-list-get-update-archive"
  endpoint: "POST /api/projects"
  auth: "org"
  request:
    path: "/api/projects"
    body: {"name": "vd-{uid}", "language": "python", "framework": "openai", "newTeamName": "vd-team-{uid}"}
  capture: {"newProjectId": "id"}
  expect:
    status: 201
    body: {"id": "<any>", "name": "vd-{uid}", "slug": "<any>", "language": "python", "framework": "openai", "serviceApiKey": "<any>", "serviceApiKeyId": "<any>"}
  verify:
    - request: "GET /api/projects?limit=100"
      auth: "org"
      expect:
        status: 200
        body: {"pagination": {"page": 1, "limit": 100, "total": "<any>"}}
        contains: ["vd-{uid}", "slug", "framework", "updatedAt"]
    - request: "GET /api/projects/{newProjectId}"
      auth: "org"
      expect:
        status: 200
        body: {"id": "{newProjectId}", "name": "vd-{uid}", "slug": "<any>", "teamId": "<any>", "createdAt": "<any>", "updatedAt": "<any>"}
    - request: "PATCH /api/projects/{newProjectId}"
      auth: "org"
      body: {"name": "vd2-{uid}"}
      expect: {"status": 200, "body": {"id": "{newProjectId}", "name": "vd2-{uid}", "language": "python", "framework": "openai"}}
    - request: "DELETE /api/projects/{newProjectId}"
      auth: "org"
      expect: {"status": 200, "body": {"id": "{newProjectId}", "name": "vd2-{uid}", "archivedAt": "<any>"}}

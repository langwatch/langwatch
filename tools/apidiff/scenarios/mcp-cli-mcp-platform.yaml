  request: {"path": "/api/v1/experiments/runs/run-none-{uid}"}
  expect: {"status": 404}

- id: "mcp-experiments-results-unknown-run-is-404"
  endpoint: "GET /api/v1/experiments/runs/{runId}/results"
  request:
    path: "/api/v1/experiments/runs/run-none-{uid}/results"
    query: {"experimentSlug": "nope-{uid}"}
  expect: {"status": 404}

- id: "mcp-experiments-run-unknown-slug-without-body-is-404"
  endpoint: "POST /api/v1/experiments/{slug}/run"
  request: {"path": "/api/v1/experiments/nope-{uid}/run"}
  expect: {"status": 404}


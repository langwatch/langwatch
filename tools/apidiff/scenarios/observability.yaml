# Generated for the sc-observability lane; timestamps in ingested spans are fixed at generation time.
# Modules: trace, analytics, annotation, dashboard, share, rum, stored-object (stored-object is branch-only, no main routes to compare).

# ---- annotations ----

- id: annotations-create-happy
  endpoint: POST /api/annotations/trace/{id}
  request: {"path": "/api/annotations/trace/vd-trace-{uid}", "body": {"comment": "c-{uid}", "isThumbsUp": true, "email": "vd@example.com"}}
  capture: {"annotationId": "data.id"}
  expect: {"status": 200, "body": {"data": {"comment": "c-{uid}", "isThumbsUp": true, "traceId": "vd-trace-{uid}", "id": "<any>"}}}
  verify:
    - {"request": "GET /api/annotations/{annotationId}", "expect": {"status": 200, "body": {"data": {"comment": "c-{uid}", "traceId": "vd-trace-{uid}"}}}}
    - {"request": "GET /api/annotations/trace/vd-trace-{uid}", "expect": {"status": 200, "path": "data", "length": 1}}
    - {"request": "GET /api/annotations", "expect": {"status": 200, "contains": "c-{uid}"}}


# Coding-assistant and GitHub scenarios (builder C). Modules: coding-agent, github.
# Sessions are ingested through POST /api/otel/v1/logs, the receiver `langwatch ingest`
# posts to; timestamps are fixed at generation time (2026-09-30). A session id carries the
# scenario's {uid}. Not covered: a pull request linked to a session, and a valid GitHub
# signature or signed install state, which need a real GitHub App the stacks do not have.

- id: coding-events-happy-lists-prompt-and-model-call
  endpoint: GET /api/coding-agent/sessions/{sessionId}/events
  setup:
    - {"request": "POST /api/otel/v1/logs", "body": {"resourceLogs": [{"resource": {"attributes": [{"key": "service.name", "value": {"stringValue": "claude-code"}}]}, "scopeLogs": [{"scope": {"name": "com.anthropic.claude_code.events", "version": "1"}, "logRecords": [{"timeUnixNano": "1790721991000000000", "severityNumber": 9, "severityText": "INFO", "eventName": "claude_code.user_prompt", "attributes": [{"key": "event.name", "value": {"stringValue": "claude_code.user_prompt"}}, {"key": "session.id", "value": {"stringValue": "vd-sess-{uid}"}}, {"key": "prompt", "value": {"stringValue": "vd prompt {uid}"}}, {"key": "prompt_length", "value": {"intValue": "14"}}, {"key": "prompt.id", "value": {"stringValue": "vd-p-{uid}"}}]}, {"timeUnixNano": "1790722051000000000", "severityNumber": 9, "severityText": "INFO", "eventName": "claude_code.api_request", "attributes": [{"key": "event.name", "value": {"stringValue": "claude_code.api_request"}}, {"key": "session.id", "value": {"stringValue": "vd-sess-{uid}"}}, {"key": "model", "value": {"stringValue": "claude-sonnet-4-20250514"}}, {"key": "input_tokens", "value": {"intValue": "1200"}}, {"key": "output_tokens", "value": {"intValue": "340"}}, {"key": "cache_read_tokens", "value": {"intValue": "800"}}, {"key": "cache_creation_tokens", "value": {"intValue": "100"}}, {"key": "cost_usd", "value": {"doubleValue": 0.012}}, {"key": "duration_ms", "value": {"intValue": "2100"}}, {"key": "prompt.id", "value": {"stringValue": "vd-p-{uid}"}}]}]}, {"scope": {"name": "langwatch.coding_agent.hook", "version": "1"}, "logRecords": [{"timeUnixNano": "1790721931000000000", "severityNumber": 9, "severityText": "INFO", "eventName": "langwatch.session_context", "attributes": [{"key": "event.name", "value": {"stringValue": "langwatch.session_context"}}, {"key": "session.id", "value": {"stringValue": "vd-sess-{uid}"}}, {"key": "coding_agent.name", "value": {"stringValue": "claude_code"}}, {"key": "vcs.repository.host", "value": {"stringValue": "github.com"}}, {"key": "vcs.repository.owner", "value": {"stringValue": "vd-org"}}, {"key": "vcs.repository.name", "value": {"stringValue": "vd-repo"}}, {"key": "vcs.ref.head.name", "value": {"stringValue": "feat/vd-{uid}"}}]}]}]}]}, "expect": {"status": 200}}
    - {"request": "GET /api/coding-agent/sessions/vd-sess-{uid}/events", "eventually": "60s", "expect": {"status": 200, "path": "events", "length": 2}}
  request: {"path": "/api/coding-agent/sessions/vd-sess-{uid}/events"}
  expect: {"status": 200, "path": "events", "length": 2}
  verify:
    - {"request": "GET /api/coding-agent/sessions/vd-sess-{uid}/events", "query": {"kinds": "model_call,user_prompt"}, "expect": {"status": 200, "path": "events", "length": 2}}
    - {"request": "GET /api/coding-agent/sessions/vd-sess-{uid}/events", "expect": {"status": 200, "contains": "model_call"}}


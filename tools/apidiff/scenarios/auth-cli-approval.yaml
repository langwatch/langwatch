# GET /api/auth/cli/device-approval: the stream `langwatch login` waits on so it need not sit
# on its poll interval. The device_code is the credential; settled or unknown codes answer at
# once with one frame, so every case here returns without holding the stream open. Main serves
# the route; a branch that does not is a merge defect (handoff ui-coverage-auth-cli).
- id: "auth-cli-device-approval-rejects-missing-code"
  endpoint: "GET /api/auth/cli/device-approval"
  auth: "none"
  request: {"path": "/api/auth/cli/device-approval"}
  expect: {"status": [400, 422]}

- id: "auth-cli-device-approval-unknown-code-is-expired"
  endpoint: "GET /api/auth/cli/device-approval"
  auth: "none"
  request:
    path: "/api/auth/cli/device-approval"
    query: {"device_code": "nope-{uid}"}
  expect: {"status": 200, "contains": "expired"}

- id: "auth-cli-device-approval-denied-code-settles"
  endpoint: "GET /api/auth/cli/device-approval"
  auth: "none"
  setup:
    - request: "POST /api/auth/cli/device-code"
      body: {}
      auth: "none"
      capture: {"deviceCode": "device_code", "userCode": "user_code"}
    - request: "POST /api/auth/cli/deny"
      body: {"user_code": "{userCode}"}
      auth: "session"
  request:
    path: "/api/auth/cli/device-approval"
    query: {"device_code": "{deviceCode}"}
  expect: {"status": 200, "contains": "denied"}

- id: "auth-cli-device-approval-approved-code-settles"
  endpoint: "GET /api/auth/cli/device-approval"
  auth: "none"
  setup:
    - request: "POST /api/auth/cli/device-code"
      body: {}
      auth: "none"
      capture: {"deviceCode": "device_code", "userCode": "user_code"}
    - request: "POST /api/auth/cli/approve"
      body: {"user_code": "{userCode}", "organization_id": "{orgId}"}
      auth: "session"
  request:
    path: "/api/auth/cli/device-approval"
    query: {"device_code": "{deviceCode}"}
  expect: {"status": 200, "contains": "approved"}

# The whole CLI login as `langwatch login` runs it: start, approve in the browser (the session),
# exchange, use the access token, then sign out. The token authenticates until logout and not
# after; main deletes the token records on logout (auth-cli.ts POST /logout).
- id: "auth-cli-login-token-authenticates-until-logout"
  endpoint: "GET /api/auth/cli/bootstrap"
  auth: "none"
  setup:
    - request: "POST /api/auth/cli/device-code"
      body: {}
      auth: "none"
      capture: {"deviceCode": "device_code", "userCode": "user_code"}
    - request: "POST /api/auth/cli/approve"
      body: {"user_code": "{userCode}", "organization_id": "{orgId}"}
      auth: "session"
    - request: "POST /api/auth/cli/exchange"
      body: {"device_code": "{deviceCode}", "client_info": {"device_label": "vd-{uid}"}}
      auth: "none"
      capture: {"accessToken": "access_token", "refreshToken": "refresh_token"}
  request:
    path: "/api/auth/cli/bootstrap"
    headers: {"Authorization": "Bearer {accessToken}"}
  expect: {"status": 200}
  verify:
    - request: "POST /api/auth/cli/logout"
      auth: "none"
      body: {"access_token": "{accessToken}", "refresh_token": "{refreshToken}"}
      expect: {"status": 200}
    - request: "GET /api/auth/cli/bootstrap"
      auth: "none"
      headers: {"Authorization": "Bearer {accessToken}"}
      expect: {"status": 401}

- id: "auth-cli-login-device-code-is-single-use"
  endpoint: "POST /api/auth/cli/exchange"
  auth: "none"
  setup:
    - request: "POST /api/auth/cli/device-code"
      body: {}
      auth: "none"
      capture: {"deviceCode": "device_code", "userCode": "user_code"}
    - request: "POST /api/auth/cli/approve"
      body: {"user_code": "{userCode}", "organization_id": "{orgId}"}
      auth: "session"
    - request: "POST /api/auth/cli/exchange"
      body: {"device_code": "{deviceCode}", "client_info": {"device_label": "vd-{uid}"}}
      auth: "none"
      expect: {"status": 200, "contains": "access_token"}
  request:
    path: "/api/auth/cli/exchange"
    body: {"device_code": "{deviceCode}"}
  expect: {"status": 408, "contains": "expired_token"}

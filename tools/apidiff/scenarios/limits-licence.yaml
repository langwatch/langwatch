# licence: the connect host's public activation door (an install redeems a code as its bearer)

- id: lim-connect-activate-malformed-code
  endpoint: POST /api/connect/v1/license/activate
  auth: none
  request:
    path: /api/connect/v1/license/activate
    headers: { Authorization: "Bearer not-a-code", X-LangWatch-Instance: "vd-{uid}" }
    body: {}
  expect:
    status: 400
    body: { error: { code: activation_code_malformed } }

- id: lim-connect-activate-no-bearer
  endpoint: POST /api/connect/v1/license/activate
  auth: none
  request:
    path: /api/connect/v1/license/activate
    headers: { X-LangWatch-Instance: "vd-{uid}" }
    body: {}
  expect:
    status: 400
    body: { error: { code: activation_code_malformed } }


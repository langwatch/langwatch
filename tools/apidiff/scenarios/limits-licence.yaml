# Builder D: rate limits, licence and plan-gate behaviours. Written unrun (apidiff scenarios runs
# single-sided once the engine allows it); nothing here lowers a global limit.
# Limiters exercised are keyed to something a scenario owns: a shard project's key (files reads) or
# an activation code the scenario invents. Not scripted, with the reason:
#  - user-avatar reads (240/min): the branch counts per actor, not per key, and the actor a project
#    key resolves to is not proven to be the key's own; exceeding it could starve avatars stack-wide.
#  - dataset attachment uploads (30/min): multipart, and the engine sends JSON bodies only.
#  - webhook test fires (webhookTestPerMinute): counted per organization, and only an entitled org
#    reaches the counter, which on the shared stack is the org every lane uses.
#  - the API's global limiter: raised on apidiff stacks and never ours to lower.
#  - licence upload, replace, expiry and seat limits: org-wide state, or needs a licence minted in the
#    backoffice; no public API mints one.
# Gaps in the format: expect cannot read response headers, so Retry-After is unchecked.


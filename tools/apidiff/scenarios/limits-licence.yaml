# ten guesses at one code are answered as unknown, the eleventh is refused; main's code for it is
# rate_limited, the branch's is activation_rate_limited, so only the status and wording are held
- id: lim-connect-activate-eleventh-guess-is-429
  endpoint: POST /api/connect/v1/license/activate
  auth: none
  setup:
    - &guess
      request: { method: POST, path: /api/connect/v1/license/activate, headers: { Authorization: "Bearer LW{uidHex16}", X-LangWatch-Instance: "vd-{uid}" }, body: {} }
      expect: { status: 401 }
    - *guess
    - *guess
    - *guess
    - *guess
    - *guess
    - *guess
    - *guess
    - *guess
    - *guess
  request:
    path: /api/connect/v1/license/activate
    headers: { Authorization: "Bearer LW{uidHex16}", X-LangWatch-Instance: "vd-{uid}" }
    body: {}
  expect:
    status: 429
    contains: many activation attempts
  verify:
    - request: { method: POST, path: /api/connect/v1/license/activate, headers: { Authorization: "Bearer LW{uidHex16}", X-LangWatch-Instance: "vd-{uid}" }, body: {} }
      expect: { status: 429 }

# licence: the sync door. The body is judged before the credential, the credential before the registry

- id: lim-connect-sync-rejects-missing-seats
  endpoint: POST /api/connect/v1/license/sync
  auth: none
  request:
    path: /api/connect/v1/license/sync
    headers: { Authorization: "Bearer lwl_{uidHex32}{uidHex32}", X-LangWatch-Instance: "vd-{uid}" }
    body: { version: "1.0.0" }
  expect:
    status: 400
    body: { error: { code: validation_error } }

- id: lim-connect-sync-rejects-extra-fields
  endpoint: POST /api/connect/v1/license/sync
  auth: none
  request:
    path: /api/connect/v1/license/sync
    headers: { Authorization: "Bearer lwl_{uidHex32}{uidHex32}", X-LangWatch-Instance: "vd-{uid}" }
    body: { version: "1.0.0", seats: { members: 1, liteMembers: 0 }, note: extra }
  expect:
    status: 400
    body: { error: { code: validation_error } }

- id: lim-connect-sync-rejects-negative-seats
  endpoint: POST /api/connect/v1/license/sync

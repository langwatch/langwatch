# projects: the MCP calls /api/projects (no /v1) with the project key
- id: "mcp-me-project-verifies-key"
  endpoint: "GET /api/v1/me/project"
  request: {"path": "/api/v1/me/project"}
  expect: {"status": 200, "body": {"id": "{projectId}", "name": "<any>", "slug": "<any>"}}

- id: "mcp-me-project-refuses-unknown-key"
  endpoint: "GET /api/v1/me/project"
  auth: "none"
  request: {"path": "/api/v1/me/project", "headers": {"X-Auth-Token": "vd-not-a-key-{uid}"}}
  expect: {"status": 401}

# traces: search (format digest) and get (digest, json); analytics timeseries without timeScale
- id: "mcp-traces-search-digest-reads-fields"
  endpoint: "POST /api/v1/traces/search"
  setup:
    - request: "POST /api/collector"
      body:
        trace_id: "vdt{uid}"
        spans:
          - {"type": "llm", "span_id": "vds{uid}", "trace_id": "vdt{uid}", "name": "vd-{uid}", "model": "gpt-5", "vendor": "openai", "input": {"type": "text", "value": "vd question {uid}"}, "output": {"type": "text", "value": "vd answer {uid}"}, "timestamps": {"started_at": 1790723307541, "finished_at": 1790723308041}}
        metadata: {"user_id": "vd-user-{uid}", "thread_id": "vd-thread-{uid}", "labels": ["vd-{uid}"]}
    - request: "GET /api/v1/traces/vdt{uid}"
      eventually: 60s
      expect: {"status": 200}
  request:
    path: "/api/v1/traces/search"
    body:
      filters: {"metadata.user_id": ["vd-user-{uid}"]}
      startDate: 1700000000000
      endDate: 4102444800000
      pageSize: 10
      format: "digest"
  expect:
    status: 200
    path: "traces"
    length: 1
    body: {"traces": [{"trace_id": "vdt{uid}", "formatted_trace": "<any>"}]}

- id: "mcp-traces-get-digest-and-json-read-fields"
  endpoint: "GET /api/v1/traces/{traceId}"
  setup:
    - request: "POST /api/collector"
      body:
        trace_id: "vdt{uid}"
        spans:
          - {"type": "llm", "span_id": "vds{uid}", "trace_id": "vdt{uid}", "name": "vd-{uid}", "model": "gpt-5", "vendor": "openai", "input": {"type": "text", "value": "vd question {uid}"}, "output": {"type": "text", "value": "vd answer {uid}"}, "timestamps": {"started_at": 1790723307541, "finished_at": 1790723308041}}
        metadata: {"user_id": "vd-user-{uid}", "thread_id": "vd-thread-{uid}", "labels": ["vd-{uid}"]}
    - request: "GET /api/v1/traces/vdt{uid}"
      eventually: 60s
      expect: {"status": 200}
  request: {"path": "/api/v1/traces/vdt{uid}", "query": {"format": "digest"}}
  expect:
    status: 200
    body:
      trace_id: "vdt{uid}"
      formatted_trace: "<any>"
      timestamps: "<any>"
      metadata: {"user_id": "vd-user-{uid}", "thread_id": "vd-thread-{uid}"}
      evaluations: "<any>"
  verify:
    - request: "GET /api/v1/traces/vdt{uid}?format=json"
      expect:
        status: 200
        body:
          trace_id: "vdt{uid}"
          ascii_tree: "<any>"
          spans: [{"span_id": "vds{uid}", "name": "vd-{uid}", "type": "llm"}]
          input: "<any>"
          output: "<any>"

- id: "mcp-analytics-timeseries-without-time-scale"
  endpoint: "POST /api/v1/analytics/timeseries"
  request:
    path: "/api/v1/analytics/timeseries"
    body:
      series: [{"metric": "metadata.trace_id", "aggregation": "cardinality"}]
      startDate: 1700000000000
      endDate: 4102444800000
      timeZone: "UTC"
  expect: {"status": 200, "body": {"currentPeriod": "<any>", "previousPeriod": "<any>"}}

# ── budgets ──────────────────────────────────────────────────────────────────

- id: "cli-gateway-budgets-create-list-update-reset-archive"
  endpoint: "POST /api/gateway/v1/budgets"
  auth: "org"
  setup:
    - request: "POST /api/gateway/v1/virtual-keys"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      body: {"name": "vd-{uid}"}
      capture: {"vkId": "virtual_key.id"}
      expect: {"status": 201}
  request:
    path: "/api/gateway/v1/budgets"
    headers: {"X-Project-Id": "{projectId}"}
    body: {"name": "vd-{uid}", "scope": {"kind": "project", "project_id": "{projectId}"}, "window": "month", "limit_usd": "10", "timezone": null, "provider_key": null}
  capture: {"budgetId": "budget.id"}
  expect:
    status: 201
    body:
      budget: {"id": "<any>", "name": "vd-{uid}", "scope_type": "project", "scope_id": "{projectId}", "window": "month", "on_breach": "<any>", "limit_usd": "<any>", "resets_at": "<any>", "current_period_started_at": "<any>", "created_at": "<any>", "archived_at": null}
  verify:
    - request: "GET /api/gateway/v1/budgets?scope_type=project&limit=100"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      expect: {"status": 200, "body": {"data": "<any>", "spend_available": "<any>"}, "contains": ["{budgetId}", "next_cursor"]}
    - request: "PATCH /api/gateway/v1/budgets/{budgetId}"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      body: {"name": "vd2-{uid}", "limit_usd": "20", "on_breach": "warn"}
      expect: {"status": 200, "body": {"budget": {"id": "{budgetId}", "name": "vd2-{uid}", "on_breach": "warn"}}}
    - request: "POST /api/gateway/v1/budgets/{budgetId}/reset"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      body: {}
      expect: {"status": 200, "body": {"budget": {"id": "{budgetId}", "current_period_started_at": "<any>"}}, "contains": ["last_reset_at"]}
    - request: "DELETE /api/gateway/v1/budgets/{budgetId}"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      expect: {"status": 200, "body": {"budget": {"id": "{budgetId}", "archived_at": "<any>"}}}
    - request: "GET /api/gateway/v1/budgets?scope_type=project&limit=100"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      expect: {"status": 200, "notContains": "{budgetId}"}
  teardown:
    - request: "DELETE /api/gateway/v1/budgets/{budgetId}"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
    - request: "POST /api/gateway/v1/virtual-keys/{vkId}/revoke"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}


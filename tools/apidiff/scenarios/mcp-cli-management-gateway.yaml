  capture: {"vkId": "virtual_key.id"}
  expect:
    status: 201
    body: {"virtual_key": {"id": "<any>", "name": "vd-{uid}", "scopes": [{"scope_type": "project", "scope_id": "{projectId}"}]}, "secret": "<any>"}
  verify:
    - request: "GET /api/gateway/v1/budgets?scope_type=virtual_key&limit=100"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      expect: {"status": 200, "contains": ["{vkId}"]}
  teardown:
    - request: "POST /api/gateway/v1/virtual-keys/{vkId}/revoke"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}


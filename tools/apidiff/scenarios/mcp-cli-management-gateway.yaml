# The `langwatch` CLI gateway families: virtual keys, budgets and spend events
# (client-sdk/services/{virtual-keys,gateway-budgets,spend-events}). Virtual keys and budgets
# send the key as a Bearer token plus `X-Project-Id`; spend events send the key alone (the routes
# are organization-level). Paths are `/api/gateway/v1/...`; bodies are what the commands build:
# `null` for the ids they default and no key for the flags they leave out. Assertions name the
# fields the services type and the commands print. Every scenario that makes a key, budget or
# endpoint removes it in a teardown step. Written unrun; spend reads need ClickHouse.

# ── virtual keys ─────────────────────────────────────────────────────────────

- id: "cli-virtual-keys-create-list-get-update-rotate-disable-enable-revoke"
  endpoint: "POST /api/gateway/v1/virtual-keys"
  auth: "org"
  request:
    path: "/api/gateway/v1/virtual-keys"
    headers: {"X-Project-Id": "{projectId}"}
    body: {"name": "vd-{uid}", "description": "vd key", "principal_user_id": null, "trace_project_id": null, "routing_policy_id": null}
  capture: {"vkId": "virtual_key.id"}
  expect:
    status: 201
    body:
      virtual_key: {"id": "<any>", "name": "vd-{uid}", "description": "vd key", "status": "active", "purpose": "user", "display_prefix": "<any>", "scopes": "<any>", "revision": "<any>", "created_at": "<any>", "updated_at": "<any>", "revoked_at": null}
      secret: "<any>"
  verify:
    - request: "GET /api/gateway/v1/virtual-keys/{vkId}"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      expect: {"status": 200, "body": {"virtual_key": {"id": "{vkId}", "name": "vd-{uid}", "status": "active"}}, "notContains": "\"secret\""}
    - request: "GET /api/gateway/v1/virtual-keys?limit=100"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      expect: {"status": 200, "body": {"data": "<any>"}, "contains": ["{vkId}", "next_cursor"]}
    - request: "PATCH /api/gateway/v1/virtual-keys/{vkId}"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      body: {"name": "vd2-{uid}", "description": null}
      # main's update reads `description ?? existing`, so a null keeps the stored value.
      expect: {"status": 200, "body": {"virtual_key": {"id": "{vkId}", "name": "vd2-{uid}", "description": "vd key"}}}
    - request: "POST /api/gateway/v1/virtual-keys/{vkId}/disable"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      body: {"reason": "vd-{uid}"}
      expect: {"status": 200, "body": {"virtual_key": {"id": "{vkId}", "status": "disabled"}}}
    - request: "POST /api/gateway/v1/virtual-keys/{vkId}/enable"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      expect: {"status": 200, "body": {"virtual_key": {"id": "{vkId}", "status": "active"}}}
    - request: "POST /api/gateway/v1/virtual-keys/{vkId}/rotate"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      expect: {"status": 200, "body": {"virtual_key": {"id": "{vkId}", "display_prefix": "<any>"}, "secret": "<any>"}}
    - request: "POST /api/gateway/v1/virtual-keys/{vkId}/revoke"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}
      expect: {"status": 200, "body": {"virtual_key": {"id": "{vkId}", "status": "revoked", "revoked_at": "<any>"}}}
  teardown:
    - request: "POST /api/gateway/v1/virtual-keys/{vkId}/revoke"
      auth: "org"
      headers: {"X-Project-Id": "{projectId}"}

- id: "cli-virtual-keys-create-with-scope-and-budget-reads-back"

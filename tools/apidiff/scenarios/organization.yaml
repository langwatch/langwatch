- id: "organization-member-update-disable"
  endpoint: "PATCH /api/organization/members/{userId}"
  auth: "org"
  setup:
    - request: "POST /api/scim/v2/Users"
      body:
        schemas: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        userName: "vd-{uid}@example.com"
        # The list pages at 50 by name (main's only filters are offset and limit); this
        # name falls as the clock rises, so the newest user heads page 1 past leftovers.
        name: {"givenName": "0{nowMs-9999999999999}", "familyName": "Person"}
        emails: [{"primary": true, "value": "vd-{uid}@example.com", "type": "work"}]
        active: true
      auth: "scim"
      capture: {"scimUserId": "id"}
  request:
    path: "/api/organization/members/{scimUserId}"
    body: {"disabled": true}
  expect: {"status": 200}
  verify:
    - request: "GET /api/organization/members/{scimUserId}"
      expect: {"status": 200, "body": {"disabled": true}}
    - request: "GET /api/organization/members?includeDisabled=true"
      expect: {"status": 200, "contains": "{scimUserId}"}


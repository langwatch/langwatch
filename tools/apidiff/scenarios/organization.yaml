    - request: "POST /api/teams"
      body: {"name": "vd-{uid}"}
      capture: {"teamId": "id"}
  request: {"path": "/api/teams", "query": {"limit": 1, "page": 1}}
  expect:
    status: 200
    body: {"pagination": {"limit": 1, "page": 1}}
    path: "data"
    length: 1


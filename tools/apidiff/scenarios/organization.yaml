- id: "team-list-includes-created"
  endpoint: "GET /api/teams"
  auth: "org"
  setup:
    - request: "POST /api/teams"
      body: {"name": "vd-{uid}"}
      capture: {"teamId": "id"}
  request: {"path": "/api/teams", "query": {"limit": 1000}}
  expect: {"status": 200, "contains": "vd-{uid}", "path": "data"}

- id: "team-list-pagination-limit-one"
  endpoint: "GET /api/teams"

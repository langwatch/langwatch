  auth: "session"
  setup:
    - request: "POST /api/auth/cli/device-code"
      body: {}
      auth: "none"
      capture: {"deviceCode": "device_code", "userCode": "user_code"}
  request:
    path: "/api/auth/cli/approve"
    body:
      user_code: "{userCode}"
      organization_id: "{orgId}"
      key_selection:
        bindings: [{"scope_type": "GLOBAL", "scope_id": "x"}]
        permissions: []
  expect: {"status": [400, 422]}

- id: "auth-cli-approve-refuses-no-session"

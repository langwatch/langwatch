    body: {"user_code": "NOPE", "organization_id": "{orgId}"}
  expect: {"status": [401, 403]}

- id: "auth-cli-deny-happy"
  endpoint: "POST /api/auth/cli/deny"
  auth: "session"
  setup:
    - request: "POST /api/auth/cli/device-code"
      body: {}
      auth: "none"
      capture: {"deviceCode": "device_code", "userCode": "user_code"}
  request: {"path": "/api/auth/cli/deny", "body": {"user_code": "{userCode}"}}
  expect: {"status": 200}
  verify:
    - request: "POST /api/auth/cli/exchange"
      auth: "none"
      body: {"device_code": "{deviceCode}"}
      expect: {"status": 410, "body": {"error": "access_denied"}}


# Plan seat limits (lane green-billing-usage). Main enforces two levers only, members and
# membersLite (platform/app/src/server/license-enforcement/types.ts): projects, workflows,
# prompts, scenarios, evaluators and every other resource are uncapped on every plan, so there is
# nothing to assert for them. The monthly event allowance refuses with ERR_PLAN_LIMIT (402) at
# 50k events on Free; no scenario reaches it without ingesting past the allowance.
# The refusal is written before any invite row, so a refused batch leaves nothing behind. The
# batch is the endpoint maximum (50) of EXTERNAL invites, which take lite seats: it overflows any
# lite allowance under 50, and an organization already past its full seats refuses first as
# members, so limitType is asserted present, not by value.

- id: lim-invites-beyond-lite-seats-is-refused
  endpoint: POST /api/organization/invites
  auth: org
  request:
    path: /api/organization/invites
    body:
      invites:
        - email: "vd-00-{uid}@example.com"
          role: "EXTERNAL"
          teams: [{"teamId": "{teamId}", "role": "VIEWER"}]

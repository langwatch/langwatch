# Grants and roles: /api/grants (who holds which role where, succeeding /api/role-bindings) and
# /api/roles with the built-in ids admin, member and viewer. specs/rbac/grants-rest-api.feature.
# Branch-only: main serves no /api/grants (it answers 404), no ?builtIn filter, no built-in role ids
# and no deprecation headers on /api/role-bindings, so in a two-sided run these are FAIL-main by
# design; judge them on the branch alone (one-stack mode). Each scenario makes its own group, role
# or key under {uid} and its teardown revokes the grant, then removes what it made.
# Not scripted: the 10,000-grant limit (grant_limit_reached; unit-tested), an expired grant (a past
# expiresAt is refused, so status=expired needs the clock) and a personal-workspace scope.

# ---- grants: round trips ----

- id: grants-create-built-in-role-for-group-on-team
  endpoint: POST /api/grants
  auth: org
  setup:
    - request: POST /api/groups
      body: { name: "vd-{uid}" }
      capture: { groupId: id }
  request:
    path: /api/grants
    body:
      principal: { type: group, id: "{groupId}" }
      roleId: member
      scope: { type: team, id: "{teamId}" }
  capture: { grantId: id }
  expect:
    status: 201
    body:
      id: "<any>"
      principal: { type: group, id: "{groupId}", name: "vd-{uid}" }
      role: { id: member, builtIn: true }
      scope: { type: team, id: "{teamId}" }
      status: active
      expiresAt: null
      createdAt: "<any>"
  verify:
    - request: GET /api/grants/{grantId}
      expect:
        status: 200
        body: { id: "{grantId}", role: { id: member, builtIn: true }, scope: { type: team, id: "{teamId}" } }
  teardown:
    - request: DELETE /api/grants/{grantId}
      auth: org
    - request: DELETE /api/groups/{groupId}
      auth: org

- id: grants-create-custom-role-for-group-on-project
  endpoint: POST /api/grants
  auth: org
  setup:
    - request: POST /api/roles
      body: { name: "vd-{uid}", permissions: ["project:view"] }
      capture: { roleId: id }
    - request: POST /api/groups
      body: { name: "vd-{uid}" }
      capture: { groupId: id }
  request:
    path: /api/grants
    body:
      principal: { type: group, id: "{groupId}" }
      roleId: "{roleId}"
      scope: { type: project, id: "{projectId}" }
  capture: { grantId: id }
  expect:
    status: 201
    body: { role: { id: "{roleId}", name: "vd-{uid}", builtIn: false }, scope: { type: project, id: "{projectId}" } }
  verify:
    - request: GET /api/grants/{grantId}
      expect:
        status: 200
        body: { role: { id: "{roleId}", name: "vd-{uid}", builtIn: false } }
  teardown:
    - request: DELETE /api/grants/{grantId}
      auth: org
    - request: DELETE /api/groups/{groupId}
      auth: org
    - request: DELETE /api/roles/{roleId}
      auth: org

- id: grants-create-for-api-key-on-project
  endpoint: POST /api/grants
  auth: org
  setup:
    - request: POST /api/api-keys
      body: { keyType: service, name: "vd-{uid}", projectIds: ["{projectId}"] }
      capture: { keyId: apiKey.id }
      expect: { status: 201 }
  request:
    path: /api/grants
    body:
      principal: { type: apiKey, id: "{keyId}" }
      roleId: viewer
      scope: { type: project, id: "{projectId}" }
  capture: { grantId: id }
  expect:
    status: 201
    body: { principal: { type: apiKey, id: "{keyId}" }, role: { id: viewer, builtIn: true } }
  teardown:
    - request: DELETE /api/grants/{grantId}
      auth: org
    - request: DELETE /api/api-keys/{keyId}
      auth: org

- id: grants-list-by-principal-pages-by-cursor
  endpoint: GET /api/grants
  auth: org
  setup:
    - request: POST /api/groups
      body: { name: "vd-{uid}" }
      capture: { groupId: id }
    - request: POST /api/grants
      body: { principal: { type: group, id: "{groupId}" }, roleId: viewer, scope: { type: project, id: "{projectId}" } }
      capture: { firstGrantId: id }
    - request: POST /api/grants
      body: { principal: { type: group, id: "{groupId}" }, roleId: member, scope: { type: team, id: "{teamId}" } }
      capture: { secondGrantId: id }
  request:
    path: /api/grants
    query: { principalType: group, principalId: "{groupId}", limit: 1 }
  capture: { cursor: nextCursor }
  expect:
    status: 200
    body: { grants: [{ id: "{firstGrantId}" }], nextCursor: "<any>" }
    path: grants
    length: 1
  verify:
    - request: GET /api/grants
      query: { principalType: group, principalId: "{groupId}", limit: 1, cursor: "{cursor}" }
      expect:
        status: 200
        body: { grants: [{ id: "{secondGrantId}" }], nextCursor: null }
        path: grants
        length: 1
    - request: GET /api/grants
      query: { principalType: group, principalId: "{groupId}", roleId: viewer }
      expect: { status: 200, body: { grants: [{ id: "{firstGrantId}" }] }, path: grants, length: 1 }
    - request: GET /api/grants
      query: { principalType: group, principalId: "{groupId}", scopeType: team, scopeId: "{teamId}" }
      expect: { status: 200, body: { grants: [{ id: "{secondGrantId}" }] }, path: grants, length: 1 }
    - request: GET /api/grants
      query: { principalType: group, principalId: "{groupId}", status: expired }
      expect: { status: 200, path: grants, length: 0 }
  teardown:
    - request: DELETE /api/grants/{firstGrantId}
      auth: org
    - request: DELETE /api/grants/{secondGrantId}
      auth: org
    - request: DELETE /api/groups/{groupId}
      auth: org

- id: grants-list-refuses-tampered-cursor
  endpoint: GET /api/grants
  auth: org
  request:
    path: /api/grants
    query: { cursor: "not-a-cursor-{uid}" }
  expect: { status: 422 }

- id: grants-get-unknown-id-is-not-found

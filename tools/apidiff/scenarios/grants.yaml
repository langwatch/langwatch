      auth: org

- id: grants-revoke-then-not-found
  endpoint: DELETE /api/grants/{grantId}
  auth: org
  setup:
    - request: POST /api/groups
      body: { name: "vd-{uid}" }
      capture: { groupId: id }
    - request: POST /api/grants
      body: { principal: { type: group, id: "{groupId}" }, roleId: member, scope: { type: team, id: "{teamId}" } }
      capture: { grantId: id }
  request: { path: "/api/grants/{grantId}" }
  expect: { status: 200, body: { id: "{grantId}", revoked: true } }
  verify:
    - request: GET /api/grants/{grantId}
      expect: { status: 404, body: { code: grant_not_found } }
  teardown:
    - request: DELETE /api/groups/{groupId}
      auth: org

- id: grants-same-grant-twice-is-two-grants
  endpoint: POST /api/grants
  auth: org
  setup:
    - request: POST /api/groups
      body: { name: "vd-{uid}" }
      capture: { groupId: id }
    - request: POST /api/grants
      body: { principal: { type: group, id: "{groupId}" }, roleId: member, scope: { type: team, id: "{teamId}" } }

# ---- nobody grants more than they hold: a key holding only organization:manage ----

- id: grants-key-cannot-grant-itself-admin
  endpoint: POST /api/grants
  auth: none
  setup:
    - request: POST /api/api-keys
      auth: org
      body:
        keyType: service
        name: "vd-{uid}"
        permissionMode: restricted
        permissions: ["organization:manage"]
        bindings: [{ role: CUSTOM, scopeType: ORGANIZATION, scopeId: "{orgId}" }]
      capture: { keyId: apiKey.id, keyToken: token }
      expect: { status: 201 }
  request:
    path: /api/grants
    headers: { Authorization: "Bearer {keyToken}" }
    body: { principal: { type: apiKey, id: "{keyId}" }, roleId: admin, scope: { type: organization, id: "{orgId}" } }
  expect:
    status: 403
    body: { code: grant_exceeds_caller_permissions, meta: { missingPermissions: ["<any>"] } }
  verify:
    - request: GET /api/grants
      auth: org
      query: { principalType: apiKey, principalId: "{keyId}", roleId: admin }
      expect: { status: 200, path: grants, length: 0 }
  teardown:
    - request: DELETE /api/api-keys/{keyId}
      auth: org

- id: grants-key-cannot-raise-a-grant-above-itself
  endpoint: PATCH /api/grants/{grantId}
  auth: none
  setup:
    - request: POST /api/api-keys

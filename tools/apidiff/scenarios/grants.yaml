# ---- grants: Idempotency-Key ----

- id: grants-create-replays-under-idempotency-key
  endpoint: POST /api/grants
  auth: org
  setup:
    - request: POST /api/groups
      body: { name: "vd-{uid}" }
      capture: { groupId: id }
    - request: POST /api/grants
      headers: { Idempotency-Key: "vd-grant-{uid}" }
      body: { principal: { type: group, id: "{groupId}" }, roleId: viewer, scope: { type: project, id: "{projectId}" } }
      capture: { grantId: id }
      expect: { status: 201 }
  request:
    path: /api/grants
    headers: { Idempotency-Key: "vd-grant-{uid}" }
    body: { principal: { type: group, id: "{groupId}" }, roleId: viewer, scope: { type: project, id: "{projectId}" } }
  expect:
    status: 201
    body: { id: "{grantId}" }
    headers: { X-Idempotent-Replay: "true" }
  verify:
    - request: GET /api/grants
      query: { principalType: group, principalId: "{groupId}" }
      expect: { status: 200, path: grants, length: 1 }
  teardown:
    - request: DELETE /api/grants/{grantId}
      auth: org
    - request: DELETE /api/groups/{groupId}
      auth: org

- id: grants-create-refuses-reused-idempotency-key
  endpoint: POST /api/grants
  auth: org
  setup:
    - request: POST /api/groups
      body: { name: "vd-{uid}" }
      capture: { groupId: id }
    - request: POST /api/grants
      headers: { Idempotency-Key: "vd-grant-{uid}" }
      body: { principal: { type: group, id: "{groupId}" }, roleId: viewer, scope: { type: project, id: "{projectId}" } }
      capture: { grantId: id }
      expect: { status: 201 }
  request:
    path: /api/grants
    headers: { Idempotency-Key: "vd-grant-{uid}" }
    body: { principal: { type: group, id: "{groupId}" }, roleId: member, scope: { type: project, id: "{projectId}" } }
  expect: { status: 409, body: { code: idempotency_error } }
  verify:
    - request: GET /api/grants
      query: { principalType: group, principalId: "{groupId}" }
      expect: { status: 200, path: grants, length: 1 }
  teardown:
    - request: DELETE /api/grants/{grantId}
      auth: org
    - request: DELETE /api/groups/{groupId}
      auth: org


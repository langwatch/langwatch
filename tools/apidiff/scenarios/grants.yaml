  request:
    path: /api/grants
    body: { principal: { type: group, id: "{groupId}" }, roleId: member, scope: { type: team, id: "{teamId}" } }
  capture: { secondGrantId: id }
  expect: { status: 201, notContains: "{firstGrantId}" }

        keyType: service
        name: "vd-{uid}"
        permissionMode: restricted
        permissions: ["organization:manage"]
        bindings: [{ role: CUSTOM, scopeType: ORGANIZATION, scopeId: "{orgId}" }]
      capture: { keyId: apiKey.id, keyToken: token }
      expect: { status: 201 }
    - request: POST /api/groups
      auth: org
      body: { name: "vd-{uid}" }
      capture: { groupId: id }
    - request: POST /api/grants
      auth: org
      body: { principal: { type: group, id: "{groupId}" }, roleId: viewer, scope: { type: organization, id: "{orgId}" } }
      capture: { grantId: id }
  request:
    path: /api/grants/{grantId}
    headers: { Authorization: "Bearer {keyToken}" }
    body: { roleId: admin }
  expect:
    status: 403
    body: { code: grant_exceeds_caller_permissions, meta: { missingPermissions: ["<any>"] } }
  verify:
    - request: GET /api/grants/{grantId}
      auth: org
      expect: { status: 200, body: { role: { id: viewer } } }
  teardown:
    - request: DELETE /api/grants/{grantId}
      auth: org
    - request: DELETE /api/groups/{groupId}
      auth: org
    - request: DELETE /api/api-keys/{keyId}
      auth: org


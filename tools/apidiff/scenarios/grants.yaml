- id: grants-change-refuses-new-scope
  endpoint: PATCH /api/grants/{grantId}
  auth: org
  setup:
    - request: POST /api/groups
      body: { name: "vd-{uid}" }
      capture: { groupId: id }
    - request: POST /api/grants

      capture: { grantId: id }
  request:
    path: /api/grants/{grantId}
    body: { roleId: viewer, scope: { type: team, id: "{teamId}" } }
  expect: { status: 422 }
  verify:
    - request: GET /api/grants/{grantId}
      expect: { status: 200, body: { role: { id: viewer }, scope: { type: project, id: "{projectId}" } } }
  teardown:

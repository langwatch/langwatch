# ---- the last administrator: its own org shard, serial, and only when one admin grant exists ----
# The setup refuses to go on unless exactly one user and no group hold admin on the organization,
# so a failing guard can never take the seeded admin's access away.

- id: grants-last-admin-cannot-be-revoked
  endpoint: DELETE /api/grants/{grantId}
  auth: org
  shard: org
  serial: true
  setup:
    - request: GET /api/grants
      query: { roleId: admin, scopeType: organization, principalType: group }
      expect: { status: 200, path: grants, length: 0 }
    - request: GET /api/grants
      query: { roleId: admin, scopeType: organization, principalType: user }
      capture: { adminGrantId: grants.0.id }
      expect: { status: 200, path: grants, length: 1 }
  request: { path: "/api/grants/{adminGrantId}" }
  expect: { status: 400, body: { code: cannot_remove_last_admin } }
  verify:
    - request: GET /api/grants/{adminGrantId}
      expect: { status: 200, body: { role: { id: admin } } }

- id: grants-last-admin-cannot-be-lowered
  endpoint: PATCH /api/grants/{grantId}
  auth: org
  shard: org
  serial: true
  setup:
    - request: GET /api/grants
      query: { roleId: admin, scopeType: organization, principalType: group }
      expect: { status: 200, path: grants, length: 0 }
    - request: GET /api/grants
      query: { roleId: admin, scopeType: organization, principalType: user }
      capture: { adminGrantId: grants.0.id }
      expect: { status: 200, path: grants, length: 1 }
  request:
    path: /api/grants/{adminGrantId}
    body: { roleId: member }
  expect: { status: 400, body: { code: cannot_demote_last_admin } }
  verify:
    - request: GET /api/grants/{adminGrantId}
      expect: { status: 200, body: { role: { id: admin } } }

# ---- roles: built-in ids and the builtIn filter ----

- id: roles-list-built-ins-first
  endpoint: GET /api/roles
  auth: org
  setup:
    - request: POST /api/roles
      body: { name: "vd-{uid}", permissions: ["project:view"] }
      capture: { roleId: id }
  request: { path: /api/roles }
  expect:
    status: 200
    body:
      roles:
        - { id: admin, builtIn: true, createdAt: null }
        - { id: member, builtIn: true }
        - { id: viewer, builtIn: true }
        - { builtIn: false }
    contains: "vd-{uid}"
  teardown:
    - request: DELETE /api/roles/{roleId}
      auth: org

- id: roles-list-built-in-only
  endpoint: GET /api/roles
  auth: org
  setup:
    - request: POST /api/roles
      body: { name: "vd-{uid}", permissions: ["project:view"] }
      capture: { roleId: id }
  request:
    path: /api/roles
    query: { builtIn: "true" }
  expect:
    status: 200
    body: { roles: [{ id: admin }, { id: member }, { id: viewer }] }
    notContains: "vd-{uid}"
    path: roles
    length: 3
  teardown:
    - request: DELETE /api/roles/{roleId}
      auth: org

- id: roles-list-custom-only
  endpoint: GET /api/roles
  auth: org
  setup:
    - request: POST /api/roles
      body: { name: "vd-{uid}", permissions: ["project:view"] }
      capture: { roleId: id }
  request:
    path: /api/roles
    query: { builtIn: "false" }
  expect:
    status: 200
    body: { roles: [{ builtIn: false }] }
    contains: "vd-{uid}"
    notContains: '"builtIn":true'
  teardown:
    - request: DELETE /api/roles/{roleId}
      auth: org

- id: roles-list-refuses-invalid-built-in-filter
  endpoint: GET /api/roles
  auth: org
  request:
    path: /api/roles
    query: { builtIn: "yes" }
  expect: { status: 422, body: { code: validation_error } }

- id: roles-get-built-in-by-id
  endpoint: GET /api/roles/{id}
  auth: org
  request: { path: /api/roles/admin }
  expect:
    status: 200
    body: { id: admin, builtIn: true, permissions: ["<any>"], createdAt: null, updatedAt: null }

- id: roles-built-in-cannot-be-changed
  endpoint: PATCH /api/roles/{id}
  auth: org
  request:
    path: /api/roles/viewer
    body: { name: "vd-{uid}" }
  expect: { status: 409, body: { code: role_is_built_in } }
  verify:
    - request: GET /api/roles/viewer
      expect: { status: 200, body: { id: viewer, builtIn: true }, notContains: "vd-{uid}" }

- id: roles-built-in-cannot-be-deleted
  endpoint: DELETE /api/roles/{id}
  auth: org
  request: { path: /api/roles/viewer }
  expect: { status: 409, body: { code: role_is_built_in } }
  verify:
    - request: GET /api/roles/viewer
      expect: { status: 200, body: { id: viewer } }

# ---- /api/role-bindings: deprecated, still answering, pointing at /api/grants ----

- id: role-bindings-deprecated-list-carries-headers
  endpoint: GET /api/role-bindings
  auth: org
  request: { path: /api/role-bindings }
  expect:
    status: 200
    body: { bindings: "<any>" }
    headers: { Deprecation: "true", Link: '</api/grants>; rel="successor-version"' }

- id: role-bindings-deprecated-writes-carry-headers
  endpoint: POST /api/role-bindings
  auth: org
  setup:
    - request: POST /api/groups
      body: { name: "vd-{uid}" }
      capture: { groupId: id }
  request:
    path: /api/role-bindings
    body: { groupId: "{groupId}", role: VIEWER, scopeType: PROJECT, scopeId: "{projectId}" }
  capture: { bindingId: id }
  expect:
    status: 201
    headers: { Deprecation: "true", Link: "/api/grants" }
  verify:
    - request: PATCH /api/role-bindings/{bindingId}
      body: { role: MEMBER }
      expect: { status: 200, headers: { Deprecation: "true", Link: "/api/grants" } }
    - request: GET /api/grants/{bindingId}
      expect: { status: 200, body: { role: { id: member } } }
    - request: DELETE /api/role-bindings/{bindingId}
      expect: { status: 200, headers: { Deprecation: "true", Link: "/api/grants" } }
  teardown:
    - request: DELETE /api/groups/{groupId}
      auth: org

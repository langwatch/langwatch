# Tenant query surfaces that read shared ClickHouse and cost money (coverage gap 2):
# LangWatchQL (/api/v1/query), the analytics-sql family's saved charts
# (/api/v1/projects/{projectId}/analytics/charts; main removed its raw SQL route in #7565)
# and instant-evals (/api/v1/instant-evals, 7 operations). All are /api/v1-only on main.

# ── /api/v1/query ───────────────────────────────────────────────────────────

- id: query-run-reads-back-own-trace
  endpoint: POST /api/v1/query
  setup:
    - {"request": "POST /api/collector", "body": {"trace_id": "vdq{uid}", "spans": [{"type": "llm", "span_id": "vdqs{uid}", "trace_id": "vdq{uid}", "name": "vd-{uid}", "model": "gpt-5", "input": {"type": "text", "value": "vd question {uid}"}, "output": {"type": "text", "value": "vd answer {uid}"}, "timestamps": {"started_at": "{nowMs-60000}", "finished_at": "{nowMs-59000}"}}]}, "expect": {"status": 200}}
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT TraceId FROM traces WHERE TraceId = 'vdq{uid}' LIMIT 10"}}
  expect: {"status": 200, "body": {"columns": "<any>", "rows": "<any>", "statistics": "<any>"}}
  verify:
    - {"request": "POST /api/v1/query", "body": {"sql": "SELECT TraceId FROM traces WHERE TraceId = 'vdq{uid}' LIMIT 10"}, "eventually": "60s", "expect": {"status": 200, "contains": "vdq{uid}", "path": "rows", "length": 1}}

- id: query-run-no-limit-is-capped-not-refused
  endpoint: POST /api/v1/query
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT TraceId FROM traces"}}
  expect: {"status": 200, "body": {"rows": "<any>"}}

- id: query-run-refuses-no-key
  endpoint: POST /api/v1/query
  auth: none
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT TraceId FROM traces LIMIT 1"}}
  expect: {"status": 401}

- id: query-run-refuses-unknown-key
  endpoint: POST /api/v1/query
  auth: none
  request: {"path": "/api/v1/query", "headers": {"X-Auth-Token": "sk-lw-vd{uid}notarealkey"}, "body": {"sql": "SELECT TraceId FROM traces LIMIT 1"}}
  expect: {"status": 401}

- id: query-run-other-project-key-sees-nothing
  endpoint: POST /api/v1/query
  auth: project-b
  setup:
    - {"request": "POST /api/collector", "auth": "project", "body": {"trace_id": "vdq{uid}", "spans": [{"type": "llm", "span_id": "vdqs{uid}", "trace_id": "vdq{uid}", "name": "vd-{uid}", "input": {"type": "text", "value": "vd question {uid}"}, "output": {"type": "text", "value": "vd answer {uid}"}, "timestamps": {"started_at": "{nowMs-60000}", "finished_at": "{nowMs-59000}"}}]}, "expect": {"status": 200}}
    - {"request": "POST /api/v1/query", "auth": "project", "body": {"sql": "SELECT TraceId FROM traces WHERE TraceId = 'vdq{uid}' LIMIT 10"}, "eventually": "60s", "expect": {"status": 200, "contains": "vdq{uid}"}}
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT TraceId, TenantId FROM traces WHERE TraceId = 'vdq{uid}' LIMIT 10"}}
  expect: {"status": 200, "path": "rows", "length": 0, "notContains": "vdq{uid}"}

- id: query-run-tenant-filter-cannot-name-another-project
  endpoint: POST /api/v1/query
  setup:
    - {"request": "POST /api/collector", "auth": "project-b", "body": {"trace_id": "vdqb{uid}", "spans": [{"type": "llm", "span_id": "vdqbs{uid}", "trace_id": "vdqb{uid}", "name": "vd-{uid}", "input": {"type": "text", "value": "vd secret {uid}"}, "output": {"type": "text", "value": "vd answer {uid}"}, "timestamps": {"started_at": "{nowMs-60000}", "finished_at": "{nowMs-59000}"}}]}, "expect": {"status": 200}}
    - {"request": "POST /api/v1/query", "auth": "project-b", "body": {"sql": "SELECT TraceId FROM traces WHERE TraceId = 'vdqb{uid}' LIMIT 10"}, "eventually": "60s", "expect": {"status": 200, "contains": "vdqb{uid}"}}
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT TraceId, TenantId FROM traces WHERE TenantId = '{projectIdB}' LIMIT 100"}}
  expect: {"status": 200, "path": "rows", "length": 0, "notContains": ["vdqb{uid}", "{projectIdB}"]}

- id: query-run-or-true-cannot-widen-tenant
  endpoint: POST /api/v1/query
  setup:
    - {"request": "POST /api/collector", "auth": "project-b", "body": {"trace_id": "vdqb{uid}", "spans": [{"type": "llm", "span_id": "vdqbs{uid}", "trace_id": "vdqb{uid}", "name": "vd-{uid}", "input": {"type": "text", "value": "vd secret {uid}"}, "output": {"type": "text", "value": "vd answer {uid}"}, "timestamps": {"started_at": "{nowMs-60000}", "finished_at": "{nowMs-59000}"}}]}, "expect": {"status": 200}}
    - {"request": "POST /api/v1/query", "auth": "project-b", "body": {"sql": "SELECT TraceId FROM traces WHERE TraceId = 'vdqb{uid}' LIMIT 10"}, "eventually": "60s", "expect": {"status": 200, "contains": "vdqb{uid}"}}
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT TraceId, TenantId FROM traces WHERE TraceId = 'vdqb{uid}' OR 1 = 1 LIMIT 10000"}}
  expect: {"status": 200, "notContains": ["vdqb{uid}", "{projectIdB}"]}

- id: query-run-union-cannot-reach-another-project
  endpoint: POST /api/v1/query
  setup:
    - {"request": "POST /api/collector", "auth": "project-b", "body": {"trace_id": "vdqb{uid}", "spans": [{"type": "llm", "span_id": "vdqbs{uid}", "trace_id": "vdqb{uid}", "name": "vd-{uid}", "input": {"type": "text", "value": "vd secret {uid}"}, "output": {"type": "text", "value": "vd answer {uid}"}, "timestamps": {"started_at": "{nowMs-60000}", "finished_at": "{nowMs-59000}"}}]}, "expect": {"status": 200}}
    - {"request": "POST /api/v1/query", "auth": "project-b", "body": {"sql": "SELECT TraceId FROM traces WHERE TraceId = 'vdqb{uid}' LIMIT 10"}, "eventually": "60s", "expect": {"status": 200, "contains": "vdqb{uid}"}}
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT TraceId FROM traces WHERE TenantId = '{projectIdB}' LIMIT 10 UNION ALL SELECT TraceId FROM (SELECT TraceId FROM traces WHERE TraceId = 'vdqb{uid}') LIMIT 10"}}
  expect: {"status": [200, 400], "notContains": "vdqb{uid}"}

- id: query-run-app-function-cannot-read-another-projects-trace
  endpoint: POST /api/v1/query
  setup:
    - {"request": "POST /api/collector", "auth": "project-b", "body": {"trace_id": "vdqb{uid}", "spans": [{"type": "llm", "span_id": "vdqbs{uid}", "trace_id": "vdqb{uid}", "name": "vd-{uid}", "input": {"type": "text", "value": "vd secret {uid}"}, "output": {"type": "text", "value": "vd answer {uid}"}, "timestamps": {"started_at": "{nowMs-60000}", "finished_at": "{nowMs-59000}"}}]}, "expect": {"status": 200}}
    - {"request": "POST /api/v1/query", "auth": "project-b", "body": {"sql": "SELECT TraceId FROM traces WHERE TraceId = 'vdqb{uid}' LIMIT 10"}, "eventually": "60s", "expect": {"status": 200, "contains": "vdqb{uid}"}}
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT TraceId, llm_messages('vdqb{uid}') AS leaked, trace_json('vdqb{uid}') AS whole FROM traces LIMIT 1"}}
  expect: {"status": [200, 400, 422], "notContains": ["vd secret {uid}", "vdqbs{uid}"]}

- id: query-run-refuses-system-tables
  endpoint: POST /api/v1/query
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT name FROM system.tables LIMIT 5"}}
  expect: {"status": 400, "body": {"code": "<any>"}, "notContains": "trace_summaries"}

- id: query-run-refuses-limit-above-cap
  endpoint: POST /api/v1/query
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT TraceId FROM traces LIMIT 10001"}}
  expect: {"status": 400, "body": {"code": "lwql_not_permitted"}, "contains": "LIMIT_TOO_HIGH"}

- id: query-run-refuses-union-branch-without-limit
  endpoint: POST /api/v1/query
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT TraceId FROM traces UNION ALL SELECT TraceId FROM traces LIMIT 5"}}
  expect: {"status": 400, "contains": "LIMIT_REQUIRED_PER_BRANCH"}

- id: query-run-refuses-unparseable-sql
  endpoint: POST /api/v1/query
  request: {"path": "/api/v1/query", "body": {"sql": "SELEC TraceId FRM traces"}}
  expect: {"status": 400, "body": {"code": "lwql_unparseable"}}

- id: query-run-rejects-missing-sql
  endpoint: POST /api/v1/query
  request: {"path": "/api/v1/query", "body": {"parameters": {"a": 1}}}
  expect: {"status": [400, 422]}

- id: query-run-rejects-empty-sql
  endpoint: POST /api/v1/query
  request: {"path": "/api/v1/query", "body": {"sql": ""}}
  expect: {"status": [400, 422]}

- id: query-run-rejects-wrong-parameter-type
  endpoint: POST /api/v1/query
  request: {"path": "/api/v1/query", "body": {"sql": "SELECT TraceId FROM traces LIMIT 1", "parameters": {"a": {"nested": true}}}}
  expect: {"status": [400, 422]}

- id: query-schema-lists-views
  endpoint: GET /api/v1/query/schema
  request: {"path": "/api/v1/query/schema"}
  expect: {"status": 200, "body": {"database": "<any>", "views": "<any>"}, "contains": "TenantId"}

- id: query-schema-refuses-no-key
  endpoint: GET /api/v1/query/schema
  auth: none
  request: {"path": "/api/v1/query/schema"}
  expect: {"status": 401}

- id: query-reference-describes-both-languages
  endpoint: GET /api/v1/query/reference
  request: {"path": "/api/v1/query/reference"}
  expect: {"status": 200, "contains": "/api/v1/query"}

- id: query-reference-refuses-no-key
  endpoint: GET /api/v1/query/reference
  auth: none

  request: {"path": "/api/v1/instant-evals", "body": {"sql": "SELECT TraceId, eval(llm_readable_trace(TraceId, 1000), 'x') AS q1 FROM traces LIMIT 1", "target": "traces", "questions": [{"instructions": "x"}]}}

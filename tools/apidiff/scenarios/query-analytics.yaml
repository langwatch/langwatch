# ── /api/v1/projects/{projectId}/analytics/charts (analytics-sql family) ─────

- id: query-charts-create-reads-back
  endpoint: POST /api/v1/projects/{projectId}/analytics/charts
  request: {"path": "/api/v1/projects/{projectId}/analytics/charts", "body": {"name": "vd-{uid}", "definition": {"version": 1, "sql": "SELECT TraceId FROM traces LIMIT 5", "parameters": {}}}}
  capture: {"chartId": "id"}
  expect: {"status": 201, "body": {"name": "vd-{uid}", "id": "<any>"}}
  verify:
    - {"request": "GET /api/v1/projects/{projectId}/analytics/charts/{chartId}", "expect": {"status": 200, "body": {"name": "vd-{uid}"}, "contains": "SELECT TraceId FROM traces LIMIT 5"}}
    - {"request": "GET /api/v1/projects/{projectId}/analytics/charts", "expect": {"status": 200, "contains": "vd-{uid}"}}

- id: query-charts-list-refuses-no-key
  endpoint: GET /api/v1/projects/{projectId}/analytics/charts
  auth: none
  request: {"path": "/api/v1/projects/{projectId}/analytics/charts"}
  expect: {"status": 401}

- id: query-charts-list-refuses-another-projects-path
  endpoint: GET /api/v1/projects/{projectId}/analytics/charts
  setup:
    - {"request": "GET /api/v1/projects/{projectIdB}/analytics/charts", "auth": "project-b", "expect": {"status": [200, 403]}}
  request: {"path": "/api/v1/projects/{projectIdB}/analytics/charts"}
  expect: {"status": [403, 404]}

- id: query-charts-get-other-project-key-refused
  endpoint: GET /api/v1/projects/{projectId}/analytics/charts/{chartId}
  auth: project-b
  setup:
    - {"request": "POST /api/v1/projects/{projectId}/analytics/charts", "auth": "project", "body": {"name": "vd-{uid}", "definition": {"version": 1, "sql": "SELECT TraceId FROM traces LIMIT 5", "parameters": {}}}, "capture": {"chartId": "id"}, "expect": {"status": 201}}
  request: {"path": "/api/v1/projects/{projectIdB}/analytics/charts/{chartId}"}
  expect: {"status": [403, 404], "notContains": "vd-{uid}"}
  verify:
    - {"request": "GET /api/v1/projects/{projectId}/analytics/charts/{chartId}", "auth": "project-b", "expect": {"status": [403, 404], "notContains": "vd-{uid}"}}
    - {"request": "GET /api/v1/projects/{projectId}/analytics/charts/{chartId}", "auth": "project", "expect": {"status": 200, "body": {"name": "vd-{uid}"}}}

- id: query-charts-create-rejects-missing-name
  endpoint: POST /api/v1/projects/{projectId}/analytics/charts
  request: {"path": "/api/v1/projects/{projectId}/analytics/charts", "body": {"definition": {"version": 1, "sql": "SELECT TraceId FROM traces LIMIT 5", "parameters": {}}}}
  expect: {"status": [400, 422]}

- id: query-charts-create-refuses-system-table-sql
  endpoint: POST /api/v1/projects/{projectId}/analytics/charts
  request: {"path": "/api/v1/projects/{projectId}/analytics/charts", "body": {"name": "vd-{uid}", "definition": {"version": 1, "sql": "SELECT name FROM system.tables LIMIT 5", "parameters": {}}}}
  expect: {"status": 400}
  verify:
    - {"request": "GET /api/v1/projects/{projectId}/analytics/charts", "expect": {"status": 200, "notContains": "vd-{uid}"}}

- id: query-charts-create-refuses-limit-above-cap
  endpoint: POST /api/v1/projects/{projectId}/analytics/charts
  request: {"path": "/api/v1/projects/{projectId}/analytics/charts", "body": {"name": "vd-{uid}", "definition": {"version": 1, "sql": "SELECT TraceId FROM traces LIMIT 10001", "parameters": {}}}}
  expect: {"status": 400, "contains": "LIMIT_TOO_HIGH"}

# ── /api/v1/instant-evals ────────────────────────────────────────────────────

- id: query-instant-evals-estimate-prices-a-run
  endpoint: POST /api/v1/instant-evals/estimate
  request: {"path": "/api/v1/instant-evals/estimate", "body": {"target": "traces", "questions": [{"instructions": "Is the answer polite?"}], "limit": 1}}
  expect: {"status": 200, "body": {"rows": "<any>", "priceUsd": "<any>", "isRowsCapped": "<any>"}}

- id: query-instant-evals-create-reads-back
  endpoint: POST /api/v1/instant-evals
  shard: project
  request: {"path": "/api/v1/instant-evals", "body": {"name": "vd-{uid}", "target": "traces", "questions": [{"instructions": "Is the answer polite?"}], "limit": 1}}
  capture: {"runId": "id"}
  expect: {"status": 202, "body": {"id": "<any>", "name": "vd-{uid}", "limit": 1}}
  verify:
    - {"request": "GET /api/v1/instant-evals/{runId}", "expect": {"status": 200, "body": {"name": "vd-{uid}"}}}
    - {"request": "GET /api/v1/instant-evals", "expect": {"status": 200, "contains": "vd-{uid}"}}
    - {"request": "GET /api/v1/instant-evals/{runId}/results", "expect": {"status": 200, "body": {"judgments": "<any>"}}}
    - {"request": "GET /api/v1/instant-evals/{runId}/sample", "expect": {"status": 200, "body": {"rows": "<any>", "judgments": "<any>"}}}
    - {"request": "POST /api/v1/instant-evals/{runId}/cancel", "expect": {"status": [200, 409]}}

- id: query-instant-evals-list-refuses-no-key
  endpoint: GET /api/v1/instant-evals
  auth: none
  request: {"path": "/api/v1/instant-evals"}
  expect: {"status": 401}

- id: query-instant-evals-create-refuses-no-key
  endpoint: POST /api/v1/instant-evals
  auth: none
  request: {"path": "/api/v1/instant-evals", "body": {"target": "traces", "questions": [{"instructions": "Is the answer polite?"}], "limit": 1}}
  expect: {"status": 401}

- id: query-instant-evals-other-project-key-cannot-read-run
  endpoint: GET /api/v1/instant-evals/{id}
  auth: project-b
  shard: project
  setup:
    - {"request": "POST /api/v1/instant-evals", "auth": "project", "body": {"name": "vd-{uid}", "target": "traces", "questions": [{"instructions": "Is the answer polite?"}], "limit": 1}, "capture": {"runId": "id"}, "expect": {"status": 202}}
  request: {"path": "/api/v1/instant-evals/{runId}"}
  expect: {"status": 404, "notContains": "vd-{uid}"}
  verify:
    - {"request": "GET /api/v1/instant-evals/{runId}/results", "auth": "project-b", "expect": {"status": 404}}
    - {"request": "GET /api/v1/instant-evals/{runId}/sample", "auth": "project-b", "expect": {"status": 404, "notContains": "vd-{uid}"}}
    - {"request": "POST /api/v1/instant-evals/{runId}/cancel", "auth": "project-b", "expect": {"status": 404}}
    - {"request": "GET /api/v1/instant-evals", "auth": "project-b", "expect": {"status": 200, "notContains": "vd-{uid}"}}
    - {"request": "GET /api/v1/instant-evals/{runId}", "auth": "project", "expect": {"status": 200, "body": {"name": "vd-{uid}"}}}

- id: query-instant-evals-sql-cannot-name-another-project
  endpoint: POST /api/v1/instant-evals/estimate
  setup:
    - {"request": "POST /api/collector", "auth": "project-b", "body": {"trace_id": "vdqb{uid}", "spans": [{"type": "llm", "span_id": "vdqbs{uid}", "trace_id": "vdqb{uid}", "name": "vd-{uid}", "input": {"type": "text", "value": "vd secret {uid}"}, "output": {"type": "text", "value": "vd answer {uid}"}, "timestamps": {"started_at": "{nowMs-60000}", "finished_at": "{nowMs-59000}"}}]}, "expect": {"status": 200}}
  request: {"path": "/api/v1/instant-evals/estimate", "body": {"sql": "SELECT TraceId, eval(llm_readable_trace(TraceId, 1000), 'Is the answer polite?') AS q1 FROM traces WHERE TenantId = '{projectIdB}' LIMIT 10", "limit": 10}}
  expect: {"status": 200, "body": {"rows": 0}, "notContains": "vdqb{uid}"}

- id: query-instant-evals-create-rejects-sql-and-target

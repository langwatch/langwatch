# ── test suites ──────────────────────────────────────────────────────────────

- id: "cli-test-suites-create-with-fields-update-replaces-them"
  endpoint: "POST /api/v1/test-suites"
  request:
    path: "/api/v1/test-suites"
    body: {"name": "vd-{uid}", "fields": [{"identifier": "tenant_id", "type": "text"}]}
  capture: {"suiteId": "id"}
  expect:
    status: 201
    body: {"id": "<any>", "name": "vd-{uid}", "slug": "<any>", "scenarioCount": 0, "archivedAt": null, "createdAt": "<any>", "updatedAt": "<any>", "platformUrl": "<any>"}
    contains: ["tenant_id"]
  verify:
    - request: "GET /api/v1/test-suites/{suiteId}"
      expect: {"status": 200, "body": {"id": "{suiteId}", "scenarios": "<any>"}, "contains": ["tenant_id"]}
    - request: "PATCH /api/v1/test-suites/{suiteId}"
      body: {"fields": [{"identifier": "region", "type": "text"}]}
      expect: {"status": 200, "body": {"id": "{suiteId}", "name": "vd-{uid}"}, "contains": ["region"], "notContains": "tenant_id"}
    - request: "PATCH /api/v1/test-suites/{suiteId}"
      body: {"name": "vd2-{uid}"}
      expect: {"status": 200, "body": {"id": "{suiteId}", "name": "vd2-{uid}"}, "contains": ["region"]}
  teardown:
    - request: "DELETE /api/v1/test-suites/{suiteId}"

- id: "cli-test-suites-list-hides-archived-unless-asked"
  endpoint: "GET /api/v1/test-suites"
  setup:
    - request: "POST /api/v1/test-suites"
      body: {"name": "vd-{uid}"}
      capture: {"suiteId": "id"}
      expect: {"status": 201}
    - request: "DELETE /api/v1/test-suites/{suiteId}"
      expect: {"status": 200, "body": {"id": "{suiteId}", "archived": true}}
  request: {"path": "/api/v1/test-suites"}
  expect: {"status": 200, "notContains": "{suiteId}"}
  verify:
    - request: "GET /api/v1/test-suites?includeArchived=true"
      expect: {"status": 200, "contains": ["{suiteId}", "archivedAt"]}

- id: "cli-test-suites-create-with-a-bad-field-identifier-is-refused"
  endpoint: "POST /api/v1/test-suites"
  request:
    path: "/api/v1/test-suites"
    body: {"name": "vd-{uid}", "fields": [{"identifier": "Bad Name", "type": "text"}]}
  expect: {"status": [400, 422]}
  verify:
    - request: "GET /api/v1/test-suites"
      expect: {"status": 200, "notContains": "vd-{uid}"}

- id: "cli-test-suites-run-with-no-targets-is-refused"
  endpoint: "POST /api/v1/test-suites/{id}/run"
  setup:
    - request: "POST /api/v1/test-suites"
      body: {"name": "vd-{uid}"}
      capture: {"suiteId": "id"}
      expect: {"status": 201}
  request:
    path: "/api/v1/test-suites/{suiteId}/run"
    body: {"targets": []}
  expect: {"status": [400, 422], "contains": "suite_targets_required"}
  teardown:
    - request: "DELETE /api/v1/test-suites/{suiteId}"

- id: "cli-test-suites-run-schedules-jobs-and-answers-the-plan"
  endpoint: "POST /api/v1/test-suites/{id}/run"
  setup:
    - request: "POST /api/v1/test-suites"
      body: {"name": "vd-{uid}"}
      capture: {"suiteId": "id"}
      expect: {"status": 201}
    - request: "POST /api/v1/scenarios"
      body: {"name": "vd-{uid}", "situation": "A customer asks for a refund", "criteria": ["Agent apologises"], "labels": ["vd"], "testSuiteId": "{suiteId}"}
      capture: {"scenarioId": "id"}
      expect: {"status": [200, 201]}
    - request: "POST /api/v1/agents"
      body: {"name": "vd-{uid}", "type": "http", "config": {"url": "http://127.0.0.1:1/echo", "method": "POST"}}
      capture: {"agentId": "id"}
      expect: {"status": 201}
  request:
    path: "/api/v1/test-suites/{suiteId}/run"
    body: {"targets": [{"type": "http", "referenceId": "{agentId}"}], "name": "vd-plan-{uid}", "repeatCount": 1, "note": "apidiff"}
  capture: {"planId": "runPlanId"}
  expect:
    status: [200, 201]
    body: {"scheduled": true, "batchRunId": "<any>", "setId": "<any>", "jobCount": 1, "runPlanId": "<any>", "planName": "vd-plan-{uid}", "created": true, "items": "<any>"}
  verify:
    - request: "GET /api/v1/test-suites/{suiteId}"
      expect: {"status": 200, "body": {"id": "{suiteId}", "scenarioCount": 1}, "contains": ["{scenarioId}"]}
  teardown:
    - request: "DELETE /api/v1/run-plans/{planId}"
    - request: "DELETE /api/v1/test-suites/{suiteId}"
    - request: "DELETE /api/v1/agents/{agentId}"

- id: "cli-test-suites-run-unknown-suite-is-404"
  endpoint: "POST /api/v1/test-suites/{id}/run"
  request:
    path: "/api/v1/test-suites/nope-{uid}/run"
    body: {"targets": [{"type": "http", "referenceId": "agent-nope-{uid}"}]}
  expect: {"status": 404}

- id: "cli-test-suites-archive-unknown-suite-is-404"
  endpoint: "DELETE /api/v1/test-suites/{id}"
  request: {"path": "/api/v1/test-suites/nope-{uid}"}
  expect: {"status": 404}

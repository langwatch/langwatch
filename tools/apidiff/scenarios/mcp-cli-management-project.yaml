  request:
    path: "/api/v1/projects/apidiff-project-widgets/analytics/dashboard-widgets/{widgetId}/dashboard"
    headers: {"Authorization": "Bearer sk-lw-apidiff-project-widgets-key", "X-Auth-Token": "sk-lw-apidiff-project-widgets-key"}
    body: {"dashboardId": "dash-nope-{uid}"}
  expect: {"status": 404}
  teardown:
    - request: "DELETE /api/v1/projects/apidiff-project-widgets/analytics/dashboard-widgets/{widgetId}"
      auth: "none"
      headers: {"Authorization": "Bearer sk-lw-apidiff-project-widgets-key", "X-Auth-Token": "sk-lw-apidiff-project-widgets-key"}

- id: "cli-dashboard-widgets-get-unknown-is-404"
  endpoint: "GET /api/v1/projects/{projectId}/analytics/dashboard-widgets/{widgetId}"
  auth: "none"
  request:
    path: "/api/v1/projects/apidiff-project-widgets/analytics/dashboard-widgets/widget-nope-{uid}"
    headers: {"Authorization": "Bearer sk-lw-apidiff-project-widgets-key", "X-Auth-Token": "sk-lw-apidiff-project-widgets-key"}

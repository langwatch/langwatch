    body: {"code": "export default function Widget() { return 1; }"}
  expect: {"status": [400, 422]}
  teardown:
    - request: "DELETE /api/v1/projects/apidiff-project-widgets/analytics/dashboard-widgets/{widgetId}"
      auth: "none"
      headers: {"Authorization": "Bearer sk-lw-apidiff-project-widgets-key", "X-Auth-Token": "sk-lw-apidiff-project-widgets-key"}

- id: "cli-dashboard-widgets-pin-on-an-unknown-dashboard-is-404"
  endpoint: "POST /api/v1/projects/{projectId}/analytics/dashboard-widgets/{widgetId}/dashboard"
  auth: "none"
  setup:
    - request: "POST /api/v1/projects/apidiff-project-widgets/analytics/dashboard-widgets"
      auth: "none"
      headers: {"Authorization": "Bearer sk-lw-apidiff-project-widgets-key", "X-Auth-Token": "sk-lw-apidiff-project-widgets-key"}
      body: {"name": "vd-{uid}", "code": "export default function Widget() { return null; }", "queries": [{"name": "q", "sql": "SELECT 1 AS one"}]}
      capture: {"widgetId": "id"}

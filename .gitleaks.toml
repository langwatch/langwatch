# gitleaks configuration — read by the `secrets` job in
# `.github/workflows/code-scanners.yml`.
#
# gitleaks is a BLOCKING gate: a committed credential is never acceptable, and
# #5708 is the precedent for why. That only stays true if the gate is
# believable, so every entry below has to name the value it is allowing and why
# that value is not a secret. An allowlist that says "noisy file" is how a
# blocking scanner gets switched off six months later.

[extend]
useDefault = true

# The Stripe product catalog is a checked-in snapshot of PUBLIC Stripe objects —
# products, prices and their `lookupKey`s (`LAUNCH_TRACES_10K` and friends).
# A lookup key is the stable public handle used to fetch a price by name instead
# of by `price_...` id; it is designed to be shipped in client code. gitleaks'
# `generic-api-key` rule fires on the `Key": "<high-entropy value>"` shape and
# cannot tell the two apart.
#
# Scoped to `generic-api-key` only, so Stripe's OWN rules still apply to this
# file: a real `sk_live_`/`rk_live_` token landing here is still caught by
# `stripe-access-token`. Scoped by path rather than by value so a new lookup key
# does not need a config change to be added.
[[allowlists]]
description = "Stripe catalog lookupKeys are public price handles, not credentials"
targetRules = ["generic-api-key"]
paths = ['''platform/app/ee/billing/stripe/stripeCatalog\.json''']

# Gateway test fixtures that pattern-match `generic-api-key` but are provably
# not credentials: a sequential-hex HMAC fixture (`0123456789abcdef...`) signing
# the vk-lifecycle and spend-ingest route tests, and the literal process key
# `"conversation-1"` in the process-store suite.
# Scoped to those test files and the generic rule only, so a real token
# landing in either is still caught by every provider-specific rule.
[[allowlists]]
description = "Sequential-hex HMAC fixture in the signed-route tests, not a credential"
targetRules = ["generic-api-key"]
paths = [
  '''platform/app/src/server/routes/__tests__/gateway-internal\.vk-lifecycle\.integration\.test\.ts''',
  '''platform/app/src/server/routes/__tests__/gateway-internal\.spend-ingest\.integration\.test\.ts''',
]

[[allowlists]]
description = "Literal fixture ids (conversation-1) in the process-store suite, not credentials"
targetRules = ["generic-api-key"]
paths = ['''platform/app/src/server/event-sourcing/process-manager/stores/__tests__/prismaProcessStore\.integration\.test\.ts''']

# The self-hosted license fixtures are base64 payloads signed with the TEST
# keypair that sits beside them in `fixtures/testKeys.ts`, checked in on
# purpose: license validation is signature verification, so a test that does not
# carry a real signature verifies nothing. The keypair signs nothing outside
# this suite, and the production verifier reads its key from
# `LANGWATCH_LICENSE_PUBLIC_KEY`, so a fixture key is refused by every real
# deployment.
#
# Scoped to `generic-api-key` only, so a real credential pasted into this file
# is still caught by every provider-specific rule. Scoped by path rather than by
# value so a new fixture does not need a config change; the first line of the
# file already carries the same claim for readers.
[[allowlists]]
description = "Signed license test fixtures, verifiable only against the checked-in test keypair"
targetRules = ["generic-api-key"]
paths = ['''platform/app/ee/licensing/__tests__/fixtures/testLicenses\.ts''']

# gitleaks scans the branch's whole commit range, not just its tip, so a value
# removed in a later commit is still found in the commit that added it. This one
# is the sequential-hex placeholder `0123456789abcdef...` that briefly stood in
# for CREDENTIALS_SECRET in the CI workflow. It never protected anything: it
# encrypted and decrypted throwaway rows inside a single CI job, and the workflow
# generates a random key per run now instead.
#
# Scoped by VALUE as well as path, and matched with AND, so any other
# high-entropy string in a workflow file is still caught. A real credential
# cannot be this string.
[[allowlists]]
description = "Sequential-hex CREDENTIALS_SECRET placeholder once inlined in the CI workflow"
targetRules = ["generic-api-key"]
matchCondition = "AND"
paths = ['''\.github/workflows/langwatch-app-ci\.yml''']
regexes = ['''(0123456789abcdef){4}''']

# The two AWS-shaped literals the secrets-gate tests plant into throwaway
# repositories. The tests exist to prove the gate fails on a credential a pull
# request adds and passes on one it did not (#6681), and a fixture that no
# scanner recognises would prove neither half. No such AWS account exists, and
# the tests run the scanners in offline mode precisely because these values
# cannot verify against a provider.
#
# Scoped by VALUE and by nothing else, so any OTHER credential — in this file
# or any other — is still caught by every rule. Deliberately NOT scoped by path
# with `matchCondition = "AND"`, the shape the CREDENTIALS_SECRET entry above
# uses: gitleaks 8.30 does not narrow that way. A `paths` entry allowlists the
# whole file, AND or no AND, and the accompanying `regexes` change nothing —
# verified by planting a second, unrelated AWS key in this file and watching it
# go unreported. Fixing that entry (and its comment, which claims a narrowing it
# does not get) is tracked in #6684.
[[allowlists]]
description = "AWS-shaped fixture credentials planted by the secrets-gate scoping tests"
regexes = [
  '''AKIAQYLPMN5HHHFPZAM2''',
  '''A1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q7R8S9T0''',
]

# The synthetic credentials the secrets-redaction suite feeds to the redactor.
# This suite's whole job is to hand credential-shaped strings to `redact()` and
# assert they come back as `[SECRET]`, so a fixture no scanner recognises would
# prove nothing, the same argument as the secrets-gate entry above. The five
# values are a sequential-hex stand-in for a Twilio auth token
# (`a1b2c3d4e5f6...`), two keyboard-pattern bodies, an obviously-truncated
# `sk-proj-abc123def456`, and an invented `zyq_` vendor prefix. None names a real
# account, and the negative half of the same suite asserts ordinary text is left
# alone.
#
# `private-key` is in the rule list for the PEM cases: the suite has to hand the
# redactor a real armour block to prove it redacts one, and `MIIabc` between
# BEGIN and END markers is a private key to any scanner. The armour is assembled
# at run time at the tip so no new literal is added, but gitleaks scans the whole
# commit range, so the earlier commits that carried it still need naming here.
#
# Scoped to these two rules and to this one path, so every provider-specific
# rule still applies here: a real OpenAI, AWS, GitHub or Stripe token pasted into
# this file is still caught, which matters more in this file than most given what
# it is full of. Scoped by path rather than by value so adding a fixture to the
# corpus does not need a config change.
[[allowlists]]
description = "Synthetic credential fixtures fed to the redactor in the secrets-redaction suite"
targetRules = ["generic-api-key", "private-key"]
paths = ['''packages/redaction/src/__tests__/secrets\.unit\.test\.ts''']

# `Idempotency-Key: signup-acme-4171` and its SDK equivalents in the billing
# docs. An idempotency key is a value the CALLER invents to make a retry safe,
# and it is meaningless to anyone who is not already authenticated: it names a
# request, never grants access to one. gitleaks' `generic-api-key` rule fires on
# the `Key: "<value>"` shape and cannot tell a caller-chosen request tag from a
# credential. `llms-full.txt` is the generated concatenation of the same pages.
#
# Scoped to `generic-api-key` and to docs paths only, so a real token pasted
# into the documentation is still caught by every provider-specific rule.
[[allowlists]]
description = "Idempotency-Key examples in the docs are caller-chosen request tags, not credentials"
targetRules = ["generic-api-key"]
paths = [
  '''docs/ai-gateway/api/management\.mdx''',
  '''docs/ai-gateway/cookbooks/metering-and-rebilling\.mdx''',
  '''docs/llms-full\.txt''',
]

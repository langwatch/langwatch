# gitleaks configuration — read by the `secrets` job in
# `.github/workflows/code-scanners.yml`.
#
# gitleaks is a BLOCKING gate: a committed credential is never acceptable, and
# #5708 is the precedent for why. That only stays true if the gate is
# believable, so every entry below has to name the value it is allowing and why
# that value is not a secret. An allowlist that says "noisy file" is how a
# blocking scanner gets switched off six months later.

[extend]
useDefault = true

# The Stripe product catalog is a checked-in snapshot of PUBLIC Stripe objects —
# products, prices and their `lookupKey`s (`LAUNCH_TRACES_10K` and friends).
# A lookup key is the stable public handle used to fetch a price by name instead
# of by `price_...` id; it is designed to be shipped in client code. gitleaks'
# `generic-api-key` rule fires on the `Key": "<high-entropy value>"` shape and
# cannot tell the two apart.
#
# Scoped to `generic-api-key` only, so Stripe's OWN rules still apply to this
# file: a real `sk_live_`/`rk_live_` token landing here is still caught by
# `stripe-access-token`. Scoped by path rather than by value so a new lookup key
# does not need a config change to be added.
[[allowlists]]
description = "Stripe catalog lookupKeys are public price handles, not credentials"
targetRules = ["generic-api-key"]
paths = ['''enterprise/modules/billing/contract/src/stripe-catalog\.json''']

# Two entries stood here and both are gone, because their subjects are.
#
# The first allowed the sequential-hex fixture `0123456789abcdef0123456789abcdef`
# in six gateway route and JWT suites; the second allowed the literal
# `conversation-1` ids in the Prisma process-store suite. All seven files were
# deleted with the platform application. The fixture value still appears in five
# surviving files, but in none of them does it sit in the `Key": "<value>"` shape
# `generic-api-key` fires on, so no successor entry is needed — verified against
# gitleaks 8.30 over the whole tree. A test that reintroduces the shape should
# get its own entry naming its own file, which is what an allowlist scoped by
# path is for.

# WebAuthn AAGUIDs are public model identifiers assigned to authenticators.
# They identify products such as iCloud Keychain and YubiKey, not a device,
# account or credential. The UI maps these registry values to readable labels.
#
# Scoped by VALUE, path and rule with AND. Every UUID is anchored, so a real
# token that merely contains one of these public identifiers is still caught,
# as is any other high-entropy value added to the source file.
[[allowlists]]
description = "Public WebAuthn authenticator model AAGUIDs, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''modules/coding-agent/browser/src/passkeyAuthenticators\.ts''']
regexes = [
  '''^fbfc3007-154e-4ecc-8c0b-6e020557d7bd$''',
  '''^dd4ec289-e01d-41c9-bb89-70fa845d4bf2$''',
  '''^adce0002-35bc-c60a-648b-0b25f1f05503$''',
  '''^ea9b8d66-4d01-1d21-3ce4-b6b48cb575d4$''',
  '''^b93fd961-f2e6-462f-b122-82002247de78$''',
  '''^bada5566-a7aa-401f-bd96-45619a55120d$''',
  '''^d548826e-79b4-db40-a3d8-11116f7e8349$''',
  '''^cb69481e-8ff7-4039-93ec-0a2729a154a8$''',
  '''^ee882879-721c-4913-9775-3dfcce97072a$''',
  '''^fa2b99dc-9e39-4257-8f92-4a30d23c4118$''',
  '''^2fc0579f-8113-47ea-b116-bb5a8db9202a$''',
  '''^73bb0cd4-e502-49b8-9c6f-b59445bf720b$''',
  '''^c1f9a0bc-1dd2-404a-b27f-8e29047a43fd$''',
  '''^d8522d9f-575b-4866-88a9-ba99fa02f35b$''',
  '''^39a5647e-1853-446c-a1f6-a79bae9f5bc7$''',
]

# The self-hosted license fixtures are base64 payloads signed with the TEST
# keypair that sits beside them in `fixtures/license-keys.fixture.ts`, checked in
# on purpose: license validation is signature verification, so a test that does not
# carry a real signature verifies nothing. The keypair signs nothing outside
# this suite, and the production verifier reads its key from
# `LANGWATCH_LICENSE_PUBLIC_KEY`, so a fixture key is refused by every real
# deployment.
#
# Scoped to `generic-api-key` only, so a real credential pasted into this file
# is still caught by every provider-specific rule. Scoped by path rather than by
# value so a new fixture does not need a config change; the first line of the
# file already carries the same claim for readers.
[[allowlists]]
description = "Signed license test fixtures, verifiable only against the checked-in test keypair"
targetRules = ["generic-api-key"]
paths = ['''enterprise/modules/licensing/process/src/testing\.ts''']

# The keypair itself, which the extraction re-added at a new path. It is the
# RSA pair the fixtures above are signed with and the verifier tests verify
# against; the file's own first line says so. It carries a `gitleaks:allow`
# comment in its docblock, which gitleaks honours only on the line the finding
# is on, so the block bodies were never covered by it.
#
# Scoped to `private-key` and to this one file: any OTHER rule still applies
# here, and no other file in the licensing package may carry a key block.
[[allowlists]]
description = "Test RSA keypair the license fixtures are signed with; verifies nothing in production"
targetRules = ["private-key"]
paths = ['''enterprise/modules/licensing/process/src/fixtures/license-keys\.fixture\.ts''']

# The offline license compatibility fixture (ADR-139): one license minted with
# the licensing code of main before connected self-hosted landed, so a test can
# pin that it still verifies and enforces the same way. It was signed with a
# keypair generated for that one mint whose private half was discarded, and the
# file holds only public keys beside it. No deployment accepts it, because the
# production verifier reads its key from `LANGWATCH_LICENSE_PUBLIC_KEY`.
#
# Scoped to `generic-api-key` and to this one file, so a real credential pasted
# into it is still caught by every provider-specific rule.
[[allowlists]]
description = "Offline license compatibility fixture, signed by a discarded one-off keypair"
targetRules = ["generic-api-key"]
paths = ['''platform/app/ee/licensing/__tests__/fixtures/offline-license-from-main\.json''']

# The stand-in license key in the audit redaction test. It is the base64 of
# `{"data":{}}`, so it holds no signature and no license, and it cannot be a
# credential. The test needs a value shaped like a license key to
# prove that the audit trail drops it.
#
# Scoped by VALUE as well as path, matched with AND and anchored, so any other
# high-entropy string in that test file is still reported.
[[allowlists]]
description = "Base64 of an empty license payload, used to prove audit redaction"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''platform/app/src/server/api/__tests__/redactAuditArgs\.unit\.test\.ts''']
regexes = ['''^eyJkYXRhIjp7fX0=$''']

# gitleaks scans the branch's whole commit range, not just its tip, so a value
# removed in a later commit is still found in the commit that added it. This one
# is the sequential-hex placeholder `0123456789abcdef...` that briefly stood in
# for CREDENTIALS_SECRET in the CI workflow. It never protected anything: it
# encrypted and decrypted throwaway rows inside a single CI job, and the workflow
# generates a random key per run now instead.
#
# Scoped by VALUE as well as path, and matched with AND, so any other
# high-entropy string in a workflow file is still caught. The value is anchored,
# so a longer secret that merely contains the placeholder is still reported.
# A real credential cannot be this string.
#
# The field is `condition`. `matchCondition` is not a name gitleaks knows, and
# an unknown key is dropped in silence, which leaves the block as a bare `paths`
# entry allowlisting the whole workflow file.
[[allowlists]]
description = "Sequential-hex CREDENTIALS_SECRET placeholder once inlined in the CI workflow"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''\.github/workflows/langwatch-app-ci\.yml''']
regexes = ['''^(0123456789abcdef){4}$''']

# The two AWS-shaped literals the secrets-gate tests plant into throwaway
# repositories. The tests exist to prove the gate fails on a credential a pull
# request adds and passes on one it did not (#6681), and a fixture that no
# scanner recognises would prove neither half. No such AWS account exists, and
# the tests run the scanners in offline mode precisely because these values
# cannot verify against a provider.
#
# Scoped by VALUE and by nothing else, so any OTHER credential — in this file
# or any other — is still caught by every rule. The two values live in exactly
# two places, this file and the test script that plants them, so a path scope
# would add little: the value is the axis that matters.
[[allowlists]]
description = "AWS-shaped fixture credentials planted by the secrets-gate scoping tests"
regexes = ['''AKIAQYLPMN5HHHFPZAM2''', '''A1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q7R8S9T0''']

# The synthetic credentials the secrets-redaction suite feeds to the redactor.
# This suite's whole job is to hand credential-shaped strings to `redact()` and
# assert they come back as `[SECRET]`, so a fixture no scanner recognises would
# prove nothing, the same argument as the secrets-gate entry above. The five
# values are a sequential-hex stand-in for a Twilio auth token
# (`a1b2c3d4e5f6...`), two keyboard-pattern bodies, an obviously-truncated
# `sk-proj-abc123def456`, and an invented `zyq_` vendor prefix. None names a real
# account, and the negative half of the same suite asserts ordinary text is left
# alone.
#
# `private-key` is in the rule list for the PEM cases: the suite has to hand the
# redactor a real armour block to prove it redacts one, and `MIIabc` between
# BEGIN and END markers is a private key to any scanner. The armour is assembled
# at run time at the tip so no new literal is added, but gitleaks scans the whole
# commit range, so the earlier commits that carried it still need naming here.
#
# Scoped to these two rules and to this one path, so every provider-specific
# rule still applies here: a real OpenAI, AWS, GitHub or Stripe token pasted into
# this file is still caught, which matters more in this file than most given what
# it is full of. Scoped by path rather than by value so adding a fixture to the
# corpus does not need a config change.
[[allowlists]]
description = "Synthetic credential fixtures fed to the redactor in the secrets-redaction suite"
targetRules = ["generic-api-key", "private-key"]
paths = ['''packages/redaction/src/__tests__/secrets\.unit\.test\.ts''']

# `Idempotency-Key: signup-acme-4171` and its SDK equivalents in the billing
# docs. An idempotency key is a value the CALLER invents to make a retry safe,
# and it is meaningless to anyone who is not already authenticated: it names a
# request, never grants access to one. gitleaks' `generic-api-key` rule fires on
# the `Key: "<value>"` shape and cannot tell a caller-chosen request tag from a
# credential. `llms-full.txt` is the generated concatenation of the same pages.
#
# Scoped to `generic-api-key` and to docs paths only, so a real token pasted
# into the documentation is still caught by every provider-specific rule.
[[allowlists]]
description = "Idempotency-Key examples in the docs are caller-chosen request tags, not credentials"
targetRules = ["generic-api-key"]
paths = [
  '''docs/ai-gateway/api/management\.mdx''',
  '''docs/ai-gateway/cookbooks/metering-and-rebilling\.mdx''',
  '''docs/llms-full\.txt''',
]

# `azure-secret-hygiene.unit.test.ts` proves the opposite of a leak: that
# `redactAuthorizationMaterial` strips bearer tokens out of Azure error text
# before it reaches a log. To prove that, the fixture has to be shaped exactly
# like the thing a real leak would be — so gitleaks flags it, correctly, on
# shape alone.
#
# Naming the value, as this file requires. `LEAKED_TOKEN` is three base64
# segments that decode to:
#   header    {"alg":"RS256","typ":"JWT"}
#   payload   {"aud":"https://storage"}
#   signature the literal ASCII word `signature`
# No key signed it, it names no tenant, no account and no subject, and it
# authenticates against nothing. Decode it and there is nothing to revoke.
#
# Scoped to this one file and to the two rules its shape trips, so every other
# rule still applies here: a real Azure account key or SAS token landing in this
# file is still caught.
# NOTE: this entry's subject is gone. The Azure hygiene suite moved to
# modules/stored-object/process/src/adapters/__tests__/ and its
# fixture is now a computed base64 account key rather than a JWT-shaped
# literal, so it trips neither rule — verified against gitleaks 8.30 over the
# whole tree. The entry is deleted rather than repointed: an allowlist that
# names a file with nothing to allow only hides the next real finding in it.

# The three synthetic credentials the secret-redaction tests assign to a named
# key. Same argument as the Azure fixture above: a test that proves a secret is
# scrubbed has to hand it something shaped like the thing a real leak would be,
# and gitleaks' `generic-api-key` rule fires on the `TOKEN": "<high-entropy
# value>"` shape without being able to tell the fixture from what it imitates.
#
# Naming the values, as this file requires:
#   sk-live-abc123    printed by a code node in the nlpgo stdout/stderr
#                     redaction test. Already the repository's stand-in leak in
#                     services/langyagent and services/aigateway, where it sits
#                     in prose rather than an assignment and so goes unflagged.
#   hunter2-signing   the second secret in that same test, present to prove the
#                     scrub covers every entry in the map and not just the first.
#   tok-live-abc123   the `{{ secrets.NAME }}` value in the scenario HTTP target
#                     test.
# No provider issued any of them, none has ever authenticated anything, and
# there is nothing to revoke.
#
# Scoped by VALUE rather than by path, which is the stronger of the two: any
# other high-entropy string in these files is still caught, and the same fixture
# stays covered wherever else it is used. Scoped to `generic-api-key` on top, so
# every provider-specific rule still applies to these values too.
#
# ANCHORED, because a gitleaks allowlist regex is a substring match against the
# matched secret. Unanchored, `sk-live-abc123` would also allow a real
# `sk-live-abc123<rest-of-a-live-key>`, which is the one string an attacker
# could pick on purpose. `^...$` allows the fixture and nothing that merely
# starts with it.
[[allowlists]]
description = "Synthetic credential fixtures in the secret-redaction tests; issued by nobody, revocable nowhere"
targetRules = ["generic-api-key"]
regexes = ['''^sk-live-abc123$''', '''^hunter2-signing$''', '''^tok-live-abc123$''']

# The JWT-shaped fixture an earlier commit on the redaction-eats-product-ids
# branch put in `applyContentRedaction.unit.test.ts`. The test proves the `jwt`
# rule still fires under an attribute whose name says it holds an identifier, so
# the fixture has to be shaped exactly like a real leak, the same argument as
# the Azure block above. The tip assembles the three segments at run time, so no
# literal is added there, but gitleaks scans the whole commit range on a pull
# request and the earlier commit still needs naming here.
#
# Naming the value, as this file requires. The three segments decode to:
#   header    {"alg":"HS256"}
#   payload   {"sub":"1234567890"}
#   signature 32 bytes over a key this repository does not hold
# It is the sample token printed across public JWT documentation. It names no
# tenant, no account and no issuer, it authenticates against nothing here, and
# there is nothing to revoke.
#
# Scoped by VALUE and ANCHORED, for the reason given above the block before it:
# a substring allowlist would also permit a real token that merely starts with
# these segments.
[[allowlists]]
description = "Public sample JWT, the fixture proving the jwt rule still runs on an identifier attribute"
targetRules = ["jwt"]
regexes = [
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dBjftJeZ4CVPmB92K27uhbUJU1p1r_wW1gFWFOEjXk$''',
]

# `ik-lw-fresh1234567890_secret`, the stand-in ingestion token an earlier commit
# on the ingest-key rotation branch handed the mocked `apiKeys.create`. The tip
# spells it `ik-lw-fake-token`, which no rule fires on, but gitleaks scans the
# whole commit range on a pull request, so the earlier commit still needs naming
# here. The value was invented for a mock return, reaches no provider, and
# authenticates nothing.
#
# Scoped by VALUE and ANCHORED, for the reason given above the block before it:
# a substring allowlist would also permit a real token that merely starts with
# this prefix.
[[allowlists]]
description = "Stand-in ingestion token in the ingest-key rotation test, issued by nobody"
targetRules = ["generic-api-key"]
regexes = ['''^ik-lw-fresh1234567890_secret$''']

# `your-api-key`, the placeholder the published curl examples put in the
# `X-Auth-Token` header. It is the instruction "paste your key here" written as
# a value, and it is spelled the same way across `docs/` — the API-reference
# pages, the prompt-management guides and the aggregated `docs/llms-full.txt`
# that is generated from them. gitleaks' default `curl-auth-header` rule reads
# any `-H "…-Token: <value>"` as a credential and cannot tell a placeholder from
# a key.
#
# It is issued by nobody, authenticates against nothing, and there is nothing to
# revoke. A real token pasted into one of these examples is still caught: the
# allowlist is scoped by VALUE and ANCHORED, so it permits this exact string and
# nothing that merely contains or extends it, and every other rule still applies
# to these files.
[[allowlists]]
description = "Documented `your-api-key` placeholder in the docs curl examples, not a credential"
targetRules = ["curl-auth-header"]
regexes = ['''^your-api-key$''']

# The two synthetic credentials the code-agent adapter's "engine echoed a
# credential back" tests hand it (lw#3439). Each test's whole point is that a
# credential the NLP engine's error text quotes back at us is scrubbed before
# it reaches the customer — a defence-in-depth check pattern-based redaction
# alone cannot make, since it requires knowing the actual configured value, not
# just its shape. Proving that requires a fixture shaped exactly like the thing
# a real leak would be, so gitleaks flags it, correctly, on shape alone.
#
# Naming the values, as this file requires:
#   sk-live-abcdef0123456789   stands in for the project's own API key, fed
#                              back inside a mocked 401 "rejected api key ..."
#                              error body.
#   shh-9f3a2b7c4e             stands in for a user-configured secret (a
#                              `config.secrets` entry), fed back inside a
#                              mocked engine ValueError message/traceback.
# No provider issued either value, neither has ever authenticated anything, and
# there is nothing to revoke.
#
# Scoped by VALUE and ANCHORED, for the reason given above the block before it:
# a substring allowlist would also permit a real token that merely starts with
# one of these.
[[allowlists]]
description = "Synthetic credentials the code-agent adapter's echoed-secret redaction tests plant (lw#3439)"
targetRules = ["generic-api-key"]
regexes = [
  '''^sk-live-abcdef0123456789$''',
  '''^shh-9f3a2b7c4e$''',
]

# `vk-lw-YOUR_VIRTUAL_KEY`, the placeholder an earlier commit on the AI Gateway
# docs branch put in the `Authorization: Bearer` header of the DNS and TLS
# verification example. The tip spells it `$LANGWATCH_VIRTUAL_KEY`, an env var
# reference no rule fires on, but gitleaks scans the whole commit range on a
# pull request, so the earlier commit still needs naming here. The same
# placeholder reaches `docs/llms-full.txt`, which is generated from the pages.
#
# It is issued by nobody, authenticates against nothing, and there is nothing to
# revoke. Scoped by VALUE and ANCHORED, for the reason given above the block
# before it: a substring allowlist would also permit a real virtual key that
# merely starts with this prefix.
[[allowlists]]
description = "Documented `vk-lw-YOUR_VIRTUAL_KEY` placeholder in the AI Gateway docs, not a credential"
targetRules = ["curl-auth-header"]
regexes = ['''^vk-lw-YOUR_VIRTUAL_KEY$''']

# `vk-lw-01HZX9NABCDEFGHJKMNPQRSTVW`, the one-time-reveal fixture secret shared
# by the tests that cover the reveal store, the CLI's `--reveal-once` create,
# the snippet projection and the two card components. It has to be shaped like
# a real virtual key, because the tests assert on the display prefix cut from
# it and on the snippet the card renders with it filled in, and that shape is
# what makes `generic-api-key` fire.
#
# The two shorter values are that fixture's display prefix, `vk-lw-01HZX9N`,
# and the masked snippet the card renders once the secret is gone,
# `vk-lw-01HZX9N...`. A prefix is what the product shows in place of a secret,
# so allowing it gives away nothing the UI does not already print.
#
# None of the three is minted by a gateway, hashed into a database or able to
# authenticate anything, so there is nothing to revoke. Scoped by VALUE and
# ANCHORED, for the reason given above the block before it: a substring
# allowlist would also permit a real virtual key that merely starts with this
# prefix.
[[allowlists]]
description = "One-time-reveal fixture secret and its display prefix in the virtual-key snippet tests"
targetRules = ["generic-api-key"]
regexes = [
  '''^vk-lw-01HZX9NABCDEFGHJKMNPQRSTVW$''',
  '''^vk-lw-01HZX9N$''',
  '''^vk-lw-01HZX9N\.\.\.$''',
]

# `TOOL_CARD_ROWS` in the governance tool card names the rows a card prints —
# seats, licence per month, tokens over thirty days, and so on. Every entry is a
# plain string identifier the UI keys its labels off. Nobody issued any of them,
# they authenticate against nothing, and there is nothing to revoke.
#
# gitleaks reads consecutive array entries as a key/value pair: the finding is
# reported on the `"tokens30Days",` line and names the NEXT entry as the secret,
# because `generic-api-key` fires on a `...token...": "<high-entropy value>"`
# shape and two adjacent camel-case identifiers are exactly that shape.
#
# So the trigger is POSITION, not the value — whichever row happens to follow
# `tokens30Days` is the one accused. It is also entropy-dependent, which makes
# it worse rather than better: of seven plausible row names tested in that slot,
# `completions30Days` and `conversationsPerSeat30Days` trip the rule while
# `escalations30Days`, `promptsLast7Days`, `integrationsLast30Days`,
# `deflectionRateLast30Days` and `averageHandleTime30Days` do not. A value-scoped
# allowlist therefore fixes exactly one arrangement of this list and breaks the
# build again, unpredictably, the next time someone adds or reorders a row.
#
# Scoped by path rather than by value for the same reason the Stripe catalog
# block above is: a new row must not need a config change to be added.
#
# `targetRules` holds this to `generic-api-key` alone, so every other rule still
# applies to this file by construction. Checked rather than assumed: a synthetic
# GitHub PAT, Stripe live key and Slack bot token appended to this file are each
# still reported, identically to the same string in a file this block does not
# cover.
#
# Anchored at BOTH ends, because an unanchored pattern here is a substring match
# and exempts more than it names. Without `$` it also swallows `toolCards.tsx`,
# `toolCards.ts.bak` and `toolCards.ts.orig`; without `^` it also swallows any
# prefixed path, so a vendored or submoduled copy at
# `vendor/platform/app/.../toolCards.ts` is silently exempt too. Both were
# confirmed by scanning a repo containing those files, not by reading the docs.
#
# gitleaks reports a path relative to the scan root it was given. CI passes `.`
# from the repository root (`gitleaks git ... .`, see
# .github/scripts/secrets-scan.sh), so the path this pattern is matched against
# is repository-relative and `^` anchors it correctly. Passing an ABSOLUTE
# directory instead — `gitleaks dir /abs/path`, which no CI job does — makes the
# reported path absolute and the `^` stop matching. That direction is safe: the
# block simply does not apply, the file is scanned, and the result is a false
# positive rather than a hidden secret. The missing-`^` failure runs the other
# way, which is why it is anchored.
[[allowlists]]
description = "Governance tool-card row identifiers are UI keys, not credentials"
targetRules = ["generic-api-key"]
paths = [
  '''^platform/app/ee/governance/dashboard/components/toolCatalog/toolCards\.ts$''',
]

# `dGhlIHNhbXBsZSBub25jZQ==`, the `Sec-WebSocket-Key` in the raw upgrade
# requests the voice listener tests write onto a socket. A `Sec-WebSocket-Key`
# is not a credential by construction: RFC 6455 defines it as a nonce the
# CLIENT invents per handshake, sent in the clear, whose only purpose is to
# prove the response came from a server that understood the upgrade. The server
# echoes a hash of it back and then forgets it. It authorizes nothing and
# survives nothing.
#
# This particular value is the example printed in RFC 6455 section 1.3 itself:
# base64 for the ASCII words `the sample nonce`. It is issued by nobody and
# there is nothing to revoke.
#
# gitleaks' `generic-api-key` rule fires on the `...Key: <value>` shape and
# cannot tell a handshake nonce from a credential.
#
# Scoped by VALUE and ANCHORED, the stronger of the two axes: any OTHER
# high-entropy string in these tests is still reported, and every
# provider-specific rule still applies to them. Anchoring matters for the usual
# reason — a gitleaks allowlist regex is a substring match, so an unanchored
# pattern would also permit a real credential that merely starts with these
# characters.
[[allowlists]]
description = "RFC 6455 sample Sec-WebSocket-Key in the voice listener handshake tests, a client-invented nonce"
targetRules = ["generic-api-key"]
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

# The bech32 test vectors in the bitcoin-address suite, which prove the
# recognizer rejects a witness version or a witness program bitcoin does not
# allow. They come in pairs: the same construction at a value bitcoin permits
# and at one it does not, so the permitted member validating is what shows the
# other is rejected for its version or its program rather than for a checksum
# that never lined up.
#
# Naming them, as this file requires. None is a credential and none can become
# one: a bech32 string is a PUBLIC address, the thing you hand out to be paid,
# and these were generated for this test rather than observed. The rejected
# members are not bitcoin addresses at all — no wallet will parse them — and the
# accepted members encode payloads of counted-up bytes, so they are well-formed
# addresses to keys nobody holds. There is nothing to revoke, and nothing to
# send anywhere.
#
# They cannot be assembled at run time the way the base64 fixture in the
# identifier hold-out suite is. The checksum IS the thing under test, so a test
# that computed it would be asserting one implementation against a copy of
# itself; the literal is what makes the vector a vector.
#
# gitleaks' `generic-api-key` rule fires on the `const token = "<entropy>"`
# shape and cannot tell an address from a key.
#
# Scoped by VALUE and ANCHORED, for the reason given above the block before it:
# a substring allowlist would also permit a real secret that merely starts with
# these characters.
[[allowlists]]
description = "Generated bech32 vectors in the bitcoin-address tests; public addresses to keys nobody holds"
targetRules = ["generic-api-key"]
regexes = [
  '''^bc1pr23clxd5mzfsh79vn6pg0kaytjeq8w4u8x8jd8$''',
  '''^bc13r23clxd5mzfsh79vn6pg0kaytjeq8w4un2kxzn$''',
  '''^bc1pqvwl8xs0$''',
  '''^bc1pqdnfnnda$''',
  '''^bc1pqv9pzxqlyckngw6zf9g9whn9d3eh4qvg37tfmf9tk2uup37w6hww86h3lrlsvrg5rvlw2s2x$''',
  '''^bc1pqv9pzxqlyckngw6zf9g9whn9d3eh4qvge0qxlk$''',
  '''^bc1qqv9pzxqlyckngw6zf9g9whn9dsaqaxas$''',
  '''^bc1qqv9pzxqlyckngw6zf9g9whn9d3eh4qvg8d8phl$''',
]

# One row of the self-hosted instance drawer's usage list, as it stood in commit
# dece2163. The property was named `key` there and held the name of a field in a
# usage report, which is the `key: "<value>"` shape `generic-api-key` fires on.
# The property is called `field` now, so nothing in the tree matches, but the
# commit stays in the branch's history and a range scan still reads it.
#
# Scoped by VALUE and ANCHORED as well as by path, matched with AND, so any
# other high-entropy string in that file is still reported.
[[allowlists]]
description = "A usage-report field name in an instance drawer row list, before the property was renamed"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''platform/app/ee/admin/backoffice/resources/instances/types\.ts''']
regexes = ['''^scenario_runs_28d$''']

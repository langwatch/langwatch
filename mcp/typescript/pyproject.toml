[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "langwatch",
    "litellm>=1.96.0",
    "mcp[cli]>=2.0.0",
    "pandas>=2.3.2",
    "tenacity>=9.1.4",
]

[tool.uv]
exclude-newer = "7 days"

# Transitive-dependency security pins. Keep these even when the importing
# package isn't a direct dependency, so a future re-resolution can't silently
# pull a vulnerable version back in.
constraint-dependencies = [
    "python-dotenv>=1.2.2",  # security: python-dotenv advisory (#934)
    "python-liquid>=2.2.1",  # security: python-liquid advisory (#1528)
    "tornado>=6.5.9",  # security: tornado advisories (#2159, #2173, #2233, #2665-#2667)
    "anyio>=4.14.2",  # security: anyio advisories (#2430, #2431)
    "httpx2>=2.12.0",  # security: httpx2 advisories (#2312, #2313, #2329)
    "pyjwt>=2.15.0",  # security: PyJWT advisories covering <=2.14.0 (#2479, #2615)
    "urllib3>=2.8.0",  # security: urllib3 advisories covering <2.8.0 (#2591, #2592, #2608)
    "litellm>=1.96.2",  # security: litellm advisory covering 1.96.0-1.96.1 (#2648)
]

[tool.uv.sources]
langwatch = { path = "../../sdks/python", editable = true }

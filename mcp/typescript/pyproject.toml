[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ipykernel>=7.3.0",
  "langwatch",
  "litellm>=1.110.0", # security: litellm advisories up to CVE-2026-93355 and GHSA-2364-6whj-g7vx, fixed in 1.110.0
  "mcp[cli]>=2.2.0", # security: MCP SDK unbounded StreamableHTTP sessions, fixed in 2.2.0 (#2823)
  "pandas>=2.3.2",
  "tenacity>=9.1.4",
]

[tool.uv]
# exclude-newer-package below needs uv 0.9.25+ (dev/docs/best_practices/dependency-age-gates.md).
required-version = ">=0.9.25"
exclude-newer = "7 days"

# Security fixes released inside the 7-day window above, admitted up to a fixed
# date so the rest of the tree keeps the cooldown. Drop each once its date is
# more than 7 days old (certifi: #8958; litellm 1.110.0: CVE-2026-93355,
# GHSA-2364-6whj-g7vx, GHSA-fjxr-j47c-4x2x, GHSA-wpm4-hgr2-xjwr).
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", litellm = "2026-11-18T12:00:00Z" }

# Transitive-dependency security pins. Keep these even when the importing
# package isn't a direct dependency, so a future re-resolution can't silently
# pull a vulnerable version back in.
constraint-dependencies = [
  "python-dotenv>=1.2.2", # security: python-dotenv advisory (#934)
  "python-liquid>=2.2.1", # security: python-liquid advisory (#1528)
  "tornado>=6.6", # security: tornado advisories (#2159, #2173, #2233, #2665-#2667, #3325-#3327)
  "filelock>=4.2.1", # security: filelock lock-file advisories covering <=4.2.0 (#3281, #3282)
  "anyio>=4.14.2", # security: anyio advisories (#2430, #2431)
  "httpx2>=2.12.0", # security: httpx2 advisories (#2312, #2313, #2329)
  "pyjwt>=2.15.0", # security: PyJWT advisories covering <=2.14.0 (#2479, #2615)
  "urllib3>=2.8.0", # security: urllib3 advisories covering <2.8.0 (#2591, #2592, #2608)
  "fsspec>=2026.6.0", # security: fsspec advisory covering <2026.6.0 (#2731)
  "aiohttp>=3.14.4", # security: aiohttp advisories covering <=3.14.3, two HIGH (#2842-#2844)
  "certifi>=2026.10.19", # security: certifi advisory covering <2026.10.19 (#2897)
]

[tool.uv.sources]
langwatch = { path = "../../sdks/python", editable = true }

[project]
name = "judge-router"
version = "0.1.0"
description = "LangWatch Judge router: route one judgement to the decision model and, when unsure, an LLM"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

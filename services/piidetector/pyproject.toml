# The PII detector service: Level 0 and Level 1 (see README.md).
#
# Its own uv resolution, outside the root workspace, like services/langevals
# (ADR-145): torch, onnxruntime and transformers are pinned to the exact
# versions the benchmark measured, and a shared lock would let them hold back
# or be held back by the SDK. ADR-193 records the service.
#
# The core (Level 0, the name rule, the combiner, both entrypoints) is
# standard library only. The model stack is the `models` extra; the ONNX
# export tool is the `export` extra, used only while building the image.

[project]
name = "langwatch-piidetector"
version = "0.1.0"
description = "PII detection service: regex and validators (Level 0), plus GLiNER, PII-Tracer and a name rule (Level 1)."
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# The stack the benchmark measured. Changing a pin changes spans: re-run the
# parity check in the README before bumping any of them.
models = [
  "torch==2.11.0",
  "gliner==0.2.29",
  "transformers==5.16.1",
  "onnxruntime==1.30.0",
  "numpy==2.5.3",
  "huggingface-hub==1.33.0",
  "tokenizers==0.23.2",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "regex==2026.9.10",
  "tqdm==4.70.1",
  "pyyaml==6.0.3",
  "requests==2.34.2",
]
export = ["onnx==1.23.2"]

[dependency-groups]
dev = ["pytest>=8.4.0", "ruff>=0.16.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["piidetector"]

[tool.uv]
required-version = ">=0.9.25"
exclude-newer = "7 days"

# CPU-only torch wheels for both linux/amd64 and linux/arm64. The PyPI torch
# wheel for linux/amd64 bundles CUDA, which this CPU service never uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

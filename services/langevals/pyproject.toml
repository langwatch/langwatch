[project]
name = "langevals"
version = "3.0.0"
description = "A platform to evaluate LLM outputs using various evaluators."
authors = [{name = "Rogerio Chaves", email = "rogerio@langwatch.ai"}]
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "pytest>=8.1.2",
    "fastapi>=0.115.11",
    "pydantic>=2.4.0",
    "python-dotenv==1.2.2",
    "mangum>=0.17.0",
    "pandas>=2.2.2",
    "markdown>=3.6",
    "uvicorn>=0.29.0",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "nest-asyncio>=1.6.0",
    "pip-licenses>=5.5.0",
    "langevals-core",
]

[project.optional-dependencies]
azure = ["langevals-azure"]
openai = ["langevals-openai"]
ragas = ["langevals-ragas"]
lingua = ["langevals-lingua"]
langevals = ["langevals-langevals"]
presidio = ["langevals-presidio"]
topic_clustering = ["langevals-topic_clustering"]
all = [
    "langevals-azure",
    "langevals-langevals",
    "langevals-lingua",
    "langevals-ragas",
    "langevals-presidio",
    "langevals-openai",
    "langevals-topic_clustering",
]

[project.scripts]
langevals-server = "langevals.server:main"

[project.entry-points.pytest11]
pass_rate_plugin = "langevals.pytest_plugins.pass_rate_plugin"

[dependency-groups]
dev = [
    "toml>=0.10.2",
    "tomli-w>=1.0.0",
    "grevillea>=0.0.1",
    "litellm>=1.79.0",
    "instructor>=1.2.2",
    "pytest-xdist>=3.5.0",
    "flaky>=3.8.1",
    "ipykernel>=6.29.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langevals"]

[tool.uv]
exclude-newer = "7 days"
override-dependencies = [
    # Upper bounds are load-bearing, not tidiness. This was an unbounded
    # `langchain>=0.3.30`, so re-locking for the security floors below silently
    # took langchain to 1.3.15 and langchain-core to 1.5.4. langchain-community
    # is not on that line and still imports langchain_core.tracers.langchain_v1,
    # which 1.x removed, so every evaluator load crashed at import. Keeping the
    # family on 0.x is what makes this a security-floor change and nothing else;
    # moving to 1.x is a deliberate migration with its own PR.
    "langchain>=0.3.30,<1",
    "langchain-core>=0.3.86,<1",
    "langchain-openai>=0.2.14,<1",
    "langchain-text-splitters>=0.3.11,<1",
    # security: GHSA-f4xh-w4cj-qxq8 — LangSmith SDK TracingMiddleware arbitrary
    # server-side file read; patched in 0.8.18.
    "langsmith>=0.8.18",
    # Force a patched strawberry-graphql (GHSA-fr49-mhgj-crfc, GHSA-qfwv-87qj-98xq,
    # GHSA-x97m-qp5c-w9xj, all of which top out at 0.315.6). arize-phoenix pins
    # strawberry exactly, so without this the pin decides the version.
    "strawberry-graphql>=0.316.0",
    "pydantic-settings>=2.14.2",  # security: pydantic-settings advisory (#1517)
    # security: GHSA circular JSON Schema $ref unbounded-CPU DoS; patched in 0.60.1.
    "json-repair>=0.60.1",
    # --- Security floors below carry no API change for this workspace. Each is
    # the first patched release named by the advisory that produced the alert;
    # raise a floor rather than removing it, so a transitive downgrade can never
    # walk back under a fix.
    #
    # litellm auth bypass via Host header injection AND via OIDC userinfo cache
    # key collision (both CRITICAL), plus four further advisories fixed across
    # 1.83.7 / 1.83.10 / 1.83.14. 1.84.0 is the first release above all of them.
    "litellm>=1.84.0",
    # Pillow: heap overflow / DoS across several decoders.
    "pillow>=12.3.0",
    # nltk unsafe deserialization in the pickle loader path.
    "nltk>=3.10.0",
    # pyasn1 decoder DoS on crafted BER/DER input.
    "pyasn1>=0.6.4",
    # aiohttp request smuggling and header-parsing advisories.
    "aiohttp>=3.14.3",
    # cryptography: bundled OpenSSL advisories.
    "cryptography>=50.0.0",
    # h2 HTTP/2 control-frame flood DoS.
    "h2>=4.4.1",
    # setuptools path traversal in PackageIndex.
    "setuptools>=83.0.0",
    # torch: deserialization advisory in torch.load.
    "torch>=2.13.0",
    #
    # NOT fixed here, deliberately:
    #   langchain / langchain-core / langchain-openai / langchain-text-splitters
    #     — this workspace is on the 0.3.x line and every patched version is on
    #       1.x, so clearing those four alerts is a breaking major upgrade of the
    #       evaluator surface, not a floor bump. Tracked separately.
    #   ragas, diskcache — no patched release exists upstream yet.
]

[tool.uv.workspace]
members = [
    "langevals_core",
    "evaluators/*",
    "notebooks",
]

[tool.uv.sources]
langevals-core = { workspace = true }
langevals-azure = { workspace = true }
langevals-openai = { workspace = true }
langevals-ragas = { workspace = true }
langevals-lingua = { workspace = true }
langevals-langevals = { workspace = true }
langevals-presidio = { workspace = true }
langevals-topic_clustering = { workspace = true }

# PyTorch CPU index for Linux
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Braids · design prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --fg: #111113;
        --fg-2: #2d2d3d;
        --muted: #5c5c6e;
        --subtle: #7b8394;
        --faint: #9ca3af;
        --line: #e2e8f0;
        --line-2: #e7ecf2;
        --bg: #f8fafc;
        --bg-2: #f1f5f9;
        --card: #fff;
        --orange: #ed8926;
        --orange-600: #dd6b20;
        --orange-700: #c05621;
        --orange-50: #fffaf0;
        --orange-100: #fff3e4;
        --orange-200: #ffd19b;
        --slate: #3d3d4d;
        --blue: #2563eb;
        --green: #16a34a;
        --green-50: #f0fdf4;
        --red: #dc2626;
        --red-50: #fef2f2;
        --yellow-50: #fefce8;
        --yellow-700: #a16207;
        --r: 8px;
        --r-lg: 12px;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --shadow: 0 1px 2px rgba(17, 17, 19, 0.04), 0 1px 3px rgba(17, 17, 19, 0.06);
        --shadow-lg: 0 24px 48px -12px rgba(17, 17, 19, 0.25), 0 0 0 1px rgba(17, 17, 19, 0.04);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font:
          14px/1.5 Inter,
          system-ui,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      code,
      .mono {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      code,
      .mono,
      pre,
      textarea,
      .cond,
      .mini,
      .chip,
      .secret,
      .act {
        font-variant-ligatures: none;
        font-feature-settings:
          "liga" 0,
          "calt" 0;
      }
      svg.i {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      svg.i.sm {
        width: 14px;
        height: 14px;
      }
      svg.i.lg {
        width: 20px;
        height: 20px;
      }

      /* prototype chrome */
      .proto {
        position: fixed;
        inset: 0 0 auto 0;
        height: 52px;
        background: #0d0d10;
        color: #e7ecf2;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        z-index: 50;
      }
      .proto .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        white-space: nowrap;
      }
      .proto .brand small {
        color: #7b8394;
        font-weight: 500;
      }
      .steps {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        flex: 1;
        scrollbar-width: none;
      }
      .steps button {
        background: transparent;
        border: 1px solid transparent;
        color: #9ca3af;
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 12.5px;
        white-space: nowrap;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .steps button .n {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #2d2d3d;
        color: #cbd5e1;
        font-size: 11px;
        display: grid;
        place-items: center;
        font-weight: 600;
      }
      .steps button:hover {
        color: #fff;
      }
      .steps button.on {
        background: #1f1f28;
        border-color: #3d3d4d;
        color: #fff;
      }
      .steps button.on .n {
        background: var(--orange);
        color: #111113;
      }
      .proto .toggle {
        background: #1f1f28;
        border: 1px solid #3d3d4d;
        color: #e7ecf2;
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12.5px;
        display: flex;
        gap: 6px;
        align-items: center;
        white-space: nowrap;
      }

      .app {
        position: fixed;
        inset: 52px 0 0 0;
        display: grid;
        grid-template-columns: 56px 1fr;
      }
      .app.notes-open {
        right: 340px;
      }
      .rail {
        background: #fff;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 0;
        gap: 4px;
      }
      .rail .logo {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--orange);
        display: grid;
        place-items: center;
        margin-bottom: 12px;
        color: #111113;
        font-weight: 800;
        font-size: 13px;
      }
      .rail a {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: var(--subtle);
      }
      .rail a.on {
        background: var(--orange-100);
        color: var(--orange-700);
      }
      .rail .grow {
        flex: 1;
      }
      .main {
        overflow: auto;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        height: 52px;
        flex: none;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }
      .crumb b {
        color: var(--fg);
        font-weight: 600;
      }
      .switcher {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px 4px 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }
      .topbar .sp {
        flex: 1;
      }
      .me {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #213b41;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 600;
      }

      .av {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: inline-grid;
        place-items: center;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        flex: none;
        letter-spacing: 0.02em;
      }
      .av.sm {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        font-size: 9px;
      }
      .av.lg {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        font-size: 12px;
      }

      .settings {
        display: grid;
        grid-template-columns: 232px 1fr;
        flex: 1;
        min-height: 0;
      }
      .snav {
        border-right: 1px solid var(--line);
        background: #fff;
        padding: 20px 12px;
        overflow: auto;
      }
      .snav h6 {
        margin: 16px 10px 6px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--subtle);
        font-weight: 600;
      }
      .snav h6:first-child {
        margin-top: 0;
      }
      .snav a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        color: var(--fg-2);
        text-decoration: none;
        font-size: 13.5px;
      }
      .snav a.on {
        background: var(--bg-2);
        color: var(--fg);
        font-weight: 600;
      }
      .snav a .tag {
        margin-left: auto;
      }
      .content {
        padding: 32px 40px 80px;
        max-width: 1120px;
        width: 100%;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 11.5px;
        font-weight: 600;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.ent {
        border-color: #e9d5ff;
        background: #faf5ff;
        color: #7e22ce;
      }
      .pill.ok {
        border-color: #bbf7d0;
        background: var(--green-50);
        color: #15803d;
      }
      .pill.warn {
        border-color: #fde68a;
        background: var(--yellow-50);
        color: var(--yellow-700);
      }
      .pill.bad {
        border-color: #fecaca;
        background: var(--red-50);
        color: var(--red);
      }
      .pill.orange {
        border-color: var(--orange-200);
        background: var(--orange-50);
        color: var(--orange-700);
      }
      .pill.quiet {
        background: var(--bg-2);
        border-color: transparent;
      }

      .ph {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 20px;
      }
      .ph h1 {
        font-size: 22px;
        line-height: 1.25;
        margin: 0;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ph p {
        margin: 4px 0 0;
        color: var(--muted);
      }
      .ph .sp {
        flex: 1;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 12px;
        border-radius: var(--r);
        border: 1px solid var(--line);
        background: #fff;
        font-weight: 500;
        white-space: nowrap;
        transition:
          background 0.12s,
          border-color 0.12s;
      }
      .btn:hover {
        background: var(--bg);
      }
      .btn.primary {
        background: var(--orange);
        border-color: var(--orange);
        color: #111113;
        font-weight: 600;
      }
      .btn.primary:hover {
        background: #f19a45;
      }
      .btn.primary[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.danger {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
        font-weight: 600;
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn.ghost:hover {
        background: var(--bg-2);
      }
      .btn.sm {
        height: 28px;
        padding: 0 9px;
        font-size: 13px;
      }
      .btn[disabled] {
        cursor: not-allowed;
        color: var(--faint);
      }
      .iconbtn {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        border: 0;
        background: transparent;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .iconbtn:hover {
        background: var(--bg-2);
        color: var(--fg);
      }
      a.link {
        color: var(--orange-700);
        text-decoration: none;
        font-weight: 500;
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      a.link:hover {
        text-decoration: underline;
      }

      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 24px;
      }
      .tabs button {
        border: 0;
        background: none;
        padding: 10px 12px;
        color: var(--muted);
        font-weight: 500;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tabs button.on {
        color: var(--fg);
        border-bottom-color: var(--orange);
      }
      .tabs .count {
        font-size: 11.5px;
        background: var(--bg-2);
        border-radius: 999px;
        padding: 0 7px;
        color: var(--muted);
        font-weight: 600;
      }

      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow);
      }
      .empty {
        padding: 0;
        overflow: hidden;
      }
      .empty .art {
        display: grid;
        place-items: center;
        padding: 28px 40px 18px;
        background: linear-gradient(180deg, #fffaf3, #fff);
        border-bottom: 1px solid var(--line-2);
      }
      .empty .body {
        display: flex;
        align-items: flex-end;
        gap: 32px;
        padding: 28px 40px 32px;
      }
      .empty h2 {
        font-size: 20px;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      .empty p {
        color: var(--muted);
        margin: 0;
        max-width: 560px;
      }
      .weave {
        stroke-dasharray: 1;
        animation: weave-in 650ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .span-in {
        transform-box: fill-box;
        transform-origin: left;
        animation: span-in 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes weave-in {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes span-in {
        from {
          transform: scaleX(0);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .weave.still,
      .span-in.still {
        animation: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .weave,
        .span-in {
          animation: none;
        }
      }
      .how {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 16px;
      }
      .how .card {
        padding: 18px;
      }
      .how .k {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--orange-100);
        color: var(--orange-700);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .how h4 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      .how p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      /* braid rows */
      .route .names {
        min-width: 0;
      }
      .route .names span,
      .route .names b {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .braid {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) minmax(260px, 1.5fr) 140px 100px 36px;
        gap: 20px;
        align-items: center;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line-2);
      }
      .braid:last-child {
        border-bottom: 0;
      }
      .braid.head {
        padding: 10px 18px;
        font-size: 12px;
        color: var(--subtle);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: var(--bg);
        border-radius: var(--r-lg) var(--r-lg) 0 0;
      }
      .route {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .route .names {
        display: flex;
        flex-direction: column;
        line-height: 1.3;
      }
      .route .names b {
        font-weight: 600;
      }
      .route .names span {
        font-size: 12.5px;
        color: var(--subtle);
      }
      .cond {
        font-family: var(--mono);
        font-size: 12px;
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: 6px;
        padding: 6px 8px;
        color: var(--fg-2);
        white-space: pre-wrap;
        line-height: 1.5;
      }
      .meta {
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.5;
      }
      .meta b {
        color: var(--fg);
        font-weight: 600;
        font-size: 13px;
      }
      .spark {
        display: block;
        margin-top: 4px;
      }
      .braid.paused {
        opacity: 0.55;
      }
      .braid-strand {
        width: 54px;
        height: 22px;
        flex: none;
      }

      /* dialog */
      .overlay {
        position: fixed;
        inset: 52px 0 0 0;
        background: rgba(17, 17, 19, 0.42);
        backdrop-filter: blur(2px);
        display: grid;
        place-items: center;
        z-index: 30;
        padding: 24px;
        animation: fade 0.15s ease;
      }
      body.notes-open .overlay {
        right: 340px;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .dialog {
        background: #fff;
        border-radius: 14px;
        box-shadow: var(--shadow-lg);
        width: min(1040px, 100%);
        max-height: calc(100vh - 100px);
        display: flex;
        flex-direction: column;
        animation: rise 0.18s ease;
        overflow: hidden;
      }
      .dialog.narrow {
        width: min(520px, 100%);
      }
      .dialog.mid {
        width: min(720px, 100%);
      }
      .dh {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 20px 24px 16px;
      }
      .dh h3 {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.01em;
      }
      .dh p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 13.5px;
      }
      .dh .sp {
        flex: 1;
      }
      .db {
        padding: 4px 24px 20px;
        overflow: auto;
      }
      .df {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px;
        border-top: 1px solid var(--line);
        background: #fff;
      }
      .df .note {
        color: var(--subtle);
        font-size: 12.5px;
        flex: 1;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 24px;
      }
      label.f {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 6px;
      }
      label.f small {
        font-weight: 500;
        color: var(--subtle);
        margin-left: 4px;
      }
      .hint {
        font-size: 12.5px;
        color: var(--subtle);
        margin-top: 6px;
      }
      .field {
        margin-bottom: 18px;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .select {
        height: 38px;
        border: 1px solid var(--line);
        border-radius: var(--r);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        background: #fff;
        width: 100%;
        text-align: left;
        position: relative;
      }
      .select .v {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .select.fixed {
        background: var(--bg);
      }
      .input {
        height: 38px;
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 0 10px;
        width: 100%;
        font: inherit;
        background: #fff;
      }
      .input:focus,
      .select:focus {
        outline: 2px solid var(--orange-200);
        border-color: var(--orange);
      }
      .menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow-lg);
        padding: 4px;
        z-index: 40;
      }
      .menu .opt {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border-radius: 6px;
      }
      .menu .opt:hover {
        background: var(--bg-2);
      }
      .menu .opt.dis {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .menu .opt small {
        margin-left: auto;
        color: var(--subtle);
        font-size: 12px;
      }

      .fromto {
        display: grid;
        grid-template-columns: 1fr 64px 1fr;
        align-items: end;
        margin-bottom: 18px;
      }
      .fromto .mid {
        height: 38px;
        display: grid;
        place-items: center;
      }

      /* code editor */
      .editor {
        position: relative;
        border: 1px solid var(--line);
        border-radius: var(--r);
        background: #fff;
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }
      .editor:focus-within {
        border-color: var(--orange);
        box-shadow: 0 0 0 3px var(--orange-100);
      }
      .editor.err {
        border-color: #fca5a5;
      }
      .editor.err:focus-within {
        box-shadow: 0 0 0 3px #fee2e2;
      }
      .editor pre,
      .editor textarea {
        margin: 0;
        padding: 10px 12px 10px 40px;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 21px;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 74px;
      }
      .editor pre {
        pointer-events: none;
        color: var(--fg-2);
      }
      .editor textarea {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        color: transparent;
        caret-color: var(--fg);
        resize: none;
        outline: none;
        overflow: hidden;
      }
      .editor .gutter {
        position: absolute;
        left: 0;
        top: 10px;
        width: 30px;
        text-align: right;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 21px;
        color: var(--faint);
        user-select: none;
      }
      .tk-str {
        color: #c05621;
      }
      .tk-kw {
        color: #7e22ce;
        font-weight: 500;
      }
      .tk-fn {
        color: #2563eb;
      }
      .tk-op {
        color: var(--subtle);
      }
      .tk-lit {
        color: #0d9488;
      }
      .tk-path {
        color: var(--fg);
      }
      .vstate {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        margin-top: 6px;
        min-height: 20px;
      }
      .vstate.ok {
        color: #15803d;
      }
      .vstate.err {
        color: var(--red);
      }
      .vstate.warn {
        color: var(--yellow-700);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        align-items: center;
      }
      .chip {
        font-family: var(--mono);
        font-size: 11.5px;
        border: 1px dashed var(--line);
        border-radius: 6px;
        padding: 2px 7px;
        background: #fff;
        color: var(--fg-2);
      }
      .chip:hover {
        border-color: var(--orange);
        color: var(--orange-700);
        border-style: solid;
      }

      .signbox {
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .signbox .t {
        flex: 1;
      }
      .signbox .t b {
        display: block;
        font-size: 13.5px;
      }
      .signbox .t span {
        font-size: 12.5px;
        color: var(--muted);
      }
      .switch {
        width: 36px;
        height: 20px;
        border-radius: 999px;
        background: #cbd5e1;
        position: relative;
        border: 0;
        flex: none;
        margin-top: 2px;
        transition: background 0.15s;
      }
      .switch::after {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .switch.on {
        background: var(--orange);
      }
      .switch.on::after {
        transform: translateX(16px);
      }
      .keystate {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed var(--line);
      }

      /* preview */
      .preview {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 18px;
        position: relative;
      }
      .preview h4 {
        margin: 0;
        font-size: 14px;
      }
      .preview .sub {
        color: var(--subtle);
        font-size: 12.5px;
      }
      .big {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 12px 0 2px;
        font-variant-numeric: tabular-nums;
      }
      .big small {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
        letter-spacing: 0;
      }
      .bar {
        height: 8px;
        border-radius: 999px;
        background: #e2e8f0;
        display: flex;
        overflow: hidden;
        margin: 10px 0 12px;
      }
      .bar i {
        display: block;
        height: 100%;
        transition: width 0.3s ease;
      }
      .legend {
        display: grid;
        gap: 5px;
        font-size: 13px;
      }
      .legend div {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .legend .sw {
        width: 10px;
        height: 10px;
        border-radius: 3px;
      }
      .legend .num {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .sect {
        font-size: 11px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--subtle);
        font-weight: 600;
        margin: 16px 0 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .mini {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .mini .r {
        display: grid;
        grid-template-columns: 1fr 120px;
        align-items: center;
        gap: 8px;
        height: 22px;
        font-family: var(--mono);
        font-size: 12px;
      }
      .mini .r .bw {
        position: relative;
        height: 8px;
      }
      .mini .r .bw i {
        position: absolute;
        top: 0;
        height: 8px;
        border-radius: 3px;
      }
      .mini .r.hid {
        color: var(--faint);
      }
      .mini .r.hid .nm {
        text-decoration: line-through;
        text-decoration-color: #cbd5e1;
      }
      .hatch {
        background: repeating-linear-gradient(-45deg, #cbd5e1 0 2px, transparent 2px 5px);
        border: 1px solid #cbd5e1;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .stack {
        display: flex;
      }
      .stack span {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--bg);
        margin-left: -6px;
        display: grid;
        place-items: center;
        font-size: 8px;
        color: #fff;
        font-weight: 700;
      }
      .stack span:first-child {
        margin-left: 0;
      }
      .test {
        display: flex;
        gap: 6px;
      }
      .test .input {
        height: 32px;
        font-family: var(--mono);
        font-size: 12px;
      }
      .testres {
        font-size: 12.5px;
        margin-top: 8px;
        color: var(--muted);
      }
      .dim {
        opacity: 0.4;
        pointer-events: none;
        filter: grayscale(1);
        transition: opacity 0.2s;
      }

      /* tables */
      table.t {
        width: 100%;
        border-collapse: collapse;
      }
      table.t th {
        text-align: left;
        font-size: 12px;
        color: var(--subtle);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 10px 16px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      table.t th:first-child {
        border-radius: var(--r-lg) 0 0 0;
      }
      table.t th:last-child {
        border-radius: 0 var(--r-lg) 0 0;
      }
      table.t td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line-2);
        vertical-align: middle;
      }
      table.t tr:last-child td {
        border-bottom: 0;
      }

      /* secret + snippets */
      .secret {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 13px;
        background: #111113;
        color: #e7ecf2;
        border-radius: var(--r);
        padding: 10px 12px;
      }
      .secret span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .secret button {
        background: #2d2d3d;
        border: 0;
        color: #e7ecf2;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 12px;
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .callout {
        display: flex;
        gap: 10px;
        padding: 10px 12px;
        border-radius: var(--r);
        font-size: 13px;
        align-items: flex-start;
      }
      .callout.warn {
        background: var(--yellow-50);
        color: #854d0e;
        border: 1px solid #fde68a;
      }
      .callout.info {
        background: var(--bg);
        color: var(--fg-2);
        border: 1px solid var(--line);
      }
      .callout.orange {
        background: var(--orange-50);
        color: #7b341e;
        border: 1px solid var(--orange-200);
      }
      .callout.bad {
        background: var(--red-50);
        color: #991b1b;
        border: 1px solid #fecaca;
      }
      .codetabs {
        display: flex;
        gap: 2px;
        margin-bottom: -1px;
      }
      .codetabs button {
        border: 1px solid transparent;
        border-bottom: 0;
        background: none;
        padding: 6px 12px;
        border-radius: 8px 8px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .codetabs button.on {
        background: #111113;
        color: #fff;
      }
      pre.code {
        margin: 0;
        background: #111113;
        color: #e7ecf2;
        border-radius: 0 var(--r) var(--r) var(--r);
        padding: 14px 16px;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.6;
        overflow: auto;
      }
      pre.code .c {
        color: #7b8394;
      }
      pre.code .s {
        color: #ffb26b;
      }
      pre.code .k {
        color: #c4a5ff;
      }
      .steps2 {
        counter-reset: s;
        display: grid;
        gap: 14px;
      }
      .steps2 > div {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr);
        gap: 10px;
      }
      .steps2 > div > div {
        min-width: 0;
      }
      .steps2 > div::before {
        counter-increment: s;
        content: counter(s);
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--orange-100);
        color: var(--orange-700);
        font-weight: 700;
        font-size: 12px;
        display: grid;
        place-items: center;
      }

      /* trace view */
      .tv {
        display: grid;
        grid-template-columns: 1fr 400px;
        flex: 1;
        min-height: 0;
      }
      .tv .left {
        padding: 20px 24px;
        overflow: auto;
        border-right: 1px solid var(--line);
        background: #fff;
      }
      .tv .right {
        overflow: auto;
        background: #fff;
      }
      .thead {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }
      .thead h2 {
        margin: 0;
        font-size: 19px;
        letter-spacing: -0.01em;
      }
      .tmeta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        color: var(--muted);
        font-size: 13px;
        margin: 6px 0 18px;
        align-items: center;
      }
      .tmeta b {
        color: var(--fg);
        font-weight: 600;
      }
      .wf {
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        overflow: hidden;
      }
      .wf .scale {
        display: grid;
        grid-template-columns: 330px 1fr;
        font-size: 11.5px;
        color: var(--subtle);
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .wf .scale div:last-child {
        display: flex;
        justify-content: space-between;
        padding: 6px 14px;
      }
      .wf .scale div:first-child {
        padding: 6px 14px;
      }
      .span {
        display: grid;
        grid-template-columns: 330px 1fr;
        align-items: center;
        height: 40px;
        border-bottom: 1px solid var(--line-2);
        cursor: pointer;
        position: relative;
      }
      .span:last-child {
        border-bottom: 0;
      }
      .span:hover {
        background: var(--bg);
      }
      .span.sel {
        background: var(--orange-50);
      }
      .span.sel::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--orange);
      }
      .span .nm {
        display: flex;
        align-items: center;
        gap: 7px;
        padding-right: 10px;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
      }
      .span .nm .tree {
        color: #cbd5e1;
        font-family: var(--mono);
      }
      .span .nm .type {
        font-size: 10.5px;
        font-weight: 600;
        border-radius: 4px;
        padding: 0 5px;
        background: var(--bg-2);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .span .track {
        position: relative;
        height: 100%;
        margin: 0 14px;
      }
      .span .track i {
        position: absolute;
        top: 14px;
        height: 12px;
        border-radius: 4px;
      }
      .span .track em {
        position: absolute;
        top: 12px;
        font-style: normal;
        font-size: 11px;
        color: var(--subtle);
        font-variant-numeric: tabular-nums;
      }
      .bpill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--orange-700);
        background: var(--orange-50);
        border: 1px solid var(--orange-200);
        border-radius: 999px;
        padding: 0 7px 0 3px;
        height: 20px;
      }
      .rp {
        padding: 20px;
      }
      .rp h3 {
        margin: 0;
        font-size: 16px;
        font-family: var(--mono);
        font-weight: 500;
      }
      .kv {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 8px 12px;
        font-size: 13px;
        margin: 14px 0;
      }
      .kv dt {
        color: var(--subtle);
      }
      .kv dd {
        margin: 0;
      }
      .io {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 10px 12px;
        font-family: var(--mono);
        font-size: 12px;
        white-space: pre-wrap;
        color: var(--fg-2);
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 14px 0 4px;
      }
      .tip {
        position: relative;
      }
      .tip[data-tip]:hover::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 6px);
        left: 50%;
        transform: translateX(-50%);
        background: #111113;
        color: #fff;
        font-size: 12px;
        padding: 5px 8px;
        border-radius: 6px;
        white-space: nowrap;
        z-index: 60;
        font-weight: 500;
      }
      .evals {
        display: grid;
        gap: 6px;
      }
      .evals div {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--r);
      }
      .evals div span:last-child {
        margin-left: auto;
        font-weight: 600;
      }

      /* toast */
      .toasts {
        position: fixed;
        right: 20px;
        bottom: 20px;
        display: grid;
        gap: 8px;
        z-index: 70;
      }
      body.notes-open .toasts {
        right: 360px;
      }
      .toast {
        background: #111113;
        color: #fff;
        border-radius: 10px;
        padding: 12px 14px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        box-shadow: var(--shadow-lg);
        max-width: 380px;
        font-size: 13px;
        animation: rise 0.2s ease;
      }
      .toast svg {
        color: #4ade80;
        margin-top: 2px;
      }
      .toast span {
        color: #cbd5e1;
        display: block;
      }

      /* notes */
      .notes {
        position: fixed;
        top: 52px;
        right: 0;
        bottom: 0;
        width: 340px;
        background: #fffdf5;
        border-left: 1px solid #f1e6c8;
        padding: 20px 22px;
        overflow: auto;
        z-index: 20;
        display: none;
      }
      .notes.open {
        display: block;
      }
      .notes .lbl {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
        color: #a16207;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .notes h3 {
        margin: 6px 0 12px;
        font-size: 16px;
      }
      .notes ul {
        margin: 0;
        padding-left: 18px;
        display: grid;
        gap: 10px;
        color: #3c2415;
        font-size: 13px;
      }
      .notes .open-q {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px dashed #e9dcb5;
      }
      .notes .open-q h4 {
        margin: 0 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #a16207;
      }

      .seg {
        display: inline-flex;
        background: var(--bg-2);
        border-radius: 8px;
        padding: 3px;
        gap: 2px;
        margin-bottom: 20px;
      }
      .seg button {
        border: 0;
        background: none;
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }
      .seg button.on {
        background: #fff;
        color: var(--fg);
        box-shadow: var(--shadow);
      }
      .banner {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-radius: var(--r-lg);
        margin-bottom: 20px;
      }
      .upsell {
        padding: 48px;
        text-align: center;
      }
      .upsell h2 {
        margin: 18px 0 8px;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      .upsell p {
        color: var(--muted);
        max-width: 520px;
        margin: 0 auto 20px;
      }
      .ent-list {
        display: flex;
        gap: 18px;
        justify-content: center;
        color: var(--fg-2);
        font-size: 13px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .ent-list span {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .ent-list svg {
        color: var(--green);
      }

      .filters {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        align-items: center;
      }
      .act {
        font-family: var(--mono);
        font-size: 12px;
        background: var(--bg-2);
        border-radius: 5px;
        padding: 2px 6px;
      }
      .person {
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }
      table.t td > div {
        white-space: nowrap;
      }
      .person i {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        font-style: normal;
        font-size: 10px;
        font-weight: 700;
      }
      .rule {
        height: 1px;
        background: var(--line);
        margin: 18px 0;
      }
    </style>
  </head>
  <body>
    <div class="proto">
      <div class="brand"><span id="logo-braid"></span>Braids <small>design prototype</small></div>
      <div class="steps" id="steps"></div>
      <button class="toggle" data-action="notes"><span id="notes-ic"></span>Design notes</button>
    </div>
    <div class="app notes-open" id="app">
      <nav class="rail" id="rail"></nav>
      <div class="main" id="main"></div>
    </div>
    <div id="overlay-root"></div>
    <div class="toasts" id="toasts"></div>
    <aside class="notes open" id="notes"></aside>

        if (/\bnot\b/.test(s))

        if (/IsMatch/.test(s))

                  into: d.into,
                  cond: d.cond,
                  from: d.from,
                  expires: d.expires,
                  by: "Sam Rivera",
                  on: "21 Oct",
                  spans: "–",
                  spark: [1, 1, 1, 1, 1, 1, 1, 1],
                },
                ...state.braids,
              ];
            const name = P[d.into].name;
            state.dlg = null;
            state.tab = "into";
            if (state.step === 2 || state.step === 0) state.step = 3;
            toast(
              editing ? "Braid saved" : `Braided into ${name}`,
              editing
                ? `${name} keeps seeing spans while the change applies.`
                : `Matching spans start showing in ${name} within a minute.`,
            );
            break;
          }
          case "rowmenu":
            e.stopPropagation();
            state.rowMenu = state.rowMenu === t.dataset.id ? null : t.dataset.id;
            break;
          case "edit": {
            const b = state.braids.find((x) => x.id === t.dataset.id);
            openNew({
              mode: "edit",
              id: b.id,
              into: b.into,
              cond: b.cond,
              from: b.from,
              expires: b.expires,
            });
            break;
          }
          case "remove":
            state.dlg = { mode: "remove", id: t.dataset.id };
            break;
          case "remove-from":
            state.fromRemoved = true;
            toast(
              "Braid removed",
              "Specialist agents' spans stop showing in Web orchestrator within 30 seconds.",
            );
            break;
          case "confirm-remove": {
            const b = state.braids.find((x) => x.id === state.dlg.id);
            state.braids = state.braids.filter((x) => x.id !== state.dlg.id);
            state.dlg = null;
            toast(
              "Braid removed",
              `${P[(b || seedBraids()[0]).into].name} stops seeing these spans within 30 seconds.`,
            );
            break;
          }
          case "newkey":
            state.keyFlow = { stage: "name", name: "Production", lang: "ts" };
            break;
          case "key-create":
            state.keyFlow.name = (document.getElementById("keyname").value || "Production").trim();
            state.keyFlow.stage = "secret";
            break;
          case "lang":
            state.keyFlow.lang = t.dataset.l;
            break;
          case "copied":
            toast("Key copied");
            return;
          case "key-done":
            state.keys = [
              {
                id: "k" + Date.now(),
                name: state.keyFlow.name,
                tail: "4f2a",
                created: "Just now",
                by: "Sam Rivera",
                used: "Not yet",
                ok: "0",
                bad: 0,
                status: "active",
              },
            ];
            state.keyFlow = null;
            toast("Signing key created", "Signed spans show here once you deploy.");
            setTimeout(() => {
              if (state.keys[0]) {
                Object.assign(state.keys[0], { used: "2 min ago", ok: "18,204", bad: 3 });
                render();
              }
            }, 2600);
            break;
          case "keymenu":
            e.stopPropagation();
            state.keyMenu = state.keyMenu === t.dataset.id ? null : t.dataset.id;
            break;
          case "rotate":
            state.dlg = { mode: "rotate", id: t.dataset.id };
            break;
          case "confirm-rotate": {
            const k = state.keys.find((x) => x.id === state.dlg.id) || state.keys[0];
            k.status = "retiring";
            k.name = k.name;
            state.keys.unshift({
              id: "k" + Date.now(),
              name: k.name + " (new)",
              tail: "9c1e",
              created: "Just now",
              by: "Sam Rivera",
              used: "Not yet",
              ok: "0",
              bad: 0,
              status: "active",
            });
            state.dlg = null;
            toast("Key rotated", "Both keys work until 28 Oct.");
            break;
          }
          case "revoke": {
            const k = state.keys.find((x) => x.id === t.dataset.id);
            k.status = "revoked";
            toast("Key revoked", "Spans signed with it stop showing straight away.");
            break;
          }
          case "sel":
            state.sel = t.dataset.id;
            break;
          case "audit":
            state.audit = t.dataset.f;
            break;
          case "plan":
            state.plan = t.dataset.p;
            break;
        }
        render();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.id === "testid") runTest(e.target.value);
        if (e.key === "Escape" && (state.dlg || state.keyFlow)) {
          state.dlg = null;
          state.keyFlow = null;
          render();
        }
        if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
        if (e.key === "ArrowRight" && state.step < STEPS.length - 1) {
          state.step++;
          STEPS[state.step].go();
          render();
        }
        if (e.key === "ArrowLeft" && state.step > 0) {
          state.step--;
          STEPS[state.step].go();
          render();
        }
      });

      document.getElementById("logo-braid").innerHTML = braidMark(20, "#ED8926", "#e7ecf2");
      document.getElementById("notes-ic").innerHTML = ic("sticky", "sm");
      STEPS[0].go();
      render();
    </script>
  </body>
</html>

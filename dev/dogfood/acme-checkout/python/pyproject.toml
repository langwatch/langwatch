[project]
name = "acme-checkout"
version = "0.1.0"
description = "ACME store guest checkout agent, the LangGraph demo application for the guided onboarding"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "langchain-openai==1.6.0",
    "langgraph==1.2.11",
    "python-dotenv==1.2.3",
    "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

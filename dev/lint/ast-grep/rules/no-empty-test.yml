id: no-empty-test-ts
message: >
  An empty test body always passes and reports as coverage. If the case is not
  written yet, mark it `it.todo("...")` so the runner counts it as outstanding
  instead of green. If it was emptied to unblock something, delete it — git
  remembers.
severity: warning
language: TypeScript
rule:
  any:
    - pattern: it($NAME, () => {})
    - pattern: it($NAME, async () => {})
    - pattern: test($NAME, () => {})
    - pattern: test($NAME, async () => {})
files:
  - "apps/**/*.test.ts"
  - "packages/**/*.test.ts"
  - "apps/**/*.spec.ts"
  - "packages/**/*.spec.ts"
  - "sdks/typescript/**/*.test.ts"
  - "packages/**/*.test.ts"

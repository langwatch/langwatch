id: require-fetch-timeout-ts
message: >
  `fetch(...)` without a timeout hangs for as long as the peer keeps the socket
  open. Pass `signal: AbortSignal.timeout(ms)` (or a controller you abort) in
  the init object. A hung control plane must not hang the caller — this is the
  same class of defect as the CLI session request that could wedge every
  command.
severity: warning
language: TypeScript
rule:
  any:
    # fetch(url) — no init object at all, so no signal.
    - pattern: fetch($URL)
    # fetch(url, {...}) where the init object carries no `signal` key.
    # Both spellings count: `signal: x` (a pair) and the `{ headers, signal }`
    # shorthand, which parses as shorthand_property_identifier, not a pair.
    - all:
        - pattern: fetch($URL, { $$$INIT })
        - not:
            has:
              stopBy: end
              any:
                - all:
                    - kind: pair
                    - has:
                        field: key
                        regex: "^signal$"
                - all:
                    - kind: shorthand_property_identifier
                    - regex: "^signal$"
files:
  - "apps/**/*.ts"
  - "packages/**/*.ts"
  - "sdks/typescript/src/**/*.ts"
ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/__tests__/**"

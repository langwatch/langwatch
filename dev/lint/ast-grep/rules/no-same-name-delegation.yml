id: no-same-name-delegation-ts
message: >
  This method's whole body forwards to a method of the same name on a
  collaborator. One or two of those is a facade; a class made of them is a
  layer, not a component — every reader pays an extra file to learn nothing,
  and every new operation has to be declared twice. Count them before you keep
  them: if most of the class is same-name delegation and it holds no rules of
  its own, delete the class and let the caller hold the collaborator. The one
  facade the feature layout does require is `app/<feature>.app.ts`, which this
  rule already skips. See dev/docs/best_practices/overengineering.md.
severity: warning
language: TypeScript
rule:
  any:
    - pattern:
        context: "class C { $M($ARG: $T): $R { return this.$P.$M($ARG); } }"
        selector: method_definition
    - pattern:
        context: "class C { async $M($ARG: $T): $R { return this.$P.$M($ARG); } }"
        selector: method_definition
    - pattern:
        context: "class C { $M($ARG: $T): $R { return this.$P.$Q.$M($ARG); } }"
        selector: method_definition
    - pattern:
        context: "class C { async $M($ARG: $T): $R { return this.$P.$Q.$M($ARG); } }"
        selector: method_definition
files:
  - "packages/**/*.ts"
  - "apps/**/*.ts"
ignores:
  - "**/*.d.ts"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/generated/**"
  # The feature layout requires exactly one facade both transports call.
  - "**/app/*.app.ts"

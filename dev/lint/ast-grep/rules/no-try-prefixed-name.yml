id: no-try-prefixed-name-ts
message: >
  A `try` prefix says nothing about what the call does. It reads as "attempt
  this" when what it actually means is "this returns nothing when there is
  nothing", and the caller learns that from the return type, not the name.
  Name the answer instead: `pricingFor`, `findByStripeId`, `activate`,
  `updatePlan`. If a name genuinely has to distinguish a nullable read from a
  throwing one, say so in the noun — `existingUser` versus `requireUser` — not
  with a verb that describes the implementation's mood. See CLAUDE.md and
  `dev/docs/CODING_STANDARDS.md`.
severity: warning
language: TypeScript
rule:
  any:
    # `tryFoo() {}` on a class, and `abstract tryFoo(): X;`
    - all:
        - any:
            - kind: method_definition
            - kind: method_signature
            - kind: abstract_method_signature
        - has:
            field: name
            kind: property_identifier
            pattern: $NAME
    # `function tryFoo() {}`
    - all:
        - kind: function_declaration
        - has:
            field: name
            kind: identifier
            pattern: $NAME
    # `const tryFoo = () => {}` — the arrow is what makes it a function rather
    # than a value that happens to be named badly.
    - all:
        - kind: variable_declarator
        - has:
            field: name
            kind: identifier
            pattern: $NAME
        - has:
            field: value
            any:
              - kind: arrow_function
              - kind: function_expression
constraints:
  NAME:
    regex: "^try[A-Z]"
files:
  - "apps/**/*.ts"
  - "packages/**/*.ts"
  - "enterprise/**/*.ts"
ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/__tests__/**"
  - "**/*.generated.ts"

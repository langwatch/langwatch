id: require-bdd-describe-context-ts
message: >
  Nested `describe` blocks must express a condition, not a topic. Use
  `describe("given <precondition>")` or `describe("when <action>")` — the
  BDD structure is what makes the failure message readable on its own.
  Top-level `describe` blocks name the unit and are exempt. See CLAUDE.md
  ("Describe blocks without 'when' context") and
  `dev/docs/TESTING_PHILOSOPHY.md`.
severity: warning
language: TypeScript
rule:
  pattern: describe($TITLE, $$$BODY)
  # Ancestors only — `inside` never matches the node itself, so a top-level
  # describe cannot satisfy this and stays exempt.
  inside:
    stopBy: end
    pattern: describe($$$OUTER)
constraints:
  TITLE:
    not:
      # $TITLE is the string-literal node, quotes included.
      regex: '^["''`]\s*(?i)(given|when)\b'
files:
  - "platform/app/**/*.test.ts"
  - "platform/app/**/*.spec.ts"
  - "sdks/typescript/**/*.test.ts"
  - "sdks/typescript/**/*.spec.ts"

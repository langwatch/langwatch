id: no-inline-dynamic-import-ts
message: >
  Avoid inline `import(...)` for what should be a static import. Use
  top-level `import` / `import type` instead. Dynamic `import()` inside
  a function for intentional lazy-loading is fine — annotate the diff
  if not obvious.
severity: warning
language: TypeScript
rule:
  pattern: import($MOD)
files:
  - "apps/**/*.ts"
  - "packages/**/*.ts"
ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  # The route table's page-loader install list: one lazy import per routed
  # page, which is what code-splits the application.
  - "**/legacy-page-loaders.ts"

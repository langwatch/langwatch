# Semgrep rules: the two patterns the langwatch oxlint plugin cannot hold,
# because one reads SQL migration files and the other is loaded by CodeRabbit
# (reviews.tools.semgrep.config_file in /.coderabbit.yaml). Every other house
# rule is an oxlint rule; see dev/lint/README.md.

rules:
  # ── PII in logger calls ────────────────────────────────────────────────
  # Pattern enumeration: literal email/userId/etc. keys, spread of User-named
  # variables, shorthand property where the value-name suggests a user object.
  # Doesn't catch `logger.info("msg", user)` — that needs taint-mode (deferred
  # to a follow-up if AC6 shows the shape mismatters).
  - id: pii-in-logger-call
    message: >
      Logger call references PII fields (email, phone, name, ip, apiKey,
      token, etc.) without redaction. Wrap with `redact(...)` or
      `hashEmail(...)`, or pass the minimal non-identifying fields needed
      for debugging. See #3754 AC2.

      Note: userId, organizationId and projectId are deliberately NOT
      flagged — see dev/docs/best_practices/logging-and-tracing.md.
    severity: WARNING
    languages: [typescript, javascript]
    paths:
      include:
        - "apps/**/src/**/*.ts"
        - "apps/**/src/**/*.tsx"
        - "packages/**/src/**/*.ts"
        - "packages/**/src/**/*.tsx"
        - "modules/**/src/**/*.ts"
        - "modules/**/src/**/*.tsx"
        - "enterprise/**/src/**/*.ts"
        - "enterprise/**/src/**/*.tsx"
      exclude:
        - "**/__tests__/**"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.spec.ts"
        - "**/*.spec.tsx"
        - "**/__fixtures__/**"
    patterns:
      - pattern-either:
          # Literal PII keys anywhere in an object argument. Semgrep ellipsis is
          # `...` (the bare token); `$...` is NOT valid semgrep and fails to
          # parse — see #3754 (semgrep --validate is now a CI gate).
          # userId / organizationId / projectId are deliberately absent from
          # this list and must not be added back. They are opaque internal
          # identifiers, logged raw on purpose: they are what makes a log line
          # attributable and what lets an incident be filtered to one tenant.
          # Redacting them costs that and protects nothing, because the
          # identifier was never the sensitive part. See the "Identifiers Are
          # Logged Raw, On Purpose" section of
          # dev/docs/best_practices/logging-and-tracing.md.
          - pattern: "logger.$LEVEL(..., { ..., email: $E, ... }, ...)"
          - pattern: "logger.$LEVEL(..., { ..., phone: $P, ... }, ...)"
          - pattern: "logger.$LEVEL(..., { ..., apiKey: $K, ... }, ...)"
          - pattern: "logger.$LEVEL(..., { ..., token: $T, ... }, ...)"
          - pattern: "console.$LEVEL(..., { ..., email: $E, ... }, ...)"
          - pattern: "console.$LEVEL(..., { ..., apiKey: $K, ... }, ...)"
          - pattern: "console.$LEVEL(..., { ..., token: $T, ... }, ...)"
          # Spread of a user/session/account object.
          - pattern: "logger.$LEVEL(..., { ...$USER, ... }, ...)"
          - pattern: "console.$LEVEL(..., { ...$USER, ... }, ...)"
          # Shorthand / named property with a user-shaped name.
          - pattern: "logger.$LEVEL(..., { ..., user: $U, ... }, ...)"
          - pattern: "logger.$LEVEL(..., { ..., session: $S, ... }, ...)"
          - pattern: "logger.$LEVEL(..., { ..., account: $A, ... }, ...)"
          - pattern: "logger.$LEVEL(..., { ..., user, ... }, ...)"
          - pattern: "logger.$LEVEL(..., { ..., session, ... }, ...)"
          - pattern: "logger.$LEVEL(..., { ..., account, ... }, ...)"

  # ── ClickHouse migrations: no hard-coded database name ─────────────────
  # Anchored to SQL DDL keywords to avoid matching `langwatch.io`, comment
  # tokens, etc. `${CLICKHOUSE_DATABASE}.<table>` under ENVSUB is the house
  # convention (.claude/skills/clickhouse-migration) and is not flagged.
  - id: clickhouse-no-qualified-table
    message: >
      ClickHouse migrations name the database through
      `${CLICKHOUSE_DATABASE}.<table>` with `-- +goose ENVSUB ON`, never
      `langwatch.<table>`: a hard-coded database name is wrong on every
      installation that chose another.
    severity: WARNING
    languages: [generic]
    paths:
      include:
        - "packages/clickhouse-migrations/migrations/**/*.sql"
        - "packages/clickhouse-migrations/migrations/**/*.ts"
    pattern-regex: '\b(FROM|JOIN|INTO|UPDATE|TABLE|VIEW|EXISTS|DROP)[[:space:]]+langwatch\.[a-z_]+'

id: require-boolean-name-prefix-ts
message: >
  Boolean names need an `is` / `has` / `should` / `can` / `will` prefix (or a
  domain equivalent such as `enabled`, `visible`, `allowed`, `disabled`,
  `active`, `open`, `loading`, `pending`, `required`, `dirty`, `valid`,
  `ready`, `done`, `used`). `perMember: boolean` reads as a noun and the call
  site cannot tell what `true` means. See CLAUDE.md and
  `dev/docs/CODING_STANDARDS.md`.
severity: warning
language: TypeScript
rule:
  any:
    # `name: boolean` on an interface / type-literal member. The member name
    # is a property_identifier.
    - all:
        - kind: property_signature
        - has:
            field: type
            has:
              stopBy: end
              kind: predefined_type
              regex: "^boolean$"
        - has:
            stopBy: end
            kind: property_identifier
            pattern: $NAME
    # `name: boolean` on a function parameter. The name is a plain identifier
    # under the `pattern` field, not a property_identifier.
    - all:
        - any:
            - kind: required_parameter
            - kind: optional_parameter
        - has:
            field: type
            has:
              stopBy: end
              kind: predefined_type
              regex: "^boolean$"
        - has:
            field: pattern
            kind: identifier
            pattern: $NAME
    # `const name: boolean = ...` and `let name: boolean`.
    - all:
        - kind: variable_declarator
        - has:
            field: type
            has:
              stopBy: end
              kind: predefined_type
              regex: "^boolean$"
        - has:
            field: name
            kind: identifier
            pattern: $NAME
constraints:
  NAME:
    not:
      regex: "(?i)^_?(is|has|had|should|can|could|will|would|must|does|did|allow|enable|disable|show|hide|use|include|require|omit|skip|force|only|no|not)|^(enabled|disabled|visible|hidden|allowed|active|inactive|open|closed|loading|pending|required|optional|dirty|pristine|valid|invalid|ready|done|used|empty|degenerate|converged|success|failed|ok)$"
files:
  - "langwatch/src/**/*.ts"
  - "platform/app/ee/**/*.ts"
ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/__tests__/**"
  - "**/*.generated.ts"
